<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adesso OCM Navigator – Change Together</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Fira Sans', sans-serif;
      background-color: #f4f6fa;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f4f6fa;
    }

    ::-webkit-scrollbar-thumb {
      background: #887d75;
      border-radius: 3px;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      main {
        padding: 0 !important;
        overflow: visible !important;
      }

      body {
        background: #fff;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.getElementById('root').innerHTML =
        '<div style="font-family:monospace;padding:32px;color:#c00;background:#fff0f0;border:2px solid #c00;margin:32px;border-radius:8px">' +
        '<b>JavaScript-Fehler (weiße Seite):</b><br><pre style="white-space:pre-wrap;margin-top:12px">' +
        (err ? err.stack : msg) + '</pre></div>';
    };
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const uid = (p = "") => p + Math.random().toString(36).slice(2, 8);
    const today = () => new Date().toISOString().slice(0, 10);
    const fmtDate = d => d ? new Date(d).toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" }) : "–";
    const clamp = (v, lo = 0, hi = 10) => Math.max(lo, Math.min(hi, Number(v) || 0));
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

    // ─── CSV / ICS helpers ───────────────────────────────────────────────
    const toCSV = (rows, cols) => {
      const esc = v => { const s = String(v ?? ""); return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s; };
      const header = cols.map(c => esc(c.label)).join(",");
      const body = rows.map(r => cols.map(c => esc(typeof c.get === "function" ? c.get(r) : r[c.key])).join(",")).join("\n");
      return header + "\n" + body;
    };
    const downloadBlob = (content, filename, type = "text/plain;charset=utf-8") => {
      const b = new Blob(["\uFEFF" + content], { type });
      const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = filename; a.click(); URL.revokeObjectURL(u);
    };
    const toICS = events => {
      const fmt = d => d ? d.replace(/-/g, "") : null;
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//adesso OCM Navigator//DE"];
      events.forEach(ev => {
        if (!ev.date) return;
        lines.push("BEGIN:VEVENT", `UID:${uid("ev-")}@ocm`, `DTSTART;VALUE=DATE:${fmt(ev.date)}`, `DTEND;VALUE=DATE:${fmt(ev.date)}`, `SUMMARY:${ev.title}`, ev.desc ? `DESCRIPTION:${ev.desc.replace(/\n/g, "\\n")}` : "", "END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      return lines.filter(l => l !== "").join("\r\n");
    };

    // ─── adesso Corporate Design Theme ──────────────────────────────────
    const T = {
      // Primary adesso Colors
      adessoBlau: "#006ec7",
      adessoGrau: "#887d75",
      // UI Colors
      bg: "#f4f6fa", surface: "#ffffff", border: "#dcdfe5", borderLight: "#edf0f5",
      text: "#222222", textSec: "#5c6178", textMut: "#887d75",
      // Secondary / Schmuckfarben (adesso CD)
      accent: "#006ec7", accentLt: "#e6f0fa",
      success: "#76c800", successLt: "#f1fad9", // adesso Grün
      warn: "#ff9868", warnLt: "#fff4ee",       // adesso Orange
      danger: "#e74c5e", dangerLt: "#fdeef0",   // Standard red for errors
      purple: "#461ebe", cyan: "#28dcaa", pink: "#f566ba",
      shadow: "0 2px 10px rgba(0,0,0,0.05)",
      r: 4, rs: 4, font: "'Fira Sans', sans-serif",
    };

    // ─── Shared style constants ──────────────────────────────────────────
    const S = {
      rowBetween:  { display: "flex", alignItems: "center", justifyContent: "space-between" },
      rowCenter:   { display: "flex", alignItems: "center", gap: 8 },
      formGrid:    { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 },
      formGridFull:{ gridColumn: "1/-1" },
      tdCell:      { padding: "8px 12px" },
      tdCellSm:    { padding: "8px 10px" },
      sectionHead: { marginBottom: 24 },
    };

    const ADKAR = ["Awareness", "Desire", "Knowledge", "Ability", "Reinforcement"];
    const ADKAR_C = { Awareness: T.adessoBlau, Desire: T.pink, Knowledge: T.cyan, Ability: T.purple, Reinforcement: T.success };
    const DIMS = ["Mensch", "Prozess", "Technologie"];
    const DIM_IC = { Mensch: "👥", Prozess: "⚙️", Technologie: "💻" };
    const READINESS = ["Unterst\u00fctzend", "Neutral", "Skeptisch", "Ablehnend"];
    const TYPES = ["Comms", "Training", "Workshop", "Coaching", "Enablement", "Event", "Feedback"];
    const ROLES = ["Sponsor", "PL", "HR", "IT", "BR", "CM", "SME", "Exec"];
    const CHANNELS = ["Townhall", "E-Mail", "Teams-Chat", "Intranet", "1:1-Gespräch", "Workshop", "Newsletter", "Video", "Poster/Flyer", "Yammer/Viva"];
    const INDUSTRIES = ["IT & Software", "Finanzdienstleistungen", "Pharma & Healthcare", "Automotive", "Energie & Utilities", "Retail & E-Commerce", "Öffentlicher Sektor", "Telekommunikation", "Produktion & Industrie", "Logistik & Transport", "Beratung", "Sonstiges"];

    // ─── Score helpers (0-10) ───────────────────────────────────────────
    const scoreColor = v => { const n = Number(v) || 0; if (n >= 8) return T.danger; if (n >= 5) return T.warn; return T.success; };
    const scoreBg = v => { const n = Number(v) || 0; if (n >= 8) return T.dangerLt; if (n >= 5) return T.warnLt; return T.successLt; };
    const statusColor = s => s === "done" ? T.success : s === "in_progress" ? T.accent : T.textMut;
    const statusLabel = s => s === "done" ? "Fertig" : s === "in_progress" ? "In Arbeit" : "Geplant";
    const readyColor = r => ({ "Unterst\u00fctzend": T.success, "Neutral": T.warn, "Skeptisch": T.pink, "Ablehnend": T.danger, "supportive": T.success, "neutral": T.warn, "skeptical": T.pink, "resistant": T.danger }[r] || T.textMut);

    // ─── Methods Library ────────────────────────────────────────────────
    const METHODS = [
      {
        id: "m1", name: "Stakeholder-Interview", category: "Analyse", adkar: ["Awareness"], effort: "Niedrig", duration: "1–2h pro Person", when: "Frühphase – Bedarfsanalyse & Stimmungsbild",
        description: "Strukturierte Einzelgespräche mit Schlüssel-Stakeholdern, um Bedenken, Erwartungen und Einflussdynamiken zu verstehen.",
        bestFor: "Skeptische Stakeholder mit hohem Einfluss identifizieren und einbinden",
        steps: ["Interviewleitfaden erstellen (5-8 offene Fragen)", "Termine mit Top-Stakeholdern vereinbaren", "Interviews führen & dokumentieren", "Ergebnisse clustern & Handlungsfelder ableiten"],
        outputs: ["Stakeholder-Stimmungsbild", "Engagement-Plan", "Risiko-Landkarte"]
      },
      {
        id: "m2", name: "Impact Assessment Workshop", category: "Analyse", adkar: ["Awareness", "Knowledge"], effort: "Mittel", duration: "2–4h", when: "Frühphase – nach Scope-Definition",
        description: "Moderierter Workshop mit Fachbereichen, um konkrete Auswirkungen des Changes auf Prozesse, Rollen und Systeme zu identifizieren und zu bewerten.",
        bestFor: "Komplexe Changes mit vielen betroffenen Bereichen systematisch erfassen",
        steps: ["Teilnehmer aus allen betroffenen Bereichen einladen", "Ist-Situation pro Bereich erfassen", "Delta zum Soll identifizieren", "Impacts bewerten (Ausmaß, Kritikalität)", "Maßnahmen ableiten"],
        outputs: ["Impact-Register", "Heatmap-Daten", "Maßnahmenvorschläge"]
      },
      {
        id: "m3", name: "Sponsor Roadshow", category: "Kommunikation", adkar: ["Awareness", "Desire"], effort: "Mittel", duration: "30–60 Min je Termin", when: "Vor Go-Live – wenn Awareness & Desire aufgebaut werden müssen",
        description: "Der Sponsor besucht betroffene Teams persönlich, erklärt das Warum und beantwortet Fragen. Stärkt Vertrauen und Sichtbarkeit.",
        bestFor: "Wenn Führungskräfte-Sichtbarkeit fehlt oder Widerstand hoch ist",
        steps: ["Talking Points mit Sponsor abstimmen", "Termine in betroffenen Standorten planen", "Begleitende FAQ & Handout erstellen", "Feedback aus Sessions sammeln", "Follow-up-Maßnahmen ableiten"],
        outputs: ["Sponsor-Talking-Points", "Feedback-Zusammenfassung", "Follow-up-Tasks"]
      },
      {
        id: "m4", name: "Change Champion Netzwerk", category: "Enablement", adkar: ["Desire", "Ability", "Reinforcement"], effort: "Hoch", duration: "Laufend (Setup: 2–3 Wochen)", when: "Ab Mitte Projektphase – als Multiplikatoren für den Change",
        description: "Aufbau eines Netzwerks von Change Champions in den Fachbereichen, die als Multiplikatoren, Feedback-Kanal und lokale Unterstützer fungieren.",
        bestFor: "Große Organisationen mit verteilten Standorten, wo zentrale Kommunikation nicht reicht",
        steps: ["Champions identifizieren & ansprechen", "Rolle & Erwartungen klären", "Kick-off-Workshop durchführen", "Regelmäßige Sync-Meetings etablieren", "Champions mit Materialien & Infos versorgen", "Feedback-Schleife einrichten"],
        outputs: ["Champion-Rollenblatt", "Regelmäßige Briefings", "Feedback-Reports"]
      },
      {
        id: "m5", name: "Resistance Management Workshop", category: "Intervention", adkar: ["Desire", "Ability"], effort: "Mittel", duration: "2–3h", when: "Wenn konkreter Widerstand sichtbar wird",
        description: "Gezielter Workshop mit resistanten Stakeholdern oder deren Führungskräften, um Ursachen von Widerstand zu verstehen und gemeinsam Lösungen zu erarbeiten.",
        bestFor: "Wenn Widerstand über individuelle Gespräche hinaus eskaliert",
        steps: ["Widerstandsmuster analysieren (Ursache, Ausdruck, Quelle)", "Geeignete Teilnehmer identifizieren", "Sicheren Raum schaffen (Regeln, Moderation)", "Bedenken sammeln & clustern", "Gemeinsam Lösungen erarbeiten", "Vereinbarungen dokumentieren & nachverfolgen"],
        outputs: ["Widerstandsanalyse", "Maßnahmenplan", "Vereinbarungen"]
      },
      {
        id: "m6", name: "Training Needs Analysis", category: "Training", adkar: ["Knowledge"], effort: "Mittel", duration: "1–2 Wochen", when: "3–6 Monate vor Go-Live",
        description: "Systematische Erhebung, welche Kompetenzen aufgebaut werden müssen – nach Zielgruppe, Rolle und System-/Prozessänderung.",
        bestFor: "Wenn Technology- oder Process-Impacts hohe Training-Scores haben",
        steps: ["Soll-Kompetenzen pro Rolle ableiten", "Ist-Kompetenzen erheben (Survey/Interviews)", "Gap-Analyse durchführen", "Trainingsformate & -umfang planen", "Trainingsplan erstellen & abstimmen"],
        outputs: ["Kompetenz-Gap-Matrix", "Trainingsplan", "Ressourcenbedarf"]
      },
      {
        id: "m7", name: "Go-Live Readiness Check", category: "Transition", adkar: ["Ability", "Reinforcement"], effort: "Mittel", duration: "1–2 Wochen vor Go-Live", when: "Unmittelbar vor Go-Live",
        description: "Strukturierte Prüfung, ob Organisation, Prozesse und Menschen bereit für den Go-Live sind. Definiert No-Go-Kriterien.",
        bestFor: "Jeder Change mit fixem Go-Live-Datum und hohem Risiko",
        steps: ["Readiness-Kriterien definieren (Tech, People, Process)", "Checkliste pro Zielgruppe erstellen", "Readiness-Assessment durchführen", "Go/No-Go-Entscheidung vorbereiten", "Restrisiken & Mitigationen dokumentieren"],
        outputs: ["Readiness-Scorecard", "Go/No-Go-Empfehlung", "Risiko-Mitigationsplan"]
      },
      {
        id: "m8", name: "Post-Go-Live Sustainment", category: "Reinforcement", adkar: ["Reinforcement"], effort: "Mittel", duration: "4–12 Wochen nach Go-Live", when: "Direkt nach Go-Live",
        description: "Maßnahmenpaket, um die Nachhaltigkeit des Changes sicherzustellen: Hypercare, Feedback-Loops, Quick Wins feiern, Nachschulung.",
        bestFor: "Jeder signifikante Change – wird am häufigsten vergessen",
        steps: ["Hypercare-Plan aufsetzen (Support-Kanäle, Ansprechpartner)", "Feedback-Mechanismus einrichten", "Quick Wins identifizieren & kommunizieren", "Nachschulungsbedarf erheben & durchführen", "Lessons Learned dokumentieren", "Reinforcement-Maßnahmen für FK aufsetzen"],
        outputs: ["Hypercare-Plan", "Feedback-Report", "Lessons Learned", "Sustainment-Roadmap"]
      },
      {
        id: "m9", name: "Pulse Survey / Stimmungscheck", category: "Messung", adkar: ["Awareness", "Desire"], effort: "Niedrig", duration: "5–10 Min (Befragung) + Auswertung", when: "Regelmäßig alle 2–4 Wochen während der Change-Phase",
        description: "Kurze, wiederkehrende Befragung der Betroffenen zu Stimmung, Verständnis und Unterstützungsbedarf. Liefert Trendlinien über Zeit.",
        bestFor: "Readiness-Tracking über Zeit und Identifikation von Trouble Spots",
        steps: ["5–8 Fragen definieren (ADKAR-basiert)", "Tool auswählen (Forms, Viva Pulse)", "Rhythmus festlegen & kommunizieren", "Ergebnisse auswerten & visualisieren", "Maßnahmen aus Ergebnissen ableiten"],
        outputs: ["Stimmungsbarometer (Trend)", "Handlungsempfehlungen", "Management-Summary"]
      },
      {
        id: "m10", name: "Führungskräfte-Enablement", category: "Enablement", adkar: ["Desire", "Knowledge", "Ability"], effort: "Mittel", duration: "2–4h Workshop + laufende Begleitung", when: "Frühzeitig – bevor breite Kommunikation startet",
        description: "Führungskräfte werden befähigt, den Change in ihren Teams aktiv zu begleiten: Botschaften, Umgang mit Widerstand, eigene Rolle.",
        bestFor: "Jeder organisationale Change – FK sind der wichtigste Erfolgsfaktor",
        steps: ["FK-spezifische Impacts & Rolle klären", "Workshop konzipieren (Botschaften, Q&A-Handling, Rolle)", "Workshop durchführen", "Toolkit bereitstellen (Talking Points, FAQ, Einwandbehandlung)", "Regelmäßige Check-ins etablieren"],
        outputs: ["FK-Toolkit", "Talking Points", "Einwandbehandlungs-Guide", "Check-in-Protokolle"]
      },
    ];

    // ─── Persistence ────────────────────────────────────────────────────
    const SK = "ocm-v4";
    const sv = async d => { try { localStorage.setItem(SK, JSON.stringify(d)); } catch { } };
    const ld = async () => { try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); const old = localStorage.getItem("ocm-v3"); return old ? JSON.parse(old) : null; } catch { return null; } };
    const emptyD = () => ({
      initiatives: [],
      stakeholders: [],
      targetGroups: [],
      impactItems: [],
      actions: [],
      engagements: [],
      commsItems: [],
      methods: [...METHODS],
      customTags: { roles: [...ROLES], actionTypes: [...TYPES], channels: [...CHANNELS], projectTags: [] },
      // Governance
      dependencies: [],
      stageGates: [],
      // Wirkungsmessung
      outcomeKPIs: [],
      hypotheses: [],
      benefits: [],
      // Leadership
      leadershipTasks: [],
      playbooks: [],
      sponsorTracking: [],
      decisionLog: [],
      // Teamentwicklung
      teamMaturity: [],
      pulseChecks: [],
      multipliers: [],
      reinforcementLoops: [],
      // Dialog & Feedback
      feedbackChannels: [],
      personas: [],
      narratives: [],
      // Operating Model
      raciItems: [],
      changeRisks: [],
      templates: [],
      // Kollaboration
      auditLog: [],
      workflowStates: [],
      stakeholderRelations: [],
      cmProfiles: [],
      userProfile: { name: "CM-User", role: "admin", initials: "CM" },
      // Adoption
      maturityAssessment: { date: null, dimensions: [], overall_score: 0 },
      onboardingPaths: [],
      learningItems: [],
      benchmarkData: [],
      // References
      references: [],
    });

    const INITIAL_RISK_QUESTIONS = {
      cc: [
        { id: "cc1", q: "Reichweite der Veränderung (Arbeitsgruppe vs. gesamte Organisation)", score: 3 },
        { id: "cc2", q: "Anzahl betroffener Mitarbeitender", score: 3 },
        { id: "cc3", q: "Unterschiedlichkeit der Auswirkungen (Einheitlich vs. Vielfältig)", score: 3 },
        { id: "cc4", q: "Art der Veränderung (Inkrementell vs. Radikal)", score: 3 },
        { id: "cc5", q: "Ausmaß der Prozessänderung", score: 3 },
        { id: "cc6", q: "Ausmaß der Tool-/Systemänderung", score: 3 },
        { id: "cc7", q: "Ausmaß der Rollen-/Verantwortungsänderung", score: 3 },
        { id: "cc8", q: "Ausmaß der Haltungs-/Überzeugungsänderung", score: 3 },
      ],
      oa: [
        { id: "oa1", q: "Wahrgenommene Notwendigkeit der Veränderung", score: 3 },
        { id: "oa2", q: "Auswirkung vergangener Veränderungen", score: 3 },
        { id: "oa3", q: "Change-Management-Kultur der Organisation", score: 3 },
        { id: "oa4", q: "Gemeinsame Vision / Richtung", score: 3 },
        { id: "oa5", q: "Führungsstil & Sichtbarkeit", score: 3 },
        { id: "oa6", q: "Mitarbeiter-Engagement & Vertrauen", score: 3 },
        { id: "oa7", q: "Ressourcenverfügbarkeit & Kapazität", score: 3 },
        { id: "oa8", q: "Change-Sättigung der Organisation", score: 3 },
      ]
    };

    const INITIAL_PCT_SCORES = { success: 5, leadership: 5, pm: 5, cm: 5 };

    // ─── UI Components ───────────────────────────────────────────────
    const Badge = ({ children, color = T.accent, bg: b, onRemove }) => (
      <span style={{ display: "inline-flex", alignItems: "center", padding: "3px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, background: b || (color + "1A"), color, whiteSpace: "nowrap", gap: 4 }}>
        {children}{onRemove && <span onClick={e => { e.stopPropagation(); onRemove(); }} style={{ cursor: "pointer", opacity: 0.6, fontSize: 13, lineHeight: 1 }}>×</span>}
      </span>
    );

    const Btn = ({ children, onClick, v = "default", small, disabled, style: sx }) => {
      const S = {
        default: { bg: T.surface, c: T.text, b: T.border },
        primary: { bg: T.accent, c: "#fff", b: T.accent },
        danger: { bg: T.dangerLt, c: T.danger, b: T.dangerLt },
        success: { bg: T.successLt, c: T.success, b: T.successLt },
        ghost: { bg: "transparent", c: T.textMut, b: "transparent" },
        warn: { bg: T.warnLt, c: T.warn, b: T.warnLt }
      };
      const s = S[v] || S.default;
      return <button className="no-print" onClick={onClick} disabled={disabled} style={{ padding: small ? "4px 10px" : "8px 16px", borderRadius: T.rs, border: `1px solid ${s.b}`, background: s.bg, color: s.c, fontSize: small ? 12 : 13, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", fontFamily: T.font, display: "inline-flex", alignItems: "center", gap: 6, opacity: disabled ? 0.5 : 1, transition: "0.2s", boxShadow: v === "default" || v === "primary" ? T.shadow : "none", ...sx }}>{children}</button>;
    };

    const Input = ({ label, value, onChange, onBlur, options, textarea, type = "text", placeholder, style: sx, min, max, step }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, ...sx }}>
        {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
        {options ? (
          <select value={value} onChange={e => onChange(e.target.value)} onBlur={onBlur} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }}>
            <option value="">{"— W\u00e4hlen —"}</option>
            {options.map(o => <option key={typeof o === "string" ? o : o.value} value={typeof o === "string" ? o : o.value}>{typeof o === "string" ? o : o.label}</option>)}
          </select>
        ) : textarea ? (
          <textarea value={value} onChange={e => onChange(e.target.value)} onBlur={onBlur} placeholder={placeholder} rows={3} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none", resize: "vertical" }} />
        ) : (
          <input type={type} value={value} onChange={e => onChange(e.target.value)} onBlur={onBlur} placeholder={placeholder} min={min} max={max} step={step} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }} />
        )}
      </div>
    );

    const TagInput = ({ label, tags = [], onChange, suggestions = [], color = T.accent }) => {
      const [inp, setInp] = useState("");
      const add = (v) => { const t = (v || inp).trim(); if (t && !tags.includes(t)) onChange([...tags, t]); setInp(""); };
      const rem = (t) => onChange(tags.filter(x => x !== t));
      const avail = suggestions.filter(s => !tags.includes(s) && s.toLowerCase().includes(inp.toLowerCase()));
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
          <div style={{ border: `1px solid ${T.border}`, background: T.bg, borderRadius: T.rs, padding: 4, display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
            {tags.map(t => (
              <Badge key={t} color={color} onRemove={() => rem(t)}>{t}</Badge>
            ))}
            <input value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); add(); } }} onBlur={() => add()} placeholder="Eingabe + Enter" style={{ flex: 1, border: "none", background: "transparent", outline: "none", padding: "4px", fontSize: 13, fontFamily: T.font, minWidth: 120 }} />
          </div>
          {inp && avail.length > 0 && (
            <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginTop: 2 }}>
              {avail.slice(0, 8).map(s => <button key={s} onClick={() => add(s)} style={{ padding: "2px 8px", borderRadius: 4, border: "none", background: T.bg, color: T.textSec, fontSize: 11, cursor: "pointer", fontFamily: T.font }}>{s}</button>)}
            </div>
          )}
        </div>
      );
    };

    const ScoreInput = ({ label, value, onChange, style: sx }) => (

    // ─── LinkSelect: Multi-select dropdown for linking items ────────

                    <span style={{ width: 16, height: 16, borderRadius: 3, border: `2px solid ${selected.includes(o.value) ? color : T.border}`, background: selected.includes(o.value) ? color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 10 }}>{selected.includes(o.value) ? "✓" : ""}</span>

    // ─── Tooltip (Hover-Infoblase) ──────────────────────────────────────
    const Tip = ({ text, children, linked, style: sx }) => {
      const [show, setShow] = useState(false);
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const ref = React.useRef(null);
      const handleEnter = () => { setShow(true); if (ref.current) { const r = ref.current.getBoundingClientRect(); setPos({ x: r.left + r.width / 2, y: r.top }); } };
      return (
        <span ref={ref} onMouseEnter={handleEnter} onMouseLeave={() => setShow(false)} style={{ position: "relative", ...sx }}>
          {children}
          {show && (
            <div style={{ position: "fixed", left: Math.min(pos.x - 120, window.innerWidth - 260), top: Math.max(pos.y - 8, 8), transform: "translateY(-100%)", zIndex: 9999, background: "#222", color: "#fff", padding: "8px 12px", borderRadius: 6, fontSize: 11.5, lineHeight: 1.5, maxWidth: 260, boxShadow: "0 4px 16px rgba(0,0,0,0.25)", pointerEvents: "none" }}>
              {text}

    // ─── Sparkline (Mini-Trendlinie) ──────────────────────────────────
    const Sparkline = ({ data = [], width = 80, height = 24, color = T.accent }) => {
      if (data.length < 2) return <span style={{ fontSize: 10, color: T.textMut }}>–</span>;
      const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * height}`).join(" ");
      return <svg width={width} height={height} style={{ display: "inline-block", verticalAlign: "middle" }}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" /><circle cx={width} cy={height - ((data[data.length - 1] - min) / range) * height} r="2" fill={color} /></svg>;
    };

    // ─── Radar Chart (CSS-basiert) ────────────────────────────────────
    const RadarChart = ({ dimensions = {}, labels = [], size = 200, color = T.accent }) => {
      const n = labels.length; if (n < 3) return null;
      const cx = size / 2, cy = size / 2, r = size * 0.4;
      const angleStep = (2 * Math.PI) / n;
      const pts = labels.map((l, i) => { const v = (dimensions[l] || 0) / 10; const a = i * angleStep - Math.PI / 2; return { x: cx + r * v * Math.cos(a), y: cy + r * v * Math.sin(a) }; });
      const poly = pts.map(p => `${p.x},${p.y}`).join(" ");
      const gridLevels = [0.25, 0.5, 0.75, 1];
      return (
        <svg width={size} height={size} style={{ display: "block", margin: "0 auto" }}>
          {gridLevels.map(gl => <polygon key={gl} points={labels.map((_, i) => { const a = i * angleStep - Math.PI / 2; return `${cx + r * gl * Math.cos(a)},${cy + r * gl * Math.sin(a)}`; }).join(" ")} fill="none" stroke={T.border} strokeWidth="0.5" />)}
          {labels.map((_, i) => { const a = i * angleStep - Math.PI / 2; return <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(a)} y2={cy + r * Math.sin(a)} stroke={T.border} strokeWidth="0.5" />; })}
          <polygon points={poly} fill={color + "33"} stroke={color} strokeWidth="2" />
          {labels.map((l, i) => { const a = i * angleStep - Math.PI / 2; const lx = cx + (r + 18) * Math.cos(a); const ly = cy + (r + 18) * Math.sin(a); return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill={T.textSec}>{l}</text>; })}
          {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
        </svg>
      );
    };

    // ─── WorkflowBadge (Freigabe-Status) ──────────────────────────────
    const WORKFLOW_STATES = ["draft", "review", "approved"];
    const WORKFLOW_LABELS = { draft: "Entwurf", review: "In Prüfung", approved: "Freigegeben" };
    const WORKFLOW_COLORS = { draft: T.textMut, review: T.warn, approved: T.success };
    const WorkflowBadge = ({ state = "draft", onCycle }) => (

        <span onClick={onCycle} style={{ cursor: onCycle ? "pointer" : "default" }}>{WORKFLOW_LABELS[state] || state}</span>

    // ─── DataTable: shared table wrapper ────────────────────────────────
    const DataTable = ({ headers, children }) => (

            <thead><tr style={{ background: T.bg }}>
              {headers.map(h => <th key={h} style={{ padding: "8px 12px", textAlign: "left", color: T.textMut, fontWeight: 600, fontSize: 10.5, textTransform: "uppercase" }}>{h}</th>)}

    );

    // ─── ADKAR coverage calc ────────────────────────────────────────────
    const adkarCov = (actions, tgId) => { const c = {}; ADKAR.forEach(a => c[a] = 0); actions.filter(a => !tgId || a.target_group_ids?.includes(tgId)).forEach(a => (a.adkar_tags || []).forEach(t => { if (c[t] !== undefined) c[t]++; })); return c; };

    // ─── Shared hook: modal + form state ────────────────────────────────
    const useModalForm = (emptyF) => {
      const [show, setShow] = useState(false);
      const [editId, setEditId] = useState(null);
      const [f, sF] = useState(emptyF);
      const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
      const close = () => { setShow(false); setEditId(null); sF(emptyF); };
      return { show, setShow, editId, setEditId, f, sF, openNew, close };
    };

    // ═══════════════════════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════════════════════
    function App() {
      const [data, setData] = useState(emptyD());
      const [loaded, setLoaded] = useState(false);
      const [nav, setNav] = useState("dashboard");
      const [sel, setSel] = useState(null);
      const [sub, setSub] = useState("overview");
      const [methodDetail, setMethodDetail] = useState(null);
      const undoStack = useRef([]);
      const editSHRef = useRef(null);
      const [toast, setToast] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      useEffect(() => { ld().then(d => { if (d) setData({ ...emptyD(), ...d, methods: d.methods || [...METHODS], customTags: { ...emptyD().customTags, ...(d.customTags || {}) } }); setLoaded(true); }); }, []);
      useEffect(() => { if (loaded) sv(data); }, [data, loaded]);

      const up = useCallback(fn => setData(p => { undoStack.current = [...undoStack.current.slice(-19), structuredClone(p)]; const n = structuredClone(p); fn(n); return n; }), []);
      const undo = useCallback(() => { if (!undoStack.current.length) return; const prev = undoStack.current[undoStack.current.length - 1]; undoStack.current = undoStack.current.slice(0, -1); setData(structuredClone(prev)); setToast({ msg: "Rückgängig gemacht ✓", id: Date.now() }); }, []);
      useEffect(() => { const h = e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); } }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [undo]);
      useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 4000); return () => clearTimeout(t); } }, [toast]);
      const ini = useMemo(() => data.initiatives.find(i => i.id === sel), [data, sel]);
      const { iSH, iTG, iIM, iAC, iENG, iCOM } = useMemo(() => {
        const fi = col => (data[col] || []).filter(x => x.initiative_id === sel);
        return { iSH: fi("stakeholders"), iTG: fi("targetGroups"), iIM: fi("impactItems"), iAC: fi("actions"), iENG: fi("engagements"), iCOM: fi("commsItems") };
      }, [data, sel]);
      const upE = (col, id, f, v) => up(d => { const it = d[col].find(x => x.id === id); if (it) it[f] = v; });
      const tags = data.customTags || emptyD().customTags;
      const allOrgUnits = useMemo(() => [...new Set([...(data.stakeholders || []).flatMap(s => Array.isArray(s.org_unit) ? s.org_unit : [s.org_unit]).filter(Boolean), ...(data.targetGroups || []).flatMap(tg => tg.org_units || []).filter(Boolean)])], [data.stakeholders, data.targetGroups]);
      // Memoized collections for extended features
      const { iDEP, iBEN, iLT, iSPT, iDL, iTM, iPC, iMUL, iRL, iFC, iPER, iNAR, iRACI, iCR, iSREL, iDEC } = useMemo(() => {
        const fi = col => (data[col] || []).filter(x => x.initiative_id === sel);
        return {
          iDEP: (data.dependencies || []).filter(d => d.from_initiative_id === sel || d.to_initiative_id === sel),
          iBEN: fi("benefits"),
          iLT: fi("leadershipTasks"), iSPT: fi("sponsorTracking"),
          iDL: fi("decisionLog"), iTM: fi("teamMaturity"), iPC: fi("pulseChecks"),
          iMUL: fi("multipliers"), iRL: fi("reinforcementLoops"), iFC: fi("feedbackChannels"),
          iPER: fi("personas"), iNAR: fi("narratives"), iRACI: fi("raciItems"),
          iCR: fi("changeRisks"), iSREL: fi("stakeholderRelations"),
          iDEC: (data.decisions || []).filter(x => x.initiative_id === sel)
        };
      }, [data, sel]);
      const userProfile = data.userProfile || emptyD().userProfile;

      // ─── SMART ALERTS ─────────────────────────────────────────────────
      const alerts = useMemo(() => {
        if (!ini) return [];
        const a = [];
        const adkar = adkarCov(iAC);
        const gaps = ADKAR.filter(k => adkar[k] === 0);
        if (gaps.length > 0) a.push({ type: "warn", icon: "⚠️", msg: `ADKAR-Lücken: ${gaps.join(", ")} – keine Maßnahmen zugeordnet` });
        const highResistant = iSH.filter(s => s.readiness === "resistant" && s.influence >= 7);
        highResistant.forEach(s => a.push({ type: "danger", icon: "🚨", msg: `${s.name} ist resistant mit Einfluss ${s.influence}/10 – dringend Engagement nötig` }));
        const noRecentEngagement = iSH.filter(s => s.influence >= 7).filter(s => {
          const engs = iENG.filter(e => e.stakeholder_id === s.id);
          if (engs.length === 0) return true;
          const last = engs.sort((a, b) => b.date.localeCompare(a.date))[0];
          return daysBetween(last.date, today()) > 14;
        });
        noRecentEngagement.forEach(s => a.push({ type: "warn", icon: "📅", msg: `${s.name} (Einfluss ${s.influence}/10) – kein Engagement seit >14 Tagen` }));
        iTG.forEach(tg => {
          const impacts = iIM.filter(i => i.target_group_id === tg.id);
          const totalLoad = impacts.reduce((s, i) => s + (i.impact_level || 0), 0);
          if (totalLoad > 25) a.push({ type: "danger", icon: "🔥", msg: `${tg.name}: Change-Saturation kritisch (Gesamt-Score: ${totalLoad})` });
        });
        const milestone = ini.milestones?.[0];
        if (milestone) {
          const daysLeft = daysBetween(today(), milestone.date);
          if (daysLeft > 0 && daysLeft <= 28) {
            const unready = iAC.filter(a => a.status === "planned");
            if (unready.length > 3) a.push({ type: "danger", icon: "⏰", msg: `Go-Live in ${daysLeft} Tagen – noch ${unready.length} Maßnahmen in "Geplant"` });
          }
        }
        // ── Alert-Typen ──────────────────────────────────────────
        // Alert 6: Hochrisiko ohne Gegenmaßnahme
        iCR.filter(r => (r.probability||0)*(r.impact||0) >= 16 && !r.mitigation && r.status === "open").forEach(r =>
          a.push({ type: "danger", icon: "🛡️", msg: `Risiko "${r.title}" (Score ${(r.probability||0)*(r.impact||0)}) ohne Gegenmaßnahme dokumentiert` })
        );
        // Alert 8: Sponsor-Inaktivität (kein sponsorTracking-Eintrag in >21 Tagen)
        iSH.filter(s => (s.roles||[s.role]).includes("Sponsor")).forEach(s => {
          const tracks = iSPT.filter(t => t.stakeholder_id === s.id).sort((a,b) => (b.date||"").localeCompare(a.date||""));
          if (tracks.length === 0 || (tracks[0].date && daysBetween(tracks[0].date, today()) > 21))
            a.push({ type: "warn", icon: "👔", msg: `Sponsor ${s.name} – kein Tracking-Eintrag seit >21 Tagen` });
        });
        // Alert 9: Benefits mit abgelaufenem Realisierungsdatum und Status "expected"
        iBEN.filter(b => b.realization_date && b.status === "expected" && daysBetween(b.realization_date, today()) > 0).forEach(b =>
          a.push({ type: "warn", icon: "💎", msg: `Nutzen "${b.title}" – Realisierungsdatum ${fmtDate(b.realization_date)} überschritten, Status noch "Erwartet"` })
        );
        // Alert 10: Narrativ ohne Zielgruppe
        iNAR.filter(n => !n.audience || n.audience.trim() === "").forEach(n =>
          a.push({ type: "warn", icon: "📖", msg: `Narrativ "${n.title}" hat keine Zielgruppe – Kommunikationslücke möglich` })
        );
        return a;
      }, [ini, iSH, iAC, iIM, iTG, iENG, iCR, iSPT, iBEN, iNAR]);

      // ─── SIDEBAR (grouped navigation) ────────────────────────────────
      const navGroups = [
        { label: "Steuerung", items: [
          { key: "dashboard", icon: "📊", label: "Dashboard" },
          { key: "portfolio", icon: "📁", label: "Portfolio" },
        ]},
        { label: "Projekt", items: [
          { key: "initiative", icon: "◉", label: "Projekt", off: !sel },
          { key: "outcomes", icon: "📈", label: "Wirkungsmessung", off: !sel },
          { key: "leadership", icon: "👔", label: "Sponsoring", off: !sel },
          { key: "teamdev", icon: "🧩", label: "Multiplikator:innen", off: !sel },
          { key: "dialogue", icon: "\u{1F4AC}", label: "Botschaften & Story", off: !sel },
          { key: "kommtrain", icon: "\u{1F4E3}", label: "Komm. & Training", off: !sel },
          { key: "opmodel", icon: "\u2699\uFE0F", label: "Entscheidungen & Risiken", off: !sel },
        ]},
        { label: "Planung & Analyse", items: [
          { key: "aktivitaetslog", icon: "📋", label: "Aktivitätslog", off: !sel },
          { key: "docs", icon: "📄", label: "Dokumente", off: !sel },
          { key: "impaktanalyse", icon: "🌡️", label: "Impact-Analyse", off: !sel },
          { key: "adoption", icon: "🎓", label: "Adoption & Reife", off: !sel },
        ]},
        { label: "Wissen", items: [
          { key: "methods", icon: "📚", label: "Methoden-Bibliothek" },
          { key: "references", icon: "📑", label: "Projektreferenzen" },
          { key: "cmprofile", icon: "🧑‍💼", label: "Profile" },
        ]},
        { label: "System", items: [
          { key: "io", icon: "↕️", label: "Import / Export" },
        ]},
      ];
      const Sidebar = () => (
        <div className={`no-print sidebar-panel${sidebarOpen ? " sidebar-open" : ""}`} style={{ width: 250, minHeight: "100vh", background: T.surface, borderRight: `1px solid ${T.border}`, display: "flex", flexDirection: "column", flexShrink: 0 }}>
          <div style={{ padding: "24px 20px 16px", borderBottom: `1px solid ${T.borderLight}` }}>
            <div style={S.rowBetween}>
              <div>
                <div style={{ fontSize: 24, fontWeight: 700, color: T.adessoBlau, letterSpacing: -0.5, marginBottom: 2 }}>adesso</div>
                <div style={{ fontSize: 10, color: T.textMut, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase" }}>CHANGE TOGETHER</div>
              </div>
              <Tip text={`${userProfile.name} (${userProfile.role})`}>
                <div onClick={() => { const roles = ["admin", "cm", "sponsor", "viewer"]; const idx = roles.indexOf(userProfile.role); up(d => { d.userProfile.role = roles[(idx + 1) % roles.length]; }); }}
                  style={{ width: 32, height: 32, borderRadius: "50%", background: T.adessoBlau, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>{userProfile.initials}</div>
              </Tip>
            </div>
          </div>
          <nav style={{ padding: "4px 12px", flex: 1, overflowY: "auto" }}>
            {navGroups.map(g => (
              <div key={g.label}>
                <div style={{ padding: "10px 12px 4px", fontSize: 10, fontWeight: 700, color: T.adessoGrau, textTransform: "uppercase", letterSpacing: 0.5 }}>{g.label}</div>
                {g.items.map(item => (
                  <button key={item.key} disabled={item.off} onClick={() => { setNav(item.key); if (item.key === "initiative") setSub("overview"); setSidebarOpen(false); }}
                    style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "7px 12px", borderRadius: T.rs, border: "none", cursor: item.off ? "not-allowed" : "pointer", textAlign: "left", background: nav === item.key ? T.accentLt : "transparent", color: nav === item.key ? T.adessoBlau : item.off ? T.borderLight : T.textSec, fontSize: 12.5, fontWeight: nav === item.key ? 600 : 400, fontFamily: T.font, transition: "0.15s", opacity: item.off ? 0.4 : 1, marginBottom: 1 }}>
                    <span style={{ fontSize: 13, width: 18, textAlign: "center" }}>{item.icon}</span>{item.label}
                    {item.key === "dashboard" && alerts.length > 0 && <span style={{ marginLeft: "auto", background: T.danger, color: "#fff", borderRadius: 8, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>{alerts.length}</span>}
                  </button>
                ))}
              </div>
            ))}
          </nav>
          {ini && (
            <div style={{ padding: "12px 20px", borderTop: `1px solid ${T.borderLight}`, background: T.accentLt }}>
              <div style={{ fontSize: 10, fontWeight: 600, color: T.adessoBlau }}>Aktives Projekt</div>
              <div style={{ fontSize: 12, fontWeight: 700, color: T.text, marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{ini.name}</div>
            </div>
          )}
        </div>
      );

      // ─── DASHBOARD (merged with Report) ─────────────────────────────
      const DashboardView = () => {
        const acts = data.actions;
        const imps = data.impactItems;
        const tA = acts.length, dA = acts.filter(a => a.status === "done").length;
        const pct = tA ? Math.round(dA / tA * 100) : 0;
        const hiImp = imps.filter(i => (i.impact_level || 0) >= 8).length;
        const statusDist = { on_track: 0, at_risk: 0, critical: 0 };
        data.initiatives.forEach(ini => {
          const iniActs = acts.filter(a => a.initiative_id === ini.id);
          const iniDone = iniActs.filter(a => a.status === "done").length;
          const iniPct = iniActs.length ? iniDone / iniActs.length : 0;
          if (iniPct >= 0.7) statusDist.on_track++;
          else if (iniPct >= 0.4) statusDist.at_risk++;
          else statusDist.critical++;
        });
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 24 }}>
              <div>
                <h2 style={{ fontSize: 24, fontWeight: 700, color: T.adessoBlau, margin: 0 }}>Portfolio Dashboard</h2>
                <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Überblick aller Change-Projekte</p>
              </div>
            </div>
            {alerts.length > 0 && sel && ini && (
              <Card style={{ marginBottom: 16, padding: 14, borderLeft: `4px solid ${T.danger}`, background: T.dangerLt + "44" }}>
                <SectionHead>⚡ Smart Alerts ({alerts.length})</SectionHead>
                {alerts.map((a, i) => <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 5, fontSize: 13, color: a.type === "danger" ? T.danger : T.warn }}><span>{a.icon}</span><span>{a.msg}</span></div>)}
              </Card>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))", gap: 14, marginBottom: 24 }}>
              {[
                ["Projekte", data.initiatives.length, T.accent, "📁", () => setNav("portfolio")],
                ["Fortschritt", `${pct}%`, T.success, "✅", null],
                ["Impacts ≥8", hiImp, T.danger, "🔥", null],
                ["On Track", statusDist.on_track, T.success, "🟢", null],
                ["At Risk / Critical", statusDist.at_risk + statusDist.critical, T.warn, "⚠️", null]
              ].map(([l, v, c, ic, click]) => (
                <Card key={l} style={{ padding: 16, borderTop: `4px solid ${c}`, cursor: click ? "pointer" : "default" }} onClick={click || undefined}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><div><div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>{l}</div><div style={{ fontSize: 26, fontWeight: 700, color: T.text }}>{v}</div></div><span style={{ fontSize: 22, opacity: 0.3 }}>{ic}</span></div>
                </Card>
              ))}
            </div>
            <Card>
              <SectionHead>Projekt-Fortschritt</SectionHead>
              {data.initiatives.length === 0 ? <p style={{ fontSize: 13, color: T.textMut }}>Noch keine Projekte. <span style={{ color: T.accent, cursor: "pointer" }} onClick={() => setNav("portfolio")}>Erstes Projekt anlegen →</span></p> :
                data.initiatives.map(i => {
                  const a = acts.filter(x => x.initiative_id === i.id), d = a.filter(x => x.status === "done").length, p = a.length ? Math.round(d / a.length * 100) : 0;
                  return (
                    <div key={i.id} style={{ marginBottom: 14 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, marginBottom: 5 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontWeight: 600, color: T.text }}>{i.name}</span>
                          {i.priority && <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 4, background: i.priority === "High" ? T.dangerLt : i.priority === "Medium" ? T.warnLt : T.successLt, color: i.priority === "High" ? T.danger : i.priority === "Medium" ? T.warn : T.success, fontWeight: 600 }}>{i.priority}</span>}
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ color: T.textMut }}>{p}% · {a.length} Maßnahmen</span>
                          <button onClick={() => { setSel(i.id); setNav("initiative"); setSub("overview"); }} style={{ padding: "3px 10px", borderRadius: T.rs, border: `1px solid ${T.accent}`, background: T.accentLt, color: T.accent, fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: T.font }}>→ Zum Projekt</button>
                        </div>
                      </div>
                      <div style={{ background: T.bg, borderRadius: 5, height: 7, overflow: "hidden" }}><div style={{ width: `${p}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.purple})`, borderRadius: 5, transition: "width 0.3s" }} /></div>
                    </div>
                  );
                })
              }
            </Card>
          </div>
        );
      };

      // ─── PORTFOLIO ────────────────────────────────────────────────────
      const PortfolioView = () => {
        const [pfTab, setPfTab] = useState("projekte");
        const [show, setShow] = useState(false);
        const [filterPriority, setFilterPriority] = useState("Alle");
        const [filterSearch, setFilterSearch] = useState("");
        const [showDep, setShowDep] = useState(false);
        const [showGate, setShowGate] = useState(false);
        const [fDep, setFDep] = useState({ from_initiative_id: "", to_initiative_id: "", type: "depends_on", notes: "" });
        const [fGate, setFGate] = useState({ initiative_id: "", name: "", date: "", status: "planned", criteria: "", notes: "" });
        const [f, sF] = useState({
          name: "", goal: "", industry: "", personDays: "", volume: "", priority: "High",
          startDate: "", endDate: "", goLiveDate: "", projectTags: [],
          fourPs: { project: "", purpose: "", particulars: "", people: "" },
          riskAssessment: INITIAL_RISK_QUESTIONS,
          pctAssessment: INITIAL_PCT_SCORES
        });
        const add = () => {
          if (!f.name) return;
          up(d => d.initiatives.push({
            id: uid("INI-"), ...f,
            personDays: Number(f.personDays) || 0,
            volume: Number(f.volume) || 0,
            milestones: f.goLiveDate ? [{ id: "M1", name: "Go-Live", date: f.goLiveDate }] : [],
            created: new Date().toISOString()
          }));
          sF({
            name: "", goal: "", industry: "", personDays: "", volume: "", priority: "High",
            startDate: "", endDate: "", goLiveDate: "", projectTags: [],
            fourPs: { project: "", purpose: "", particulars: "", people: "" },
            riskAssessment: INITIAL_RISK_QUESTIONS,
            pctAssessment: INITIAL_PCT_SCORES,
            visibility: "internal", ocm_scope: [], change_story: { why: "", what: "", how: "" }
          });
          setShow(false);
        };
        const delIni = (id, e) => { e.stopPropagation(); if (!confirm("Projekt und alle zugehörigen Daten löschen?")) return; up(d => { ["initiatives","stakeholders","targetGroups","impactItems","actions","engagements","commsItems"].forEach(k => { if (d[k]) d[k] = d[k].filter(x => x.initiative_id !== id && x.id !== id); }); }); if (sel === id) { setSel(null); setNav("portfolio"); } };
        const saveDep = () => { if (!fDep.from_initiative_id || !fDep.to_initiative_id) return; up(d => { if (!d.dependencies) d.dependencies = []; d.dependencies.push({ id: uid("DEP-"), ...fDep }); }); setFDep({ from_initiative_id: "", to_initiative_id: "", type: "depends_on", notes: "" }); setShowDep(false); };
        const saveGate = () => { if (!fGate.name) return; up(d => { if (!d.stageGates) d.stageGates = []; d.stageGates.push({ id: uid("SG-"), ...fGate }); }); setFGate({ initiative_id: "", name: "", date: "", status: "planned", criteria: "", notes: "" }); setShowGate(false); };
        const gateStatusColor = s => s === "passed" ? T.success : s === "failed" ? T.danger : s === "in_review" ? T.warn : T.textMut;
        const GATE_LABELS = { planned: "Geplant", in_review: "In Pr\u00fcfung", passed: "Bestanden", failed: "Nicht bestanden" };
        const iniName = id => data.initiatives.find(i => i.id === id)?.name || id;
        const deps = data.dependencies || [];
        const gates = data.stageGates || [];
        const PF_TABS = [{ key: "projekte", label: "Projekte" }, { key: "governance", label: "Governance" }];
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 20 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Change Portfolio</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{"\u00dc"}bersicht aller strategischen Projekte</p></div>
            </div>
            <div style={{ display: "flex", borderBottom: `2px solid ${T.borderLight}`, marginBottom: 24 }}>
              {PF_TABS.map(tab => <button key={tab.key} onClick={() => setPfTab(tab.key)} style={{ padding: "8px 18px", border: "none", borderBottom: pfTab === tab.key ? `2px solid ${T.adessoBlau}` : "none", marginBottom: -2, cursor: "pointer", fontFamily: T.font, fontSize: 13, fontWeight: pfTab === tab.key ? 700 : 400, color: pfTab === tab.key ? T.adessoBlau : T.textMut, background: "transparent" }}>{tab.label}</button>)}
            </div>
            {pfTab === "projekte" && (<>
              {data.initiatives.length > 0 && (
                <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
                  <input value={filterSearch} onChange={e => setFilterSearch(e.target.value)} placeholder={"🔍 Projekt suchen\u2026"} style={{ padding: "7px 12px", borderRadius: T.rs, border: `1px solid ${T.border}`, fontSize: 13, outline: "none", background: T.surface, color: T.text, flex: "1 1 200px", minWidth: 160 }} />
                  {["Alle", "High", "Medium", "Low"].map(p => (
                    <Btn key={p} v={filterPriority === p ? "primary" : "default"} small onClick={() => setFilterPriority(p)}>{p === "Alle" ? "Alle Priorit\u00e4ten" : p}</Btn>
                  ))}
                </div>
              )}
              {data.initiatives.length === 0 ? <Empty icon="📁" title="Noch keine Projekte" sub="Starte dein Portfolio" action={<Btn v="primary" onClick={() => setShow(true)}>Erstes Projekt</Btn>} /> : (() => {
                const filtered = data.initiatives.filter(i =>
                  (filterPriority === "Alle" || i.priority === filterPriority) &&
                  (!filterSearch || i.name.toLowerCase().includes(filterSearch.toLowerCase()) || (i.goal || "").toLowerCase().includes(filterSearch.toLowerCase()))
                );
                if (filtered.length === 0) return <Empty icon="🔍" title="Keine Ergebnisse" sub="Filter oder Suchbegriff anpassen" />;
                return (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 14 }}>
                    {filtered.map(i => {
                      const ac = data.actions.filter(a => a.initiative_id === i.id), dn = ac.filter(a => a.status === "done").length, pc = ac.length ? Math.round(dn / ac.length * 100) : 0;
                      return <Card key={i.id} onClick={() => { setSel(i.id); setNav("initiative"); setSub("overview"); }} style={{ cursor: "pointer", borderColor: sel === i.id ? T.accent : T.border }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                          <div style={{ fontSize: 15, fontWeight: 700, color: T.text }}>{i.name}</div>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            <Badge color={i.priority === "High" ? T.danger : i.priority === "Medium" ? T.warn : T.success}>{i.priority}</Badge>
                            <Btn v="ghost" small onClick={e => delIni(i.id, e)}>{"\u2715"}</Btn>
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
                          {i.industry && <Badge color={T.purple}>{i.industry}</Badge>}
                          {(i.projectTags || []).map(t => <Badge key={t} color={T.cyan}>{t}</Badge>)}
                        </div>
                        <p style={{ fontSize: 12, color: T.textSec, margin: "0 0 8px", minHeight: 16 }}>{i.goal || "\u2013"}</p>
                        <div style={{ display: "flex", gap: 10, fontSize: 11, color: T.textMut, marginBottom: 8 }}>
                          {i.startDate && <span>{"📅"} {fmtDate(i.startDate)} {"\u2013"} {fmtDate(i.endDate)}</span>}
                          {i.personDays > 0 && <span>{"👤"} {i.personDays} PT</span>}
                          {i.volume > 0 && <span>{"💰"} {Number(i.volume).toLocaleString("de-DE")}{"\u20ac"}</span>}
                        </div>
                        <div style={{ background: T.bg, borderRadius: 5, height: 5, overflow: "hidden", marginBottom: 4 }}><div style={{ width: `${pc}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.purple})`, borderRadius: 5 }} /></div>
                        <div style={{ fontSize: 11, color: T.textMut }}>{pc}% {"\u2022"} {ac.length} Ma{"\u00df"}nahmen</div>
                      </Card>;
                    })}
                    <div style={{ marginTop: 12 }}><Btn v="default" small onClick={() => setShow(true)}>{"\uFF0B"} Weiteres Projekt hinzuf\u00fcgen</Btn></div>
                  </div>
                );
              })()}
            </>)}

            {pfTab === "governance" && (
              <div style={{ ...S.formGrid }}>
                <Card>
                  <div style={{ ...S.rowBetween, marginBottom: 12 }}>
                    <SectionHead>Projekt-Abh{"\u00e4"}ngigkeiten ({deps.length})</SectionHead>
                    {deps.length > 0 && <Btn v="primary" small onClick={() => setShowDep(true)}>{"\uFF0B"} Abh{"\u00e4"}ngigkeit</Btn>}
                  </div>
                  {deps.length === 0 ? <Empty icon="🔗" title="Keine Abh\u00e4ngigkeiten" sub="Verbinde Projekte miteinander" action={<Btn v="primary" onClick={() => setShowDep(true)}>{"\uFF0B"} Abh{"\u00e4"}ngigkeit</Btn>} /> : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {deps.map(d => (
                        <div key={d.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ fontSize: 13 }}>
                            <span style={{ fontWeight: 600 }}>{iniName(d.from_initiative_id)}</span>
                            <span style={{ margin: "0 8px", color: T.textMut }}>{"\u2192"} {d.type === "depends_on" ? "abh\u00e4ngig von" : d.type === "blocks" ? "blockiert" : "verkn\u00fcpft mit"}</span>
                            <span style={{ fontWeight: 600 }}>{iniName(d.to_initiative_id)}</span>
                          </div>
                          <Btn v="ghost" small onClick={() => up(d2 => { d2.dependencies = (d2.dependencies || []).filter(x => x.id !== d.id); })}>{"\u2715"}</Btn>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
                <Card>
                  <div style={{ ...S.rowBetween, marginBottom: 12 }}>
                    <SectionHead>Stage Gates ({gates.length})</SectionHead>
                    {gates.length > 0 && <Btn v="primary" small onClick={() => setShowGate(true)}>{"\uFF0B"} Stage Gate</Btn>}
                  </div>
                  {gates.length === 0 ? <Empty icon="🏁" title="Keine Stage Gates" sub="Definiere Meilenstein-Pr\u00fcfpunkte" action={<Btn v="primary" onClick={() => setShowGate(true)}>{"\uFF0B"} Stage Gate</Btn>} /> : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {gates.map(g => (
                        <div key={g.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${gateStatusColor(g.status)}` }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                            <span style={{ fontSize: 13, fontWeight: 700 }}>{g.name}</span>
                            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                              <Badge color={gateStatusColor(g.status)}>{GATE_LABELS[g.status] || g.status}</Badge>
                              <Btn v="ghost" small onClick={() => up(d => { d.stageGates = (d.stageGates || []).filter(x => x.id !== g.id); })}>{"\u2715"}</Btn>
                            </div>
                          </div>
                          {g.date && <div style={{ fontSize: 11, color: T.textMut }}>{"📅"} {fmtDate(g.date)}</div>}
                          {g.criteria && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{g.criteria}</div>}
                          <div style={{ marginTop: 6 }}>
                            {["planned","in_review","passed","failed"].map(s => (
                              <Btn key={s} small v={g.status === s ? "primary" : "default"} onClick={() => up(d => { const sg = (d.stageGates || []).find(x => x.id === g.id); if (sg) sg.status = s; })} style={{ marginRight: 4 }}>{GATE_LABELS[s]}</Btn>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </Card>
              </div>
            )}

            <Modal open={show} onClose={() => setShow(false)} title="Neues Projekt" wide>
              <div style={S.formGrid}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} placeholder="z.B. ERP Migration Wave 1" style={{ gridColumn: "1/-1" }} />
                <Input label="Ziel" value={f.goal} onChange={v => sF(p => ({ ...p, goal: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Branche" value={f.industry} onChange={v => sF(p => ({ ...p, industry: v }))} options={INDUSTRIES} />
                <Input label="Priorit\u00e4t" value={f.priority} onChange={v => sF(p => ({ ...p, priority: v }))} options={["High", "Medium", "Low"]} />
                <Input label="Startdatum" value={f.startDate} onChange={v => sF(p => ({ ...p, startDate: v }))} type="date" />
                <Input label="Enddatum" value={f.endDate} onChange={v => sF(p => ({ ...p, endDate: v }))} type="date" />
                <Input label="Personentage (PT)" value={f.personDays} onChange={v => sF(p => ({ ...p, personDays: v }))} type="number" placeholder="z.B. 120" />
                <Input label={"Auftragsvolumen (\u20ac)"} value={f.volume} onChange={v => sF(p => ({ ...p, volume: v }))} type="number" placeholder="z.B. 250000" />
                <Input label="Go-Live Datum" value={f.goLiveDate} onChange={v => sF(p => ({ ...p, goLiveDate: v }))} type="date" />
                <div />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Projekt-Tags (z.B. SAP, Cloud, Reorg)" tags={f.projectTags} onChange={v => sF(p => ({ ...p, projectTags: v }))} suggestions={tags.projectTags} color={T.cyan} /></div>
              </div>
              <Btn v="primary" onClick={add} style={{ marginTop: 18, alignSelf: "flex-end" }}>Erstellen</Btn>
            </Modal>
            <Modal open={showDep} onClose={() => setShowDep(false)} title="Abh\u00e4ngigkeit hinzuf\u00fcgen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Von Projekt" value={fDep.from_initiative_id} onChange={v => setFDep(p => ({ ...p, from_initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Typ" value={fDep.type} onChange={v => setFDep(p => ({ ...p, type: v }))} options={["depends_on","blocks","related_to"]} />
                <Input label="Zu Projekt" value={fDep.to_initiative_id} onChange={v => setFDep(p => ({ ...p, to_initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Notizen" value={fDep.notes} onChange={v => setFDep(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveDep} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showGate} onClose={() => setShowGate(false)} title="Stage Gate hinzuf\u00fcgen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Projekt" value={fGate.initiative_id} onChange={v => setFGate(p => ({ ...p, initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Name" value={fGate.name} onChange={v => setFGate(p => ({ ...p, name: v }))} />
                <Input label="Datum" value={fGate.date} onChange={v => setFGate(p => ({ ...p, date: v }))} type="date" />
                <Input label="Kriterien" value={fGate.criteria} onChange={v => setFGate(p => ({ ...p, criteria: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveGate} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── CHANGE IMPACT ANALYSIS ─────────────────────────────────────
      const ChangeImpactSub = () => {
        const dims = [
          { key: "process", icon: "⚙️", label: "Prozesse", color: T.accent, questions: [
            { k: "process_current", l: "Welche Prozesse sind betroffen?", ph: "Betroffene Gesch\u00e4ftsprozesse auflisten" },
            { k: "process_change", l: "Was \u00e4ndert sich konkret?", ph: "Neue Abl\u00e4ufe, wegfallende Schritte, neue Schnittstellen" },
            { k: "process_gap", l: "Wo sind die gr\u00f6\u00dften L\u00fccken zum Zielzustand?", ph: "Kompetenz-, Tool- oder Prozess-L\u00fccken" },
          ]},
          { key: "organization", icon: "🏢", label: "Organisation & Struktur", color: T.purple, questions: [
            { k: "org_roles", l: "Welche Rollen/Teams sind betroffen?", ph: "Abteilungen, Teams, F\u00fchrungsebenen" },
            { k: "org_structure", l: "Wie \u00e4ndert sich die Aufbauorganisation?", ph: "Neue Teams, ge\u00e4nderte Berichtslinien, Verantwortlichkeiten" },
            { k: "org_culture", l: "Welche kulturellen Ver\u00e4nderungen sind n\u00f6tig?", ph: "Zusammenarbeit, Entscheidungswege, Werte" },
          ]},
          { key: "technology", icon: "💻", label: "Technologie & Systeme", color: T.cyan, questions: [
            { k: "tech_systems", l: "Welche Systeme werden eingef\u00fchrt/abgel\u00f6st?", ph: "Neue Tools, Plattformen, Schnittstellen" },
            { k: "tech_skills", l: "Welche technischen F\u00e4higkeiten werden ben\u00f6tigt?", ph: "Schulungsbedarf, neue Kompetenzen" },
            { k: "tech_transition", l: "Wie sieht die \u00dcbergangsphase aus?", ph: "Parallelbetrieb, Datenmigration, Pilotierung" },
          ]},
          { key: "people", icon: "👥", label: "Menschen & Kultur", color: T.pink, questions: [
            { k: "people_affected", l: "Wie viele Mitarbeitende sind betroffen?", ph: "Anzahl, Standorte, Bereiche" },
            { k: "people_resistance", l: "Wo ist mit Widerstand zu rechnen?", ph: "Angst vor Job\u00e4nderungen, Komfortzone, Unsicherheit" },
            { k: "people_support", l: "Welche Unterst\u00fctzung wird ben\u00f6tigt?", ph: "Coaching, Trainings, Kommunikation, F\u00fchrungskr\u00e4fteentwicklung" },
          ]},
        ];
        const cia = ini.change_impact_analysis || {};
        const upCIA = (key, val) => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.change_impact_analysis) i.change_impact_analysis = {}; i.change_impact_analysis[key] = val; } });
        const dimScores = dims.map(dim => {
          const answered = dim.questions.filter(q => cia[q.k] && cia[q.k].trim().length > 0).length;
          return { ...dim, answered, total: dim.questions.length, pct: Math.round(answered / dim.questions.length * 100) };
        });
        const totalPct = Math.round(dimScores.reduce((s, d) => s + d.answered, 0) / dimScores.reduce((s, d) => s + d.total, 0) * 100);
        return (
          <div>
            <Card style={{ marginBottom: 20 }}>
              <SectionHead>Change Impact Analyse {"\u2013"} Fortschritt</SectionHead>
              <p style={{ fontSize: 12, color: T.textMut, marginBottom: 12 }}>Analysiere die Ver{"\u00e4"}nderung systematisch in 4 Dimensionen. Vollst{"\u00e4"}ndigkeit: <strong>{totalPct}%</strong></p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
                {dimScores.map(d => (
                  <div key={d.key} style={{ padding: "12px 14px", background: d.color + "12", borderRadius: T.rs, borderLeft: `3px solid ${d.color}`, textAlign: "center" }}>
                    <div style={{ fontSize: 22, marginBottom: 4 }}>{d.icon}</div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: d.color }}>{d.label}</div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: d.pct === 100 ? T.success : d.pct > 0 ? T.warn : T.textMut, marginTop: 4 }}>{d.pct}%</div>
                    <div style={{ fontSize: 10, color: T.textMut }}>{d.answered}/{d.total} beantwortet</div>
                  </div>
                ))}
              </div>
            </Card>
            {dims.map(dim => (
              <Card key={dim.key} style={{ marginBottom: 16 }}>
                <SectionHead>{dim.icon} {dim.label}</SectionHead>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {dim.questions.map(q => (
                    <Input key={q.k} label={q.l} value={cia[q.k] || ""} onChange={v => upCIA(q.k, v)} textarea placeholder={q.ph} />
                  ))}
                </div>
              </Card>
            ))}
            <Card>
              <SectionHead>Zusammenfassende Bewertung</SectionHead>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Input label={"Gesamteinsch\u00e4tzung der Ver\u00e4nderungstiefe"} value={cia.overall_depth || ""} onChange={v => upCIA("overall_depth", v)} options={["", "Gering \u2013 inkrementelle Anpassung", "Mittel \u2013 sp\u00fcrbare Ver\u00e4nderung", "Hoch \u2013 tiefgreifender Wandel", "Transformativ \u2013 grundlegender Kulturwandel"]} />
                <Input label={"Prim\u00e4re betroffene Dimension"} value={cia.primary_dimension || ""} onChange={v => upCIA("primary_dimension", v)} options={["", "Prozesse", "Organisation", "Technologie", "Menschen"]} />
                <Input label="Kritischster Handlungsbedarf" value={cia.critical_action || ""} onChange={v => upCIA("critical_action", v)} textarea style={{ gridColumn: "1/-1" }} placeholder="Was muss als erstes adressiert werden?" />
              </div>
            </Card>
          </div>
        );
      };

      // ─── ROADMAP / OCM-AKTIVITÄTENPLAN ─────────────────────────────
      const RoadmapSub = () => {
        const [showMs, setShowMs] = useState(false);
        const [fMs, setFMs] = useState({ title: "", date: "", adkar_phase: "", type: "milestone", notes: "" });
        const milestones = (ini.roadmap_items || []).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
        const saveMs = () => {
          if (!fMs.title) return;
          up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.roadmap_items) i.roadmap_items = []; i.roadmap_items.push({ id: uid("RM-"), ...fMs }); } });
          setFMs({ title: "", date: "", adkar_phase: "", type: "milestone", notes: "" }); setShowMs(false);
        };
        const delMs = id => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i.roadmap_items = (i.roadmap_items || []).filter(x => x.id !== id); });
        const PHASE_COLORS = { Awareness: "#e65100", Desire: "#1565c0", Knowledge: "#2e7d32", Ability: "#6a1b9a", Reinforcement: "#c62828" };
        const TYPE_ICONS = { milestone: "\u{1F3AF}", phase_start: "\u25B6\uFE0F", phase_end: "\u23F9\uFE0F", checkpoint: "\u2705", event: "\u{1F4C5}" };
        const grouped = {};
        ADKAR.forEach(a => { grouped[a] = milestones.filter(m => m.adkar_phase === a); });
        const ungrouped = milestones.filter(m => !m.adkar_phase || !ADKAR.includes(m.adkar_phase));
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 16 }}>
              <span style={{ fontSize: 14, fontWeight: 600 }}>OCM-Aktivit{"\u00e4"}tenplan / Roadmap</span>
              <Btn v="primary" small onClick={() => setShowMs(true)}>{"\uFF0B"} Eintrag</Btn>
            </div>
            <Card style={{ marginBottom: 20 }}>
              <SectionHead>ADKAR-Phasen Timeline</SectionHead>
              <p style={{ fontSize: 12, color: T.textMut, marginBottom: 14 }}>Ordne Meilensteine und Aktivit{"\u00e4"}ten den ADKAR-Phasen zu, um den {"\u00dc"}berblick {"\u00fc"}ber den Change-Verlauf zu behalten.</p>
              <div style={{ display: "flex", gap: 0, marginBottom: 20 }}>
                {ADKAR.map((a, idx) => {
                  const cnt = (grouped[a] || []).length;
                  return (
                    <div key={a} style={{ flex: 1, padding: "12px 10px", background: (PHASE_COLORS[a] || T.textMut) + "14", borderLeft: idx > 0 ? `2px solid ${T.border}` : "none", textAlign: "center", position: "relative" }}>
                      <div style={{ fontSize: 11, fontWeight: 700, color: PHASE_COLORS[a], letterSpacing: 0.5 }}>{a}</div>
                      <div style={{ fontSize: 22, fontWeight: 700, color: cnt > 0 ? PHASE_COLORS[a] : T.textMut, marginTop: 4 }}>{cnt}</div>
                      <div style={{ fontSize: 10, color: T.textMut }}>Eintr{"\u00e4"}ge</div>
                      {idx < 4 && <div style={{ position: "absolute", right: -8, top: "50%", transform: "translateY(-50%)", fontSize: 14, color: T.textMut }}>{"\u25B8"}</div>}
                    </div>
                  );
                })}
              </div>
              {ADKAR.map(a => grouped[a].length > 0 && (
                <div key={a} style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: PHASE_COLORS[a], marginBottom: 6, padding: "4px 10px", background: (PHASE_COLORS[a]) + "12", borderRadius: T.rs }}>{a}</div>
                  {grouped[a].map(m => (
                    <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderBottom: `1px solid ${T.borderLight}` }}>
                      <span>{TYPE_ICONS[m.type] || "\u{1F4CC}"}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{m.title}</div>
                        {m.notes && <div style={{ fontSize: 11, color: T.textMut }}>{m.notes}</div>}
                      </div>
                      <span style={{ fontSize: 11, color: T.textSec, whiteSpace: "nowrap" }}>{m.date ? fmtDate(m.date) : "\u2013"}</span>
                      <Btn v="ghost" small onClick={() => delMs(m.id)}>{"\u2715"}</Btn>
                    </div>
                  ))}
                </div>
              ))}
              {ungrouped.length > 0 && (
                <div style={{ marginBottom: 14 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: T.textMut, marginBottom: 6, padding: "4px 10px", background: T.bg, borderRadius: T.rs }}>Ohne ADKAR-Phase</div>
                  {ungrouped.map(m => (
                    <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", borderBottom: `1px solid ${T.borderLight}` }}>
                      <span>{TYPE_ICONS[m.type] || "\u{1F4CC}"}</span>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{m.title}</div>
                        {m.notes && <div style={{ fontSize: 11, color: T.textMut }}>{m.notes}</div>}
                      </div>
                      <span style={{ fontSize: 11, color: T.textSec, whiteSpace: "nowrap" }}>{m.date ? fmtDate(m.date) : "\u2013"}</span>
                      <Btn v="ghost" small onClick={() => delMs(m.id)}>{"\u2715"}</Btn>
                    </div>
                  ))}
                </div>
              )}
              {milestones.length === 0 && <Empty icon={"\u{1F5D3}\uFE0F"} title={"Keine Eintr\u00e4ge"} sub={"Lege Meilensteine und Aktivit\u00e4ten an"} />}
            </Card>
            {iAC.length > 0 && (
              <Card>
                <SectionHead>Ma{"\u00df"}nahmen nach ADKAR-Phase</SectionHead>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 8 }}>
                  {ADKAR.map(a => {
                    const acts = iAC.filter(ac => (ac.adkar_tags || []).includes(a));
                    return (
                      <div key={a} style={{ padding: "10px", background: (PHASE_COLORS[a] || T.textMut) + "10", borderRadius: T.rs, borderTop: `3px solid ${PHASE_COLORS[a]}` }}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: PHASE_COLORS[a], marginBottom: 6 }}>{a}</div>
                        {acts.length === 0 ? <div style={{ fontSize: 11, color: T.textMut }}>Keine</div> : acts.map(ac => (
                          <div key={ac.id} style={{ fontSize: 11, padding: "3px 0", borderBottom: `1px solid ${T.borderLight}` }}>
                            <Badge color={ac.status === "done" ? T.success : ac.status === "in_progress" ? T.accent : T.warn}>{ac.status === "done" ? "\u2713" : ac.status === "in_progress" ? "\u25B6" : "\u25CB"}</Badge> {ac.title}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </Card>
            )}
            <Modal open={showMs} onClose={() => setShowMs(false)} title="Roadmap-Eintrag anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Titel" value={fMs.title} onChange={v => setFMs(p => ({ ...p, title: v }))} />
                <Input label="Datum" value={fMs.date} onChange={v => setFMs(p => ({ ...p, date: v }))} type="date" />
                <Input label="ADKAR-Phase" value={fMs.adkar_phase} onChange={v => setFMs(p => ({ ...p, adkar_phase: v }))} options={["", ...ADKAR]} />
                <Input label="Typ" value={fMs.type} onChange={v => setFMs(p => ({ ...p, type: v }))} options={[{value:"milestone",label:"Meilenstein"},{value:"phase_start",label:"Phasenstart"},{value:"phase_end",label:"Phasenende"},{value:"checkpoint",label:"Checkpoint"},{value:"event",label:"Event"}]} />
                <Input label="Notizen" value={fMs.notes} onChange={v => setFMs(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveMs} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── INITIATIVE ───────────────────────────────────────────────────
      const InitiativeView = () => {
        if (!ini) return <Empty icon="◉" title="Kein Projekt ausgewählt" sub="Wähle im Portfolio" />;
        const tabs = [
          { key: "overview", label: "\u00dcbersicht" },
          { key: "projectdata", label: "Projektdaten" },
          { key: "stakeholders", label: "Stakeholder", count: iSH.length },
          { key: "targets", label: "Zielgruppen", count: iTG.length },
          { key: "changeimpact", label: "Change Impact", count: iIM.length },
          { key: "actions", label: "Ma\u00dfnahmen", count: iAC.length },
          { key: "roadmap", label: "Roadmap" },
          { key: "risk", label: "Risikoanalyse" },
          { key: "pct", label: "PCT Profile" },
          { key: "budget", label: "Budget" },
        ];
        return (
          <div>
            <h2 style={{ margin: "0 0 4px", fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>{ini.name}</h2>
            <p style={{ margin: "0 0 20px", fontSize: 13, color: T.textMut }}>{ini.goal}</p>
            <Tabs tabs={tabs} active={sub} onChange={setSub} />
            {sub === "overview" && <OverviewSub />}
            {sub === "projectdata" && <ProjectDataSub />}
            {sub === "stakeholders" && <StakeholderSub />}
            {sub === "targets" && <TargetSub />}
            {sub === "changeimpact" && <React.Fragment><ChangeImpactSub /><div style={{ marginTop: 28 }}><SectionHead>{"Impact-Analyse pro Zielgruppe"}</SectionHead><p style={{ fontSize: 12, color: T.textMut, marginBottom: 12 }}>{"Detaillierte Bewertung der Ver\u00e4nderungsauswirkung auf einzelne Zielgruppen (Impact, Trainingsbedarf, Kommunikationsbedarf)."}</p><ImpactSub /></div></React.Fragment>}
            {sub === "actions" && <ActionSub />}
            {sub === "roadmap" && <RoadmapSub />}
            {sub === "risk" && <RiskSub />}
            {sub === "pct" && <PCTSub />}
            {sub === "budget" && <BudgetSub />}
          </div>
        );
      };

      const OverviewSub = () => {
        const adkar = adkarCov(iAC);
        const sc = { planned: 0, in_progress: 0, done: 0 };
        iAC.forEach(a => sc[a.status]++);
        const totalAc = iAC.length;
        const pct = totalAc ? Math.round(sc.done / totalAc * 100) : 0;
        const ra = ini.riskAssessment || INITIAL_RISK_QUESTIONS;
