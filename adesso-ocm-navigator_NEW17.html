          </div>
        );
      };

      // ─── PDF REPORT ──────────────────────────────────────────────────
      const PDFReportView = () => {
        if (!ini) return <Empty icon="📄" title="Kein Projekt" sub="" />;
        const dn = iAC.filter(a => a.status === "done").length;
        const pct = iAC.length ? Math.round(dn / iAC.length * 100) : 0;
        const adkar = adkarCov(iAC);
        const gaps = ADKAR.filter(a => adkar[a] === 0);
        const p4 = ini.fourPs || {};
        const S = { fontSize: 13, lineHeight: 1.7, color: T.text };
        const H2 = { fontSize: 18, fontWeight: 700, color: T.adessoBlau, margin: "24px 0 10px", borderBottom: `2px solid ${T.accent}`, paddingBottom: 6 };
        const H3 = { fontSize: 14, fontWeight: 700, color: T.text, margin: "16px 0 6px" };
        const TH = { padding: "6px 10px", textAlign: "left", fontSize: 11, fontWeight: 700, color: T.textMut, background: T.bg, borderBottom: `1px solid ${T.border}` };
        const TD = { padding: "6px 10px", fontSize: 12, borderBottom: `1px solid ${T.borderLight}` };
        return (
          <div>
            <div className="no-print" style={{ ...S.rowBetween, marginBottom: 20 }}>
              <Btn onClick={() => setNav("dashboard")}>← Zurück zum Dashboard</Btn>
              <Btn v="primary" onClick={() => window.print()}>🖨️ Drucken / PDF speichern</Btn>
            </div>
            <div style={{ maxWidth: 800, margin: "0 auto" }}>
              <h1 style={{ fontSize: 28, fontWeight: 700, color: T.adessoBlau, marginBottom: 4 }}>{ini.name}</h1>
              <p style={{ fontSize: 13, color: T.textMut, marginBottom: 4 }}>Statusreport – {fmtDate(today())}</p>
              {ini.goal && <p style={{ ...S, fontStyle: "italic", marginBottom: 20 }}>{ini.goal}</p>}

              <div style={H2}>Projektübersicht</div>
              <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <tbody>
                  {[["Branche", ini.industry], ["Priorität", ini.priority], ["Zeitraum", ini.startDate ? `${fmtDate(ini.startDate)} – ${fmtDate(ini.endDate)}` : "–"], ["Go-Live", ini.milestones?.[0]?.date ? fmtDate(ini.milestones[0].date) : "–"], ["Personentage", ini.personDays ? `${ini.personDays} PT` : "–"], ["Volumen", ini.volume ? `${Number(ini.volume).toLocaleString("de-DE")}€` : "–"], ["Fortschritt", `${pct}% (${dn}/${iAC.length} Maßnahmen)`]].map(([l, v]) => (
                    <tr key={l}><td style={{ ...TD, fontWeight: 600, width: 160 }}>{l}</td><td style={TD}>{v || "–"}</td></tr>
                  ))}
                </tbody>
              </table>

              {(p4.project || p4.purpose || p4.particulars || p4.people) && <>
                <div style={H2}>Projektdefinition</div>
                {p4.project && <><div style={H3}>Projekt</div><p style={S}>{p4.project}</p></>}
                {p4.purpose && <><div style={H3}>Zweck</div><p style={S}>{p4.purpose}</p></>}
                {p4.particulars && <><div style={H3}>Besonderheiten</div><p style={S}>{p4.particulars}</p></>}
                {p4.people && <><div style={H3}>Betroffene</div><p style={S}>{p4.people}</p></>}
              </>}

              {gaps.length > 0 && <div style={{ padding: 12, background: T.warnLt, borderRadius: T.rs, marginTop: 16, fontSize: 13 }}>⚠ ADKAR-Lücken: <strong>{gaps.join(", ")}</strong> – keine Maßnahmen zugeordnet</div>}

              <div style={H2}>ADKAR Coverage</div>
              <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
                {ADKAR.map(a => <div key={a} style={{ flex: 1, textAlign: "center", padding: 10, background: T.bg, borderRadius: T.rs }}>
                  <div style={{ fontSize: 20, fontWeight: 700, color: ADKAR_C[a] }}>{adkar[a]}</div>
                  <div style={{ fontSize: 10, fontWeight: 600 }}>{a}</div>
                </div>)}
              </div>

              <div style={H2}>Stakeholder ({iSH.length})</div>
              {iSH.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Name", "Rolle(n)", "Organisationseinheit", "Einfl.", "Int.", "Readiness", "Notizen"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                <tbody>{iSH.map(s => <tr key={s.id}>
                  <td style={{ ...TD, fontWeight: 600 }}>{s.name}</td>
                  <td style={TD}>{(s.roles || [s.role]).join(", ")}</td>
                  <td style={TD}>{s.org_unit || "–"}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{s.influence}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{s.interest}</td>
                  <td style={TD}>{s.readiness}</td>
                  <td style={{ ...TD, fontSize: 11 }}>{s.notes || "–"}</td>
                </tr>)}</tbody>
              </table>}

              <div style={H2}>Zielgruppen ({iTG.length})</div>
              {iTG.map(tg => <div key={tg.id} style={{ marginBottom: 10, padding: 10, background: T.bg, borderRadius: T.rs }}>
                <span style={{ fontWeight: 700 }}>{tg.name}</span> – {tg.size} Personen • {(tg.org_units || []).join(", ") || "–"}
              </div>)}

              <div style={H2}>Impact Items ({iIM.length})</div>
              {iIM.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Zielgruppe", "Dimension", "Beschreibung", "Impact", "Training", "Komm."].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                <tbody>{iIM.map(im => { const tg = iTG.find(t => t.id === im.target_group_id); return <tr key={im.id}>
                  <td style={TD}>{tg?.name || "–"}</td>
                  <td style={TD}>{im.dimension}</td>
                  <td style={{ ...TD, maxWidth: 200 }}>{im.change_description}</td>
                  <td style={{ ...TD, textAlign: "center", fontWeight: 700, color: scoreColor(im.impact_level) }}>{im.impact_level}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{im.training_need}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{im.comms_need}</td>
                </tr>; })}</tbody>
              </table>}

              <div style={H2}>Maßnahmen ({iAC.length})</div>
              {iAC.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Maßnahme", "Typ", "Status", "Fällig", "Owner", "ADKAR"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                <tbody>{iAC.map(a => { const ow = iSH.find(s => s.id === a.owner_person_id); return <tr key={a.id}>
                  <td style={{ ...TD, fontWeight: 600 }}>{a.title}</td>
                  <td style={TD}>{(a.typeTags || [a.type]).join(", ")}</td>
                  <td style={{ ...TD, color: statusColor(a.status) }}>{statusLabel(a.status)}</td>
                  <td style={TD}>{a.due_date ? fmtDate(a.due_date) : "–"}</td>
                  <td style={TD}>{ow?.name || "–"}</td>
                  <td style={TD}>{(a.adkar_tags || []).join(", ")}</td>
                </tr>; })}</tbody>
              </table>}

              {iENG.length > 0 && <>
                <div style={H2}>Engagements ({iENG.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Datum", "Stakeholder", "Art", "Ergebnis", "Nächste Aktion"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iENG.sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(e => { const s = iSH.find(x => x.id === e.stakeholder_id); return <tr key={e.id}>
                    <td style={TD}>{fmtDate(e.date)}</td>
                    <td style={{ ...TD, fontWeight: 600 }}>{s?.name || "–"}</td>
                    <td style={TD}>{e.type}</td>
                    <td style={TD}>{e.outcome || "–"}</td>
                    <td style={TD}>{e.next_action || "–"}</td>
                  </tr>; })}</tbody>
                </table>
              </>}

              {iCOM.length > 0 && <>
                <div style={H2}>Kommunikationsplanung ({iCOM.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Zielgruppe", "ADKAR", "Kernbotschaft", "Kanal", "Absender"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iCOM.map(c => { const tg = iTG.find(t => t.id === c.target_group_id); const sender = iSH.find(s => s.id === c.sender_id); return <tr key={c.id}>
                    <td style={TD}>{tg?.name || "Alle"}</td>
                    <td style={TD}>{c.adkar_phase}</td>
                    <td style={{ ...TD, maxWidth: 200 }}>{c.key_message}</td>
                    <td style={TD}>{(c.channelTags || [c.channel]).join(", ")}</td>
                    <td style={TD}>{sender?.name || "–"}</td>
                  </tr>; })}</tbody>
                </table>
              </>}

              {(() => { const iOKRe = (data.okrs || []).filter(o => o.initiative_id === sel); return iOKRe.length > 0 ? <>
                <div style={H2}>Wirkungsmessung – OKRs ({iOKRe.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Objective","Key Results","Fortschritt"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iOKRe.map(okr => { const krs = okr.key_results || []; const prog = krs.length === 0 ? 0 : Math.round(krs.map(kr => Number(kr.target) > 0 ? Math.min(Math.round((Number(kr.current||0)/Number(kr.target))*100),100) : 0).reduce((a,b)=>a+b,0)/krs.length); return <tr key={okr.id}>
                    <td style={{ ...TD, fontWeight: 600 }}>{okr.objective}</td>
                    <td style={{ ...TD, fontSize: 11 }}>{krs.map(kr => `${kr.title}: ${kr.current||0}/${kr.target} ${kr.unit||""}`).join("; ") || "–"}</td>
                    <td style={{ ...TD, fontWeight: 700, color: prog >= 70 ? T.success : prog >= 30 ? T.accent : T.textMut }}>{prog}%</td>
                  </tr>; })}</tbody>
                </table>
              </> : null; })()}

              {iBEN.length > 0 && <>
                <div style={H2}>Nutzenpotenziale ({iBEN.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Bezeichnung","Kategorie","Wert","Realisierung","Verantwortlich","Status"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iBEN.map(b => <tr key={b.id}>
                    <td style={{ ...TD, fontWeight: 600 }}>{b.title}</td>
                    <td style={TD}>{b.category}</td>
                    <td style={TD}>{b.value ? `${b.value}${b.unit || ""}` : "–"}</td>
                    <td style={TD}>{b.realization_date ? fmtDate(b.realization_date) : "–"}</td>
                    <td style={TD}>{b.owner || "–"}</td>
                    <td style={{ ...TD, color: b.status === "realized" ? T.success : b.status === "partial" ? T.warn : T.textMut }}>{b.status === "realized" ? "Realisiert" : b.status === "partial" ? "Teilweise" : "Erwartet"}</td>
                  </tr>)}</tbody>
                </table>
              </>}

              {iCR.length > 0 && <>
                <div style={H2}>Change-Risiken ({iCR.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Risiko","W","A","Score","Gegenmaßnahme","Verantwortlich","Status"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{[...iCR].sort((a,b) => (b.probability*b.impact)-(a.probability*a.impact)).map(r => { const s = (r.probability||0)*(r.impact||0); return <tr key={r.id}>
                    <td style={{ ...TD, fontWeight: 600 }}>{r.title}</td>
                    <td style={{ ...TD, textAlign: "center" }}>{r.probability}</td>
                    <td style={{ ...TD, textAlign: "center" }}>{r.impact}</td>
                    <td style={{ ...TD, textAlign: "center", fontWeight: 700, color: s >= 20 ? T.danger : s >= 10 ? T.warn : T.success }}>{s}</td>
                    <td style={{ ...TD, fontSize: 11 }}>{r.mitigation || "–"}</td>
                    <td style={TD}>{r.owner || "–"}</td>
                    <td style={TD}>{r.status}</td>
                  </tr>; })}</tbody>
                </table>
              </>}

              {iDL.length > 0 && <>
                <div style={H2}>Entscheidungslog ({iDL.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Datum","Thema","Entscheidung","Begründung","Entscheidungsträger"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iDL.map(d => <tr key={d.id}>
                    <td style={TD}>{fmtDate(d.date)}</td>
                    <td style={{ ...TD, fontWeight: 600 }}>{d.title}</td>
                    <td style={TD}>{d.decision || "–"}</td>
                    <td style={{ ...TD, fontSize: 11 }}>{d.rationale || "–"}</td>
                    <td style={TD}>{d.owner || "–"}</td>
                  </tr>)}</tbody>
                </table>
              </>}

              {iTM.length > 0 && <>
                <div style={H2}>Team-Reifegrad</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Dimension","Team","Score","Datum","Notizen"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{[...iTM].sort((a,b)=>(a.dimension||"").localeCompare(b.dimension||"")).map(t => <tr key={t.id}>
                    <td style={{ ...TD, fontWeight: 600, textTransform: "capitalize" }}>{t.dimension}</td>
                    <td style={TD}>{t.team || "–"}</td>
                    <td style={{ ...TD, fontWeight: 700, color: t.score >= 7 ? T.success : t.score >= 4 ? T.warn : T.danger }}>{t.score}/10</td>
                    <td style={TD}>{fmtDate(t.date)}</td>
                    <td style={{ ...TD, fontSize: 11 }}>{t.notes || "–"}</td>
                  </tr>)}</tbody>
                </table>
              </>}

              {iPER.length > 0 && <>
                <div style={H2}>Personas ({iPER.length})</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                  {iPER.map(p => <div key={p.id} style={{ padding: 12, background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${T.pink}` }}>
                    <div style={{ fontWeight: 700, marginBottom: 4 }}>{p.name}{p.role ? ` · ${p.role}` : ""}</div>
                    {p.pain_points && <div style={{ fontSize: 11, marginBottom: 2 }}><strong>Schmerzpunkte:</strong> {p.pain_points}</div>}
                    {p.goals && <div style={{ fontSize: 11, marginBottom: 2 }}><strong>Ziele:</strong> {p.goals}</div>}
                    {p.quote && <div style={{ fontSize: 11, fontStyle: "italic", color: T.textSec }}>„{p.quote}"</div>}
                  </div>)}
                </div>
              </>}

              {iRACI.length > 0 && <>
                <div style={H2}>RACI-Übersicht ({iRACI.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Aktivität","R – Responsible","A – Accountable","C – Consulted","I – Informed"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iRACI.map(r => <tr key={r.id}>
                    <td style={{ ...TD, fontWeight: 600 }}>{r.activity}</td>
                    <td style={{ ...TD, color: T.danger }}>{r.responsible || "–"}</td>

            { id: "AL-2", ts: "2026-01-16T10:30:00", entity: "stakeholders", action: "erstellt", detail: "Dr. Petra Schmidt (Sponsor) hinzugefügt", user: "CM-User" },
            { id: "AL-3", ts: "2026-01-18T14:00:00", entity: "actions", action: "erstellt", detail: "Kick-off Workshop Finance (geplant)", user: "CM-User" },
            { id: "AL-4", ts: "2026-02-05T11:15:00", entity: "actions", action: "geändert", detail: "Stakeholder-Interview – Status: geplant → in Bearbeitung", user: "CM-User" },
            { id: "AL-5", ts: "2026-02-20T09:00:00", entity: "changeRisks", action: "erstellt", detail: "Risiko 'Hoher Widerstand Finance' (Score 12) angelegt", user: "CM-User" },
            { id: "AL-6", ts: "2026-03-01T16:45:00", entity: "engagements", action: "erstellt", detail: "1:1 mit Sabine Müller – Ergebnis: Bedenken dokumentiert", user: "CM-User" },
            { id: "AL-7", ts: "2026-03-10T08:30:00", entity: "outcomeKPIs", action: "geändert", detail: "Akzeptanzrate aktualisiert: 50% → 55%", user: "CM-User" },
          ];
          setData(d); setSel("INI-d1"); setNav("dashboard");
        };
        return (
          <div>
            <h2 style={{ margin: "0 0 24px", fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Import / Export</h2>
            <div style={S.formGrid}>
              <Card>
                <SectionHead>Import (JSON)</SectionHead>
                <textarea value={txt} onChange={e => setTxt(e.target.value)} placeholder="JSON einfügen…" style={{ width: "100%", minHeight: 140, background: T.bg, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: 12, fontSize: 12, fontFamily: "monospace", resize: "vertical", outline: "none", boxSizing: "border-box", color: T.text }} />
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}><Btn v="primary" onClick={doImp}>Importieren</Btn><Btn onClick={loadDemo}>Demo-Daten</Btn></div>
                {msg && <div style={{ marginTop: 8, fontSize: 12, color: msg.ok ? T.success : T.danger }}>{msg.m}</div>}
              </Card>
              <Card>
                <SectionHead>Export</SectionHead>
                <Btn onClick={doExp} style={{ marginBottom: 8, width: "100%" }}>📦 Vollständiger JSON-Export</Btn>
                <div style={{ marginTop: 14 }}>
                  <SectionHead>CSV-Export (je Projekt)</SectionHead>
                  {data.initiatives.length === 0 ? <p style={{ fontSize: 12, color: T.textMut }}>Keine Projekte vorhanden.</p> : (
                    <div style={{ marginBottom: 12 }}>
                      <Input label="Projekt wählen" value={csvSel || ""} onChange={v => setCsvSel(v)} options={[{ value: "", label: "– bitte wählen –" }, ...data.initiatives.map(i => ({ value: i.id, label: i.name }))]} />
                      {csvSel && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
                          {[["stakeholder","👤 Stakeholder"],["actions","📋 Maßnahmen"],["impacts","🎯 Impacts"],["engagements","🤝 Engagements"],["kpis","📈 KPIs"],["risks","⚠️ Risiken"],["jira","🔗 Jira-Format"]].map(([t, l]) => (
                            <Btn key={t} v="default" small onClick={() => exportCSV(t, csvSel)}>{l}</Btn>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <div style={{ marginTop: 14 }}>
                  <SectionHead>Kalender-Export (.ics)</SectionHead>
                  {data.initiatives.length === 0 ? <p style={{ fontSize: 12, color: T.textMut }}>Keine Projekte vorhanden.</p> : (
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6 }}>
                      {data.initiatives.map(i => (
                        <Btn key={i.id} v="default" small onClick={() => exportICS(i.id)}>📅 {i.name}</Btn>
                      ))}
                    </div>
                  )}
                </div>
                <div style={{ marginTop: 14, padding: 12, background: T.bg, borderRadius: T.rs }}>
                  <SectionHead>Datenbestand</SectionHead>
                  {[["Initiativen", data.initiatives.length], ["Stakeholder", data.stakeholders.length], ["Zielgruppen", data.targetGroups.length], ["Impacts", data.impactItems.length], ["Maßnahmen", data.actions.length], ["Engagements", (data.engagements || []).length], ["Komm.-Items", (data.commsItems || []).length], ["KPIs", (data.outcomeKPIs || []).length], ["Benefits", (data.benefits || []).length], ["Risiken", (data.changeRisks || []).length], ["Personas", (data.personas || []).length]].map(([l, v]) => (
                    <div key={l} style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", fontSize: 12 }}><span style={{ color: T.textMut }}>{l}</span><span style={{ fontWeight: 600, color: T.text }}>{v}</span></div>
                  ))}
                </div>
              </Card>
            </div>
            <Card style={{ marginTop: 20 }}>
              <div style={{ ...S.rowBetween, marginBottom: 12 }}>
                <SectionHead>📋 Änderungsprotokoll ({(data.auditLog || []).length} Einträge)</SectionHead>
                {(data.auditLog || []).length > 0 && (
                  <Btn small v="default" onClick={() => { const csv = toCSV(data.auditLog || [], [{label:"Zeitstempel",key:"ts"},{label:"Entität",key:"entity"},{label:"Aktion",key:"action"},{label:"Detail",key:"detail"},{label:"Benutzer",key:"user"}]); downloadBlob(csv, "audit-log.csv", "text/csv;charset=utf-8"); }}>📥 CSV</Btn>
                )}
              </div>
              {(data.auditLog || []).length === 0 ? (
                <Empty icon="📋" title="Keine Protokolleinträge" sub="Alle Datenänderungen werden hier aufgezeichnet" />
              ) : (
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead><tr style={{ background: T.bg }}>
                      <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec, whiteSpace: "nowrap" }}>Zeitstempel</th>
                      <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Entität</th>
                      <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Aktion</th>
                      <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Detail</th>
                      <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Benutzer</th>
                    </tr></thead>
                    <tbody>
                      {[...(data.auditLog || [])].reverse().slice(0, 100).map((log, i) => (
                        <tr key={log.id || i} style={{ borderTop: `1px solid ${T.borderLight}`, background: i % 2 ? T.bg + "66" : "transparent" }}>
                          <td style={{ padding: "6px 10px", color: T.textMut, whiteSpace: "nowrap" }}>{log.ts ? new Date(log.ts).toLocaleString("de-DE") : "–"}</td>
                          <td style={{ padding: "6px 10px" }}><Badge color={T.purple}>{log.entity || "–"}</Badge></td>
                          <td style={{ padding: "6px 10px" }}><Badge color={log.action === "gelöscht" ? T.danger : log.action === "erstellt" ? T.success : T.accent}>{log.action || "–"}</Badge></td>
                          <td style={{ padding: "6px 10px", color: T.textSec }}>{log.detail || "–"}</td>
                          <td style={{ padding: "6px 10px", color: T.textMut }}>{log.user || "–"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          </div>
        );
      };

      // ─── GOVERNANCE ───────────────────────────────────────────────────
      const GovernanceView = () => {
        const [showDep, setShowDep] = useState(false);
        const [showGate, setShowGate] = useState(false);
        const [fDep, setFDep] = useState({ from_initiative_id: "", to_initiative_id: "", type: "depends_on", notes: "" });
        const [fGate, setFGate] = useState({ initiative_id: sel || "", name: "", date: "", status: "planned", criteria: "", notes: "" });
        const deps = data.dependencies || [];
        const gates = (data.stageGates || []).filter(g => !sel || g.initiative_id === sel);
        const saveDep = () => {
          if (!fDep.from_initiative_id || !fDep.to_initiative_id) return;
          up(d => { if (!d.dependencies) d.dependencies = []; d.dependencies.push({ id: uid("DEP-"), ...fDep }); });
          setFDep({ from_initiative_id: "", to_initiative_id: "", type: "depends_on", notes: "" }); setShowDep(false);
        };
        const saveGate = () => {
          if (!fGate.name) return;
          up(d => { if (!d.stageGates) d.stageGates = []; d.stageGates.push({ id: uid("SG-"), ...fGate, initiative_id: fGate.initiative_id || sel || "" }); });
          setFGate({ initiative_id: sel || "", name: "", date: "", status: "planned", criteria: "", notes: "" }); setShowGate(false);
        };
        const gateStatusColor = s => s === "passed" ? T.success : s === "failed" ? T.danger : s === "in_review" ? T.warn : T.textMut;
        const GATE_LABELS = { planned: "Geplant", in_review: "In Pr\u00fcfung", passed: "Bestanden", failed: "Nicht bestanden" };
        const iniName = id => data.initiatives.find(i => i.id === id)?.name || id;
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Governance</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Abhängigkeiten & Stage Gates zwischen Projekten</p></div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowDep(true)}>＋ Abhängigkeit</Btn>
                <Btn v="primary" onClick={() => setShowGate(true)}>＋ Stage Gate</Btn>
              </div>
            </div>
            <div style={{ ...S.formGrid, marginBottom: 20 }}>
              <Card>
                <SectionHead>Projekt-Abhängigkeiten ({deps.length})</SectionHead>
                {deps.length === 0 ? <Empty icon="🔗" title="Keine Abhängigkeiten" sub="Verbinde Projekte miteinander" /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {deps.map(d => (
                      <div key={d.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div style={{ fontSize: 13 }}>
                          <span style={{ fontWeight: 600 }}>{iniName(d.from_initiative_id)}</span>
                          <span style={{ margin: "0 8px", color: T.textMut }}>→ {d.type === "depends_on" ? "abhängig von" : d.type === "blocks" ? "blockiert" : "verknüpft mit"}</span>
                          <span style={{ fontWeight: 600 }}>{iniName(d.to_initiative_id)}</span>
                        </div>
                        <Btn v="ghost" small onClick={() => up(d2 => { d2.dependencies = (d2.dependencies || []).filter(x => x.id !== d.id); })}>✕</Btn>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
              <Card>
                <SectionHead>Stage Gates ({gates.length})</SectionHead>
                {gates.length === 0 ? <Empty icon="🏁" title="Keine Stage Gates" sub="Definiere Meilenstein-Prüfpunkte" /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {gates.map(g => (
                      <div key={g.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${gateStatusColor(g.status)}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontSize: 13, fontWeight: 700 }}>{g.name}</span>
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            <Badge color={gateStatusColor(g.status)}>{GATE_LABELS[g.status] || g.status}</Badge>
                            <Btn v="ghost" small onClick={() => up(d => { d.stageGates = (d.stageGates || []).filter(x => x.id !== g.id); })}>✕</Btn>
                          </div>
                        </div>
                        {g.date && <div style={{ fontSize: 11, color: T.textMut }}>📅 {fmtDate(g.date)}</div>}
                        {g.criteria && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{g.criteria}</div>}
                        <div style={{ marginTop: 6 }}>
                          {["planned","in_review","passed","failed"].map(s => (
                            <Btn key={s} small v={g.status === s ? "primary" : "default"} onClick={() => up(d => { const sg = (d.stageGates || []).find(x => x.id === g.id); if (sg) sg.status = s; })} style={{ marginRight: 4 }}>{GATE_LABELS[s]}</Btn>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
            <Modal open={showDep} onClose={() => setShowDep(false)} title="Abhängigkeit hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Von Projekt" value={fDep.from_initiative_id} onChange={v => setFDep(p => ({ ...p, from_initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Typ" value={fDep.type} onChange={v => setFDep(p => ({ ...p, type: v }))} options={["depends_on","blocks","related_to"]} />
                <Input label="Zu Projekt" value={fDep.to_initiative_id} onChange={v => setFDep(p => ({ ...p, to_initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Notizen" value={fDep.notes} onChange={v => setFDep(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveDep} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showGate} onClose={() => setShowGate(false)} title="Stage Gate hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Projekt" value={fGate.initiative_id} onChange={v => setFGate(p => ({ ...p, initiative_id: v }))} options={data.initiatives.map(i => ({ value: i.id, label: i.name }))} />
                <Input label="Name" value={fGate.name} onChange={v => setFGate(p => ({ ...p, name: v }))} />
                <Input label="Datum" value={fGate.date} onChange={v => setFGate(p => ({ ...p, date: v }))} type="date" />
                <Input label="Kriterien" value={fGate.criteria} onChange={v => setFGate(p => ({ ...p, criteria: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveGate} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── OUTCOMES (Wirkungsmessung) ───────────────────────────────────
      const OutcomesView = () => {
        const [showOKR, setShowOKR] = useState(false);
        const [showKR, setShowKR] = useState(null);
        const [showBen, setShowBen] = useState(false);
        const [fOKR, setFOKR] = useState({ objective: "" });
        const [fKR, setFKR] = useState({ title: "", target: "", current: "", unit: "" });
        const [fBen, setFBen] = useState({ title: "", category: "financial", value: "", unit: "", realization_date: "", owner: "", status: "expected", notes: "" });
        if (!ini) return <Empty icon="📈" title="Kein Projekt gewählt" sub="Wähle ein Projekt im Portfolio" />;
        const iOKR = (data.okrs || []).filter(o => o.initiative_id === sel);
        const saveOKR = () => {
          if (!fOKR.objective) return;
          up(d => { if (!d.okrs) d.okrs = []; d.okrs.push({ id: uid("OKR-"), initiative_id: sel, objective: fOKR.objective, key_results: [] }); });
          setFOKR({ objective: "" }); setShowOKR(false);
        };
        const saveKR = () => {
          if (!fKR.title || !showKR) return;
          up(d => { const okr = (d.okrs || []).find(o => o.id === showKR); if (okr) okr.key_results.push({ id: uid("KR-"), title: fKR.title, target: fKR.target, current: fKR.current || "0", unit: fKR.unit }); });
          setFKR({ title: "", target: "", current: "", unit: "" }); setShowKR(null);
        };
        const saveBen = () => {
          if (!fBen.title) return;
          up(d => { if (!d.benefits) d.benefits = []; d.benefits.push({ id: uid("BEN-"), initiative_id: sel, ...fBen }); });
          setFBen({ title: "", category: "financial", value: "", unit: "", realization_date: "", owner: "", status: "expected", notes: "" }); setShowBen(false);
        };
        const updateKR = (okrId, krId, field, val) => {
          up(d => { const okr = (d.okrs || []).find(o => o.id === okrId); if (okr) { const kr = okr.key_results.find(k => k.id === krId); if (kr) kr[field] = val; } });
        };
        const removeKR = (okrId, krId) => {
          up(d => { const okr = (d.okrs || []).find(o => o.id === okrId); if (okr) okr.key_results = okr.key_results.filter(k => k.id !== krId); });
        };
        const removeOKR = (okrId) => {
          up(d => { d.okrs = (d.okrs || []).filter(o => o.id !== okrId); });
        };
        const okrProgress = (okr) => {
          if (!okr.key_results || okr.key_results.length === 0) return 0;
          const progs = okr.key_results.map(kr => {
            const t = Number(kr.target); const c = Number(kr.current || 0);
            return t > 0 ? Math.min(Math.round((c / t) * 100), 100) : 0;
          });
          return Math.round(progs.reduce((a, b) => a + b, 0) / progs.length);
        };
        const benCatColor = c => c === "financial" ? T.success : c === "quality" ? T.accent : c === "strategic" ? T.purple : T.warn;
        const benStatusColor = s => s === "realized" ? T.success : s === "partial" ? T.warn : T.textMut;
        const BEN_CAT_LABELS = { financial: "Finanziell", quality: "Qualität", strategic: "Strategisch", risk_reduction: "Risikominderung", efficiency: "Effizienz" };
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Wirkungsmessung</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} – OKRs & Nutzenpotenziale</p>
            </div>
            <div style={{ marginBottom: 24 }}>
              <SectionHead>Objectives & Key Results ({iOKR.length})</SectionHead>
              {iOKR.length === 0 ? <Empty icon="🎯" title="Keine OKRs definiert" sub="Definiere qualitative Ziele und messbare Ergebnisse" action={<Btn v="primary" onClick={() => setShowOKR(true)}>＋ Erstes Objective anlegen</Btn>} /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                  {iOKR.map(okr => {
                    const prog = okrProgress(okr);
                    return (
                      <Card key={okr.id} style={{ borderLeft: `4px solid ${prog >= 70 ? T.success : prog >= 30 ? T.accent : T.textMut}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 700, fontSize: 15, color: T.adessoBlau, marginBottom: 4 }}>🎯 {okr.objective}</div>
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                              <div style={{ flex: 1, background: T.bg, borderRadius: 4, height: 6 }}><div style={{ width: `${prog}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.success})`, borderRadius: 4 }} /></div>
                              <span style={{ fontSize: 12, fontWeight: 700, color: prog >= 70 ? T.success : T.textMut }}>{prog}%</span>
                            </div>
                          </div>
                          <Btn v="ghost" small onClick={() => removeOKR(okr.id)}>✕</Btn>
                        </div>
                        {okr.key_results.length === 0 ? (
                          <div style={{ padding: "12px 0", textAlign: "center", color: T.textMut, fontSize: 12 }}>
                            Noch keine Key Results. <span style={{ color: T.accent, cursor: "pointer", textDecoration: "underline" }} onClick={() => setShowKR(okr.id)}>＋ Key Result hinzufügen</span>
                          </div>
                        ) : (
                          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                            {okr.key_results.map((kr, idx) => {
                              const krProg = Number(kr.target) > 0 ? Math.min(Math.round((Number(kr.current || 0) / Number(kr.target)) * 100), 100) : 0;
                              return (
                                <div key={kr.id} style={{ padding: "8px 12px", background: T.bg, borderRadius: T.rs, display: "flex", alignItems: "center", gap: 10 }}>
                                  <span style={{ fontSize: 12, color: T.textMut, fontWeight: 600, minWidth: 24 }}>KR{idx + 1}</span>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 3 }}>{kr.title}</div>
                                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                      <div style={{ flex: 1, background: T.surface, borderRadius: 3, height: 5 }}><div style={{ width: `${krProg}%`, height: "100%", background: krProg >= 70 ? T.success : krProg >= 30 ? T.accent : T.textMut, borderRadius: 3 }} /></div>
                                      <span style={{ fontSize: 11, color: T.textMut }}>{kr.current || 0} / {kr.target} {kr.unit}</span>
                                    </div>
                                  </div>
                                  <div style={{ display: "flex", gap: 4 }}>
                                    <Btn v="ghost" small onClick={() => { const nv = prompt("Aktueller Wert:", kr.current || "0"); if (nv !== null) updateKR(okr.id, kr.id, "current", nv); }}>✏️</Btn>
                                    <Btn v="ghost" small onClick={() => removeKR(okr.id, kr.id)}>✕</Btn>
                                  </div>
                                </div>
                              );
                            })}
                            <div style={{ marginTop: 4 }}><Btn v="default" small onClick={() => setShowKR(okr.id)}>＋ Key Result hinzufügen</Btn></div>
                          </div>
                        )}
                      </Card>
                    );
                  })}
                  <div style={{ marginTop: 4 }}><Btn v="default" small onClick={() => setShowOKR(true)}>＋ Weiteres Objective hinzufügen</Btn></div>
                </div>
              )}
            </div>
            <div>
              <SectionHead>Nutzenpotenziale ({iBEN.length})</SectionHead>
              {iBEN.length === 0 ? <Empty icon="💎" title="Keine Nutzenpotenziale" sub="Dokumentiere erwartete Vorteile des Projekts" action={<Btn v="primary" onClick={() => setShowBen(true)}>＋ Nutzen anlegen</Btn>} /> : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(250px,1fr))", gap: 12 }}>
                  {iBEN.map(b => (
                    <Card key={b.id} style={{ borderTop: `3px solid ${benCatColor(b.category)}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontWeight: 700, fontSize: 14 }}>{b.title}</span>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Badge color={benCatColor(b.category)}>{BEN_CAT_LABELS[b.category] || b.category}</Badge>
                          <Btn v="ghost" small onClick={() => up(d => { d.benefits = (d.benefits || []).filter(x => x.id !== b.id); })}>✕</Btn>
                        </div>
                      </div>
                      {(b.value || b.unit) && <div style={{ fontSize: 13, fontWeight: 600, color: T.text, marginBottom: 4 }}>{b.value}{b.unit}</div>}
                      {b.realization_date && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>📅 Realisierung: {fmtDate(b.realization_date)}</div>}
                      {b.owner && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 6 }}>👤 {b.owner}</div>}
                      {b.notes && <div style={{ fontSize: 12, color: T.textSec }}>{b.notes}</div>}
                      <div style={{ marginTop: 8, display: "flex", gap: 4 }}>
                        {["expected","partial","realized"].map(s => <Btn key={s} small v={b.status === s ? "primary" : "default"} onClick={() => up(d => { const bi = (d.benefits || []).find(x => x.id === b.id); if (bi) bi.status = s; })} style={{ color: b.status === s ? undefined : benStatusColor(s) }}>{s === "expected" ? "Erwartet" : s === "partial" ? "Teilw." : "Realisiert"}</Btn>)}
                      </div>
                    </Card>
                  ))}
                  <div style={{ marginTop: 6 }}><Btn v="default" small onClick={() => setShowBen(true)}>＋ Weiteren Nutzen hinzufügen</Btn></div>
                </div>
              )}
            </div>
            <Modal open={showOKR} onClose={() => setShowOKR(false)} title="Neues Objective">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Objective (qualitatives Ziel)" value={fOKR.objective} onChange={v => setFOKR(p => ({ ...p, objective: v }))} textarea placeholder={"z.B. Mitarbeiter nutzen das neue System eigenständig"} />
              </div>
              <Btn v="primary" onClick={saveOKR} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={!!showKR} onClose={() => setShowKR(null)} title="Neues Key Result">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Key Result (messbares Ergebnis)" value={fKR.title} onChange={v => setFKR(p => ({ ...p, title: v }))} placeholder={"z.B. Adoptionsrate > 80%"} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                  <Input label="Zielwert" value={fKR.target} onChange={v => setFKR(p => ({ ...p, target: v }))} />
                  <Input label="Aktueller Wert" value={fKR.current} onChange={v => setFKR(p => ({ ...p, current: v }))} />
                  <Input label="Einheit" value={fKR.unit} onChange={v => setFKR(p => ({ ...p, unit: v }))} placeholder={"%"} />
                </div>
              </div>
              <Btn v="primary" onClick={saveKR} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showBen} onClose={() => setShowBen(false)} title="Nutzenpotenzial anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Bezeichnung" value={fBen.title} onChange={v => setFBen(p => ({ ...p, title: v }))} />
                <Input label="Kategorie" value={fBen.category} onChange={v => setFBen(p => ({ ...p, category: v }))} options={[{value:"financial",label:"Finanziell"},{value:"quality",label:"Qualität"},{value:"strategic",label:"Strategisch"},{value:"risk_reduction",label:"Risikominderung"},{value:"efficiency",label:"Effizienz"}]} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <Input label="Wert / Größenordnung" value={fBen.value} onChange={v => setFBen(p => ({ ...p, value: v }))} />
                  <Input label={"Einheit (z.B. \u20AC, %, Tage)"} value={fBen.unit} onChange={v => setFBen(p => ({ ...p, unit: v }))} />
                </div>
                <Input label="Realisierungsdatum" value={fBen.realization_date} onChange={v => setFBen(p => ({ ...p, realization_date: v }))} type="date" />
                <Input label="Verantwortlich" value={fBen.owner} onChange={v => setFBen(p => ({ ...p, owner: v }))} />
                <Input label="Notizen" value={fBen.notes} onChange={v => setFBen(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveBen} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── LEADERSHIP (Führung) ─────────────────────────────────────────
      const LeadershipView = () => {
        const [showTask, setShowTask] = useState(false);
        const [showSPT, setShowSPT] = useState(false);
        const [fTask, setFTask] = useState({ title: "", owner_id: "", due_date: "", status: "open", description: "" });
        const [fSPT, setFSPT] = useState({ stakeholder_id: "", score: 5, notes: "", date: today() });
        if (!ini) return <Empty icon="👔" title="Kein Projekt gewählt" sub="" />;
        const saveTask = () => {
          if (!fTask.title) return;
          const ownerSH = iSH.find(x => x.id === fTask.owner_id);
          up(d => { if (!d.leadershipTasks) d.leadershipTasks = []; d.leadershipTasks.push({ id: uid("LT-"), initiative_id: sel, title: fTask.title, owner: ownerSH?.name || "", owner_id: fTask.owner_id, due_date: fTask.due_date, status: fTask.status, description: fTask.description }); });
          setFTask({ title: "", owner_id: "", due_date: "", status: "open", description: "" }); setShowTask(false);
        };
        const saveSPT = () => {
          if (!fSPT.stakeholder_id) return;
          up(d => { if (!d.sponsorTracking) d.sponsorTracking = []; d.sponsorTracking.push({ id: uid("SPT-"), initiative_id: sel, ...fSPT, score: Number(fSPT.score) }); });
          setFSPT({ stakeholder_id: "", score: 5, notes: "", date: today() }); setShowSPT(false);
        };
        const taskStatusColor = s => s === "done" ? T.success : s === "in_progress" ? T.accent : T.textMut;
        const sponsorProgress = (() => {
          if (iSPT.length === 0) return null;
          const scores = iSPT.map(s => s.score || 0);
          return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
        })();
        const sponsorOptions = iSH.map(s => ({ value: s.id, label: s.name }));
        const ownerOptions = [{ value: "", label: "– Keine –" }, ...iSH.map(s => ({ value: s.id, label: s.name }))];
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Sponsoring</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} – Sponsor-Aktivierung & Leadership-Aufgaben</p>
            </div>
            <div style={{ ...S.formGrid, marginBottom: 20 }}>
              <Card>
                <SectionHead>Sponsor-Aktivierung ({iSPT.length} Einträge)</SectionHead>
                {sponsorProgress !== null && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}><span style={{ color: T.textMut }}>Ø Aktivierungs-Score</span><span style={{ fontWeight: 700, color: T.adessoBlau }}>{sponsorProgress}/10</span></div>
                    <div style={{ background: T.bg, borderRadius: 4, height: 8 }}><div style={{ width: `${sponsorProgress * 10}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.success})`, borderRadius: 4 }} /></div>
                  </div>
                )}
                {iSPT.length === 0 ? (
                  <Empty icon="👔" title="Keine Einträge" sub="Erfasse den Aktivierungsgrad deiner Sponsoren" action={<Btn v="primary" onClick={() => setShowSPT(true)}>＋ Eintrag hinzufügen</Btn>} />
                ) : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {iSPT.map(s => {
                      const sh = iSH.find(x => x.id === s.stakeholder_id);
                      return (
                        <div key={s.id} style={{ padding: "8px 10px", background: T.bg, borderRadius: T.rs }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                            <span style={{ fontWeight: 600 }}>{sh?.name || s.stakeholder_id}</span>
                            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                              <Badge color={s.score >= 7 ? T.success : s.score >= 4 ? T.warn : T.danger}>{s.score}/10</Badge>
                              {s.date && <span style={{ fontSize: 11, color: T.textMut }}>{fmtDate(s.date)}</span>}
                              <Btn v="ghost" small onClick={() => up(d => { d.sponsorTracking = (d.sponsorTracking || []).filter(x => x.id !== s.id); })}>✕</Btn>
                            </div>
                          </div>
                          {s.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{s.notes}</div>}
                        </div>
                      );
                    })}
                    <div style={{ marginTop: 4 }}><Btn v="default" small onClick={() => setShowSPT(true)}>＋ Weiteren Eintrag hinzufügen</Btn></div>
                  </div>
                )}
              </Card>
              <Card>
                <SectionHead>Leadership-Aufgaben ({iLT.length})</SectionHead>
                <p style={{ margin: "0 0 12px", fontSize: 12, color: T.textMut }}>Aufgaben speziell f{"\u00fc"}r F{"\u00fc"}hrungskr{"\u00e4"}fte {"\u2013"} z.B. Sichtbarkeit zeigen, Botschafter-Rolle, Team-Kommunikation. F{"\u00fc"}r ADKAR-Ma{"\u00df"}nahmen an Zielgruppen {"\u2192"} Projekt {">"} Ma{"\u00df"}nahmen.</p>
                {iLT.length === 0 ? <Empty icon="📋" title="Keine Aufgaben" sub="Weise F\u00fchrungsaufgaben zu" action={<Btn v="primary" onClick={() => setShowTask(true)}>{"\uFF0B"} Aufgabe hinzuf\u00fcgen</Btn>} /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iLT.map(t => (
                      <div key={t.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${taskStatusColor(t.status)}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 700, fontSize: 13 }}>{t.title}</span>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            {["open","in_progress","done"].map(s => <Btn key={s} small v={t.status === s ? "primary" : "default"} onClick={() => up(d => { const lt = (d.leadershipTasks || []).find(x => x.id === t.id); if (lt) lt.status = s; })}>{s === "open" ? "Offen" : s === "in_progress" ? "Aktiv" : "Fertig"}</Btn>)}
                            <Btn v="ghost" small onClick={() => up(d => { d.leadershipTasks = (d.leadershipTasks || []).filter(x => x.id !== t.id); })}>✕</Btn>
                          </div>
                        </div>
                        {t.owner && <div style={{ fontSize: 11, color: T.textMut }}>👤 {t.owner}</div>}
                        {t.due_date && <div style={{ fontSize: 11, color: T.textMut }}>📅 {fmtDate(t.due_date)}</div>}
                        {t.description && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{t.description}</div>}
                      </div>
                    ))}
                    <div style={{ marginTop: 6 }}><Btn v="default" small onClick={() => setShowTask(true)}>＋ Weitere Aufgabe hinzufügen</Btn></div>
                  </div>
                )}
              </Card>
            </div>
            <Modal open={showSPT} onClose={() => setShowSPT(false)} title="Sponsor-Aktivierung erfassen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Sponsor" value={fSPT.stakeholder_id} onChange={v => setFSPT(p => ({ ...p, stakeholder_id: v }))} options={sponsorOptions} />
                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>AKTIVIERUNGS-SCORE (0–10)</label>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8 }}>
                    <input type="range" min={0} max={10} step={1} value={fSPT.score} onChange={e => setFSPT(p => ({ ...p, score: Number(e.target.value) }))} style={{ flex: 1 }} />
                    <Badge color={fSPT.score >= 7 ? T.success : fSPT.score >= 4 ? T.warn : T.danger} style={{ minWidth: 36, textAlign: "center", fontWeight: 700 }}>{fSPT.score}/10</Badge>
                  </div>
                </div>
                <Input label="Datum" value={fSPT.date} onChange={v => setFSPT(p => ({ ...p, date: v }))} type="date" />
                <Input label="Notizen / Beobachtungen" value={fSPT.notes} onChange={v => setFSPT(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveSPT} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showTask} onClose={() => setShowTask(false)} title="Leadership-Aufgabe">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Aufgabe" value={fTask.title} onChange={v => setFTask(p => ({ ...p, title: v }))} />
                <Input label="Verantwortlich (Stakeholder)" value={fTask.owner_id} onChange={v => setFTask(p => ({ ...p, owner_id: v }))} options={ownerOptions} />
                <Input label="Fällig am" value={fTask.due_date} onChange={v => setFTask(p => ({ ...p, due_date: v }))} type="date" />
                <Input label="Beschreibung" value={fTask.description} onChange={v => setFTask(p => ({ ...p, description: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveTask} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── TEAMDEV (Teamentwicklung) ────────────────────────────────────
      const TeamdevView = () => {
        const [showPC, setShowPC] = useState(false);
        const [showMul, setShowMul] = useState(false);
        const [showRL, setShowRL] = useState(false);
        const [showTM, setShowTM] = useState(false);
        const [fPC, setFPC] = useState({ date: today(), group: "", score: 5, notes: "" });
        const [fMul, setFMul] = useState({ name: "", role: "", team: "", influence: 5, notes: "" });
        const [fRL, setFRL] = useState({ title: "", trigger: "", effect: "", notes: "" });
        const [fTM, setFTM] = useState({ team: "", dimension: "collaboration", score: 5, date: today(), notes: "" });
        if (!ini) return <Empty icon="🧩" title="Kein Projekt gewählt" sub="" />;
        const savePC = () => {
          if (!fPC.group) return;
          up(d => { if (!d.pulseChecks) d.pulseChecks = []; d.pulseChecks.push({ id: uid("PC-"), initiative_id: sel, ...fPC, score: Number(fPC.score) }); });
          setFPC({ date: today(), group: "", score: 5, notes: "" }); setShowPC(false);
        };
        const saveMul = () => {
          if (!fMul.name) return;
          up(d => { if (!d.multipliers) d.multipliers = []; d.multipliers.push({ id: uid("MUL-"), initiative_id: sel, ...fMul, influence: Number(fMul.influence) }); });
          setFMul({ name: "", role: "", team: "", influence: 5, notes: "" }); setShowMul(false);
        };
        const saveRL = () => {
          if (!fRL.title) return;
          up(d => { if (!d.reinforcementLoops) d.reinforcementLoops = []; d.reinforcementLoops.push({ id: uid("RL-"), initiative_id: sel, ...fRL }); });
          setFRL({ title: "", trigger: "", effect: "", notes: "" }); setShowRL(false);
        };
        const saveTM = () => {
          if (!fTM.team) return;
          up(d => { if (!d.teamMaturity) d.teamMaturity = []; d.teamMaturity.push({ id: uid("TM-"), initiative_id: sel, ...fTM, score: Number(fTM.score) }); });
          setFTM({ team: "", dimension: "collaboration", score: 5, date: today(), notes: "" }); setShowTM(false);
        };
        const TM_DIMS = ["collaboration","competence","commitment","communication","clarity"];
        const tmByDim = TM_DIMS.map(dim => {
          const entries = iTM.filter(t => t.dimension === dim).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          return { dim, latest: entries[0] || null };
        });
        const latestPC = iTG.map(tg => {
          const checks = iPC.filter(p => p.group === tg.name).sort((a, b) => b.date?.localeCompare(a.date));
          return { tg, latest: checks[0] || null };
        });
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Multiplikator:innen & Change Agents</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} {"\u2013"} Change Champions, Multiplikator:innen & Netzwerke</p>
            </div>
            <div style={{ ...S.formGrid, marginBottom: 20 }}>
              <Card>
                <SectionHead>Pulse Checks – aktueller Stand</SectionHead>
                {latestPC.length === 0 ? <Empty icon="💓" title="Keine Zielgruppen" sub="Lege zuerst Zielgruppen an" action={<Btn v="primary" onClick={() => setShowPC(true)}>{"\uFF0B"} Pulse Check</Btn>} /> : (
                  <><div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {latestPC.map(({ tg, latest }) => (
                      <div key={tg.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                          <span style={{ fontWeight: 600, fontSize: 13 }}>{tg.name}</span>
                          {latest ? <Badge color={latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger}>{latest.score}/10</Badge> : <Badge color={T.textMut}>Kein Check</Badge>}
                        </div>
                        {latest && <>
                          <div style={{ background: T.surface, borderRadius: 4, height: 6, marginBottom: 4 }}><div style={{ width: `${latest.score * 10}%`, height: "100%", background: latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger, borderRadius: 4 }} /></div>
                          <div style={{ fontSize: 11, color: T.textMut }}>{fmtDate(latest.date)}{latest.notes && ` – ${latest.notes.slice(0, 60)}`}</div>
                        </>}
                      </div>
                    ))}
                  </div>
                  <div style={{ textAlign: "center", paddingTop: 10 }}><Btn v="ghost" onClick={() => setShowPC(true)}>{"\uFF0B"} Neuer Pulse Check</Btn></div>
                  </>
                )}
              </Card>
              <Card>
                <SectionHead>Multiplikator:innen ({iMUL.length})</SectionHead>
                {iMUL.length === 0 ? <Empty icon="📡" title="Keine Multiplikator:innen" sub="Identifiziere Change Agents" action={<Btn v="primary" onClick={() => setShowMul(true)}>{"\uFF0B"} Multiplikator:in hinzuf{"\u00fc"}gen</Btn>} /> : (
                  <><div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iMUL.map(m => (
                      <div key={m.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{m.name}</div>
                          {m.role && <div style={{ fontSize: 11, color: T.textMut }}>{m.role}{m.team ? ` · ${m.team}` : ""}</div>}
                          {m.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{m.notes}</div>}
                        </div>
                        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                          <Badge color={T.purple}>Einfluss {m.influence}/10</Badge>
                          <Btn v="ghost" small onClick={() => up(d => { d.multipliers = (d.multipliers || []).filter(x => x.id !== m.id); })}>✕</Btn>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div style={{ textAlign: "center", paddingTop: 10 }}><Btn v="ghost" onClick={() => setShowMul(true)}>{"\uFF0B"} Weiteren Multiplikator:in hinzuf{"\u00fc"}gen</Btn></div>
                  </>
                )}
              </Card>
            </div>
            <Card style={{ marginTop: 14 }}>
              <SectionHead>Team-Reifegrad ({iTM.length} Einträge)</SectionHead>
              {iTM.length === 0 ? <Empty icon="📐" title="Keine Reife-Checks" sub="Erfasse den Entwicklungsstand des Teams" action={<Btn v="primary" onClick={() => setShowTM(true)}>Reife-Check anlegen</Btn>} /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {tmByDim.map(({ dim, latest }) => {
                    const c = latest ? (latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger) : T.borderLight;
                    return (
                      <div key={dim} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 600, fontSize: 13, textTransform: "capitalize" }}>{dim}</span>
                          {latest ? <Badge color={c}>{latest.score}/10</Badge> : <Badge color={T.textMut}>Nicht bewertet</Badge>}
                        </div>
                        <div style={{ background: T.surface, borderRadius: 3, height: 5 }}><div style={{ width: `${(latest?.score || 0) * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                        {latest?.notes && <div style={{ fontSize: 11, color: T.textMut, marginTop: 4 }}>{latest.notes}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>
            <Card style={{ marginTop: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <SectionHead>Verstärkungs-Schleifen ({iRL.length})</SectionHead>
              </div>
              {iRL.length === 0 ? <Empty icon="🔁" title="Keine Verstärkungs-Schleifen" sub="Definiere positive Feedback-Kreisläufe" action={<Btn v="primary" onClick={() => setShowRL(true)}>Schleife anlegen</Btn>} /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {iRL.map(r => (
                    <div key={r.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{r.title || r.description}</div>
                        {r.trigger && <div style={{ fontSize: 12, color: T.textSec }}>Auslöser: {r.trigger}</div>}
                        {r.effect && <div style={{ fontSize: 12, color: T.textSec }}>Wirkung: {r.effect}</div>}
                      </div>
                      <Btn v="ghost" small onClick={() => up(d => { d.reinforcementLoops = (d.reinforcementLoops || []).filter(x => x.id !== r.id); })}>✕</Btn>
                    </div>
                  ))}
                </div>
              )}
            </Card>
            <Modal open={showPC} onClose={() => setShowPC(false)} title="Pulse Check erfassen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Gruppe / Zielgruppe" value={fPC.group} onChange={v => setFPC(p => ({ ...p, group: v }))} options={iTG.map(t => t.name)} />
                <Input label="Datum" value={fPC.date} onChange={v => setFPC(p => ({ ...p, date: v }))} type="date" />
                <Input label="Stimmungs-Score (0–10)" value={String(fPC.score)} onChange={v => setFPC(p => ({ ...p, score: clamp(v) }))} type="number" />
                <Input label="Notizen" value={fPC.notes} onChange={v => setFPC(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={savePC} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showMul} onClose={() => setShowMul(false)} title="Multiplikator:in hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Name" value={fMul.name} onChange={v => setFMul(p => ({ ...p, name: v }))} />
                <Input label="Rolle" value={fMul.role} onChange={v => setFMul(p => ({ ...p, role: v }))} />

          setFNar({ title: "", audience: "", message: "", tone: "informativ", status: "draft", adkar_phase: "" }); setShowNar(false);

        };
        const narStatusColor = s => s === "approved" ? T.success : s === "review" ? T.warn : T.textMut;
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Botschaften & Change Story</h2>

              <Card>
                <SectionHead>Feedback-Kanäle ({iFC.length})</SectionHead>

              {[
                { key: "q1_why", group: "WARUM", label: "1. Warum m\u00fcssen wir uns ver\u00e4ndern?", ph: "Was sind die externen/internen Treiber? Marktdruck, Regulierung, Strategie?" },
                { key: "q2_ifnot", group: "WARUM", label: "2. Was passiert, wenn wir nichts tun?", ph: "Welche Risiken und Konsequenzen entstehen bei Nicht-Handeln?" },
                { key: "q3_what", group: "WAS", label: "3. Was genau \u00e4ndert sich?", ph: "Prozesse, Systeme, Strukturen, Rollen \u2013 konkret benennen" },
                { key: "q4_same", group: "WAS", label: "4. Was bleibt gleich?", ph: "Welche Elemente bleiben bestehen? Was gibt Stabilit\u00e4t?" },
                { key: "q5_future", group: "WAS", label: "5. Wie sieht die Zukunft aus?", ph: "Zielbild: Wie arbeiten wir nach der Ver\u00e4nderung? Was wird besser?" },
                { key: "q6_personal", group: "WIE", label: "6. Was bedeutet das f\u00fcr mich pers\u00f6nlich?", ph: "Auswirkungen auf Alltag, Aufgaben, Zusammenarbeit der Betroffenen" },
                { key: "q7_support", group: "WIE", label: "7. Wer unterst\u00fctzt mich?", ph: "Ansprechpartner, F\u00fchrungskr\u00e4fte, Change Agents, Multiplikatoren" },
                { key: "q8_preparation", group: "WIE", label: "8. Wie werde ich vorbereitet?", ph: "Trainings, Schulungen, Informationsveranstaltungen, Materialien" },
                { key: "q9_participate", group: "WIE", label: "9. Wie kann ich mitgestalten?", ph: "Feedback-M\u00f6glichkeiten, Pilotgruppen, Workshops, Beteiligungsformate" },
                { key: "q10_success", group: "WIE", label: "10. Woran messen wir den Erfolg?", ph: "KPIs, Meilensteine, Erfolgskriterien der Ver\u00e4nderung" },
              ].map((q, idx) => {
                const cs = ini.change_story || {};

                  { key: "q1_why", group: "WARUM" }, { key: "q2_ifnot", group: "WARUM" },

                  { key: "q6_personal", group: "WIE" }, { key: "q7_support", group: "WIE" }, { key: "q8_preparation", group: "WIE" },
                  { key: "q9_participate", group: "WIE" }, { key: "q10_success", group: "WIE" },
                ][idx - 1].group : null;

                    {showHeader && <div style={{ marginTop: idx > 0 ? 16 : 0, marginBottom: 8, padding: "6px 12px", background: q.group === "WARUM" ? "#fff3e0" : q.group === "WAS" ? "#e3f2fd" : "#e8f5e9", borderRadius: T.rs, fontSize: 12, fontWeight: 700, color: q.group === "WARUM" ? "#e65100" : q.group === "WAS" ? "#1565c0" : "#2e7d32" }}>{q.group === "WARUM" ? "WARUM \u2013 Dringlichkeit & Notwendigkeit" : q.group === "WAS" ? "WAS \u2013 Vision & Zielbild" : "WIE \u2013 Begleitung & Unterst\u00fctzung"}</div>}
                    <Input label={q.label} value={cs[q.key] || ""} onChange={v => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.change_story) i.change_story = {}; i.change_story[q.key] = v; } })} textarea placeholder={q.ph} />
                  </React.Fragment>
                );
              })}
            </Card>
            <Card>
              <SectionHead>Narrative & Kernbotschaften ({iNAR.length})</SectionHead>
              {iNAR.length === 0 ? <Empty icon="📖" title="Keine Narrative" sub="Entwickle die Changestory" action={<Btn v="primary" onClick={() => setShowNar(true)}>Narrativ anlegen</Btn>} /> : (
                <><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 12 }}>

                          <Btn v="ghost" small onClick={() => up(d => { d.narratives = (d.narratives || []).filter(x => x.id !== n.id); })}>✕</Btn>
                        </div>
                      </div>
                      {n.audience && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Zielgruppe: {n.audience}</div>}

                      <div style={{ marginTop: 8, display: "flex", gap: 4 }}>

                <div style={{ textAlign: "center", paddingTop: 10 }}><Btn v="ghost" onClick={() => setShowNar(true)}>{"\uFF0B"} Weiteres Narrativ hinzuf{"\u00fc"}gen</Btn></div>

            <Modal open={showFC} onClose={() => setShowFC(false)} title="Feedback-Kanal anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                <Input label="Notizen" value={fFC.notes} onChange={v => setFFC(p => ({ ...p, notes: v }))} textarea />

            <Modal open={showPer} onClose={() => setShowPer(false)} title="Persona anlegen" wide>

      // ─── KOMMUNIKATIONS- UND TRAININGSKONZEPT ─────────────────────────
      const KommTrainView = () => {

        const [showTrain, setShowTrain] = useState(false);

        const emptyCM = { target_group_id: "", adkar_phase: "Awareness", key_message: "", channelTags: [], sender_id: "", timing: "", frequency: "", action_ids: [], impact_item_ids: [], stakeholder_ids: [] };
        const [showCM, setShowCM] = useState(false);

        const togTG_K = id => setFKomm(p => ({ ...p, target_group_ids: (p.target_group_ids || []).includes(id) ? p.target_group_ids.filter(x => x !== id) : [...(p.target_group_ids || []), id] }));
        const togTG_T = id => setFTrain(p => ({ ...p, target_group_ids: (p.target_group_ids || []).includes(id) ? p.target_group_ids.filter(x => x !== id) : [...(p.target_group_ids || []), id] }));
        const saveKomm = () => {
          if (!fKomm.title) return;
          up(d => { if (!d.commItems) d.commItems = []; d.commItems.push({ id: uid("KOM-"), initiative_id: sel, ...fKomm }); });
          setFKomm({ title: "", target_group_ids: [], channel: "", adkar_phase: "", date: "", responsible: "", message: "", status: "planned" }); setShowKomm(false);
        };
        const saveTrain = () => {
          if (!fTrain.title) return;

          setFTrain({ title: "", target_group_ids: [], format: "", adkar_phase: "", date: "", duration: "", trainer: "", content: "", status: "planned" }); setShowTrain(false);

        const openCMEdit = c => { setEditCMId(c.id); setFCM({ target_group_id: c.target_group_id || "", adkar_phase: c.adkar_phase || "Awareness", key_message: c.key_message || "", channelTags: c.channelTags || [c.channel].filter(Boolean), sender_id: c.sender_id || "", timing: c.timing || "", frequency: c.frequency || "", action_ids: c.action_ids || [], impact_item_ids: c.impact_item_ids || [], stakeholder_ids: c.stakeholder_ids || [] }); setShowCM(true); };

            {ktTab !== "matrix" && (iKOMM.length > 0 || iTRAIN.length > 0) && (

                <Input label="Format" value={fTrain.format} onChange={v => setFTrain(p => ({ ...p, format: v }))} options={["Pr\u00e4senzschulung","Online-Training","E-Learning","Workshop","Coaching","Webinar","Blended Learning","Sonstige"]} />
                <Input label="ADKAR-Phase" value={fTrain.adkar_phase} onChange={v => setFTrain(p => ({ ...p, adkar_phase: v }))} options={["", ...ADKAR]} />
                <Input label="Datum" value={fTrain.date} onChange={v => setFTrain(p => ({ ...p, date: v }))} type="date" />
                <Input label="Dauer" value={fTrain.duration} onChange={v => setFTrain(p => ({ ...p, duration: v }))} placeholder="z.B. 2 Stunden, 1 Tag" />
                <Input label={"Trainer / Durchf\u00fchrend"} value={fTrain.trainer} onChange={v => setFTrain(p => ({ ...p, trainer: v }))} />
                <Input label="Status" value={fTrain.status} onChange={v => setFTrain(p => ({ ...p, status: v }))} options={STATUS_OPTS} />
                <div style={{ gridColumn: "1/-1" }}>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Zielgruppen</label>
                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
                    {iTG.map(tg => <button key={tg.id} onClick={() => togTG_T(tg.id)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontFamily: T.font, fontWeight: 600, background: (fTrain.target_group_ids || []).includes(tg.id) ? T.accentLt : T.bg, color: (fTrain.target_group_ids || []).includes(tg.id) ? T.accent : T.textMut }}>{tg.name}</button>)}
                    {iTG.length === 0 && <span style={{ fontSize: 11, color: T.textMut }}>Keine Zielgruppen vorhanden</span>}
                  </div>
                </div>
                <Input label="Inhalte / Beschreibung" value={fTrain.content} onChange={v => setFTrain(p => ({ ...p, content: v }))} textarea style={{ gridColumn: "1/-1" }} placeholder="Welche Inhalte werden vermittelt?" />
              </div>
              <Btn v="primary" onClick={saveTrain} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showTpl} onClose={() => setShowTpl(false)} title={"Kommunikations-Vorlage w\u00e4hlen"} wide>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {COMMS_TEMPLATES.map((tpl, i) => (
                  <div key={i} style={{ padding: "12px 14px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${ADKAR_C[tpl.adkar_phase] || T.accent}`, cursor: "pointer" }} onClick={() => applyTemplate(tpl)}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ fontWeight: 700, fontSize: 13 }}>{tpl.label}</span>
                      <Badge color={ADKAR_C[tpl.adkar_phase]}>{tpl.adkar_phase}</Badge>
                    </div>

                    <div style={{ marginTop: 6, display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {(tpl.channelTags || []).map(c => <Badge key={c} color={T.cyan}>{c}</Badge>)}
                    </div>
                  </div>
                ))}
              </div>
            </Modal>
            <Modal open={showCM} onClose={() => { setShowCM(false); setEditCMId(null); }} title={editCMId ? "Komm.-Item bearbeiten" : "Neues Komm.-Item"} wide>
              <div style={S.formGrid}>
                <Input label="Zielgruppe" value={fCM.target_group_id} onChange={v => setFCM(p => ({ ...p, target_group_id: v }))} options={[{ value: "", label: "Alle" }, ...iTG.map(t => ({ value: t.id, label: t.name }))]} />

                <Input label="Absender" value={fCM.sender_id} onChange={v => setFCM(p => ({ ...p, sender_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />

                <Input label="Frequenz" value={fCM.frequency} onChange={v => setFCM(p => ({ ...p, frequency: v }))} placeholder="z.B. einmalig, w\u00f6chentlich" />
                <div />
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label={"Verkn\u00fcpfte Ma\u00dfnahmen"} options={iAC.map(a => ({ value: a.id, label: (a.title || a.id).slice(0, 40) }))} selected={fCM.action_ids || []} onChange={v => setFCM(p => ({ ...p, action_ids: v }))} color={T.cyan} /></div>
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verkn\u00fcpfte Impacts" options={iIM.map(im => ({ value: im.id, label: (im.change_description || im.id).slice(0, 40) }))} selected={fCM.impact_item_ids || []} onChange={v => setFCM(p => ({ ...p, impact_item_ids: v }))} color={T.purple} /></div>
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verkn\u00fcpfte Stakeholder" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={fCM.stakeholder_ids || []} onChange={v => setFCM(p => ({ ...p, stakeholder_ids: v }))} color={T.accent} /></div>

              <Btn v="primary" onClick={saveCM} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
