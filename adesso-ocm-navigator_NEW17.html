        const ccAvg = ra.cc && ra.cc.length ? (ra.cc.reduce((s, q) => s + q.score, 0) / ra.cc.length).toFixed(1) : "–";
        const oaAvg = ra.oa && ra.oa.length ? (ra.oa.reduce((s, q) => s + q.score, 0) / ra.oa.length).toFixed(1) : "–";
        const DIMS_DE = { Mensch: "Mensch", Prozess: "Prozesse", Technologie: "Technologie" };

        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 16 }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: T.textSec }}>Status-Übersicht</span>
              <Btn v="default" small onClick={() => setNav("pdfReport")}>📄 PDF exportieren</Btn>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 12, marginBottom: 20 }}>
              {[
                ["Fortschritt", `${pct}%`, pct >= 75 ? T.success : pct >= 40 ? T.warn : T.textMut, "✅"],
                ["Maßnahmen", String(totalAc), T.accent, "📋"],
                ["Stakeholder", String(iSH.length), T.purple, "👥"],
                ["Impacts", String(iIM.length), T.danger, "⚡"],
              ].map(([l, v, c, ic]) => (
                <Card key={l} style={{ padding: 14, borderTop: `3px solid ${c}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}><div><div style={{ fontSize: 10, color: T.textMut, marginBottom: 2 }}>{l}</div><div style={{ fontSize: 22, fontWeight: 700, color: T.text }}>{v}</div></div><span style={{ fontSize: 18, opacity: 0.3 }}>{ic}</span></div>
                </Card>
              ))}
            </div>
            {ini.milestones && ini.milestones.length > 0 && (
              <Card style={{ gridColumn: "1/-1", marginBottom: 12 }}>
                <SectionHead>{"N\u00e4chste Meilensteine"}</SectionHead>
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                  {ini.milestones.filter(m => m.date).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5).map((m, i) => {
                    const daysLeft = daysBetween(today(), m.date);
                    const color = daysLeft < 0 ? T.danger : daysLeft <= 14 ? T.warn : T.success;
                    return (
                      <div key={i} style={{ padding: "10px 14px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${color}`, minWidth: 140 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: T.text }}>{m.title || m.name || "Meilenstein"}</div>
                        <div style={{ fontSize: 11, color }}>{fmtDate(m.date)}{" "}{daysLeft >= 0 ? "(in " + daysLeft + "d)" : "(" + Math.abs(daysLeft) + "d \u00fcberf\u00e4llig)"}</div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            )}
            <div style={S.formGrid}>
              <Card>
                <SectionHead>ADKAR Coverage</SectionHead>
                {ADKAR.map(a => (
                  <div key={a} style={{ marginBottom: 6 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}><span style={{ color: T.text, fontWeight: 500 }}>{a}</span><span style={{ color: T.textMut }}>{adkar[a]}</span></div>
                    <div style={{ background: T.bg, borderRadius: 3, height: 8, overflow: "hidden" }}><div style={{ width: `${Math.min(adkar[a] * 20, 100)}%`, height: "100%", borderRadius: 3, background: ADKAR_C[a], transition: "width .3s" }} /></div>
                  </div>
                ))}
              </Card>
              <Card>
                <SectionHead>Maßnahmen-Status</SectionHead>
                <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                  {[["Geplant", sc.planned, T.textMut], ["In Arbeit", sc.in_progress, T.accent], ["Fertig", sc.done, T.success]].map(([l, v, c]) => (
                    <div key={l} style={{ flex: 1, textAlign: "center", padding: 12, background: T.bg, borderRadius: T.rs }}><div style={{ fontSize: 24, fontWeight: 700, color: c }}>{v}</div><div style={{ fontSize: 10, color: T.textMut }}>{l}</div></div>
                  ))}
                </div>
                <SectionHead>Risiko-Zusammenfassung</SectionHead>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ flex: 1, textAlign: "center", padding: 10, background: T.bg, borderRadius: T.rs }}>
                    <div style={{ fontSize: 10, color: T.textMut, marginBottom: 2 }}>Change-Komplexität</div>
                    <Badge color={Number(ccAvg) >= 4 ? T.danger : Number(ccAvg) >= 2.5 ? T.warn : T.success}>{ccAvg}</Badge>
                  </div>
                  <div style={{ flex: 1, textAlign: "center", padding: 10, background: T.bg, borderRadius: T.rs }}>
                    <div style={{ fontSize: 10, color: T.textMut, marginBottom: 2 }}>Org. Bereitschaft</div>
                    <Badge color={Number(oaAvg) >= 4 ? T.success : Number(oaAvg) >= 2.5 ? T.warn : T.danger}>{oaAvg}</Badge>
                  </div>
                </div>
              </Card>
              <Card style={{ gridColumn: "1/-1" }}>
                <SectionHead>Impact-Verteilung</SectionHead>
                {DIMS.map(dim => { const items = iIM.filter(i => i.dimension === dim); return (
                  <div key={dim} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={{ width: 20, fontSize: 14 }}>{DIM_IC[dim]}</span><span style={{ width: 100, fontSize: 12, color: T.text, fontWeight: 500 }}>{DIMS_DE[dim]}</span>
                    <div style={{ flex: 1, display: "flex", gap: 3 }}>{items.map((it, i) => <ScoreDot key={i} value={it.impact_level} size={22} />)}{items.length === 0 && <span style={{ fontSize: 11, color: T.textMut }}>–</span>}</div>
                  </div>
                ); })}
              </Card>
            </div>
          </div>
        );
      };

      const ProjectDataSub = () => {
        if (!ini) return null;
        const [lf, setLf] = useState({});
        const iniId = ini.id;
        useEffect(() => { setLf({}); }, [iniId]);
        const val = (field) => lf[field] !== undefined ? lf[field] : (ini[field] || "");
        const valStr = (field) => lf[field] !== undefined ? lf[field] : String(ini[field] || "");
        const ch = (field, v) => setLf(prev => ({ ...prev, [field]: v }));
        const sync = (field) => { if (lf[field] !== undefined) up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i[field] = lf[field]; }); };
        const syncNum = (field) => { if (lf[field] !== undefined) up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i[field] = Number(lf[field]) || 0; }); };
        const syncSel = (field, v) => { up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i[field] = v; }); };
        return (
          <div>
            <SectionHead>Stammdaten</SectionHead>
            <div style={{ background: "#fff", border: "1px solid " + T.border, borderRadius: T.r, padding: 16 }}>
              <div style={S.formGrid}>
                <Input label="Name" value={val("name")} onChange={v => ch("name", v)} onBlur={() => sync("name")} style={{ gridColumn: "1/-1" }} />
                <Input label="Ziel" value={val("goal")} onChange={v => ch("goal", v)} onBlur={() => sync("goal")} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Branche" value={ini.industry || ""} onChange={v => syncSel("industry", v)} options={INDUSTRIES} />
                <Input label={"Priorit\u00e4t"} value={ini.priority || ""} onChange={v => syncSel("priority", v)} options={["High", "Medium", "Low"]} />
                <Input label="Startdatum" value={ini.startDate || ""} onChange={v => syncSel("startDate", v)} type="date" />
                <Input label="Enddatum" value={ini.endDate || ""} onChange={v => syncSel("endDate", v)} type="date" />
                <Input label="Go-Live Datum" value={ini.goLiveDate || ""} onChange={v => syncSel("goLiveDate", v)} type="date" />
                <Input label="Personentage (PT)" value={valStr("personDays")} onChange={v => ch("personDays", v)} onBlur={() => syncNum("personDays")} type="number" />
                <Input label={"Auftragsvolumen (\u20ac)"} value={valStr("volume")} onChange={v => ch("volume", v)} onBlur={() => syncNum("volume")} type="number" />
                <Input label="Sichtbarkeit" value={ini.visibility || "internal"} onChange={v => syncSel("visibility", v)} options={[{value: "internal", label: "Nur intern (adesso)"}, {value: "client", label: "Kundensichtbar"}]} />
                <div style={{ gridColumn: "1/-1" }}>
                  <TagInput label="Projekt-Tags" tags={ini.projectTags || []} onChange={v => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i.projectTags = v; })} suggestions={tags.projectTags} color={T.cyan} />
                </div>
                <div style={{ gridColumn: "1/-1" }}>
                  <TagInput label="OCM-Leistungsumfang" tags={ini.ocm_scope || []} onChange={v => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i.ocm_scope = v; })} suggestions={["Konzeption", "Kommunikation", "Training", "Stakeholder-Management", "Change Impact Analyse", "Change Readiness", "Coaching", "Train-the-Trainer", "Widerstandsmanagement"]} color={T.cyan} />
                </div>
              </div>
            </div>
            <div style={{ marginTop: 24 }}>
              <SectionHead>Projektkontext</SectionHead>
            </div>
            <div style={{ background: "#fff", border: "1px solid " + T.border, borderRadius: T.r, padding: 16 }}>
              <div style={S.formGrid}>
                <Input label="Projektkontext" value={val("projectContext")} onChange={v => ch("projectContext", v)} onBlur={() => sync("projectContext")} textarea style={{ gridColumn: "1/-1" }} placeholder="Was ist der Hintergrund des Projekts?" />
                <Input label={"Was \u00e4ndert sich? (High-Level)"} value={val("whatChanges")} onChange={v => ch("whatChanges", v)} onBlur={() => sync("whatChanges")} textarea style={{ gridColumn: "1/-1" }} placeholder={"Welche Ver\u00e4nderungen kommen auf die Betroffenen zu?"} />
                <Input label="Erwartung an OCM" value={val("ocmExpectation")} onChange={v => ch("ocmExpectation", v)} onBlur={() => sync("ocmExpectation")} textarea style={{ gridColumn: "1/-1" }} placeholder="Was wird konkret vom Change Management erwartet?" />
              </div>
            </div>
          </div>
        );
      };

      const RiskSub = () => {
        const ra = ini.riskAssessment || INITIAL_RISK_QUESTIONS;
        const upR = (type, qId, val) => up(d => {
          const i = d.initiatives.find(x => x.id === sel);
          if (i) {
            if (!i.riskAssessment) i.riskAssessment = INITIAL_RISK_QUESTIONS;
            const q = i.riskAssessment[type].find(x => x.id === qId);
            if (q) q.score = val;
          }
        });

        const ccAvg = ra.cc.reduce((s, q) => s + q.score, 0) / ra.cc.length;
        const oaAvg = ra.oa.reduce((s, q) => s + q.score, 0) / ra.oa.length;

        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <Card>
              <SectionHead>Change-Eigenschaften (CC)</SectionHead>
              <p style={{ fontSize: 11, color: T.textMut, marginBottom: 10 }}>Skala: 1 = gering / kaum betroffen · 5 = sehr hoch / stark betroffen</p>
              {ra.cc.map(q => (
                <div key={q.id} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 12, marginBottom: 4 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {[1, 2, 3, 4, 5].map(v => (
                      <button key={v} onClick={() => upR("cc", q.id, v)} style={{ flex: 1, padding: "4px", borderRadius: 4, border: "none", background: q.score === v ? T.accent : T.bg, color: q.score === v ? "#fff" : T.text, fontSize: 11, cursor: "pointer" }}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card>
              <SectionHead>Organisatorische Attribute (OA)</SectionHead>
              <p style={{ fontSize: 11, color: T.textMut, marginBottom: 10 }}>Skala: 1 = gering / kaum betroffen · 5 = sehr hoch / stark betroffen</p>
              {ra.oa.map(q => (
                <div key={q.id} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 12, marginBottom: 4 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {[1, 2, 3, 4, 5].map(v => (
                      <button key={v} onClick={() => upR("oa", q.id, v)} style={{ flex: 1, padding: "4px", borderRadius: 4, border: "none", background: q.score === v ? T.accent : T.bg, color: q.score === v ? "#fff" : T.text, fontSize: 11, cursor: "pointer" }}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card style={{ gridColumn: "1/-1", textAlign: "center" }}>
              <SectionHead>Risiko-Positionierung</SectionHead>
              <div style={{ display: "flex", justifyContent: "center", gap: 40, alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: ccAvg > 3.5 ? T.danger : ccAvg > 2.5 ? T.warn : T.success }}>{ccAvg.toFixed(1)}</div>
                  <div style={{ fontSize: 11, color: T.textMut }}>Ø CC-Score</div>
                </div>
                <div style={{ width: 150, height: 150, border: `2px solid ${T.border}`, position: "relative", background: "#f9f9f9" }}>
                  <div style={{ position: "absolute", bottom: 0, left: 0, width: "50%", height: "50%", background: T.successLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", top: 0, right: 0, width: "50%", height: "50%", background: T.dangerLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", left: (oaAvg / 5 * 100) + "%", bottom: (ccAvg / 5 * 100) + "%", width: 12, height: 12, borderRadius: "50%", background: T.accent, transform: "translate(-50%, 50%)", border: "2px solid #fff", boxShadow: T.shadow }} />
                  <div style={{ position: "absolute", bottom: -20, left: "50%", transform: "translateX(-50%)", fontSize: 10 }}>OA (Resilienz) →</div>
                  <div style={{ position: "absolute", left: -45, top: "50%", transform: "rotate(-90deg) translateX(50%)", fontSize: 10 }}>CC (Intensität) →</div>
                </div>
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: oaAvg > 3.5 ? T.danger : oaAvg > 2.5 ? T.warn : T.success }}>{oaAvg.toFixed(1)}</div>
                  <div style={{ fontSize: 11, color: T.textMut }}>Ø OA-Score</div>
                </div>
              </div>
            </Card>
          </div>
        );
      };

      const PCTSub = () => {
        const p = ini.pctAssessment || INITIAL_PCT_SCORES;
        const upP = (f, v) => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.pctAssessment) i.pctAssessment = INITIAL_PCT_SCORES; i.pctAssessment[f] = v; } });
        const PCT_LABELS = { success: "Projekterfolg", leadership: "Leadership", pm: "PM", cm: "CM" };
        const PCT_DESC = { success: "Klarheit der Ziele und Definition des Erfolgs.", leadership: "Sichtbarkeit, Koalition und Unterst\u00fctzung der F\u00fchrung.", pm: "Technische Seite: Planung, Ressourcen, Zeitplan.", cm: "Menschliche Seite: Change Management Prozesse." };
        return (
          <div style={S.formGrid}>
            <div style={{ gridColumn: "1/-1" }}>
              <div style={{ background: T.accentLt, border: "1px solid " + T.borderLight, borderRadius: T.rs, padding: "10px 14px", marginBottom: 16, fontSize: 12, color: T.textSec }}>
                <strong>PCT = Project Change Triangle</strong> {"\u2013"} Bewertung der drei Erfolgsfaktoren:<br />
                <span style={{ color: T.adessoBlau }}>{"\u25A0"}</span>{" "}<strong>PM</strong> = Projektmanagement-Qualit{"ä"}t |{" "}
                <span style={{ color: T.purple }}>{"\u25A0"}</span>{" "}<strong>CM</strong> = Change-Management-Reife |{" "}
                <span style={{ color: T.success }}>{"\u25A0"}</span>{" "}<strong>Leadership</strong> = Sponsoring & F{"ü"}hrung<br />
                Skala: 1 (sehr schwach) {"→"} 10 (sehr stark). Bewerte als OCM-Berater:in den aktuellen Ist-Zustand des Projekts.
              </div>
            </div>
            {Object.keys(p).map(key => (
              <Card key={key}>
                <SectionHead>{PCT_LABELS[key] || key}</SectionHead>
                <ScoreInput label="Bewertung (0\u201310)" value={p[key]} onChange={v => upP(key, v)} />
                <p style={{ fontSize: 11, color: T.textMut, marginTop: 8 }}>{PCT_DESC[key] || ""}</p>
              </Card>
            ))}
            <Card style={{ gridColumn: "1/-1" }}>
              <SectionHead>{"PCT-\u00dcbersicht"}</SectionHead>
              <div style={{ display: "flex", gap: 4, height: 200, alignItems: "flex-end" }}>
                {Object.entries(p).map(([k, v]) => (
                  <div key={k} style={{ flex: 1, textAlign: "center" }}>
                    <div style={{ height: (v * 15), background: v >= 7 ? T.success : v >= 4 ? T.warn : T.danger, borderRadius: "4px 4px 0 0", transition: "0.5s" }} />
                    <div style={{ fontSize: 11, fontWeight: 600, marginTop: 8 }}>{PCT_LABELS[k] || k}</div>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>{v}</div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        );
      };

      // ─── STAKEHOLDER ──────────────────────────────────────────────────
      const StakeholderSub = () => {
        const [shView, setShView] = useState("list");
        const emptyF = { name: "", roles: [], company_roles: [], project_roles: [], org_unit: [], influence: 5, interest: 5, readiness: "Neutral", notes: "", group_size: "", engagement_strategy: "inform", location: "", language: "" };
        const { show, setShow, editId, setEditId, f, sF, openNew, close } = useModalForm(emptyF);
        const save = () => { if (!f.name) return; if (editId) { up(d => { const s = d.stakeholders.find(x => x.id === editId); if (s) Object.assign(s, f); }); } else { up(d => d.stakeholders.push({ id: uid("S-"), initiative_id: sel, ...f })); } close(); };
        const openEdit = (s) => { setEditId(s.id); sF({ name: s.name, roles: s.roles || [s.role].filter(Boolean), company_roles: s.company_roles || [], project_roles: s.project_roles || [], org_unit: Array.isArray(s.org_unit) ? s.org_unit : (s.org_unit ? [s.org_unit] : []), influence: s.influence, interest: s.interest, readiness: s.readiness, notes: s.notes || "", group_size: s.group_size || "", engagement_strategy: s.engagement_strategy || "inform", location: s.location || "", language: s.language || "" }); setShow(true); };
        editSHRef.current = openEdit;
        const del = (id, e) => { if (e) e.stopPropagation(); up(d => d.stakeholders = d.stakeholders.filter(s => s.id !== id)); };
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 16 }}>
              <div style={{ display: "flex", gap: 4 }}>
                {[["list","📋 Liste"],["map","🗺️ Power-Interest"],["network","🕸️ Netzwerk"]].map(([k,l]) => (
                  <Btn key={k} small v={shView===k?"primary":"default"} onClick={() => setShView(k)}>{l}</Btn>
                ))}
              </div>
            </div>
            {shView === "map" && <StakeholderMapSub />}
            {shView === "network" && <NetworkGraphSub />}
            {shView === "list" && (iSH.length === 0 ? <Empty icon="👤" title="Keine Stakeholder" sub="Erfasse Stakeholder für dieses Projekt" action={<Btn v="primary" onClick={openNew}>＋ Stakeholder hinzufügen</Btn>} /> : (<>
              <DataTable headers={["Name", "Rolle(n)", "Organisationseinheit", "Gruppe (n)", "Einfluss", "Interesse", "Change Readiness", "Notizen", "Letztes Engagement", ""]}>
                {iSH.map(s => {
                      const engs = iENG.filter(e => e.stakeholder_id === s.id).sort((a, b) => b.date.localeCompare(a.date));
                      const lastEng = engs[0];
                      const daysSince = lastEng ? daysBetween(lastEng.date, today()) : null;
                      return (
                        <tr key={s.id} style={{ borderBottom: `1px solid ${T.borderLight}` }}>
                          <td style={{ padding: "8px 12px", fontWeight: 500, color: T.text, cursor: "pointer" }} onClick={() => openEdit(s)}>{s.name}</td>
                          <td style={{ padding: "8px 12px" }}>{(s.roles || [s.role]).map(r => <Badge key={r} color={T.purple}>{r}</Badge>)}</td>
                          <td style={{ padding: "8px 12px" }}>
                            {(Array.isArray(s.org_unit) ? s.org_unit : (s.org_unit ? [s.org_unit] : [])).map(ou => <Badge key={ou} color={T.cyan}>{ou}</Badge>)}
                            {(!s.org_unit || (Array.isArray(s.org_unit) && s.org_unit.length === 0)) && <span style={{ color: T.textMut, fontSize: 11 }}>{"\u2013"}</span>}
                          </td>
                          <td style={{ padding: "8px 12px", fontSize: 12, color: T.textSec }}>{s.groupSize || "–"}</td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.influence} /></td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.interest} /></td>
                          <td style={{ padding: "8px 12px" }}><Badge color={readyColor(s.readiness)}>{s.readiness}</Badge></td>
                          <td style={{ padding: "8px 12px", fontSize: 11, maxWidth: 180 }}>
                            <EditCell value={s.notes || ""} onChange={v => up(d => { const sh = d.stakeholders.find(x => x.id === s.id); if (sh) sh.notes = v; })} style={{ fontSize: 11, color: T.textSec }} placeholder="Notiz…" />
                          </td>
                          <td style={{ padding: "8px 12px", fontSize: 11, color: daysSince !== null && daysSince > 14 ? T.danger : T.textMut }}>{lastEng ? `${fmtDate(lastEng.date)} (vor ${daysSince}d)` : "–"}</td>
                          <td style={{ padding: "8px 12px" }}><Btn v="ghost" small onClick={e => del(s.id, e)}>✕</Btn></td>
                        </tr>
                      );
                })}
              </DataTable>
              <div style={{ marginTop: 10 }}><Btn v="default" small onClick={openNew}>＋ Weiteren Stakeholder hinzufügen</Btn></div>
            </>))}
            <Modal open={show} onClose={close} title={editId ? "Stakeholder bearbeiten" : "Stakeholder hinzufügen"}>
              <div style={S.formGrid}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Rolle im Unternehmen – frei anlegbar" tags={f.roles} onChange={v => sF(p => ({ ...p, roles: v }))} suggestions={tags.roles} color={T.purple} /></div>
                <Input label="Rolle im Projekt" value={f.projectRole || ""} onChange={v => sF(p => ({ ...p, projectRole: v }))} placeholder="z.B. Sponsor, Key User, Projektleiter" />
                <Input label="Anzahl Personen in Gruppe" value={f.groupSize || ""} onChange={v => sF(p => ({ ...p, groupSize: v }))} type="number" placeholder="z.B. 50" />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Organisationseinheit(en)" tags={Array.isArray(f.org_unit) ? f.org_unit : (f.org_unit ? [f.org_unit] : [])} onChange={v => sF(p => ({ ...p, org_unit: v }))} suggestions={allOrgUnits} color={T.cyan} /></div>
                <Input label="Standort" value={f.location || ""} onChange={v => sF(p => ({ ...p, location: v }))} placeholder={"z.B. Berlin, M\u00fcnchen"} />
                <Input label="Sprache(n)" value={f.language || ""} onChange={v => sF(p => ({ ...p, language: v }))} placeholder="z.B. Deutsch, Englisch" />
                <ScoreInput label="Einfluss (0–10)" value={f.influence} onChange={v => sF(p => ({ ...p, influence: v }))} />
                <ScoreInput label="Interesse (0–10)" value={f.interest} onChange={v => sF(p => ({ ...p, interest: v }))} />
                <Input label="Change Readiness" value={f.readiness} onChange={v => sF(p => ({ ...p, readiness: v }))} options={READINESS} />
                <Input label="Notizen" value={f.notes} onChange={v => sF(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── STAKEHOLDER MAP (Power-Interest Grid) ───────────────────────
      const StakeholderMapSub = () => {
        const [tooltip, setTooltip] = useState(null);
        const W = 480, H = 360;
        const PAD = 50;
        const toX = interest => PAD + ((interest || 0) / 10) * (W - PAD * 2);
        const toY = influence => H - PAD - ((influence || 0) / 10) * (H - PAD * 2);
        const quadrants = [
          { x: PAD, y: PAD, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Eng einbinden", bg: "#fff8e1" },
          { x: PAD + (W - PAD * 2) / 2, y: PAD, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Aktiv managen", bg: "#fde8eb" },
          { x: PAD, y: PAD + (H - PAD * 2) / 2, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Beobachten", bg: "#f4f6fa" },
          { x: PAD + (W - PAD * 2) / 2, y: PAD + (H - PAD * 2) / 2, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Informiert halten", bg: "#e6f0fa" },
        ];
        if (iSH.length === 0) return <Empty icon="🗺️" title="Keine Stakeholder" sub="Lege zuerst Stakeholder an" />;
        return (
          <div>
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12, alignItems: "center" }}>
              <SectionHead>Stakeholder Power-Interest Grid</SectionHead>
              <div style={{ display: "flex", gap: 12, fontSize: 11 }}>
                {Object.entries({ supportive: T.success, neutral: T.textMut, skeptical: T.warn, resistant: T.danger }).map(([r, c]) => (
                  <span key={r} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ width: 10, height: 10, borderRadius: "50%", background: c, display: "inline-block" }} />
                    {r}
                  </span>
                ))}
              </div>
            </div>
            <div style={{ position: "relative", display: "inline-block" }}>
              <svg width={W} height={H} style={{ display: "block" }}>
                {/* Quadrant backgrounds */}
                {quadrants.map((q, i) => <rect key={i} x={q.x} y={q.y} width={q.w} height={q.h} fill={q.bg} />)}
                {/* Quadrant border */}
                <rect x={PAD} y={PAD} width={W - PAD*2} height={H - PAD*2} fill="none" stroke={T.border} strokeWidth="1" />
                <line x1={(W)/2} y1={PAD} x2={(W)/2} y2={H-PAD} stroke={T.border} strokeWidth="1" strokeDasharray="4,4" />
                <line x1={PAD} y1={(H)/2} x2={W-PAD} y2={(H)/2} stroke={T.border} strokeWidth="1" strokeDasharray="4,4" />
                {/* Axis labels */}
                <text x={W/2} y={H-8} textAnchor="middle" fontSize="11" fill={T.textMut}>Interesse →</text>
                <text x={14} y={H/2} textAnchor="middle" fontSize="11" fill={T.textMut} transform={`rotate(-90,14,${H/2})`}>Einfluss →</text>
                {/* Quadrant labels */}
                {quadrants.map((q, i) => <text key={i} x={q.x + q.w/2} y={q.y + 14} textAnchor="middle" fontSize="10" fill={T.textSec} fontWeight="600">{q.label}</text>)}
                {/* Scale ticks */}
                {[0,2,4,6,8,10].map(v => <React.Fragment key={v}>
                  <text x={toX(v)} y={PAD-6} textAnchor="middle" fontSize="8" fill={T.textMut}>{v}</text>
                  <text x={PAD-6} y={toY(v)+3} textAnchor="end" fontSize="8" fill={T.textMut}>{v}</text>
                </React.Fragment>)}
                {/* Stakeholder circles */}
                {iSH.map(s => {
                  const cx = toX(s.interest || 5), cy = toY(s.influence || 5);
                  const r = 6 + (s.influence || 0) * 0.9;
                  const col = readyColor(s.readiness);
                  const initials = (s.name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
                  const sEngs = iENG.filter(e => e.stakeholder_id === s.id).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
                  const lastEngDate = sEngs[0]?.date;
                  const daysSinceEng = lastEngDate ? daysBetween(lastEngDate, today()) : null;
                  const engOverdue = daysSinceEng === null || daysSinceEng > 30;
                  const ringColor = engOverdue ? "#e53e3e" : "#38a169";
                  return (
                    <g key={s.id} style={{ cursor: "pointer" }}
                      onMouseEnter={() => setTooltip({ s, cx, cy })}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => { if (editSHRef.current) editSHRef.current(s); }}
                    >
                      <circle cx={cx} cy={cy} r={r + 3} fill="none" stroke={ringColor} strokeWidth="2.5" opacity="0.85" />
                      <circle cx={cx} cy={cy} r={r} fill={col} fillOpacity="0.75" stroke={col} strokeWidth="1.5" />
                      <text x={cx} y={cy+3} textAnchor="middle" fontSize="7" fontWeight="700" fill="#fff">{initials}</text>
                    </g>
                  );
                })}
              </svg>
              {tooltip && (
                <div style={{ position: "absolute", left: tooltip.cx + 12, top: tooltip.cy - 16, background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px 12px", fontSize: 12, boxShadow: T.shadow, zIndex: 100, minWidth: 180, pointerEvents: "none" }}>
                  <div style={{ fontWeight: 700, marginBottom: 4 }}>{tooltip.s.name}</div>
                  <div style={{ color: T.textMut }}>Einfluss: <strong>{tooltip.s.influence}</strong> · Interesse: <strong>{tooltip.s.interest}</strong></div>
                  <div style={{ marginTop: 4 }}><Badge color={readyColor(tooltip.s.readiness)}>{tooltip.s.readiness}</Badge></div>
                  {tooltip.s.notes && <div style={{ color: T.textSec, marginTop: 4, fontSize: 11 }}>{tooltip.s.notes.slice(0, 80)}</div>}
                </div>
              )}
            </div>
            <div style={{ marginTop: 10, fontSize: 11.5, color: T.textSec, display: "flex", gap: 16 }}>
              <span>🔴 Engagement überfällig (&gt;30 Tage)</span>
              <span>🟢 Kürzlich kontaktiert</span>
            </div>
          </Card>
          <Card style={{ marginTop: 12 }}>
            <SectionHead>Engagement-Strategien nach Quadrant</SectionHead>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, fontSize: 12 }}>
              {[
                ["Hoch Einfluss · Hoch Interesse", "Eng einbinden", T.adessoBlau, "Regelmäßige 1:1s, aktive Beteiligung an Entscheidungen"],
                ["Hoch Einfluss · Niedrig Interesse", "Zufrieden stellen", T.purple, "Gezielt informieren, als Sponsor gewinnen"],
                ["Niedrig Einfluss · Hoch Interesse", "Informiert halten", T.cyan, "Newsletter, Updates, Feedback-Möglichkeiten"],
                ["Niedrig Einfluss · Niedrig Interesse", "Beobachten", T.textMut, "Minimale Kommunikation, bei Bedarf reaktiv"],
              ].map(([quad, strat, color, desc]) => (
                <div key={quad} style={{ padding: "8px 10px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${color}` }}>
                  <div style={{ fontWeight: 600, color, marginBottom: 2 }}>{strat}</div>
                  <div style={{ color: T.textSec, marginBottom: 2 }}>{quad}</div>
                  <div style={{ color: T.textMut, fontSize: 11 }}>{desc}</div>
                </div>
              ))}
            </div>
          </Card>
          </div>
        );
      };

      // ─── TARGET GROUPS ────────────────────────────────────────────────
      const TargetSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [f, sF] = useState({ name: "", size: "", org_units: [], locations: "", stakeholder_ids: [], language: "", specifics: "" });
        const resetF = () => sF({ name: "", size: "", org_units: [], locations: "", stakeholder_ids: [], language: "", specifics: "" });
        const add = () => { if (!f.name) return; up(d => d.targetGroups.push({ id: uid("TG-"), initiative_id: sel, name: f.name, size: parseInt(f.size) || 0, org_units: f.org_units, locations: f.locations.split(",").map(s => s.trim()).filter(Boolean), stakeholder_ids: f.stakeholder_ids, language: f.language, specifics: f.specifics })); resetF(); setShow(false); };
        const save = () => { if (!editId || !f.name) return; up(d => { const tg = d.targetGroups.find(t => t.id === editId); if (tg) { tg.name = f.name; tg.size = parseInt(f.size) || 0; tg.org_units = f.org_units; tg.locations = f.locations.split(",").map(s => s.trim()).filter(Boolean); tg.stakeholder_ids = f.stakeholder_ids; tg.language = f.language; tg.specifics = f.specifics; } }); setEditId(null); resetF(); setShow(false); };
        const openEdit = (tg) => { setEditId(tg.id); sF({ name: tg.name, size: String(tg.size || ""), org_units: tg.org_units || [], locations: (tg.locations || []).join(", "), stakeholder_ids: tg.stakeholder_ids || [], language: tg.language || "", specifics: tg.specifics || "" }); setShow(true); };
        const openNew = () => { setEditId(null); resetF(); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}><span style={{ fontSize: 14, fontWeight: 600 }}>Zielgruppen</span><Btn v="primary" small onClick={openNew}>＋</Btn></div>
            {iTG.length === 0 ? <Empty icon="👥" title="Keine Zielgruppen" sub="" /> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 12 }}>
                {iTG.map(tg => <Card key={tg.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 600, cursor: "pointer" }} onClick={() => openEdit(tg)}>{tg.name} ✏️</span>
                    <Btn v="ghost" small onClick={() => up(d => d.targetGroups = d.targetGroups.filter(t => t.id !== tg.id))}>✕</Btn>
                  </div>
                  <div style={{ fontSize: 12, color: T.textMut, marginBottom: 6 }}>👥 {tg.size} {" "} {tg.org_units?.join(", ") || "–"}{tg.locations?.length > 0 && ` | 📍 ${tg.locations.join(", ")}`}{tg.language && ` | 🗣️ ${tg.language}`}</div>
                  {tg.specifics && <div style={{ fontSize: 11, color: T.textSec, marginBottom: 6, fontStyle: "italic" }}>{tg.specifics}</div>}
                  {(tg.stakeholder_ids || []).length > 0 && <div style={{ marginBottom: 6, display: "flex", gap: 3, flexWrap: "wrap" }}>{(tg.stakeholder_ids || []).map(sid => { const s = iSH.find(x => x.id === sid); return s ? <Badge key={sid} color={T.purple}>{s.name}</Badge> : null; })}</div>}
                  <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>{ADKAR.map(a => { const c = adkarCov(iAC, tg.id)[a]; return <Badge key={a} color={c === 0 ? T.danger : c < 2 ? T.warn : T.success}>{a[0]}:{c}</Badge>; })}</div>
                  <div style={{ marginTop: 10, borderTop: `1px solid ${T.borderLight}`, paddingTop: 8 }}>
                    <button onClick={() => setNav("impaktanalyse")} style={{ background: "none", border: "none", cursor: "pointer", color: T.accent, fontSize: 12, fontWeight: 600, fontFamily: T.font, padding: 0, display: "flex", alignItems: "center", gap: 4 }}>🌡️ Impacts anzeigen</button>
                  </div>
                </Card>)}
              </div>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Zielgruppe bearbeiten" : "Neue Zielgruppe"}>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} />
                <Input label="Größe" value={f.size} onChange={v => sF(p => ({ ...p, size: v }))} type="number" />
                <TagInput label="Organisationseinheit(en)" tags={f.org_units} onChange={v => sF(p => ({ ...p, org_units: v }))} suggestions={allOrgUnits} color={T.cyan} />
                <Input label="Standorte" value={f.locations} onChange={v => sF(p => ({ ...p, locations: v }))} />
                <Input label="Sprache(n)" value={f.language || ""} onChange={v => sF(p => ({ ...p, language: v }))} placeholder="z.B. Deutsch, Englisch" />
                <Input label="Besonderheiten" value={f.specifics || ""} onChange={v => sF(p => ({ ...p, specifics: v }))} textarea placeholder="z.B. Schichtbetrieb, Remote-Arbeit, besondere Anforderungen" style={{ gridColumn: "1/-1" }} />
                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Verknüpfte Stakeholder</label>
                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
                    {iSH.map(s => <button key={s.id} onClick={() => sF(p => ({ ...p, stakeholder_ids: p.stakeholder_ids.includes(s.id) ? p.stakeholder_ids.filter(x => x !== s.id) : [...p.stakeholder_ids, s.id] }))} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontFamily: T.font, fontWeight: 600, background: f.stakeholder_ids.includes(s.id) ? T.accentLt : T.bg, color: f.stakeholder_ids.includes(s.id) ? T.accent : T.textMut }}>{s.name}</button>)}
                  </div>
                </div>
              </div>
              <Btn v="primary" onClick={editId ? save : add} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── IMPACTS (0-10 scale) ─────────────────────────────────────────
      const ImpactSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const emptyF = { target_group_id: "", dimension: "Mensch", change_description: "", impact_level: 5, training_need: 5, comms_need: 5, resistance: "" };
        const [f, sF] = useState(emptyF);
        const save = () => { if (!f.change_description) return; if (editId) { up(d => { const im = d.impactItems.find(x => x.id === editId); if (im) Object.assign(im, f); }); } else { up(d => d.impactItems.push({ id: uid("I-"), initiative_id: sel, ...f, dependencies: [] })); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (imp) => { setEditId(imp.id); sF({ target_group_id: imp.target_group_id, dimension: imp.dimension, change_description: imp.change_description, impact_level: imp.impact_level, training_need: imp.training_need, comms_need: imp.comms_need, resistance: imp.resistance || "" }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}><span style={{ fontSize: 14, fontWeight: 600 }}>Impact Items</span><Btn v="primary" small onClick={openNew}>＋</Btn></div>
            {iIM.length === 0 ? <Empty icon="⚡" title="Keine Impacts" sub="" /> : (
              <DataTable headers={["Zielgruppe", "Dim.", "Beschreibung", "Impact", "Train.", "Komm.", ""]}>
                {iIM.map(imp => <tr key={imp.id} style={{ borderBottom: `1px solid ${T.borderLight}`, cursor: "pointer" }} onClick={() => openEdit(imp)}>
                  <td style={{ padding: "8px 10px" }}><EditCell value={imp.target_group_id} onChange={v => upE("impactItems", imp.id, "target_group_id", v)} options={iTG.map(t => ({ value: t.id, label: t.name }))} /></td>
                  <td style={{ padding: "8px 10px" }}><EditCell value={imp.dimension} onChange={v => upE("impactItems", imp.id, "dimension", v)} options={DIMS.map(d => ({ value: d, label: d }))} /></td>
                  <td style={{ padding: "8px 10px", color: T.textSec, maxWidth: 200 }}><EditCell value={imp.change_description} onChange={v => upE("impactItems", imp.id, "change_description", v)} /></td>
                  <td style={{ padding: "8px 10px" }}><EditCell value={imp.impact_level} onChange={v => upE("impactItems", imp.id, "impact_level", clamp(v))} type="score" /></td>
                  <td style={{ padding: "8px 10px" }}><EditCell value={imp.training_need} onChange={v => upE("impactItems", imp.id, "training_need", clamp(v))} type="score" /></td>
                  <td style={{ padding: "8px 10px" }}><EditCell value={imp.comms_need} onChange={v => upE("impactItems", imp.id, "comms_need", clamp(v))} type="score" /></td>
                  <td style={{ padding: "8px 10px" }}><Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => d.impactItems = d.impactItems.filter(i => i.id !== imp.id)); }}>✕</Btn></td>
                </tr>)}
              </DataTable>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Impact bearbeiten" : "Neues Impact Item"}>
              <div style={S.formGrid}>
                <Input label="Zielgruppe" value={f.target_group_id} onChange={v => sF(p => ({ ...p, target_group_id: v }))} options={iTG.map(t => ({ value: t.id, label: t.name }))} />
                <Input label="Dimension" value={f.dimension} onChange={v => sF(p => ({ ...p, dimension: v }))} options={DIMS} />
                <Input label="Beschreibung: Was ändert sich genau?" value={f.change_description} onChange={v => sF(p => ({ ...p, change_description: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <ScoreInput label="Impact (0–10)" value={f.impact_level} onChange={v => sF(p => ({ ...p, impact_level: v }))} />
                <Input label="Mögliche Widerstände" value={f.resistance || ""} onChange={v => sF(p => ({ ...p, resistance: v }))} textarea style={{ gridColumn: "1/-1" }} placeholder="Welche Widerstände sind zu erwarten?" />
                <ScoreInput label="Training-Bedarf (0–10)" value={f.training_need} onChange={v => sF(p => ({ ...p, training_need: v }))} />
                <ScoreInput label="Komm.-Bedarf (0–10)" value={f.comms_need} onChange={v => sF(p => ({ ...p, comms_need: v }))} />
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── STAKEHOLDER NETWORK GRAPH ────────────────────────────────────
      const NetworkGraphSub = () => {
        const [tooltip, setTooltip] = useState(null);
        const [showAddRel, setShowAddRel] = useState(false);
        const emptyRel = { from_id: "", to_id: "", type: "ally", strength: 2, note: "" };
        const [fRel, setFRel] = useState(emptyRel);
        const saveRel = () => {
          if (!fRel.from_id || !fRel.to_id || fRel.from_id === fRel.to_id) return;
          up(d => { if (!d.stakeholderRelations) d.stakeholderRelations = []; d.stakeholderRelations.push({ id: uid("REL-"), initiative_id: sel, ...fRel }); });
          setFRel(emptyRel); setShowAddRel(false);
        };
        const delRel = id => up(d => { d.stakeholderRelations = (d.stakeholderRelations || []).filter(r => r.id !== id); });
        const REL_TYPES = ["ally", "conflict", "influence", "neutral"];
        const REL_LABELS = { ally: "Verbündet", conflict: "Konflikt", influence: "Einfluss auf", neutral: "Neutral" };
        const REL_COLORS = { ally: T.success, conflict: T.danger, influence: T.accent, neutral: T.textMut };
        const REL_DASH = { ally: "none", conflict: "6,3", influence: "none", neutral: "3,5" };
        const W = 640, H = 400, CX = 320, CY = 195, R = 158;
        const N = iSH.length;
        const nodePos = iSH.map((sh, i) => {
          const angle = (i / Math.max(1, N)) * 2 * Math.PI - Math.PI / 2;
          return { ...sh, x: N === 1 ? CX : CX + R * Math.cos(angle), y: N === 1 ? CY : CY + R * Math.sin(angle) };
        });
        const nodeR = sh => Math.max(10, 6 + (sh.influence || 5) * 1.4);
        const initials = name => (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 12 }}>
              <div style={{ display: "flex", gap: 12, fontSize: 12, color: T.textMut, flexWrap: "wrap" }}>
                {Object.entries(REL_LABELS).map(([k, l]) => (
                  <span key={k} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke={REL_COLORS[k]} strokeWidth="2" strokeDasharray={REL_DASH[k] === "none" ? "" : REL_DASH[k]} /></svg>
                    {l}
                  </span>
                ))}
              </div>
              <Btn small v="primary" onClick={() => setShowAddRel(true)}>＋ Beziehung</Btn>
            </div>
            {iSH.length === 0 ? <Empty icon="🕸️" title="Keine Stakeholder" sub="Lege zuerst Stakeholder an" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block", maxHeight: 420 }}>
                  {/* Quadrant hints */}
                  <circle cx={CX} cy={CY} r={R} fill="none" stroke={T.borderLight} strokeWidth="1" strokeDasharray="4,4" />
                  {/* Edges */}
                  {iSREL.map(rel => {
                    const from = nodePos.find(n => n.id === rel.from_id);
                    const to = nodePos.find(n => n.id === rel.to_id);
                    if (!from || !to) return null;
                    const col = REL_COLORS[rel.type] || T.textMut;
                    const dash = REL_DASH[rel.type] || "none";
                    const sw = (rel.strength || 2) * 0.9;
                    const dx = to.x - from.x, dy = to.y - from.y, dist = Math.sqrt(dx*dx + dy*dy);
                    const ex = to.x - dx / dist * nodeR(to), ey = to.y - dy / dist * nodeR(to);
                    return (
                      <g key={rel.id}>
                        <line x1={from.x} y1={from.y} x2={ex} y2={ey} stroke={col} strokeWidth={sw} strokeDasharray={dash === "none" ? "" : dash} opacity={0.75} />
                        {rel.type === "influence" && (
                          <polygon points={`${ex},${ey} ${ex - dy/dist*5 - dx/dist*8},${ey + dx/dist*5 - dy/dist*8} ${ex + dy/dist*5 - dx/dist*8},${ey - dx/dist*5 - dy/dist*8}`} fill={col} />
                        )}
                      </g>
                    );
                  })}
                  {/* Nodes */}
                  {nodePos.map(sh => {
                    const r = nodeR(sh);
                    const col = readyColor(sh.readiness);
                    return (
                      <g key={sh.id} onMouseEnter={() => setTooltip(sh)} onMouseLeave={() => setTooltip(null)} style={{ cursor: "pointer" }}>
                        <circle cx={sh.x} cy={sh.y} r={r} fill={col + "22"} stroke={col} strokeWidth="2" />
                        <text x={sh.x} y={sh.y} textAnchor="middle" dominantBaseline="middle" fontSize={Math.max(8, r * 0.65)} fontWeight="700" fill={col}>{initials(sh.name)}</text>
                        <text x={sh.x} y={sh.y + r + 11} textAnchor="middle" fontSize="9" fill={T.textSec}>{sh.name.split(" ")[0]}</text>
                      </g>
                    );
                  })}
                  {/* Tooltip */}
                  {tooltip && (() => {
                    const np = nodePos.find(n => n.id === tooltip.id);
                    if (!np) return null;
                    const tx = np.x > W / 2 ? np.x - 150 : np.x + nodeR(np) + 6;
                    const ty = Math.min(H - 80, np.y - 30);
                    return (
                      <g>
                        <rect x={tx} y={ty} width="148" height="72" rx="6" fill={T.surface} stroke={T.border} strokeWidth="1" filter="drop-shadow(0 2px 6px rgba(0,0,0,.15))" />
                        <text x={tx + 10} y={ty + 18} fontSize="12" fontWeight="700" fill={T.text}>{tooltip.name}</text>
                        <text x={tx + 10} y={ty + 34} fontSize="10" fill={T.textMut}>{(tooltip.roles || [tooltip.role]).join(", ")}</text>
                        <text x={tx + 10} y={ty + 50} fontSize="10" fill={readyColor(tooltip.readiness)}>{tooltip.readiness} · Einfl: {tooltip.influence} · Int: {tooltip.interest}</text>
                        {tooltip.org_unit && <text x={tx + 10} y={ty + 64} fontSize="9" fill={T.textMut}>{tooltip.org_unit}</text>}
                      </g>
                    );
                  })()}
                </svg>
                {/* Relationship list */}
                {iSREL.length > 0 && (
                  <div style={{ padding: "12px 16px", borderTop: `1px solid ${T.borderLight}` }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: T.textMut, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Beziehungen ({iSREL.length})</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {iSREL.map(rel => {
                        const from = iSH.find(s => s.id === rel.from_id);
                        const to = iSH.find(s => s.id === rel.to_id);
                        return (
                          <div key={rel.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 10px", borderRadius: T.rs, background: REL_COLORS[rel.type] + "15", border: `1px solid ${REL_COLORS[rel.type]}44`, fontSize: 12 }}>
                            <span style={{ fontWeight: 600 }}>{from?.name?.split(" ")[0] || "?"}</span>
                            <span style={{ color: REL_COLORS[rel.type], fontSize: 10 }}>──{REL_LABELS[rel.type]}──▶</span>
                            <span style={{ fontWeight: 600 }}>{to?.name?.split(" ")[0] || "?"}</span>
                            {rel.note && <span style={{ fontSize: 10, color: T.textMut }}>({rel.note})</span>}
                            <button onClick={() => delRel(rel.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.textMut, fontSize: 13, padding: "0 2px", lineHeight: 1 }}>×</button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </Card>
            )}
            <Modal open={showAddRel} onClose={() => setShowAddRel(false)} title="Beziehung hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Von Stakeholder" value={fRel.from_id} onChange={v => setFRel(p => ({ ...p, from_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Zu Stakeholder" value={fRel.to_id} onChange={v => setFRel(p => ({ ...p, to_id: v }))} options={iSH.filter(s => s.id !== fRel.from_id).map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Beziehungstyp" value={fRel.type} onChange={v => setFRel(p => ({ ...p, type: v }))} options={REL_TYPES.map(t => ({ value: t, label: REL_LABELS[t] }))} />
                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Stärke (1–3)</label>
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    {[1,2,3].map(v => <Btn key={v} small v={fRel.strength === v ? "primary" : "default"} onClick={() => setFRel(p => ({ ...p, strength: v }))}>{v === 1 ? "Schwach" : v === 2 ? "Mittel" : "Stark"}</Btn>)}
                  </div>
                </div>
                <Input label="Notiz (optional)" value={fRel.note} onChange={v => setFRel(p => ({ ...p, note: v }))} />
              </div>
              <Btn v="primary" onClick={saveRel} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── ACTIONS ──────────────────────────────────────────────────────
      const ActionSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [acView, setAcView] = useState("list");
        const [dragOverColumn, setDragOverColumn] = useState(null);
        const emptyF = { typeTags: [], title: "", adkar_tags: [], target_group_ids: [], owner_person_id: "", supporter_ids: [], opponent_ids: [], due_date: "", status: "planned", impact_item_ids: [] };
        const [f, sF] = useState(emptyF);
        const togA = t => sF(p => ({ ...p, adkar_tags: p.adkar_tags.includes(t) ? p.adkar_tags.filter(x => x !== t) : [...p.adkar_tags, t] }));
        const togT = id => sF(p => ({ ...p, target_group_ids: p.target_group_ids.includes(id) ? p.target_group_ids.filter(x => x !== id) : [...p.target_group_ids, id] }));
        const save = () => { if (!f.title) return; if (editId) { up(d => { const a = d.actions.find(x => x.id === editId); if (a) Object.assign(a, f); }); } else { up(d => d.actions.push({ id: uid("A-"), initiative_id: sel, ...f })); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (a) => { setEditId(a.id); sF({ typeTags: a.typeTags || [a.type], title: a.title, adkar_tags: a.adkar_tags || [], target_group_ids: a.target_group_ids || [], owner_person_id: a.owner_person_id || "", supporter_ids: a.supporter_ids || [], opponent_ids: a.opponent_ids || [], due_date: a.due_date || "", status: a.status, impact_item_ids: a.impact_item_ids || [] }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        const cycle = id => up(d => { const a = d.actions.find(x => x.id === id); if (a) a.status = a.status === "planned" ? "in_progress" : a.status === "in_progress" ? "done" : "planned"; });
        const moveStatus = (id, st) => up(d => { const a = d.actions.find(x => x.id === id); if (a) a.status = st; });
        const updateActionStatus = (id, newStatus) => {
          up(d => {
            const idx = d.actions.findIndex(x => x.id === id);
            if (idx !== -1) {
              d.actions[idx] = { ...d.actions[idx], status: newStatus };
            }
          });
        };
        const COLS = [
          { key: "planned", label: "Geplant", icon: "📋", color: T.warn },
          { key: "in_progress", label: "In Bearbeitung", icon: "⚙️", color: T.accent },
          { key: "done", label: "Erledigt", icon: "✅", color: T.success },
        ];
        return (
          <div>
            <div style={{ ...S.rowBetween, marginBottom: 8 }}>
              <div style={{ display: "flex", gap: 4 }}>
                <Btn small v={acView === "list" ? "primary" : "default"} onClick={() => setAcView("list")}>📋 Liste</Btn>
                <Btn small v={acView === "kanban" ? "primary" : "default"} onClick={() => setAcView("kanban")}>🗌 Kanban</Btn>
              </div>
            </div>
            <div style={{ background: "#ebf8ff", color: "#2b6cb0", fontSize: 12, padding: "8px 12px", borderRadius: T.rs, marginBottom: 16, border: "1px solid #bee3f8" }}>
              {"ℹ️"} <strong>Ma{"\u00df"}nahmen f{"\u00fc"}r Zielgruppen</strong> {"\u2013"} ADKAR-basierte Change-Aktivit{"\u00e4"}ten, die auf betroffene Gruppen ausgerichtet sind. F{"\u00fc"}r Aufgaben an F{"\u00fc"}hrungskr{"\u00e4"}fte {"\u2192"} Sponsoring.
            </div>
            {/* Kanban Board */}
            {acView === "kanban" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
                {COLS.map(col => {
                  const colAC = iAC.filter(a => a.status === col.key);
                  const isOver = dragOverColumn === col.key;
                  return (
                    <div key={col.key}
                      onDragOver={e => e.preventDefault()}
                      onDragEnter={e => { e.preventDefault(); setDragOverColumn(col.key); }}
                      onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverColumn(null); }}
                      onDrop={e => { e.preventDefault(); const id = e.dataTransfer.getData("actionId"); if (id) updateActionStatus(id, col.key); setDragOverColumn(null); }}
                      style={{ borderRadius: T.rs, border: isOver ? "2px dashed #667eea" : "2px solid transparent", background: isOver ? "#f0f0ff" : "transparent", transition: "border 0.15s, background 0.15s", padding: isOver ? 2 : 2 }}
                    >
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, padding: "8px 12px", background: col.color + "18", borderRadius: T.rs, borderLeft: `3px solid ${col.color}` }}>
                        <span>{col.icon}</span><span style={{ fontWeight: 700, color: col.color, fontSize: 13 }}>{col.label}</span>
                        <span style={{ marginLeft: "auto", background: col.color, color: "#fff", borderRadius: 10, padding: "1px 8px", fontSize: 11, fontWeight: 700 }}>{colAC.length}</span>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 8, minHeight: 60 }}>
                        {colAC.map(a => {
                          const ow = iSH.find(s => s.id === a.owner_person_id);
                          const tgs = iTG.filter(t => (a.target_group_ids || []).includes(t.id));
                          return (
                            <Card key={a.id}
                              draggable={true}
                              onDragStart={e => { e.dataTransfer.setData("actionId", a.id); e.dataTransfer.effectAllowed = "move"; }}
                              onClick={() => openEdit(a)}
                              style={{ padding: 12, cursor: "grab", borderTop: `3px solid ${col.color}` }}
                            >
                              <div style={{ fontWeight: 600, fontSize: 12.5, marginBottom: 6, lineHeight: 1.3 }}>{a.title}</div>
                              <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginBottom: 6 }}>
                                {(a.adkar_tags || []).map(t => <Badge key={t} color={ADKAR_C[t]} style={{ fontSize: 9, padding: "1px 5px" }}>{t}</Badge>)}
                                {(a.typeTags || [a.type]).filter(Boolean).map(t => <Badge key={t} color={T.cyan} style={{ fontSize: 9, padding: "1px 5px" }}>{t}</Badge>)}
                              </div>
                              {a.due_date && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 3 }}>📅 {fmtDate(a.due_date)}</div>}
                              {ow && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 3 }}>👤 {ow.name}</div>}
                              {tgs.length > 0 && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 6 }}>🎯 {tgs.map(t => t.name).join(", ")}</div>}
                              <div style={{ display: "flex", gap: 4, marginTop: 4 }}>
                                {col.key !== "planned" && <Btn small v="ghost" onClick={e => { e.stopPropagation(); moveStatus(a.id, col.key === "in_progress" ? "planned" : "in_progress"); }} style={{ fontSize: 10, padding: "2px 8px" }}>◀ Zurück</Btn>}
                                {col.key !== "done" && <Btn small v="primary" onClick={e => { e.stopPropagation(); moveStatus(a.id, col.key === "planned" ? "in_progress" : "done"); }} style={{ fontSize: 10, padding: "2px 8px" }}>Weiter ▶</Btn>}
                              </div>
                            </Card>
                          );
                        })}
                        {colAC.length === 0 && <div style={{ padding: "20px 0", textAlign: "center", color: T.textMut, fontSize: 12, background: T.bg, borderRadius: T.rs }}>Keine Maßnahmen</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {/* List View */}
            {acView === "list" && (iAC.length === 0 ? <Empty icon="📋" title="Keine Maßnahmen" sub="Erstelle Maßnahmen für dieses Projekt" action={<Btn v="primary" onClick={openNew}>＋ Maßnahme hinzufügen</Btn>} /> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {iAC.map(a => {
                  const ow = iSH.find(s => s.id === a.owner_person_id); const supps = (a.supporter_ids || []).map(id => iSH.find(s => s.id === id)).filter(Boolean); const opps = (a.opponent_ids || []).map(id => iSH.find(s => s.id === id)).filter(Boolean); return (
                    <Card key={a.id} style={{ padding: 14, borderLeft: `4px solid ${statusColor(a.status)}`, cursor: "pointer" }} onClick={() => openEdit(a)}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                            <button onClick={e => { e.stopPropagation(); cycle(a.id); }} style={{ width: 20, height: 20, borderRadius: 5, border: `2px solid ${statusColor(a.status)}`, background: a.status === "done" ? T.successLt : "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: statusColor(a.status), fontFamily: T.font }}>{a.status === "done" ? "✓" : a.status === "in_progress" ? "▸" : ""}</button>
                            <span style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{a.title}</span>
                            {(a.typeTags || [a.type]).map(t => <Badge key={t} color={T.cyan}>{t}</Badge>)}
                            <Badge color={statusColor(a.status)}>{statusLabel(a.status)}</Badge>
                          </div>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {(a.adkar_tags || []).map(t => <Badge key={t} color={ADKAR_C[t]}>{t}</Badge>)}
                            {a.due_date && <Badge color={T.textMut}>📅 {fmtDate(a.due_date)}</Badge>}
                            {ow && <Badge color={T.success}>👤 {ow.name}</Badge>}
                            {supps.map(s => <Badge key={s.id} color={T.accent}>👍 {s.name}</Badge>)}
                            {opps.map(s => <Badge key={s.id} color={T.danger}>👎 {s.name}</Badge>)}
                            {(a.impact_item_ids || []).map(iid => { const im = iIM.find(x => x.id === iid); return im ? <Badge key={iid} color={T.purple}>⚡ {im.change_description?.slice(0,20)}</Badge> : null; })}
                          </div>
                        </div>
                        <Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => d.actions = d.actions.filter(x => x.id !== a.id)); }}>✕</Btn>
                      </div>
                    </Card>
                  );
                })}
                <div style={{ marginTop: 10 }}><Btn v="default" small onClick={openNew}>＋ Weitere Maßnahme hinzufügen</Btn></div>
              </div>
            ))}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Maßnahme bearbeiten" : "Neue Maßnahme"} wide>
              <div style={S.formGrid}>
                <Input label="Titel" value={f.title} onChange={v => sF(p => ({ ...p, title: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Typ(en) – frei anlegbar" tags={f.typeTags} onChange={v => sF(p => ({ ...p, typeTags: v }))} suggestions={tags.actionTypes} color={T.cyan} /></div>
                <Input label="Owner" value={f.owner_person_id} onChange={v => sF(p => ({ ...p, owner_person_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Fällig am" value={f.due_date} onChange={v => sF(p => ({ ...p, due_date: v }))} type="date" />
                <Input label="Status" value={f.status} onChange={v => sF(p => ({ ...p, status: v }))} options={[{value:"planned",label:"Geplant"},{value:"in_progress",label:"In Arbeit"},{value:"done",label:"Fertig"}]} />
                <div />
                <LinkSelect label="Supporter" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={f.supporter_ids} onChange={v => sF(p => ({ ...p, supporter_ids: v }))} color={T.success} />
                <LinkSelect label="Gegner" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={f.opponent_ids} onChange={v => sF(p => ({ ...p, opponent_ids: v }))} color={T.danger} />
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Impacts" options={iIM.map(im => ({ value: im.id, label: (im.change_description || im.id).slice(0, 50) }))} selected={f.impact_item_ids || []} onChange={v => sF(p => ({ ...p, impact_item_ids: v }))} color={T.purple} /></div>
              </div>
              <div style={{ marginTop: 14 }}><label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>ADKAR-Tags</label><div style={{ display: "flex", gap: 5, marginTop: 6 }}>{ADKAR.map(a => <button key={a} onClick={() => togA(a)} style={{ padding: "5px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5, fontFamily: T.font, fontWeight: 600, background: f.adkar_tags.includes(a) ? ADKAR_C[a] + "20" : T.bg, color: f.adkar_tags.includes(a) ? ADKAR_C[a] : T.textMut, outline: f.adkar_tags.includes(a) ? `2px solid ${ADKAR_C[a]}` : "none" }}>{a}</button>)}</div></div>
              <div style={{ marginTop: 14 }}><label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Zielgruppen</label><div style={{ display: "flex", gap: 5, marginTop: 6, flexWrap: "wrap" }}>{iTG.map(tg => <button key={tg.id} onClick={() => togT(tg.id)} style={{ padding: "5px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5, fontFamily: T.font, fontWeight: 600, background: f.target_group_ids.includes(tg.id) ? T.accentLt : T.bg, color: f.target_group_ids.includes(tg.id) ? T.accent : T.textMut }}>{tg.name}</button>)}</div></div>
              <Btn v="primary" onClick={save} style={{ marginTop: 20 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── BUDGET TRACKER ───────────────────────────────────────────────
      const BudgetSub = () => {
        const [showModal, setShowModal] = useState(false);
        const [editBudgetId, setEditBudgetId] = useState(null);
        const BUDGET_CATS = ["Personal", "Tools", "Training", "Kommunikation", "Sonstiges"];
        const emptyBF = { bezeichnung: "", kategorie: "Personal", geplant: "", ist: "", notizen: "" };
        const [bf, setBF] = useState(emptyBF);

        const budgetItems = (ini && ini.budgetItems) ? ini.budgetItems : [];

        const saveBudgetItem = () => {
          if (!bf.bezeichnung) return;
          if (editBudgetId) {
            up(d => {
              const initiative = d.initiatives.find(x => x.id === sel);
              if (initiative) {
                initiative.budgetItems = (initiative.budgetItems || []).map(item =>
                  item.id === editBudgetId
                    ? { ...item, bezeichnung: bf.bezeichnung, kategorie: bf.kategorie, geplant: Number(bf.geplant) || 0, ist: Number(bf.ist) || 0, notizen: bf.notizen }
                    : item
                );
              }
            });
          } else {
            up(d => {
              const initiative = d.initiatives.find(x => x.id === sel);
              if (initiative) {
                if (!initiative.budgetItems) initiative.budgetItems = [];
                initiative.budgetItems = [...initiative.budgetItems, { id: uid("BUD-"), bezeichnung: bf.bezeichnung, kategorie: bf.kategorie, geplant: Number(bf.geplant) || 0, ist: Number(bf.ist) || 0, notizen: bf.notizen }];
              }
            });
          }
          setBF(emptyBF);
          setEditBudgetId(null);
          setShowModal(false);
        };

        const openEditBudget = (item) => {
          setEditBudgetId(item.id);
          setBF({ bezeichnung: item.bezeichnung, kategorie: item.kategorie || "Personal", geplant: String(item.geplant || ""), ist: String(item.ist || ""), notizen: item.notizen || "" });
          setShowModal(true);
        };

        const openNewBudget = () => {
          setEditBudgetId(null);
          setBF(emptyBF);
          setShowModal(true);
        };

        const deleteBudgetItem = (id) => {
          up(d => {
            const initiative = d.initiatives.find(x => x.id === sel);
            if (initiative) {
              initiative.budgetItems = (initiative.budgetItems || []).filter(item => item.id !== id);
            }
          });
        };

        const totalGeplant = budgetItems.reduce((s, item) => s + (Number(item.geplant) || 0), 0);
        const totalIst = budgetItems.reduce((s, item) => s + (Number(item.ist) || 0), 0);
        const totalDiff = totalIst - totalGeplant;
        const overBudget = totalIst > totalGeplant && totalGeplant > 0;

        // PT summary from actions (preserved from original)
        const totalPlanned = iAC.reduce((s, a) => s + (Number(a.planned_days) || 0), 0);
        const totalActual = iAC.reduce((s, a) => s + (Number(a.actual_days) || 0), 0);
        const pct = totalPlanned ? Math.round(Math.min(200, totalActual / totalPlanned * 100)) : 0;
        const ptOverBudget = totalActual > totalPlanned && totalPlanned > 0;

        const fmtEur = v => Number(v || 0).toLocaleString("de-DE") + " €";

        return (
          <div style={{ marginTop: 20 }}>
            {/* PT Summary Cards */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 20 }}>
              <Card style={{ padding: 16, borderTop: `4px solid ${T.accent}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Geplante Personentage</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: T.accent }}>{totalPlanned}</div>
                <div style={{ fontSize: 11, color: T.textMut }}>PT gesamt</div>
              </Card>
              <Card style={{ padding: 16, borderTop: `4px solid ${ptOverBudget ? T.danger : T.success}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Tatsächliche Personentage</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: ptOverBudget ? T.danger : T.success }}>{totalActual}</div>
                {ptOverBudget && <div style={{ fontSize: 11, color: T.danger }}>+{totalActual - totalPlanned} PT Überschreitung</div>}
              </Card>
              <Card style={{ padding: 16, borderTop: `4px solid ${ptOverBudget ? T.danger : T.warn}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Auslastung</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: ptOverBudget ? T.danger : T.warn }}>{pct}%</div>
                <div style={{ background: T.bg, borderRadius: 4, height: 6, marginTop: 6 }}><div style={{ width: `${Math.min(100, pct)}%`, height: "100%", background: ptOverBudget ? T.danger : T.success, borderRadius: 4 }} /></div>
              </Card>
            </div>

            {/* Budget Items Section */}
            <Card style={{ marginBottom: 20 }}>
              <div style={{ ...S.rowBetween, marginBottom: 16 }}>
                <SectionHead>Budgetposten</SectionHead>
                <Btn v="primary" small onClick={openNewBudget}>＋ Budgetposten hinzufügen</Btn>
              </div>
              {budgetItems.length === 0 ? (
                <Empty icon="💰" title="Keine Budgetposten" sub={"F\u00fcge oben rechts einen Budgetposten hinzu, um das Budget zu verwalten"} />
              ) : (
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ background: T.bg }}>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Bezeichnung</th>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Kategorie</th>
                    <th style={{ padding: "8px 10px", textAlign: "right", fontWeight: 600, color: T.textSec }}>Geplant (€)</th>
                    <th style={{ padding: "8px 10px", textAlign: "right", fontWeight: 600, color: T.textSec }}>Ist (€)</th>
                    <th style={{ padding: "8px 10px", textAlign: "right", fontWeight: 600, color: T.textSec }}>Differenz</th>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Notizen</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}></th>
                  </tr></thead>
                  <tbody>
                    {budgetItems.map((item, i) => {
                      const diff = (Number(item.ist) || 0) - (Number(item.geplant) || 0);
                      return (
                        <tr key={item.id} style={{ borderTop: `1px solid ${T.borderLight}`, background: i % 2 ? T.bg + "66" : "transparent" }}>
                          <td style={{ padding: "7px 10px", fontWeight: 500 }}>{item.bezeichnung}</td>
                          <td style={{ padding: "7px 10px" }}><Badge color={T.accent}>{item.kategorie}</Badge></td>
                          <td style={{ padding: "7px 10px", textAlign: "right" }}>{fmtEur(item.geplant)}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right" }}>{fmtEur(item.ist)}</td>
                          <td style={{ padding: "7px 10px", textAlign: "right", color: diff > 0 ? T.danger : diff < 0 ? T.success : T.textMut, fontWeight: diff !== 0 ? 700 : 400 }}>{diff > 0 ? `+${diff.toLocaleString("de-DE")} €` : diff < 0 ? `${diff.toLocaleString("de-DE")} €` : "–"}</td>
                          <td style={{ padding: "7px 10px", color: T.textSec, maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.notizen || "–"}</td>
                          <td style={{ padding: "7px 10px", textAlign: "center" }}>
                            <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
                              <Btn small v="ghost" onClick={() => openEditBudget(item)}>✏️</Btn>
                              <Btn small v="danger" onClick={() => deleteBudgetItem(item.id)}>🗑️</Btn>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot><tr style={{ borderTop: `2px solid ${T.border}`, fontWeight: 700, background: T.bg }}>
                    <td style={{ padding: "8px 10px" }} colSpan={2}>Gesamt</td>
                    <td style={{ padding: "8px 10px", textAlign: "right" }}>{fmtEur(totalGeplant)}</td>
                    <td style={{ padding: "8px 10px", textAlign: "right", color: overBudget ? T.danger : T.success }}>{fmtEur(totalIst)}</td>
                    <td style={{ padding: "8px 10px", textAlign: "right", color: overBudget ? T.danger : T.success, fontWeight: 700 }}>{totalDiff > 0 ? `+${totalDiff.toLocaleString("de-DE")} €` : totalDiff < 0 ? `${totalDiff.toLocaleString("de-DE")} €` : "–"}</td>
                    <td colSpan={2} />
                  </tr></tfoot>
                </table>
              )}
            </Card>

            {/* PT Budget Table from Actions */}
            <Card>
              <SectionHead>Maßnahmen-Budget <span style={{ fontWeight: 400, color: T.textMut }}>(Klick auf Zahl → bearbeiten)</span></SectionHead>
              {iAC.length === 0 ? <Empty icon="📋" title="Keine Maßnahmen" sub="" /> : (
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ background: T.bg }}>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Maßnahme</th>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Status</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Geplant (PT)</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Aktuell (PT)</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Differenz</th>
                  </tr></thead>
                  <tbody>
                    {iAC.map((a, i) => {
                      const pl = Number(a.planned_days) || 0, ac2 = Number(a.actual_days) || 0, diff = ac2 - pl;
                      return (
                        <tr key={a.id} style={{ borderTop: `1px solid ${T.borderLight}`, background: i % 2 ? T.bg + "66" : "transparent" }}>
                          <td style={{ padding: "7px 10px", fontWeight: 500 }}>{a.title}</td>
                          <td style={{ padding: "7px 10px" }}><Badge color={statusColor(a.status)}>{statusLabel(a.status)}</Badge></td>
                          <td style={{ padding: "7px 10px", textAlign: "center" }}><EditCell value={String(pl || "")} onChange={v => upE("actions", a.id, "planned_days", Number(v) || 0)} /></td>
                          <td style={{ padding: "7px 10px", textAlign: "center" }}><EditCell value={String(ac2 || "")} onChange={v => upE("actions", a.id, "actual_days", Number(v) || 0)} /></td>
                          <td style={{ padding: "7px 10px", textAlign: "center", color: diff > 0 ? T.danger : diff < 0 ? T.success : T.textMut, fontWeight: diff !== 0 ? 700 : 400 }}>{diff > 0 ? `+${diff}` : diff < 0 ? String(diff) : "–"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot><tr style={{ borderTop: `2px solid ${T.border}`, fontWeight: 700, background: T.bg }}>
                    <td style={{ padding: "8px 10px" }}>Gesamt</td><td />
                    <td style={{ padding: "8px 10px", textAlign: "center" }}>{totalPlanned}</td>
                    <td style={{ padding: "8px 10px", textAlign: "center", color: ptOverBudget ? T.danger : T.success }}>{totalActual}</td>
