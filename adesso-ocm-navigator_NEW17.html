      };

      // ─── OPMODEL (Operating Model) ────────────────────────────────────
      const OpmodelView = () => {
        const [showRaci, setShowRaci] = useState(false);
        const [showRisk, setShowRisk] = useState(false);
        const [showDec, setShowDec] = useState(false);
        const [fRaci, setFRaci] = useState({ activity: "", responsible_ids: [], accountable_id: "", consulted_ids: [], informed_ids: [], action_ids: [] });
        const [fRisk, setFRisk] = useState({ title: "", probability: 3, impact: 3, mitigation: "", owner: "", status: "open" });
        const [fDec, setFDec] = useState({ title: "", date: today(), decided_by: "", impact: "", notes: "" });
        if (!ini) return <Empty icon={"\u2699\uFE0F"} title={"Kein Projekt gew\u00e4hlt"} sub="" />;
        const emptyRaci = { activity: "", responsible_ids: [], accountable_id: "", consulted_ids: [], informed_ids: [], action_ids: [] };
        const saveRaci = () => {
          if (!fRaci.activity) return;
          up(d => { if (!d.raciItems) d.raciItems = []; d.raciItems.push({ id: uid("RACI-"), initiative_id: sel, ...fRaci }); });
          setFRaci(emptyRaci); setShowRaci(false);
        };
        const shName = id => { const s = iSH.find(x => x.id === id); return s ? s.name : "?"; };
        const shNames = ids => (ids || []).map(id => shName(id)).filter(n => n !== "?").join(", ") || "\u2013";
        const togRaciSH = (field, id) => setFRaci(p => ({ ...p, [field]: (p[field] || []).includes(id) ? p[field].filter(x => x !== id) : [...(p[field] || []), id] }));
        const togRaciAC = id => setFRaci(p => ({ ...p, action_ids: (p.action_ids || []).includes(id) ? p.action_ids.filter(x => x !== id) : [...(p.action_ids || []), id] }));
        const saveRisk = () => {
          if (!fRisk.title) return;
          up(d => { if (!d.changeRisks) d.changeRisks = []; d.changeRisks.push({ id: uid("CR-"), initiative_id: sel, ...fRisk, probability: Number(fRisk.probability), impact: Number(fRisk.impact) }); });
          setFRisk({ title: "", probability: 3, impact: 3, mitigation: "", owner: "", status: "open" }); setShowRisk(false);
        };
        const riskScore = r => (r.probability || 0) * (r.impact || 0);
        const riskColor = r => { const s = riskScore(r); return s >= 20 ? T.danger : s >= 10 ? T.warn : T.success; };
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Entscheidungen & Risiken</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} {"\u2013"} Entscheidungen, RACI & Change-Risiken</p>
            </div>
            <Card style={{ marginBottom: 20 }}>
              <SectionHead>Entscheidungen ({iDEC.length})</SectionHead>
              {iDEC.length === 0 ? <Empty icon={"📝"} title="Keine Entscheidungen" sub="Dokumentiere wichtige Projektentscheidungen" action={<Btn v="primary" onClick={() => setShowDec(true)}>{"\uFF0B"} Entscheidung dokumentieren</Btn>} /> : (<>
                <DataTable headers={["Datum", "Entscheidung", "Entscheider", "Auswirkung", ""]}>
                  {iDEC.map(d => (
                    <tr key={d.id} style={{ borderBottom: `1px solid ${T.borderLight}` }}>
                      <td style={S.tdCell}>{fmtDate(d.date)}</td>
                      <td style={{ ...S.tdCell, fontWeight: 500 }}>{d.title}</td>
                      <td style={S.tdCell}>{d.decided_by}</td>
                      <td style={{ ...S.tdCell, fontSize: 11, color: T.textSec }}>{d.impact}</td>
                      <td style={S.tdCell}><Btn v="ghost" small onClick={() => up(dd => dd.decisions = (dd.decisions || []).filter(x => x.id !== d.id))}>✕</Btn></td>
                    </tr>
                  ))}
                </DataTable>
                <div style={{ textAlign: "center", paddingTop: 10 }}><Btn v="ghost" onClick={() => setShowDec(true)}>{"\uFF0B"} Weitere Entscheidung</Btn></div>
              </>)}
            </Card>
            <Modal open={showDec} onClose={() => setShowDec(false)} title="Entscheidung dokumentieren">
              <div style={S.formGrid}>
                <Input label="Entscheidung" value={fDec.title} onChange={v => setFDec(p => ({...p, title: v}))} style={{ gridColumn: "1/-1" }} />
                <Input label="Datum" value={fDec.date} onChange={v => setFDec(p => ({...p, date: v}))} type="date" />
                <Input label="Entscheider" value={fDec.decided_by} onChange={v => setFDec(p => ({...p, decided_by: v}))} placeholder="z.B. Sponsor, PL" />
                <Input label="Auswirkung" value={fDec.impact} onChange={v => setFDec(p => ({...p, impact: v}))} textarea style={{ gridColumn: "1/-1" }} placeholder={"Was bedeutet diese Entscheidung f\u00fcr das Projekt?"} />
                <Input label="Notizen" value={fDec.notes} onChange={v => setFDec(p => ({...p, notes: v}))} textarea style={{ gridColumn: "1/-1" }} />
              </div>
              <Btn v="primary" onClick={() => { if (!fDec.title) return; up(d => { if (!d.decisions) d.decisions = []; d.decisions.push({ id: uid("DEC-"), initiative_id: sel, ...fDec }); }); setFDec({ title: "", date: today(), decided_by: "", impact: "", notes: "" }); setShowDec(false); }} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Card style={{ marginBottom: 14 }}>
              <SectionHead>{"RACI-Matrix (" + iRACI.length + " Aktivit\u00e4ten)"}</SectionHead>
              {iRACI.length === 0 ? <Empty icon="📊" title="Keine RACI-Eintr\u00e4ge" sub="Kl\u00e4re Verantwortlichkeiten" action={<Btn v="primary" onClick={() => setShowRaci(true)}>RACI-Eintrag anlegen</Btn>} /> : (<>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead>
                      <tr>
                        {["Aktivit\u00e4t","Verkn. Ma\u00dfnahmen","R \u2013 Responsible","A \u2013 Accountable","C \u2013 Consulted","I \u2013 Informed",""].map(h => (
                          <th key={h} style={{ padding: "6px 10px", textAlign: "left", fontWeight: 700, color: T.textMut, background: T.bg, borderBottom: `1px solid ${T.border}`, fontSize: 11 }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {iRACI.map(r => (
                        <tr key={r.id}>

                              <span style={{ position: "absolute", top: 1, left: 2, fontSize: 8, color: bc, fontWeight: 700 }}>{score}</span>
                              {risksHere.map(r => (
                                <div key={r.id} title={`${r.title} (W=${r.probability}, A=${r.impact})`} style={{ width: 16, height: 16, borderRadius: "50%", background: riskColor(r), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 7, fontWeight: 700, color: "#fff", cursor: "default", overflow: "hidden" }}>

                            <Badge color={riskColor(r)}>Score {riskScore(r)}</Badge>

            <Modal open={showRaci} onClose={() => setShowRaci(false)} title="RACI-Eintrag anlegen" wide>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <Input label={"Aktivit\u00e4t / Aufgabe"} value={fRaci.activity} onChange={v => setFRaci(p => ({ ...p, activity: v }))} />

                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Verkn{"\u00fc"}pfte Ma{"\u00df"}nahmen (Mehrfachauswahl)</label>

                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>I {"\u2013"} Informed (Informiert, Mehrfachauswahl)</label>
                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
                    {iSH.length === 0 ? <span style={{ fontSize: 11, color: T.textMut }}>Keine Stakeholder vorhanden</span> : iSH.map(s => <button key={s.id} onClick={() => togRaciSH("informed_ids", s.id)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontFamily: T.font, fontWeight: 600, background: (fRaci.informed_ids || []).includes(s.id) ? "#f3f4f6" : T.bg, color: (fRaci.informed_ids || []).includes(s.id) ? T.text : T.textMut }}>{s.name}</button>)}

      // ─── ADOPTION (Adoption & Reife) ──────────────────────────────────
      const AdoptionView = () => {
        const [showLearn, setShowLearn] = useState(false);
        const [fLearn, setFLearn] = useState({ title: "", type: "e-learning", url: "", duration: "", audience: "", notes: "" });
        const saveLearn = () => {
          if (!fLearn.title) return;
          up(d => { if (!d.learningItems) d.learningItems = []; d.learningItems.push({ id: uid("LI-"), ...fLearn }); });
          setFLearn({ title: "", type: "e-learning", url: "", duration: "", audience: "", notes: "" }); setShowLearn(false);
        };
        const mat = data.maturityAssessment || emptyD().maturityAssessment;
        const learns = data.learningItems || [];
        const MATURITY_DIMS = [
          { key: "strategy", label: "Change-Strategie" },
          { key: "leadership", label: "Führungsaktivierung" },
          { key: "comms", label: "Kommunikation" },
          { key: "training", label: "Training & Befähigung" },
          { key: "measurement", label: "Wirkungsmessung" },
          { key: "sustainability", label: "Nachhaltigkeit" },
        ];
        const getScore = key => {
          const dim = (mat.dimensions || []).find(d => d.key === key);
          return dim ? dim.score : 0;
        };
        const setScore = (key, val) => {
          up(d => {
            if (!d.maturityAssessment) d.maturityAssessment = { date: null, dimensions: [], overall_score: 0 };
            const dims = d.maturityAssessment.dimensions || [];
            const existing = dims.find(x => x.key === key);
            if (existing) existing.score = val;
            else dims.push({ key, score: val });
            d.maturityAssessment.dimensions = dims;
            const scores = MATURITY_DIMS.map(dm => (dims.find(x => x.key === dm.key)?.score || 0));
            d.maturityAssessment.overall_score = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
            d.maturityAssessment.date = today();
          });
        };
        const overallScore = mat.overall_score || 0;
        const matLevel = overallScore >= 8 ? "Optimiert" : overallScore >= 6 ? "Definiert" : overallScore >= 3 ? "Entwickelt" : "Initial";
        const matColor = overallScore >= 8 ? T.success : overallScore >= 6 ? T.accent : overallScore >= 3 ? T.warn : T.danger;
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Adoption & Reife</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>OCM-Reifegrad & Lernpfade</p>
            </div>
            <div style={{ ...S.formGrid, marginBottom: 20 }}>
              <Card style={{ borderTop: `4px solid ${matColor}` }}>
                <SectionHead>OCM-Reifegrad Gesamt</SectionHead>
                <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 16 }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 42, fontWeight: 700, color: matColor, lineHeight: 1 }}>{overallScore}</div>
                    <div style={{ fontSize: 12, color: T.textMut }}>von 10</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: matColor }}>{matLevel}</div>
                    {mat.date && <div style={{ fontSize: 11, color: T.textMut }}>Zuletzt bewertet: {fmtDate(mat.date)}</div>}
                  </div>
                </div>
                <div style={{ background: T.bg, borderRadius: 6, height: 10, overflow: "hidden" }}>
                  <div style={{ width: `${overallScore * 10}%`, height: "100%", background: `linear-gradient(90deg,${matColor},${T.accent})`, borderRadius: 6, transition: "width 0.3s" }} />
                </div>
              </Card>
              <Card>
                <SectionHead>Dimensionen-Bewertung</SectionHead>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {MATURITY_DIMS.map(dm => {
                    const sc = getScore(dm.key);
                    const c = sc >= 7 ? T.success : sc >= 4 ? T.warn : T.danger;
                    return (
                      <div key={dm.key}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                          <span style={{ fontWeight: 600 }}>{dm.label}</span>
                          <div style={{ display: "flex", gap: 2 }}>
                            {[0,2,4,6,8,10].map(v => <Btn key={v} small v={sc === v ? "primary" : "default"} onClick={() => setScore(dm.key, v)} style={{ padding: "1px 5px", fontSize: 10 }}>{v}</Btn>)}
                          </div>
                        </div>
                        <div style={{ background: T.bg, borderRadius: 3, height: 5 }}><div style={{ width: `${sc * 10}%`, height: "100%", background: c, borderRadius: 3, transition: "width 0.3s" }} /></div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>
            <Card style={{ marginBottom: 20 }}>
              <SectionHead>🕸️ Reifegrad-Radar</SectionHead>
              <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 32, padding: "8px 0", flexWrap: "wrap" }}>
                <RadarChart labels={MATURITY_DIMS.map(d => d.label)} values={MATURITY_DIMS.map(d => getScore(d.key) / 10)} color={matColor} size={260} />
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {MATURITY_DIMS.map(dm => { const sc = getScore(dm.key); const c = sc >= 7 ? T.success : sc >= 4 ? T.warn : T.danger; return (<div key={dm.key} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}><div style={{ width: 10, height: 10, borderRadius: "50%", background: c, flexShrink: 0 }} /><span style={{ minWidth: 155 }}>{dm.label}</span><span style={{ fontWeight: 700, color: c }}>{sc}/10</span></div>); })}
                </div>
              </div>
            </Card>
            <Card>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <SectionHead>Lerninhalte & Onboarding ({learns.length})</SectionHead>
              </div>
              {learns.length === 0 ? <Empty icon="🎓" title="Keine Lerninhalte" sub="F\u00fcge E-Learnings, Guides und Workshops hinzu" action={<Btn v="primary" onClick={() => setShowLearn(true)}>Lerninhalt anlegen</Btn>} /> : (
                <><div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))", gap: 12 }}>
                  {learns.map(l => (
                    <Card key={l.id} style={{ padding: 14 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{l.title}</div>
                          <Badge color={T.purple} style={{ marginTop: 3 }}>{l.type}</Badge>
                        </div>
                        <Btn v="ghost" small onClick={() => up(d => { d.learningItems = (d.learningItems || []).filter(x => x.id !== l.id); })}>✕</Btn>
                      </div>
                      {l.audience && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Zielgruppe: {l.audience}</div>}
                      {l.duration && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>⏱ {l.duration}</div>}
                      {l.url && <a href={l.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 12, color: T.accent }}>🔗 Link öffnen</a>}
                      {l.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{l.notes}</div>}
                    </Card>
                  ))}
                </div>
                <div style={{ textAlign: "center", paddingTop: 12 }}>
                  <Btn v="ghost" onClick={() => setShowLearn(true)}>{"\uFF0B"} Weiteren Lerninhalt hinzuf{"\u00fc"}gen</Btn>
                </div>
                </>
              )}
            </Card>
            <Modal open={showLearn} onClose={() => setShowLearn(false)} title="Lerninhalt anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Titel" value={fLearn.title} onChange={v => setFLearn(p => ({ ...p, title: v }))} />
                <Input label="Typ" value={fLearn.type} onChange={v => setFLearn(p => ({ ...p, type: v }))} options={["e-learning","video","guide","workshop","webinar","podcast","article"]} />
                <Input label="Zielgruppe" value={fLearn.audience} onChange={v => setFLearn(p => ({ ...p, audience: v }))} />
                <Input label="Dauer" value={fLearn.duration} onChange={v => setFLearn(p => ({ ...p, duration: v }))} />
                <Input label="URL / Link" value={fLearn.url} onChange={v => setFLearn(p => ({ ...p, url: v }))} />
                <Input label="Notizen" value={fLearn.notes} onChange={v => setFLearn(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveLearn} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── CM PROFILE VIEW ──────────────────────────────────────────────
      const CMProfileView = () => {
        const CM_COMP_DIMS = [
          { key: "strategy", label: "Change-Strategie" },
          { key: "leadership", label: "Führungsaktivierung" },
          { key: "comms", label: "Kommunikation" },
          { key: "training", label: "Training & Befähigung" },
          { key: "measurement", label: "Wirkungsmessung" },
          { key: "sustainability", label: "Nachhaltigkeit" },
        ];
        const emptyP = { name: "", role: "Change Manager", initials: "", email: "", focus_areas: [], bio: "", competencies: {}, projects: [], linked_initiatives: [] };
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [f, sF] = useState(emptyP);
        const [detail, setDetail] = useState(null);
        const [projInput, setProjInput] = useState({ name: "", year: "", role: "", outcome: "" });
        const profiles = data.cmProfiles || [];
        const setComp = (key, val) => sF(p => ({ ...p, competencies: { ...p.competencies, [key]: val } }));
        const addProject = () => { if (!projInput.name) return; sF(p => ({ ...p, projects: [...p.projects, { id: uid("PR-"), ...projInput }] })); setProjInput({ name: "", year: "", role: "", outcome: "" }); };
        const open = () => { setEditId(null); sF(emptyP); setShow(true); };
        const openEdit = prof => { setEditId(prof.id); sF({ name: prof.name, role: prof.role || "Change Manager", initials: prof.initials || "", email: prof.email || "", focus_areas: prof.focus_areas || [], bio: prof.bio || "", competencies: { ...prof.competencies }, projects: [...(prof.projects || [])], linked_initiatives: prof.linked_initiatives || [] }); setShow(true); };
        const save = () => {
          if (!f.name) return;
          const rec = { ...f, initials: f.initials || f.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() };
          if (editId) { up(d => { const p = (d.cmProfiles || []).find(x => x.id === editId); if (p) Object.assign(p, rec); }); }
          else { up(d => { if (!d.cmProfiles) d.cmProfiles = []; d.cmProfiles.push({ id: uid("CMP-"), ...rec }); }); }
          setShow(false); setEditId(null);
        };
        const del = id => up(d => { d.cmProfiles = (d.cmProfiles || []).filter(x => x.id !== id); });
        const avgComp = comps => { const vals = Object.values(comps || {}); return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0; };
        const compColor = v => v >= 8 ? T.success : v >= 5 ? T.accent : T.warn;
        const AVATAR_COLORS = [T.adessoBlau, T.purple, T.cyan, T.pink, "#8b5e3c", "#2d6a4f"];
        return (
          <div>
            <div style={{ marginBottom: 24 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Profile</h2>
              <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Kompetenzprofile & Projektreferenzen der Change-Manager</p>
            </div>
            {profiles.length === 0 ? (
              <Empty icon="🧑‍💼" title="Noch keine Profile" sub="Lege das erste Kompetenzprofil an" action={<Btn v="primary" onClick={open}>Profil anlegen</Btn>} />
            ) : (<>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 16 }}>
                {profiles.map((prof, idx) => {
                  const avg = avgComp(prof.competencies);
                  const avatarColor = AVATAR_COLORS[idx % AVATAR_COLORS.length];
                  return (
                    <Card key={prof.id} style={{ cursor: "pointer", borderTop: `4px solid ${avatarColor}` }} onClick={() => setDetail(prof)}>
                      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
                        <div style={{ width: 48, height: 48, borderRadius: "50%", background: avatarColor, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, fontWeight: 700, flexShrink: 0 }}>{prof.initials || "CM"}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: 14, color: T.text }}>{prof.name}</div>
                          <div style={{ fontSize: 11.5, color: T.textMut }}>{prof.role}</div>
                          {prof.email && <div style={{ fontSize: 11, color: T.accent, marginTop: 2 }}>{prof.email}</div>}
                        </div>
                        <div style={{ textAlign: "center" }}>
                          <div style={{ fontSize: 22, fontWeight: 700, color: compColor(avg) }}>{avg}</div>
                          <div style={{ fontSize: 9, color: T.textMut }}>Ø Komp.</div>
                        </div>
                      </div>
                      {/* Competency mini-bars */}
                      <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 12 }}>
                        {CM_COMP_DIMS.map(dim => {
                          const val = (prof.competencies || {})[dim.key] || 0;
                          const c = compColor(val);
                          return (
                            <div key={dim.key} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11 }}>
                              <span style={{ width: 130, color: T.textMut, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{dim.label}</span>
                              <div style={{ flex: 1, background: T.bg, borderRadius: 3, height: 6 }}><div style={{ width: `${val * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                              <span style={{ width: 18, textAlign: "right", fontWeight: 600, color: c, fontSize: 10 }}>{val}</span>
                            </div>
                          );
                        })}
                      </div>
                      {/* Focus areas */}
                      {(prof.focus_areas || []).length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
                          {prof.focus_areas.map(fa => <Badge key={fa} color={T.purple}>{fa}</Badge>)}
                        </div>
                      )}
                      {/* Project references */}
                      <div style={{ fontSize: 11, color: T.textMut }}>📁 {(prof.projects || []).length} Projektreferenz{(prof.projects || []).length !== 1 ? "en" : ""}</div>
                      {(prof.linked_initiatives || []).length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6 }}>
                          {(prof.linked_initiatives || []).map(iid => { const ini2 = data.initiatives.find(x => x.id === iid); return ini2 ? <Badge key={iid} color={T.accent}>{ini2.name}</Badge> : null; })}
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                        <Btn small v="default" onClick={e => { e.stopPropagation(); openEdit(prof); }}>✏️ Bearbeiten</Btn>
                        <Btn small v="ghost" onClick={e => { e.stopPropagation(); del(prof.id); }}>✕</Btn>
                      </div>
                    </Card>
                  );
                })}
              </div>
              <div style={{ textAlign: "center", paddingTop: 16 }}>
                <Btn v="ghost" onClick={open}>{"\uFF0B"} Weiteres Profil anlegen</Btn>
              </div>
            </>)}
            {/* Detail Modal */}
            <Modal open={!!detail} onClose={() => setDetail(null)} title={detail?.name || ""} wide>
              {detail && (() => {
                const avg = avgComp(detail.competencies);
                return (
                  <div>
                    {detail.bio && <p style={{ fontSize: 13, color: T.textSec, margin: "0 0 16px", lineHeight: 1.6 }}>{detail.bio}</p>}
                    <div style={{ ...S.formGrid, marginBottom: 20 }}>
                      <Card style={{ padding: 14 }}>
                        <SectionHead>Kompetenzprofil (Ø {avg}/10)</SectionHead>
                        {CM_COMP_DIMS.map(dim => {
                          const val = (detail.competencies || {})[dim.key] || 0;
                          const c = compColor(val);
                          return (
                            <div key={dim.key} style={{ marginBottom: 8 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                                <span>{dim.label}</span><span style={{ fontWeight: 700, color: c }}>{val}/10</span>
                              </div>
                              <div style={{ background: T.bg, borderRadius: 3, height: 7 }}><div style={{ width: `${val * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                            </div>
                          );
                        })}
                      </Card>
                      <Card style={{ padding: 14 }}>
                        <SectionHead>Projektreferenzen ({(detail.projects || []).length})</SectionHead>
                        {(detail.projects || []).length === 0 ? <div style={{ fontSize: 12, color: T.textMut }}>Keine Referenzen</div> : (
                          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                            {(detail.projects || []).map(p => (
                              <div key={p.id} style={{ padding: "8px 10px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${T.accent}` }}>
                                <div style={{ fontWeight: 600, fontSize: 12 }}>{p.name} <span style={{ fontWeight: 400, color: T.textMut }}>({p.year})</span></div>
                                {p.role && <div style={{ fontSize: 11, color: T.textSec }}>{p.role}</div>}
                                {p.outcome && <div style={{ fontSize: 11, color: T.success, marginTop: 2 }}>✓ {p.outcome}</div>}
                              </div>
                            ))}
                          </div>
                        )}
                      </Card>
                    </div>
                    {(detail.focus_areas || []).length > 0 && (
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {detail.focus_areas.map(fa => <Badge key={fa} color={T.purple}>{fa}</Badge>)}
                      </div>
                    )}
                  </div>
                );
              })()}
            </Modal>
            {/* Create/Edit Modal */}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Profil bearbeiten" : "Neues Profil"} wide>
              <div style={S.formGrid}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <Input label="Rolle/Titel" value={f.role} onChange={v => sF(p => ({ ...p, role: v }))} />
                <Input label="Kürzel (2–3 Buchstaben)" value={f.initials} onChange={v => sF(p => ({ ...p, initials: v.toUpperCase().slice(0, 3) }))} />
                <Input label="E-Mail" value={f.email} onChange={v => sF(p => ({ ...p, email: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Schwerpunkte" tags={f.focus_areas} onChange={v => sF(p => ({ ...p, focus_areas: v }))} suggestions={["ADKAR","Stakeholder-Management","Kommunikation","Training","Leadership","Kultur","Agilität","SAP","IT-Transformation"]} color={T.purple} /></div>
                <Input label="Kurzbiografie" value={f.bio} onChange={v => sF(p => ({ ...p, bio: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Verknüpfte Projekte</label>
                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
                    {data.initiatives.map(ini2 => <button key={ini2.id} onClick={() => sF(p => ({ ...p, linked_initiatives: (p.linked_initiatives || []).includes(ini2.id) ? p.linked_initiatives.filter(x => x !== ini2.id) : [...(p.linked_initiatives || []), ini2.id] }))} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontFamily: T.font, fontWeight: 600, background: (f.linked_initiatives || []).includes(ini2.id) ? T.accentLt : T.bg, color: (f.linked_initiatives || []).includes(ini2.id) ? T.accent : T.textMut }}>{ini2.name}</button>)}
                    {data.initiatives.length === 0 && <span style={{ fontSize: 11, color: T.textMut }}>Keine Projekte vorhanden</span>}
                  </div>
                </div>
                <div style={{ gridColumn: "1/-1" }}>
                  <SectionHead>Kompetenz-Bewertung (0–10)</SectionHead>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 8 }}>
                    {CM_COMP_DIMS.map(dim => (
                      <div key={dim.key}>
                        <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>{dim.label}</label>
                        <div style={{ display: "flex", gap: 3, marginTop: 4, flexWrap: "wrap" }}>
                          {[0,2,4,6,8,10].map(v => <Btn key={v} small v={(f.competencies[dim.key] || 0) === v ? "primary" : "default"} onClick={() => setComp(dim.key, v)} style={{ padding: "2px 6px", fontSize: 10 }}>{v}</Btn>)}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ gridColumn: "1/-1" }}>
                  <SectionHead>Projektreferenzen</SectionHead>
                  {f.projects.map((p, i) => (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", background: T.bg, borderRadius: T.rs, marginBottom: 6, fontSize: 12 }}>
                      <span style={{ flex: 1 }}><strong>{p.name}</strong> ({p.year}) – {p.role}</span>
                      <Btn small v="ghost" onClick={() => sF(prev => ({ ...prev, projects: prev.projects.filter((_, j) => j !== i) }))}>✕</Btn>
                    </div>
                  ))}
                  <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 6, marginTop: 8 }}>
                    <Input label="Projektname" value={projInput.name} onChange={v => setProjInput(p => ({ ...p, name: v }))} />
                    <Input label="Jahr" value={projInput.year} onChange={v => setProjInput(p => ({ ...p, year: v }))} />
                    <Input label="Meine Rolle" value={projInput.role} onChange={v => setProjInput(p => ({ ...p, role: v }))} />
                    <Input label="Ergebnis / Outcome" value={projInput.outcome} onChange={v => setProjInput(p => ({ ...p, outcome: v }))} style={{ gridColumn: "1/-1" }} />
                  </div>
                  <Btn small v="default" onClick={addProject} style={{ marginTop: 6 }}>＋ Referenz hinzufügen</Btn>
                </div>
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── RENDER ───────────────────────────────────────────────────────
      const views = { dashboard: DashboardView, portfolio: PortfolioView, initiative: InitiativeView, docs: DocsView, aktivitaetslog: AktivitaetslogView, impaktanalyse: ImpaktanalyseView, engagement: EngagementView, timeline: TimelineView, methods: MethodsView, references: ReferencesView, pdfReport: PDFReportView, io: IOView, outcomes: OutcomesView, leadership: LeadershipView, teamdev: TeamdevView, dialogue: DialogueView, kommtrain: KommTrainView, opmodel: OpmodelView, adoption: AdoptionView, cmprofile: CMProfileView };
      const V = views[nav] || DashboardView;

      return (
        <div style={{ display: "flex", minHeight: "100vh", background: T.bg, fontFamily: T.font, color: T.text, fontSize: 13.5 }}>
          <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
          <style>{`@media print { body, #root { background: #fff !important; } nav, button { display: none !important; } main { padding: 20px !important; max-height: none !important; overflow: visible !important; } [style*="min-height: 100vh"] { display: block !important; } [style*="width: 244px"], [style*="width: 250px"] { display: none !important; } } @media (max-width: 767px) { .sidebar-panel { display: none !important; } .sidebar-panel.sidebar-open { display: flex !important; position: fixed; z-index: 1000; top: 0; bottom: 0; left: 0; width: 250px; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.3); } .ham-btn { display: flex !important; } .mob-overlay { display: block !important; } main { padding-top: 60px !important; } }`}</style>
          {sidebarOpen && <div className="mob-overlay" onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, zIndex: 999, background: "rgba(0,0,0,0.4)" }} />}
          <button className="ham-btn" onClick={() => setSidebarOpen(o => !o)} style={{ display: "none", position: "fixed", top: 12, left: 12, zIndex: 1001, background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.rs, width: 38, height: 38, cursor: "pointer", fontSize: 18, alignItems: "center", justifyContent: "center", boxShadow: T.shadow }}>☰</button>
          <Sidebar />
          <main style={{ flex: 1, padding: "28px 36px", overflowY: "auto", maxHeight: "100vh" }}><V /></main>
          {toast && <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#1e293b", color: "#f1f5f9", padding: "12px 20px", borderRadius: T.r, fontSize: 13, fontWeight: 600, zIndex: 9999, display: "flex", alignItems: "center", gap: 12, boxShadow: "0 4px 20px rgba(0,0,0,0.3)", whiteSpace: "nowrap" }}>
            <span>↩️ {toast.msg}</span>
            <span style={{ fontSize: 11, opacity: 0.6 }}>Ctrl+Z für weiteres Rückgängig</span>
            <button onClick={() => setToast(null)} style={{ border: "none", background: "transparent", color: "inherit", cursor: "pointer", fontSize: 16, padding: "0 4px", lineHeight: 1 }}>×</button>
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>

</html>
