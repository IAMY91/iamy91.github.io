<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adesso OCM Navigator – Change Together</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Fira Sans', sans-serif;
      background-color: #f4f6fa;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f4f6fa;
    }

    ::-webkit-scrollbar-thumb {
      background: #887d75;
      border-radius: 3px;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      main {
        padding: 0 !important;
        overflow: visible !important;
      }

      body {
        background: #fff;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const uid = (p = "") => p + Math.random().toString(36).slice(2, 8);
    const today = () => new Date().toISOString().slice(0, 10);
    const fmtDate = d => d ? new Date(d).toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" }) : "–";
    const clamp = (v, lo = 0, hi = 10) => Math.max(lo, Math.min(hi, Number(v) || 0));
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

    // ─── adesso Corporate Design Theme ──────────────────────────────────
    const T = {
      // Primary adesso Colors
      adessoBlau: "#006ec7",
      adessoGrau: "#887d75",
      // UI Colors
      bg: "#f4f6fa", surface: "#ffffff", border: "#dcdfe5", borderLight: "#edf0f5",
      text: "#222222", textSec: "#5c6178", textMut: "#887d75",
      // Secondary / Schmuckfarben (adesso CD)
      accent: "#006ec7", accentLt: "#e6f0fa",
      success: "#76c800", successLt: "#f1fad9", // adesso Grün
      warn: "#ff9868", warnLt: "#fff4ee",       // adesso Orange
      danger: "#e74c5e", dangerLt: "#fdeef0",   // Standard red for errors
      purple: "#461ebe", cyan: "#28dcaa", pink: "#f566ba",
      shadow: "0 2px 10px rgba(0,0,0,0.05)",
      r: 4, rs: 4, font: "'Fira Sans', sans-serif",
    };

    const ADKAR = ["Awareness", "Desire", "Knowledge", "Ability", "Reinforcement"];
    const ADKAR_C = { Awareness: T.adessoBlau, Desire: T.pink, Knowledge: T.cyan, Ability: T.purple, Reinforcement: T.success };
    const DIMS = ["People", "Process", "Technology", "Org"];
    const DIM_IC = { People: "👥", Process: "⚙️", Technology: "💻", Org: "🏢" };
    const READINESS = ["supportive", "neutral", "skeptical", "resistant"];
    const TYPES = ["Comms", "Training", "Workshop", "Coaching", "Enablement", "Event", "Feedback"];
    const STATUSES = ["planned", "in_progress", "done"];
    const ROLES = ["Sponsor", "PL", "HR", "IT", "BR", "CM", "SME", "Exec"];
    const CHANNELS = ["Townhall", "E-Mail", "Teams-Chat", "Intranet", "1:1-Gespräch", "Workshop", "Newsletter", "Video", "Poster/Flyer", "Yammer/Viva"];
    const INDUSTRIES = ["IT & Software", "Finanzdienstleistungen", "Pharma & Healthcare", "Automotive", "Energie & Utilities", "Retail & E-Commerce", "Öffentlicher Sektor", "Telekommunikation", "Produktion & Industrie", "Logistik & Transport", "Beratung", "Sonstiges"];

    // ─── Score helpers (0-10) ───────────────────────────────────────────
    const scoreColor = v => { const n = Number(v) || 0; if (n >= 8) return T.danger; if (n >= 5) return T.warn; return T.success; };
    const scoreBg = v => { const n = Number(v) || 0; if (n >= 8) return T.dangerLt; if (n >= 5) return T.warnLt; return T.successLt; };
    const statusColor = s => s === "done" ? T.success : s === "in_progress" ? T.accent : T.textMut;
    const statusLabel = s => s === "done" ? "Fertig" : s === "in_progress" ? "In Arbeit" : "Geplant";
    const readyColor = r => r === "supportive" ? T.success : r === "neutral" ? T.warn : r === "skeptical" ? T.pink : T.danger;

    // ─── Methods Library ────────────────────────────────────────────────
    const METHODS = [
      {
        id: "m1", name: "Stakeholder-Interview", category: "Analyse", adkar: ["Awareness"], effort: "Niedrig", duration: "1–2h pro Person", when: "Frühphase – Bedarfsanalyse & Stimmungsbild",
        description: "Strukturierte Einzelgespräche mit Schlüssel-Stakeholdern, um Bedenken, Erwartungen und Einflussdynamiken zu verstehen.",
        bestFor: "Skeptische Stakeholder mit hohem Einfluss identifizieren und einbinden",
        steps: ["Interviewleitfaden erstellen (5-8 offene Fragen)", "Termine mit Top-Stakeholdern vereinbaren", "Interviews führen & dokumentieren", "Ergebnisse clustern & Handlungsfelder ableiten"],
        outputs: ["Stakeholder-Stimmungsbild", "Engagement-Plan", "Risiko-Landkarte"]
      },
      {
        id: "m2", name: "Impact Assessment Workshop", category: "Analyse", adkar: ["Awareness", "Knowledge"], effort: "Mittel", duration: "2–4h", when: "Frühphase – nach Scope-Definition",
        description: "Moderierter Workshop mit Fachbereichen, um konkrete Auswirkungen des Changes auf Prozesse, Rollen und Systeme zu identifizieren und zu bewerten.",
        bestFor: "Komplexe Changes mit vielen betroffenen Bereichen systematisch erfassen",
        steps: ["Teilnehmer aus allen betroffenen Bereichen einladen", "Ist-Situation pro Bereich erfassen", "Delta zum Soll identifizieren", "Impacts bewerten (Ausmaß, Kritikalität)", "Maßnahmen ableiten"],
        outputs: ["Impact-Register", "Heatmap-Daten", "Maßnahmenvorschläge"]
      },
      {
        id: "m3", name: "Sponsor Roadshow", category: "Kommunikation", adkar: ["Awareness", "Desire"], effort: "Mittel", duration: "30–60 Min je Termin", when: "Vor Go-Live – wenn Awareness & Desire aufgebaut werden müssen",
        description: "Der Sponsor besucht betroffene Teams persönlich, erklärt das Warum und beantwortet Fragen. Stärkt Vertrauen und Sichtbarkeit.",
        bestFor: "Wenn Führungskräfte-Sichtbarkeit fehlt oder Widerstand hoch ist",
        steps: ["Talking Points mit Sponsor abstimmen", "Termine in betroffenen Standorten planen", "Begleitende FAQ & Handout erstellen", "Feedback aus Sessions sammeln", "Follow-up-Maßnahmen ableiten"],
        outputs: ["Sponsor-Talking-Points", "Feedback-Zusammenfassung", "Follow-up-Tasks"]
      },
      {
        id: "m4", name: "Change Champion Netzwerk", category: "Enablement", adkar: ["Desire", "Ability", "Reinforcement"], effort: "Hoch", duration: "Laufend (Setup: 2–3 Wochen)", when: "Ab Mitte Projektphase – als Multiplikatoren für den Change",
        description: "Aufbau eines Netzwerks von Change Champions in den Fachbereichen, die als Multiplikatoren, Feedback-Kanal und lokale Unterstützer fungieren.",
        bestFor: "Große Organisationen mit verteilten Standorten, wo zentrale Kommunikation nicht reicht",
        steps: ["Champions identifizieren & ansprechen", "Rolle & Erwartungen klären", "Kick-off-Workshop durchführen", "Regelmäßige Sync-Meetings etablieren", "Champions mit Materialien & Infos versorgen", "Feedback-Schleife einrichten"],
        outputs: ["Champion-Rollenblatt", "Regelmäßige Briefings", "Feedback-Reports"]
      },
      {
        id: "m5", name: "Resistance Management Workshop", category: "Intervention", adkar: ["Desire", "Ability"], effort: "Mittel", duration: "2–3h", when: "Wenn konkreter Widerstand sichtbar wird",
        description: "Gezielter Workshop mit resistanten Stakeholdern oder deren Führungskräften, um Ursachen von Widerstand zu verstehen und gemeinsam Lösungen zu erarbeiten.",
        bestFor: "Wenn Widerstand über individuelle Gespräche hinaus eskaliert",
        steps: ["Widerstandsmuster analysieren (Ursache, Ausdruck, Quelle)", "Geeignete Teilnehmer identifizieren", "Sicheren Raum schaffen (Regeln, Moderation)", "Bedenken sammeln & clustern", "Gemeinsam Lösungen erarbeiten", "Vereinbarungen dokumentieren & nachverfolgen"],
        outputs: ["Widerstandsanalyse", "Maßnahmenplan", "Vereinbarungen"]
      },
      {
        id: "m6", name: "Training Needs Analysis", category: "Training", adkar: ["Knowledge"], effort: "Mittel", duration: "1–2 Wochen", when: "3–6 Monate vor Go-Live",
        description: "Systematische Erhebung, welche Kompetenzen aufgebaut werden müssen – nach Zielgruppe, Rolle und System-/Prozessänderung.",
        bestFor: "Wenn Technology- oder Process-Impacts hohe Training-Scores haben",
        steps: ["Soll-Kompetenzen pro Rolle ableiten", "Ist-Kompetenzen erheben (Survey/Interviews)", "Gap-Analyse durchführen", "Trainingsformate & -umfang planen", "Trainingsplan erstellen & abstimmen"],
        outputs: ["Kompetenz-Gap-Matrix", "Trainingsplan", "Ressourcenbedarf"]
      },
      {
        id: "m7", name: "Go-Live Readiness Check", category: "Transition", adkar: ["Ability", "Reinforcement"], effort: "Mittel", duration: "1–2 Wochen vor Go-Live", when: "Unmittelbar vor Go-Live",
        description: "Strukturierte Prüfung, ob Organisation, Prozesse und Menschen bereit für den Go-Live sind. Definiert No-Go-Kriterien.",
        bestFor: "Jeder Change mit fixem Go-Live-Datum und hohem Risiko",
        steps: ["Readiness-Kriterien definieren (Tech, People, Process)", "Checkliste pro Zielgruppe erstellen", "Readiness-Assessment durchführen", "Go/No-Go-Entscheidung vorbereiten", "Restrisiken & Mitigationen dokumentieren"],
        outputs: ["Readiness-Scorecard", "Go/No-Go-Empfehlung", "Risiko-Mitigationsplan"]
      },
      {
        id: "m8", name: "Post-Go-Live Sustainment", category: "Reinforcement", adkar: ["Reinforcement"], effort: "Mittel", duration: "4–12 Wochen nach Go-Live", when: "Direkt nach Go-Live",
        description: "Maßnahmenpaket, um die Nachhaltigkeit des Changes sicherzustellen: Hypercare, Feedback-Loops, Quick Wins feiern, Nachschulung.",
        bestFor: "Jeder signifikante Change – wird am häufigsten vergessen",
        steps: ["Hypercare-Plan aufsetzen (Support-Kanäle, Ansprechpartner)", "Feedback-Mechanismus einrichten", "Quick Wins identifizieren & kommunizieren", "Nachschulungsbedarf erheben & durchführen", "Lessons Learned dokumentieren", "Reinforcement-Maßnahmen für FK aufsetzen"],
        outputs: ["Hypercare-Plan", "Feedback-Report", "Lessons Learned", "Sustainment-Roadmap"]
      },
      {
        id: "m9", name: "Pulse Survey / Stimmungscheck", category: "Messung", adkar: ["Awareness", "Desire"], effort: "Niedrig", duration: "5–10 Min (Befragung) + Auswertung", when: "Regelmäßig alle 2–4 Wochen während der Change-Phase",
        description: "Kurze, wiederkehrende Befragung der Betroffenen zu Stimmung, Verständnis und Unterstützungsbedarf. Liefert Trendlinien über Zeit.",
        bestFor: "Readiness-Tracking über Zeit und Identifikation von Trouble Spots",
        steps: ["5–8 Fragen definieren (ADKAR-basiert)", "Tool auswählen (Forms, Viva Pulse)", "Rhythmus festlegen & kommunizieren", "Ergebnisse auswerten & visualisieren", "Maßnahmen aus Ergebnissen ableiten"],
        outputs: ["Stimmungsbarometer (Trend)", "Handlungsempfehlungen", "Management-Summary"]
      },
      {
        id: "m10", name: "Führungskräfte-Enablement", category: "Enablement", adkar: ["Desire", "Knowledge", "Ability"], effort: "Mittel", duration: "2–4h Workshop + laufende Begleitung", when: "Frühzeitig – bevor breite Kommunikation startet",
        description: "Führungskräfte werden befähigt, den Change in ihren Teams aktiv zu begleiten: Botschaften, Umgang mit Widerstand, eigene Rolle.",
        bestFor: "Jeder organisationale Change – FK sind der wichtigste Erfolgsfaktor",
        steps: ["FK-spezifische Impacts & Rolle klären", "Workshop konzipieren (Botschaften, Q&A-Handling, Rolle)", "Workshop durchführen", "Toolkit bereitstellen (Talking Points, FAQ, Einwandbehandlung)", "Regelmäßige Check-ins etablieren"],
        outputs: ["FK-Toolkit", "Talking Points", "Einwandbehandlungs-Guide", "Check-in-Protokolle"]
      },
    ];

    // ─── Persistence ────────────────────────────────────────────────────
    const SK = "ocm-v3";
    const sv = async d => { try { localStorage.setItem(SK, JSON.stringify(d)); } catch { } };
    const ld = async () => { try { const r = localStorage.getItem(SK); return r ? JSON.parse(r) : null; } catch { return null; } };
    const emptyD = () => ({
      initiatives: [],
      stakeholders: [],
      targetGroups: [],
      impactItems: [],
      actions: [],
      changeProposals: [],
      engagements: [],
      commsItems: [],
      methods: [...METHODS],
      customTags: { roles: [...ROLES], actionTypes: [...TYPES], channels: [...CHANNELS], projectTags: [] }
    });

    const INITIAL_RISK_QUESTIONS = {
      cc: [
        { id: "cc1", q: "Scope of change (Workgroup vs Enterprise)", score: 3 },
        { id: "cc2", q: "Number of employees impacted", score: 3 },
        { id: "cc3", q: "Variation in impact (Uniform vs Varied)", score: 3 },
        { id: "cc4", q: "Type of change (Incremental vs Radical)", score: 3 },
        { id: "cc5", q: "Degree of process change", score: 3 },
        { id: "cc6", q: "Degree of tool change", score: 3 },
        { id: "cc7", q: "Degree of role/responsibility change", score: 3 },
        { id: "cc8", q: "Degree of mindset/belief change", score: 3 },
      ],
      oa: [
        { id: "oa1", q: "Perceived need for change", score: 3 },
        { id: "oa2", q: "Impact of past changes", score: 3 },
        { id: "oa3", q: "Change management culture", score: 3 },
        { id: "oa4", q: "Shared vision / Direction", score: 3 },
        { id: "oa5", q: "Leadership style & visibility", score: 3 },
        { id: "oa6", q: "Employee engagement / Trust", score: 3 },
        { id: "oa7", q: "Resource availability & capacity", score: 3 },
        { id: "oa8", q: "Change saturation of organization", score: 3 },
      ]
    };

    const INITIAL_PCT_SCORES = { success: 5, leadership: 5, pm: 5, cm: 5 };

    // ─── UI Components ───────────────────────────────────────────────
    const Badge = ({ children, color = T.accent, bg: b, onRemove }) => (
      <span style={{ display: "inline-flex", alignItems: "center", padding: "3px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, background: b || (color + "1A"), color, whiteSpace: "nowrap", gap: 4 }}>
        {children}{onRemove && <span onClick={e => { e.stopPropagation(); onRemove(); }} style={{ cursor: "pointer", opacity: 0.6, fontSize: 13, lineHeight: 1 }}>×</span>}
      </span>
    );

    const Btn = ({ children, onClick, v = "default", small, disabled, style: sx }) => {
      const S = {
        default: { bg: T.surface, c: T.text, b: T.border },
        primary: { bg: T.accent, c: "#fff", b: T.accent },
        danger: { bg: T.dangerLt, c: T.danger, b: T.dangerLt },
        success: { bg: T.successLt, c: T.success, b: T.successLt },
        ghost: { bg: "transparent", c: T.textMut, b: "transparent" },
        warn: { bg: T.warnLt, c: T.warn, b: T.warnLt }
      };
      const s = S[v] || S.default;
      return <button className="no-print" onClick={onClick} disabled={disabled} style={{ padding: small ? "4px 10px" : "8px 16px", borderRadius: T.rs, border: `1px solid ${s.b}`, background: s.bg, color: s.c, fontSize: small ? 12 : 13, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", fontFamily: T.font, display: "inline-flex", alignItems: "center", gap: 6, opacity: disabled ? 0.5 : 1, transition: "0.2s", boxShadow: v === "default" || v === "primary" ? T.shadow : "none", ...sx }}>{children}</button>;
    };

    const Input = ({ label, value, onChange, options, textarea, type = "text", placeholder, style: sx, min, max, step }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, ...sx }}>
        {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
        {options ? (
          <select value={value} onChange={e => onChange(e.target.value)} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }}>
            <option value="">— Wählen —</option>
            {options.map(o => <option key={typeof o === "string" ? o : o.value} value={typeof o === "string" ? o : o.value}>{typeof o === "string" ? o : o.label}</option>)}
          </select>
        ) : textarea ? (
          <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={3} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none", resize: "vertical" }} />
        ) : (
          <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} min={min} max={max} step={step} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }} />
        )}
      </div>
    );

    const TagInput = ({ label, tags = [], onChange, suggestions = [], color = T.accent }) => {
      const [inp, setInp] = useState("");
      const add = (v) => { const t = (v || inp).trim(); if (t && !tags.includes(t)) onChange([...tags, t]); setInp(""); };
      const rem = (t) => onChange(tags.filter(x => x !== t));
      const avail = suggestions.filter(s => !tags.includes(s) && s.toLowerCase().includes(inp.toLowerCase()));
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
          <div style={{ border: `1px solid ${T.border}`, background: T.bg, borderRadius: T.rs, padding: 4, display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
            {tags.map(t => (
              <Badge key={t} color={color} onRemove={() => rem(t)}>{t}</Badge>
            ))}
            <input value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); add(); } }} onBlur={() => add()} placeholder="Eingabe + Enter" style={{ flex: 1, border: "none", background: "transparent", outline: "none", padding: "4px", fontSize: 13, fontFamily: T.font, minWidth: 120 }} />
          </div>
          {inp && avail.length > 0 && (
            <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginTop: 2 }}>
              {avail.slice(0, 8).map(s => <button key={s} onClick={() => add(s)} style={{ padding: "2px 8px", borderRadius: 4, border: "none", background: T.bg, color: T.textSec, fontSize: 11, cursor: "pointer", fontFamily: T.font }}>{s}</button>)}
            </div>
          )}
        </div>
      );
    };

    const ScoreInput = ({ label, value, onChange, style: sx }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, ...sx }}>
        {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input type="range" min="0" max="10" value={value} onChange={e => onChange(Number(e.target.value))} style={{ flex: 1, accentColor: scoreColor(value) }} />
          <span style={{ width: 28, height: 28, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, background: scoreBg(value), color: scoreColor(value) }}>{value}</span>
        </div>
      </div>
    );

    const ScoreDot = ({ value, size = 28 }) => (
      <div style={{ width: size, height: size, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size < 24 ? 10 : 12, fontWeight: 700, background: scoreBg(value), color: scoreColor(value) }}>{value}</div>
    );

    const Card = ({ children, style: sx, onClick }) => (
      <div onClick={onClick} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.r, padding: 20, boxShadow: T.shadow, transition: "0.2s", cursor: onClick ? "pointer" : "default", ...sx }}>{children}</div>
    );

    const Modal = ({ open, onClose, title, children, wide }) => {
      if (!open) return null;
      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(34,34,34,0.4)", backdropFilter: "blur(3px)" }} onClick={onClose}>
          <div onClick={e => e.stopPropagation()} style={{ background: T.surface, borderRadius: 8, padding: 28, boxShadow: "0 10px 40px rgba(0,0,0,0.15)", width: wide ? "min(95vw,900px)" : "min(90vw,540px)", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h3 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: T.adessoBlau }}>{title}</h3>
              <Btn v="ghost" small onClick={onClose}>✕</Btn>
            </div>
            {children}
          </div>
        </div>
      );
    };

    const Tabs = ({ tabs, active, onChange }) => (
      <div className="no-print" style={{ display: "flex", gap: 2, background: T.borderLight, borderRadius: 6, padding: 2, marginBottom: 20, overflowX: "auto" }}>
        {tabs.map(t => (
          <button key={t.key} onClick={() => onChange(t.key)} style={{ padding: "8px 16px", borderRadius: 4, border: "none", cursor: "pointer", fontSize: 13, fontWeight: active === t.key ? 600 : 400, fontFamily: T.font, background: active === t.key ? T.surface : "transparent", color: active === t.key ? T.adessoBlau : T.textSec, boxShadow: active === t.key ? T.shadow : "none", transition: "0.2s", whiteSpace: "nowrap" }}>
            {t.label}{t.count != null && <span style={{ marginLeft: 6, fontSize: 11, opacity: 0.6 }}>{t.count}</span>}
          </button>
        ))}
      </div>
    );

    const Empty = ({ icon, title, sub, action }) => (
      <div style={{ textAlign: "center", padding: "48px 20px" }}>
        <div style={{ fontSize: 40, marginBottom: 12, opacity: 0.5 }}>{icon}</div>
        <div style={{ fontSize: 16, fontWeight: 600, color: T.text, marginBottom: 6 }}>{title}</div>
        <div style={{ fontSize: 13, color: T.textMut, marginBottom: 18 }}>{sub}</div>
        {action}
      </div>
    );

    const SectionHead = ({ children }) => <div style={{ fontSize: 12, fontWeight: 700, color: T.textSec, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 12 }}>{children}</div>;


    const EditCell = ({ value, onChange, type = "text", options }) => {
      const [ed, setEd] = useState(false);
      const [tmp, setTmp] = useState(value);
      useEffect(() => setTmp(value), [value]);
      if (!ed) return <span onClick={() => setEd(true)} style={{ cursor: "pointer", borderBottom: "1px dashed transparent", padding: "1px 0" }} onMouseEnter={e => e.target.style.borderBottomColor = T.accent} onMouseLeave={e => e.target.style.borderBottomColor = "transparent"}>{options ? (options.find(o => (typeof o === "string" ? o : o.value) === value) || {}).label || value || "–" : value || "–"}</span>;
      const commit = () => { onChange(tmp); setEd(false); };
      if (options) return <select value={tmp} onChange={e => { setTmp(e.target.value); onChange(e.target.value); setEd(false); }} onBlur={() => setEd(false)} autoFocus style={{ background: T.bg, border: `1px solid ${T.accent}`, borderRadius: 5, padding: "2px 5px", fontSize: 12, fontFamily: T.font, outline: "none" }}>{options.map(o => <option key={typeof o === "string" ? o : o.value} value={typeof o === "string" ? o : o.value}>{typeof o === "string" ? o : o.label}</option>)}</select>;
      if (type === "score") return <input type="number" min="0" max="10" value={tmp} onChange={e => setTmp(clamp(e.target.value))} onBlur={commit} onKeyDown={e => e.key === "Enter" && commit()} autoFocus style={{ background: T.bg, border: `1px solid ${T.accent}`, borderRadius: 5, padding: "2px 5px", fontSize: 12, fontFamily: T.font, outline: "none", width: 44, textAlign: "center" }} />;
      return <input value={tmp} onChange={e => setTmp(e.target.value)} onBlur={commit} onKeyDown={e => e.key === "Enter" && commit()} autoFocus type={type} style={{ background: T.bg, border: `1px solid ${T.accent}`, borderRadius: 5, padding: "2px 6px", fontSize: 12, fontFamily: T.font, outline: "none", width: "100%" }} />;
    };



    // ─── ADKAR coverage calc ────────────────────────────────────────────
    const adkarCov = (actions, tgId) => { const c = {}; ADKAR.forEach(a => c[a] = 0); actions.filter(a => !tgId || a.target_group_ids?.includes(tgId)).forEach(a => (a.adkar_tags || []).forEach(t => { if (c[t] !== undefined) c[t]++; })); return c; };

    // ═══════════════════════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════════════════════
    function App() {
      const [data, setData] = useState(emptyD());
      const [loaded, setLoaded] = useState(false);

      const [methodDetail, setMethodDetail] = useState(null);

      useEffect(() => { ld().then(d => { if (d) setData({ ...emptyD(), ...d, methods: d.methods || [...METHODS], customTags: { ...emptyD().customTags, ...(d.customTags || {}) } }); setLoaded(true); }); }, []);
      useEffect(() => { if (loaded) sv(data); }, [data, loaded]);

      const up = useCallback(fn => setData(p => { const n = structuredClone(p); fn(n); return n; }), []);
      const ini = useMemo(() => data.initiatives.find(i => i.id === sel), [data, sel]);
      const iSH = useMemo(() => data.stakeholders.filter(s => s.initiative_id === sel), [data, sel]);
      const iTG = useMemo(() => data.targetGroups.filter(t => t.initiative_id === sel), [data, sel]);
      const iIM = useMemo(() => data.impactItems.filter(i => i.initiative_id === sel), [data, sel]);
      const iAC = useMemo(() => data.actions.filter(a => a.initiative_id === sel), [data, sel]);
      const iENG = useMemo(() => (data.engagements || []).filter(e => e.initiative_id === sel), [data, sel]);
      const iCOM = useMemo(() => (data.commsItems || []).filter(c => c.initiative_id === sel), [data, sel]);
      const upE = (col, id, f, v) => up(d => { const it = d[col].find(x => x.id === id); if (it) it[f] = v; });
      const tags = data.customTags || emptyD().customTags;

      // ─── SMART ALERTS ─────────────────────────────────────────────────
      const alerts = useMemo(() => {
        if (!ini) return [];
        const a = [];
        const adkar = adkarCov(iAC);
        const gaps = ADKAR.filter(k => adkar[k] === 0);
        if (gaps.length > 0) a.push({ type: "warn", icon: "⚠️", msg: `ADKAR-Lücken: ${gaps.join(", ")} – keine Maßnahmen zugeordnet` });
        const highResistant = iSH.filter(s => s.readiness === "resistant" && s.influence >= 7);
        highResistant.forEach(s => a.push({ type: "danger", icon: "🚨", msg: `${s.name} ist resistant mit Einfluss ${s.influence}/10 – dringend Engagement nötig` }));
        const noRecentEngagement = iSH.filter(s => s.influence >= 7).filter(s => {
          const engs = iENG.filter(e => e.stakeholder_id === s.id);
          if (engs.length === 0) return true;
          const last = engs.sort((a, b) => b.date.localeCompare(a.date))[0];
          return daysBetween(last.date, today()) > 14;
        });
        noRecentEngagement.forEach(s => a.push({ type: "warn", icon: "📅", msg: `${s.name} (Einfluss ${s.influence}/10) – kein Engagement seit >14 Tagen` }));
        iTG.forEach(tg => {
          const impacts = iIM.filter(i => i.target_group_id === tg.id);
          const totalLoad = impacts.reduce((s, i) => s + (i.impact_level || 0), 0);
          if (totalLoad > 25) a.push({ type: "danger", icon: "🔥", msg: `${tg.name}: Change-Saturation kritisch (Gesamt-Score: ${totalLoad})` });
        });
        const milestone = ini.milestones?.[0];
        if (milestone) {
          const daysLeft = daysBetween(today(), milestone.date);
          if (daysLeft > 0 && daysLeft <= 28) {
            const unready = iAC.filter(a => a.status === "planned");
            if (unready.length > 3) a.push({ type: "danger", icon: "⏰", msg: `Go-Live in ${daysLeft} Tagen – noch ${unready.length} Maßnahmen in "Geplant"` });
          }
        }
        return a;
      }, [ini, iSH, iAC, iIM, iTG, iENG]);

      // ─── SIDEBAR ──────────────────────────────────────────────────────
      const Sidebar = () => (
        <div className="no-print" style={{ width: 250, minHeight: "100vh", background: T.surface, borderRight: `1px solid ${T.border}`, display: "flex", flexDirection: "column", flexShrink: 0 }}>
          <div style={{ padding: "24px 20px 20px", borderBottom: `1px solid ${T.borderLight}` }}>
            <div style={{ fontSize: 24, fontWeight: 700, color: T.adessoBlau, letterSpacing: -0.5, marginBottom: 2 }}>adesso</div>
            <div style={{ fontSize: 10, color: T.textMut, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase" }}>CHANGE TOGETHER</div>
          </div>
          <div style={{ padding: "12px 20px 4px", fontSize: 11, fontWeight: 700, color: T.adessoGrau, textTransform: "uppercase" }}>OCM Navigator</div>
          <nav style={{ padding: "8px 12px", flex: 1 }}>
            {[
              { key: "dashboard", icon: "📊", label: "Dashboard" },
              { key: "portfolio", icon: "📁", label: "Portfolio" },
              { key: "initiative", icon: "◉", label: "Initiative", off: !sel },
              { key: "engagement", icon: "🤝", label: "Engagements", off: !sel },
              { key: "comms", icon: "📣", label: "Komm.-Matrix", off: !sel },
              { key: "saturation", icon: "🌡️", label: "Saturation", off: !sel },
              { key: "heatmap", icon: "🔥", label: "Heatmap", off: !sel },
              { key: "timeline", icon: "📅", label: "Timeline", off: !sel },
              { key: "report", icon: "📋", label: "Report", off: !sel },

                style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 12px", borderRadius: T.rs, border: "none", cursor: item.off ? "not-allowed" : "pointer", textAlign: "left", background: nav === item.key ? T.accentLt : "transparent", color: nav === item.key ? T.adessoBlau : item.off ? T.borderLight : T.textSec, fontSize: 13, fontWeight: nav === item.key ? 600 : 400, fontFamily: T.font, transition: "0.2s", opacity: item.off ? 0.4 : 1, marginBottom: 2 }}>
                <span style={{ fontSize: 14, width: 20, textAlign: "center" }}>{item.icon}</span>{item.label}
                {item.key === "dashboard" && alerts.length > 0 && <span style={{ marginLeft: "auto", background: T.danger, color: "#fff", borderRadius: 8, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>{alerts.length}</span>}
              </button>
            ))}
          </nav>
          {ini && (
            <div style={{ padding: "16px 20px", borderTop: `1px solid ${T.borderLight}`, background: T.accentLt }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: T.adessoBlau }}>Aktive Initiative</div>
              <div style={{ fontSize: 13, fontWeight: 700, color: T.text, marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{ini.name}</div>
            </div>
          )}
        </div>
      );

      // ─── DASHBOARD (per initiative when selected) ─────────────────────
      const DashboardView = () => {
        const scope = sel && ini ? "initiative" : "portfolio";
        const acts = scope === "initiative" ? iAC : data.actions;
        const imps = scope === "initiative" ? iIM : data.impactItems;
        const shs = scope === "initiative" ? iSH : data.stakeholders;
        const tgs = scope === "initiative" ? iTG : data.targetGroups;
        const tA = acts.length, dA = acts.filter(a => a.status === "done").length;
        const pct = tA ? Math.round(dA / tA * 100) : 0;
        const hiImp = imps.filter(i => (i.impact_level || 0) >= 8).length;
        const res = shs.filter(s => s.readiness === "resistant" || s.readiness === "skeptical").length;
        const ppl = tgs.reduce((s, t) => s + (t.size || 0), 0);
        return (
          <div>
            <h2 style={{ fontSize: 24, fontWeight: 700, color: T.adessoBlau, marginBottom: 24 }}>{scope === "initiative" ? "Initiative Dashboard" : "Portfolio Dashboard"}</h2>
            {alerts.length > 0 && scope === "initiative" && (
              <Card style={{ marginBottom: 20, padding: 16, borderLeft: `4px solid ${T.danger}`, background: T.dangerLt + "44" }}>
                <SectionHead>⚡ Smart Alerts ({alerts.length})</SectionHead>
                {alerts.map((a, i) => (
                  <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 6, fontSize: 13, color: a.type === "danger" ? T.danger : T.warn }}>
                    <span>{a.icon}</span><span>{a.msg}</span>
                  </div>
                ))}
              </Card>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 16, marginBottom: 24 }}>
              {[[scope === "initiative" ? "Maßnahmen" : "Initiativen", scope === "initiative" ? tA : data.initiatives.length, T.accent, "📁"], ["Fortschritt", `${pct}%`, T.success, "✅"], ["Impacts ≥8", hiImp, T.danger, "🔥"], ["Betroffene", ppl, T.purple, "👥"], ["Skept./Resistant", res, T.warn, "⚠️"]].map(([l, v, c, ic]) => (
                <Card key={l} style={{ padding: 20, borderTop: `4px solid ${c}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <div><div style={{ fontSize: 12, color: T.textMut, marginBottom: 6 }}>{l}</div><div style={{ fontSize: 28, fontWeight: 700, color: T.text }}>{v}</div></div>
                    <span style={{ fontSize: 24, opacity: 0.3 }}>{ic}</span>
                  </div>
                </Card>
              ))}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <Card>
                <SectionHead>{scope === "initiative" ? "Maßnahmen-Status" : "Initiativen-Fortschritt"}</SectionHead>
                {scope === "portfolio" ? (data.initiatives.length === 0 ? <p style={{ fontSize: 13, color: T.textMut }}>Noch keine Initiativen</p> :
                  data.initiatives.map(ini => {
                    const a = data.actions.filter(x => x.initiative_id === ini.id), d = a.filter(x => x.status === "done").length, p = a.length ? Math.round(d / a.length * 100) : 0;
                    return <div key={ini.id} style={{ marginBottom: 12, cursor: "pointer" }} onClick={() => { setSel(ini.id); }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}><span style={{ fontWeight: 600, color: T.text }}>{ini.name}</span><span style={{ color: T.textMut }}>{p}%</span></div>
                      <div style={{ background: T.bg, borderRadius: 5, height: 6, overflow: "hidden" }}><div style={{ width: `${p}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.purple})`, borderRadius: 5 }} /></div>
                    </div>;

                  <div style={{ display: "flex", gap: 10 }}>
                    {[["Geplant", acts.filter(a => a.status === "planned").length, T.textMut], ["In Arbeit", acts.filter(a => a.status === "in_progress").length, T.accent], ["Fertig", dA, T.success]].map(([l, v, c]) => (
                      <div key={l} style={{ flex: 1, textAlign: "center", padding: 12, background: T.bg, borderRadius: T.rs }}><div style={{ fontSize: 24, fontWeight: 700, color: c }}>{v}</div><div style={{ fontSize: 10, color: T.textMut }}>{l}</div></div>
                    ))}
                  </div>
                )}
              </Card>
              <Card>
                <SectionHead>ADKAR-Abdeckung{scope === "initiative" ? "" : " (Portfolio)"}</SectionHead>
                <div style={{ display: "flex", gap: 14 }}>
                  {ADKAR.map(a => {
                    const c = adkarCov(acts)[a]; return (
                      <div key={a} style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 22, fontWeight: 700, color: ADKAR_C[a] }}>{c}</div>
                        <div style={{ fontSize: 10, fontWeight: 600, color: T.textSec }}>{a}</div>
                        <div style={{ background: T.bg, borderRadius: 3, height: 4, marginTop: 5, overflow: "hidden" }}><div style={{ width: `${Math.min(c * 15, 100)}%`, height: "100%", background: ADKAR_C[a], borderRadius: 3 }} /></div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>
          </div>
        );
      };

      // ─── PORTFOLIO ────────────────────────────────────────────────────
      const PortfolioView = () => {
        const [show, setShow] = useState(false);
        const [f, sF] = useState({
          name: "", goal: "", industry: "", personDays: "", volume: "", priority: "High",
          startDate: "", endDate: "", goLiveDate: "", projectTags: [],

          pctAssessment: INITIAL_PCT_SCORES
        });
        const add = () => {
          if (!f.name) return;
          up(d => d.initiatives.push({
            id: uid("INI-"), ...f,
            personDays: Number(f.personDays) || 0,
            volume: Number(f.volume) || 0,
            milestones: f.goLiveDate ? [{ id: "M1", name: "Go-Live", date: f.goLiveDate }] : [],
            created: new Date().toISOString()
          }));
          sF({
            name: "", goal: "", industry: "", personDays: "", volume: "", priority: "High",
            startDate: "", endDate: "", goLiveDate: "", projectTags: [],
            fourPs: { project: "", purpose: "", particulars: "", people: "" },

        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Change Portfolio</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Übersicht aller strategischen Projekte</p></div>
              <Btn v="primary" onClick={() => setShow(true)}>＋ Neue Initiative</Btn>
            </div>
            {data.initiatives.length === 0 ? <Empty icon="📁" title="Noch keine Initiativen" sub="Starte dein Portfolio" action={<Btn v="primary" onClick={() => setShow(true)}>Erste Initiative</Btn>} /> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 14 }}>
                {data.initiatives.map(i => {
                  const ac = data.actions.filter(a => a.initiative_id === i.id), dn = ac.filter(a => a.status === "done").length, pc = ac.length ? Math.round(dn / ac.length * 100) : 0;
                  return <Card key={i.id} onClick={() => { setSel(i.id); setNav("initiative"); setSub("overview"); }} style={{ cursor: "pointer", borderColor: sel === i.id ? T.accent : T.border }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><div style={{ fontSize: 15, fontWeight: 700, color: T.text }}>{i.name}</div><Badge color={i.priority === "High" ? T.danger : i.priority === "Medium" ? T.warn : T.success}>{i.priority}</Badge></div>
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 6 }}>
                      {i.industry && <Badge color={T.purple}>{i.industry}</Badge>}
                      {(i.projectTags || []).map(t => <Badge key={t} color={T.cyan}>{t}</Badge>)}
                    </div>

                      {i.personDays > 0 && <span>👤 {i.personDays} PT</span>}
                      {i.volume > 0 && <span>💰 {Number(i.volume).toLocaleString("de-DE")}€</span>}
                    </div>
                    <div style={{ background: T.bg, borderRadius: 5, height: 5, overflow: "hidden", marginBottom: 4 }}><div style={{ width: `${pc}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.purple})`, borderRadius: 5 }} /></div>
                    <div style={{ fontSize: 11, color: T.textMut }}>{pc}% • {ac.length} Maßnahmen</div>
                  </Card>;
                })}
              </div>
            )}
            <Modal open={show} onClose={() => setShow(false)} title="Neue Initiative" wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} placeholder="z.B. ERP Migration Wave 1" style={{ gridColumn: "1/-1" }} />
                <Input label="Ziel" value={f.goal} onChange={v => sF(p => ({ ...p, goal: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Branche" value={f.industry} onChange={v => sF(p => ({ ...p, industry: v }))} options={INDUSTRIES} />
                <Input label="Priorität" value={f.priority} onChange={v => sF(p => ({ ...p, priority: v }))} options={["High", "Medium", "Low"]} />
                <Input label="Startdatum" value={f.startDate} onChange={v => sF(p => ({ ...p, startDate: v }))} type="date" />
                <Input label="Enddatum" value={f.endDate} onChange={v => sF(p => ({ ...p, endDate: v }))} type="date" />
                <Input label="Personentage (PT)" value={f.personDays} onChange={v => sF(p => ({ ...p, personDays: v }))} type="number" placeholder="z.B. 120" />
                <Input label="Auftragsvolumen (€)" value={f.volume} onChange={v => sF(p => ({ ...p, volume: v }))} type="number" placeholder="z.B. 250000" />
                <Input label="Go-Live Datum" value={f.goLiveDate} onChange={v => sF(p => ({ ...p, goLiveDate: v }))} type="date" />

              </div>

            </Modal>
          </div>
        );
      };

      // ─── INITIATIVE ───────────────────────────────────────────────────
      const InitiativeView = () => {
        if (!ini) return <Empty icon="◉" title="Keine Initiative ausgewählt" sub="Wähle im Portfolio" />;
        const tabs = [
          { key: "overview", label: "Übersicht" },
          { key: "risk", label: "Risk Assessment" },
          { key: "pct", label: "PCT Profile" },
          { key: "stakeholders", label: "Stakeholder", count: iSH.length },
          { key: "targets", label: "Zielgruppen", count: iTG.length },
          { key: "impacts", label: "Impacts", count: iIM.length },
          { key: "actions", label: "Maßnahmen", count: iAC.length },
        ];
        return (
          <div>
            <h2 style={{ margin: "0 0 4px", fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>{ini.name}</h2>
            <p style={{ margin: "0 0 20px", fontSize: 13, color: T.textMut }}>{ini.goal}</p>
            <Tabs tabs={tabs} active={sub} onChange={setSub} />
            {sub === "overview" && <OverviewSub />}
            {sub === "risk" && <RiskSub />}
            {sub === "pct" && <PCTSub />}

            {sub === "impacts" && <ImpactSub />}
            {sub === "actions" && <ActionSub />}
          </div>
        );

      const OverviewSub = () => {
        const adkar = adkarCov(iAC);
        const sc = { planned: 0, in_progress: 0, done: 0 };
        iAC.forEach(a => sc[a.status]++);
        const del = () => {
          if (!confirm("Löschen?")) return;
          up(d => {
            ["initiatives", "stakeholders", "targetGroups", "impactItems", "actions", "engagements", "commsItems"].forEach(k => {
              if (d[k]) d[k] = d[k].filter(x => x.initiative_id !== sel && x.id !== sel);

          setSel(null);
          setNav("portfolio");

        const up4 = (f, v) => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.fourPs) i.fourPs = {}; i.fourPs[f] = v; } });

        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            <Card style={{ gridColumn: "1/-1" }}>
              <SectionHead>Prosci 4 P's Model</SectionHead>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>

                <Input label="Purpose (Why are we changing?)" value={p4.purpose} onChange={v => up4("purpose", v)} textarea />
                <Input label="Particulars (What is changing?)" value={p4.particulars} onChange={v => up4("particulars", v)} textarea />
                <Input label="People (Who is changing?)" value={p4.people} onChange={v => up4("people", v)} textarea />
              </div>
            </Card>
            <Card>
              <SectionHead>Stammdaten</SectionHead>

                </div>
              ))}
            </Card>
          </div>
        );
      };

      const RiskSub = () => {
        const ra = ini.riskAssessment || INITIAL_RISK_QUESTIONS;
        const upR = (type, qId, val) => up(d => {

          if (i) {
            if (!i.riskAssessment) i.riskAssessment = INITIAL_RISK_QUESTIONS;
            const q = i.riskAssessment[type].find(x => x.id === qId);
            if (q) q.score = val;
          }
        });

        const ccAvg = ra.cc.reduce((s, q) => s + q.score, 0) / ra.cc.length;
        const oaAvg = ra.oa.reduce((s, q) => s + q.score, 0) / ra.oa.length;

        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <Card>
              <SectionHead>Change Characteristics (CC)</SectionHead>
              {ra.cc.map(q => (
                <div key={q.id} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 12, marginBottom: 4 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {[1, 2, 3, 4, 5].map(v => (
                      <button key={v} onClick={() => upR("cc", q.id, v)} style={{ flex: 1, padding: "4px", borderRadius: 4, border: "none", background: q.score === v ? T.accent : T.bg, color: q.score === v ? "#fff" : T.text, fontSize: 11, cursor: "pointer" }}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card>
              <SectionHead>Organizational Attributes (OA)</SectionHead>

                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card style={{ gridColumn: "1/-1", textAlign: "center" }}>

                  <div style={{ fontSize: 11, color: T.textMut }}>Avg. CC Score</div>
                </div>
                <div style={{ width: 150, height: 150, border: `2px solid ${T.border}`, position: "relative", background: "#f9f9f9" }}>
                  <div style={{ position: "absolute", bottom: 0, left: 0, width: "50%", height: "50%", background: T.successLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", top: 0, right: 0, width: "50%", height: "50%", background: T.dangerLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", left: (oaAvg / 5 * 100) + "%", bottom: (ccAvg / 5 * 100) + "%", width: 12, height: 12, borderRadius: "50%", background: T.accent, transform: "translate(-50%, 50%)", border: "2px solid #fff", boxShadow: T.shadow }} />

                    <div style={{ fontSize: 13, fontWeight: 700 }}>{v}</div>
                  </div>

              </div>
            </Card>
          </div>

      // ─── STAKEHOLDER ──────────────────────────────────────────────────
      const StakeholderSub = () => {
        const [show, setShow] = useState(false);
        const [f, sF] = useState({ name: "", roles: [], function: "", org_unit: "", influence: 5, interest: 5, readiness: "neutral", notes: "" });
        const add = () => { if (!f.name) return; up(d => d.stakeholders.push({ id: uid("S-"), initiative_id: sel, ...f })); sF({ name: "", roles: [], function: "", org_unit: "", influence: 5, interest: 5, readiness: "neutral", notes: "" }); setShow(false); };

            {iSH.length === 0 ? <Empty icon="👤" title="Keine Stakeholder" sub="" /> : (

                          <td style={{ padding: "8px 12px" }}>{(s.roles || [s.role]).map(r => <Badge key={r} color={T.purple}>{r}</Badge>)}</td>
                          <td style={{ padding: "8px 12px", color: T.textSec }}><EditCell value={s.org_unit} onChange={v => upE("stakeholders", s.id, "org_unit", v)} /></td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.influence} /><EditCell value={s.influence} onChange={v => upE("stakeholders", s.id, "influence", clamp(v))} type="score" /></td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.interest} /><EditCell value={s.interest} onChange={v => upE("stakeholders", s.id, "interest", clamp(v))} type="score" /></td>
                          <td style={{ padding: "8px 12px" }}><Badge color={readyColor(s.readiness)}><EditCell value={s.readiness} onChange={v => upE("stakeholders", s.id, "readiness", v)} options={READINESS.map(r => ({ value: r, label: r }))} /></Badge></td>
                          <td style={{ padding: "8px 12px", fontSize: 11, color: daysSince !== null && daysSince > 14 ? T.danger : T.textMut }}>{lastEng ? `${fmtDate(lastEng.date)} (vor ${daysSince}d)` : "–"}</td>
                          <td style={{ padding: "8px 12px" }}><Btn v="ghost" small onClick={() => del(s.id)}>✕</Btn></td>
                        </tr>

                <Input label="Funktion" value={f.function} onChange={v => sF(p => ({ ...p, function: v }))} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Rolle(n) – frei anlegbar" tags={f.roles} onChange={v => sF(p => ({ ...p, roles: v }))} suggestions={tags.roles} color={T.purple} /></div>
                <Input label="Organisationseinheit" value={f.org_unit} onChange={v => sF(p => ({ ...p, org_unit: v }))} />
                <ScoreInput label="Einfluss (0–10)" value={f.influence} onChange={v => sF(p => ({ ...p, influence: v }))} />
                <ScoreInput label="Interesse (0–10)" value={f.interest} onChange={v => sF(p => ({ ...p, interest: v }))} />

          </div>

        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}><span style={{ fontSize: 14, fontWeight: 600 }}>Zielgruppen</span><Btn v="primary" small onClick={() => setShow(true)}>＋</Btn></div>
            {iTG.length === 0 ? <Empty icon="👥" title="Keine Zielgruppen" sub="" /> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))", gap: 12 }}>
                {iTG.map(tg => <Card key={tg.id}><div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}><span style={{ fontSize: 14, fontWeight: 600 }}>{tg.name}</span><Btn v="ghost" small onClick={() => up(d => d.targetGroups = d.targetGroups.filter(t => t.id !== tg.id))}>✕</Btn></div>
                  <div style={{ fontSize: 12, color: T.textMut, marginBottom: 8 }}>👥 {tg.size} • {tg.org_units?.join(", ") || "–"}</div>
                  <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>{ADKAR.map(a => { const c = adkarCov(iAC, tg.id)[a]; return <Badge key={a} color={c === 0 ? T.danger : c < 2 ? T.warn : T.success}>{a[0]}:{c}</Badge>; })}</div>
                </Card>)}

            <Modal open={show} onClose={() => setShow(false)} title="Zielgruppe"><div style={{ display: "flex", flexDirection: "column", gap: 14 }}><Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} /><Input label="Größe" value={f.size} onChange={v => sF(p => ({ ...p, size: v }))} type="number" /><Input label="Organisationseinheiten (kommagetrennt)" value={f.org_units} onChange={v => sF(p => ({ ...p, org_units: v }))} /><Input label="Standorte" value={f.locations} onChange={v => sF(p => ({ ...p, locations: v }))} /></div><Btn v="primary" onClick={add} style={{ marginTop: 16 }}>Speichern</Btn></Modal>
          </div>
        );

                            {opps.map(s => <Badge key={s.id} color={T.danger}>👎 {s.name}</Badge>)}

                        </div>
                        <Btn v="ghost" small onClick={() => up(d => d.actions = d.actions.filter(x => x.id !== a.id))}>✕</Btn>

                    </Card>
