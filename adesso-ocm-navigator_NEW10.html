                            </Card>
                          );
                        })}
                        {colAC.length === 0 && <div style={{ padding: "20px 0", textAlign: "center", color: T.textMut, fontSize: 12, background: T.bg, borderRadius: T.rs }}>Keine Maßnahmen</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {/* List View */}
            {acView === "list" && (iAC.length === 0 ? <Empty icon="📋" title="Keine Maßnahmen" sub="" /> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {iAC.map(a => {
                  const ow = iSH.find(s => s.id === a.owner_person_id); const supps = (a.supporter_ids || []).map(id => iSH.find(s => s.id === id)).filter(Boolean); const opps = (a.opponent_ids || []).map(id => iSH.find(s => s.id === id)).filter(Boolean); return (
                    <Card key={a.id} style={{ padding: 14, borderLeft: `4px solid ${statusColor(a.status)}`, cursor: "pointer" }} onClick={() => openEdit(a)}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                            <button onClick={e => { e.stopPropagation(); cycle(a.id); }} style={{ width: 20, height: 20, borderRadius: 5, border: `2px solid ${statusColor(a.status)}`, background: a.status === "done" ? T.successLt : "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: statusColor(a.status), fontFamily: T.font }}>{a.status === "done" ? "✓" : a.status === "in_progress" ? "▸" : ""}</button>
                            <span style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{a.title}</span>
                            {(a.typeTags || [a.type]).map(t => <Badge key={t} color={T.cyan}>{t}</Badge>)}
                            <Badge color={statusColor(a.status)}>{statusLabel(a.status)}</Badge>
                          </div>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {(a.adkar_tags || []).map(t => <Badge key={t} color={ADKAR_C[t]}>{t}</Badge>)}
                            {a.due_date && <Badge color={T.textMut}>📅 {fmtDate(a.due_date)}</Badge>}
                            {ow && <Badge color={T.success}>👤 {ow.name}</Badge>}
                            {supps.map(s => <Badge key={s.id} color={T.accent}>👍 {s.name}</Badge>)}
                            {opps.map(s => <Badge key={s.id} color={T.danger}>👎 {s.name}</Badge>)}
                            {(a.impact_item_ids || []).map(iid => { const im = iIM.find(x => x.id === iid); return im ? <Badge key={iid} color={T.purple}>⚡ {im.change_description?.slice(0,20)}</Badge> : null; })}
                          </div>
                        </div>
                        <Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => d.actions = d.actions.filter(x => x.id !== a.id)); }}>✕</Btn>
                      </div>
                    </Card>
                  );
                })}
              </div>
            ))}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Maßnahme bearbeiten" : "Neue Maßnahme"} wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Titel" value={f.title} onChange={v => sF(p => ({ ...p, title: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Typ(en) – frei anlegbar" tags={f.typeTags} onChange={v => sF(p => ({ ...p, typeTags: v }))} suggestions={tags.actionTypes} color={T.cyan} /></div>
                <Input label="Owner" value={f.owner_person_id} onChange={v => sF(p => ({ ...p, owner_person_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Fällig am" value={f.due_date} onChange={v => sF(p => ({ ...p, due_date: v }))} type="date" />
                <Input label="Status" value={f.status} onChange={v => sF(p => ({ ...p, status: v }))} options={[{value:"planned",label:"Geplant"},{value:"in_progress",label:"In Arbeit"},{value:"done",label:"Fertig"}]} />
                <div />
                <LinkSelect label="Supporter" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={f.supporter_ids} onChange={v => sF(p => ({ ...p, supporter_ids: v }))} color={T.success} />
                <LinkSelect label="Gegner" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={f.opponent_ids} onChange={v => sF(p => ({ ...p, opponent_ids: v }))} color={T.danger} />
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Impacts" options={iIM.map(im => ({ value: im.id, label: (im.change_description || im.id).slice(0, 50) }))} selected={f.impact_item_ids || []} onChange={v => sF(p => ({ ...p, impact_item_ids: v }))} color={T.purple} /></div>
              </div>
              <div style={{ marginTop: 14 }}><label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>ADKAR-Tags</label><div style={{ display: "flex", gap: 5, marginTop: 6 }}>{ADKAR.map(a => <button key={a} onClick={() => togA(a)} style={{ padding: "5px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5, fontFamily: T.font, fontWeight: 600, background: f.adkar_tags.includes(a) ? ADKAR_C[a] + "20" : T.bg, color: f.adkar_tags.includes(a) ? ADKAR_C[a] : T.textMut, outline: f.adkar_tags.includes(a) ? `2px solid ${ADKAR_C[a]}` : "none" }}>{a}</button>)}</div></div>
              <div style={{ marginTop: 14 }}><label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Zielgruppen</label><div style={{ display: "flex", gap: 5, marginTop: 6, flexWrap: "wrap" }}>{iTG.map(tg => <button key={tg.id} onClick={() => togT(tg.id)} style={{ padding: "5px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5, fontFamily: T.font, fontWeight: 600, background: f.target_group_ids.includes(tg.id) ? T.accentLt : T.bg, color: f.target_group_ids.includes(tg.id) ? T.accent : T.textMut }}>{tg.name}</button>)}</div></div>
              <Btn v="primary" onClick={save} style={{ marginTop: 20 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── BUDGET TRACKER ───────────────────────────────────────────────
      const BudgetSub = () => {
        const totalPlanned = iAC.reduce((s, a) => s + (Number(a.planned_days) || 0), 0);
        const totalActual = iAC.reduce((s, a) => s + (Number(a.actual_days) || 0), 0);
        const pct = totalPlanned ? Math.round(Math.min(200, totalActual / totalPlanned * 100)) : 0;
        const overBudget = totalActual > totalPlanned && totalPlanned > 0;
        return (
          <div style={{ marginTop: 20 }}>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 14, marginBottom: 20 }}>
              <Card style={{ padding: 16, borderTop: `4px solid ${T.accent}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Geplante Personentage</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: T.accent }}>{totalPlanned}</div>
                <div style={{ fontSize: 11, color: T.textMut }}>PT gesamt</div>
              </Card>
              <Card style={{ padding: 16, borderTop: `4px solid ${overBudget ? T.danger : T.success}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Tatsächliche Personentage</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: overBudget ? T.danger : T.success }}>{totalActual}</div>
                {overBudget && <div style={{ fontSize: 11, color: T.danger }}>+{totalActual - totalPlanned} PT Überschreitung</div>}
              </Card>
              <Card style={{ padding: 16, borderTop: `4px solid ${overBudget ? T.danger : T.warn}` }}>
                <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Auslastung</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: overBudget ? T.danger : T.warn }}>{pct}%</div>
                <div style={{ background: T.bg, borderRadius: 4, height: 6, marginTop: 6 }}><div style={{ width: `${Math.min(100, pct)}%`, height: "100%", background: overBudget ? T.danger : T.success, borderRadius: 4 }} /></div>
              </Card>
            </div>
            <Card>
              <SectionHead>Maßnahmen-Budget <span style={{ fontWeight: 400, color: T.textMut }}>(Klick auf Zahl → bearbeiten)</span></SectionHead>
              {iAC.length === 0 ? <Empty icon="📋" title="Keine Maßnahmen" sub="" /> : (
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ background: T.bg }}>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Maßnahme</th>
                    <th style={{ padding: "8px 10px", textAlign: "left", fontWeight: 600, color: T.textSec }}>Status</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Geplant (PT)</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Aktuell (PT)</th>
                    <th style={{ padding: "8px 10px", textAlign: "center", fontWeight: 600, color: T.textSec }}>Differenz</th>
                  </tr></thead>
                  <tbody>
                    {iAC.map((a, i) => {
                      const pl = Number(a.planned_days) || 0, ac2 = Number(a.actual_days) || 0, diff = ac2 - pl;
                      return (
                        <tr key={a.id} style={{ borderTop: `1px solid ${T.borderLight}`, background: i % 2 ? T.bg + "66" : "transparent" }}>
                          <td style={{ padding: "7px 10px", fontWeight: 500 }}>{a.title}</td>
                          <td style={{ padding: "7px 10px" }}><Badge color={statusColor(a.status)}>{statusLabel(a.status)}</Badge></td>
                          <td style={{ padding: "7px 10px", textAlign: "center" }}><EditCell value={String(pl || "")} onSave={v => upE("actions", a.id, "planned_days", Number(v) || 0)} style={{ textAlign: "center", minWidth: 40 }} /></td>
                          <td style={{ padding: "7px 10px", textAlign: "center" }}><EditCell value={String(ac2 || "")} onSave={v => upE("actions", a.id, "actual_days", Number(v) || 0)} style={{ textAlign: "center", minWidth: 40 }} /></td>
                          <td style={{ padding: "7px 10px", textAlign: "center", color: diff > 0 ? T.danger : diff < 0 ? T.success : T.textMut, fontWeight: diff !== 0 ? 700 : 400 }}>{diff > 0 ? `+${diff}` : diff < 0 ? String(diff) : "–"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot><tr style={{ borderTop: `2px solid ${T.border}`, fontWeight: 700, background: T.bg }}>
                    <td style={{ padding: "8px 10px" }}>Gesamt</td><td />
                    <td style={{ padding: "8px 10px", textAlign: "center" }}>{totalPlanned}</td>
                    <td style={{ padding: "8px 10px", textAlign: "center", color: overBudget ? T.danger : T.success }}>{totalActual}</td>
                    <td style={{ padding: "8px 10px", textAlign: "center", color: overBudget ? T.danger : T.success, fontWeight: 700 }}>{totalActual - totalPlanned > 0 ? `+${totalActual - totalPlanned}` : totalActual - totalPlanned < 0 ? String(totalActual - totalPlanned) : "–"}</td>
                  </tr></tfoot>
                </table>
              )}
            </Card>
          </div>
        );
      };

      // ─── DOKUMENTE ─────────────────────────────────────────────────────
      const DocsView = () => {
        if (!ini) return <Empty icon="📄" title="Keine Initiative" sub="" />;
        const docs = (ini.documents || []);
        const handleUpload = (e) => {
          const files = Array.from(e.target.files || []);
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              up(d => {
                const i = d.initiatives.find(x => x.id === sel);
                if (i) {
                  if (!i.documents) i.documents = [];
                  i.documents.push({ id: uid("DOC-"), name: file.name, size: file.size, type: file.type, date: today(), dataUrl: ev.target.result });
                }
              });
            };
            reader.readAsDataURL(file);
          });
          e.target.value = "";
        };
        const delDoc = (docId) => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) i.documents = (i.documents || []).filter(x => x.id !== docId); });
        const downloadDoc = (doc) => { const a = document.createElement("a"); a.href = doc.dataUrl; a.download = doc.name; a.click(); };
        const fmtSize = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : (b / 1024).toFixed(0) + " KB";
        const iconFor = (name) => { const ext = (name || "").split(".").pop().toLowerCase(); if (["pptx","ppt"].includes(ext)) return "📊"; if (["xlsx","xls","csv"].includes(ext)) return "📈"; if (["docx","doc"].includes(ext)) return "📝"; if (["pdf"].includes(ext)) return "📕"; if (["png","jpg","jpeg","gif","svg"].includes(ext)) return "🖼️"; return "📎"; };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Dokumente</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Dateien zur Initiative hochladen & verwalten</p></div>
              <label style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "8px 18px", borderRadius: T.rs, background: T.accent, color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: T.font }}>
                ＋ Hochladen<input type="file" multiple onChange={handleUpload} style={{ display: "none" }} accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.png,.jpg,.jpeg,.gif,.svg,.zip" />
              </label>
            </div>
            {docs.length === 0 ? <Empty icon="📄" title="Keine Dokumente" sub="Lade Slides, Docs, Excel oder andere Dateien hoch" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead><tr style={{ background: T.bg }}>
                    {["", "Dateiname", "Typ", "Größe", "Hochgeladen", ""].map(h => <th key={h} style={{ padding: "10px 14px", textAlign: "left", color: T.textMut, fontWeight: 600, fontSize: 11, textTransform: "uppercase" }}>{h}</th>)}
                  </tr></thead>
                  <tbody>{docs.map(doc => (
                    <tr key={doc.id} style={{ borderBottom: `1px solid ${T.borderLight}` }}>
                      <td style={{ padding: "10px 14px", fontSize: 20 }}>{iconFor(doc.name)}</td>
                      <td style={{ padding: "10px 14px", fontWeight: 600, color: T.text, cursor: "pointer" }} onClick={() => downloadDoc(doc)}><span style={{ borderBottom: `1px dashed ${T.accent}`, color: T.accent }}>{doc.name}</span></td>
                      <td style={{ padding: "10px 14px", color: T.textMut }}>{(doc.name || "").split(".").pop().toUpperCase()}</td>
                      <td style={{ padding: "10px 14px", color: T.textMut }}>{fmtSize(doc.size || 0)}</td>
                      <td style={{ padding: "10px 14px", color: T.textMut }}>{fmtDate(doc.date)}</td>
                      <td style={{ padding: "10px 14px" }}>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Btn small onClick={() => downloadDoc(doc)}>⬇</Btn>
                          <Btn v="ghost" small onClick={() => delDoc(doc.id)}>✕</Btn>
                        </div>
                      </td>
                    </tr>
                  ))}</tbody>
                </table>
              </Card>
            )}
            <p style={{ marginTop: 16, fontSize: 11, color: T.textMut }}>Dateien werden im Browser-Speicher abgelegt. Große Dateien (&gt;5 MB) können den Speicher belasten.</p>
          </div>
        );
      };

      // ─── ENGAGEMENT TRACKER ───────────────────────────────────────────
      const EngagementView = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const emptyF = { stakeholder_id: "", date: today(), type: "1:1-Gespräch", notes: "", outcome: "", next_action: "", attachmentName: "", action_ids: [], impact_item_ids: [] };
        const [f, sF] = useState(emptyF);
        if (!ini) return <Empty icon="🤝" title="Keine Initiative" sub="" />;
        const save = () => { if (!f.stakeholder_id) return; if (editId) { up(d => { const e = d.engagements?.find(x => x.id === editId); if (e) Object.assign(e, f); }); } else { up(d => { if (!d.engagements) d.engagements = []; d.engagements.push({ id: uid("E-"), initiative_id: sel, ...f }); }); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (e) => { setEditId(e.id); sF({ stakeholder_id: e.stakeholder_id, date: e.date, type: e.type, notes: e.notes || "", outcome: e.outcome || "", next_action: e.next_action || "", attachmentName: e.attachmentName || "", action_ids: e.action_ids || [], impact_item_ids: e.impact_item_ids || [] }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        const grouped = {};
        iSH.forEach(s => { grouped[s.id] = { stakeholder: s, engagements: iENG.filter(e => e.stakeholder_id === s.id).sort((a, b) => b.date.localeCompare(a.date)) }; });
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Engagement Tracker</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Stakeholder-Interaktionen & Ergebnisse</p></div>
              <Btn v="primary" onClick={openNew}>＋ Engagement</Btn>
            </div>
            {iSH.length === 0 ? <Empty icon="🤝" title="Keine Stakeholder" sub="Erst Stakeholder anlegen" /> : (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                {Object.values(grouped).map(({ stakeholder: s, engagements: engs }) => {
                  const daysSince = engs[0] ? daysBetween(engs[0].date, today()) : null;
                  const urgent = s.influence >= 7 && (daysSince === null || daysSince > 14);
                  return (
                    <Card key={s.id} style={{ borderLeft: `4px solid ${urgent ? T.danger : readyColor(s.readiness)}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 14, fontWeight: 600, color: T.text }}>{s.name}</span>
                          <Badge color={T.purple}>{(s.roles || [s.role]).join(", ")}</Badge><Badge color={readyColor(s.readiness)}>{s.readiness}</Badge>
                          <span style={{ fontSize: 11, color: T.textMut }}>Einfl: {s.influence} / Int: {s.interest}</span>
                        </div>
                        {urgent && <Badge color={T.danger}>⚠ Engagement überfällig</Badge>}
                      </div>
                      {engs.length === 0 ? <p style={{ fontSize: 12, color: T.textMut, fontStyle: "italic" }}>Noch kein Engagement dokumentiert</p> : (
                        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          {engs.slice(0, 5).map(e => (
                            <div key={e.id} onClick={() => openEdit(e)} style={{ padding: "8px 12px", background: T.bg, borderRadius: T.rs, fontSize: 12, cursor: "pointer" }}>
                              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                                <span style={{ fontWeight: 600, color: T.text }}>{fmtDate(e.date)} – {e.type}</span>
                                <Btn v="ghost" small onClick={ev => { ev.stopPropagation(); up(d => d.engagements = d.engagements.filter(x => x.id !== e.id)); }}>✕</Btn>
                              </div>
                              {e.notes && <div style={{ color: T.textSec, marginBottom: 2 }}>{e.notes}</div>}
                              {e.outcome && <div style={{ color: T.accent }}>Ergebnis: {e.outcome}</div>}
                              {e.next_action && <div style={{ color: T.warn }}>Nächste Aktion: {e.next_action}</div>}
                              {e.attachmentName && <div style={{ color: T.purple }}>📎 {e.attachmentName}</div>}
                              {(e.action_ids || []).length > 0 && <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginTop: 3 }}>{e.action_ids.map(aid => { const ac = iAC.find(a => a.id === aid); return ac ? <Badge key={aid} color={T.cyan}>{ac.title?.slice(0,25)}</Badge> : null; })}</div>}
                            </div>
                          ))}
                          {engs.length > 5 && <span style={{ fontSize: 11, color: T.textMut }}>+{engs.length - 5} weitere</span>}
                        </div>
                      )}
                    </Card>
                  );
                })}
              </div>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Engagement bearbeiten" : "Engagement dokumentieren"}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Stakeholder" value={f.stakeholder_id} onChange={v => sF(p => ({ ...p, stakeholder_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Datum" value={f.date} onChange={v => sF(p => ({ ...p, date: v }))} type="date" />
                <Input label="Art" value={f.type} onChange={v => sF(p => ({ ...p, type: v }))} options={["1:1-Gespräch", "Workshop", "E-Mail", "Townhall", "Teams-Call", "Informell"]} />
                <Input label="Ergebnis" value={f.outcome} onChange={v => sF(p => ({ ...p, outcome: v }))} />
                <Input label="Notizen" value={f.notes} onChange={v => sF(p => ({ ...p, notes: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Nächste Aktion" value={f.next_action} onChange={v => sF(p => ({ ...p, next_action: v }))} style={{ gridColumn: "1/-1" }} />
                <Input label="Dateianhang (Name/Link)" value={f.attachmentName} onChange={v => sF(p => ({ ...p, attachmentName: v }))} placeholder="z.B. Protokoll_2026-03.pdf" style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Maßnahmen" options={iAC.map(a => ({ value: a.id, label: (a.title || a.id).slice(0, 40) }))} selected={f.action_ids || []} onChange={v => sF(p => ({ ...p, action_ids: v }))} color={T.cyan} /></div>
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Impacts" options={iIM.map(im => ({ value: im.id, label: (im.change_description || im.id).slice(0, 40) }))} selected={f.impact_item_ids || []} onChange={v => sF(p => ({ ...p, impact_item_ids: v }))} color={T.purple} /></div>
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── COMMS MATRIX ─────────────────────────────────────────────────
      const COMMS_TEMPLATES = [
        { label: "🚀 Kick-off / Go-Live-Ankündigung", adkar_phase: "Awareness", key_message: `Wir starten [Initiative]: Am [Datum] beginnt eine wichtige Veränderung für [Zielgruppe]. In den nächsten Wochen erfahrt ihr alles, was ihr wissen müsst.`, channelTags: ["Townhall", "E-Mail"], timing: "Projektstart", frequency: "einmalig" },
        { label: "📅 Go-Live-Countdown", adkar_phase: "Awareness", key_message: `Noch [X] Tage bis zum Go-Live von [Initiative]. Alle notwendigen Informationen und Anleitungen findet ihr in [Link]. Euer Training startet am [Datum].`, channelTags: ["E-Mail", "Intranet"], timing: "4–6 Wochen vor Go-Live", frequency: "einmalig" },
        { label: "👔 Sponsor-Botschaft", adkar_phase: "Desire", key_message: `Als Sponsor von [Initiative] möchte ich euch persönlich den Nutzen dieser Veränderung erläutern: [Begründung]. Ich bin überzeugt, dass diese Investition sich für jeden von euch auszahlen wird.`, channelTags: ["Townhall", "Video"], timing: "Projekt-Kick-off", frequency: "einmalig" },
        { label: "🎓 Training-Einladung", adkar_phase: "Knowledge", key_message: `Dein Training für [System/Prozess] startet am [Datum]. Bitte plane [Dauer] ein. Anmeldung und Unterlagen: [Link]. Bei Fragen: [Kontakt].`, channelTags: ["E-Mail", "Teams-Chat"], timing: "2–3 Wochen vor Training", frequency: "einmalig" },
        { label: "❓ FAQ-Update", adkar_phase: "Knowledge", key_message: `Häufige Fragen zu [Initiative] – jetzt aktualisiert! Die 10 wichtigsten Antworten findet ihr unter [Link]. Weitere Fragen? Postet im [Teams-Kanal] oder meldet euch bei [Kontakt].`, channelTags: ["Intranet", "Teams-Chat", "Newsletter"], timing: "laufend", frequency: "monatlich" },
        { label: "🌟 Erfolgsgeschichte / Quick Win", adkar_phase: "Reinforcement", key_message: `Wir feiern einen ersten Erfolg: [Beschreibung]. Das zeigt, dass [Initiative] wirkt und ihr großartige Arbeit leistet. Danke für euer Engagement!`, channelTags: ["Newsletter", "Townhall", "Yammer/Viva"], timing: "nach erstem nachweisbaren Erfolg", frequency: "einmalig" },
        { label: "🆘 Change-Resistenz ansprechen", adkar_phase: "Desire", key_message: `Wir wissen, dass Veränderungen manchmal herausfordernd sind. Eure Bedenken zu [Thema] nehmen wir ernst. Deshalb haben wir [Maßnahme] eingerichtet. Kommt ins Gespräch: [Angebot].`, channelTags: ["1:1-Gespräch", "Workshop"], timing: "bei Anzeichen von Widerstand", frequency: "einmalig" },
        { label: "📊 Milestone-Update / Status", adkar_phase: "Awareness", key_message: `Update zu [Initiative]: Wir haben [Meilenstein] erreicht. Fortschritt: [X]%. Als Nächstes steht [Schritt] an. Alle Details im Projektbericht: [Link].`, channelTags: ["Newsletter", "Teams-Chat", "Intranet"], timing: "nach Meilensteinen", frequency: "monatlich" },
      ];

      const CommsView = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [showTpl, setShowTpl] = useState(false);
        const emptyF = { target_group_id: "", adkar_phase: "Awareness", key_message: "", channelTags: [], sender_id: "", timing: "", frequency: "", action_ids: [], impact_item_ids: [], stakeholder_ids: [] };
        const [f, sF] = useState(emptyF);
        if (!ini) return <Empty icon="📣" title="Keine Initiative" sub="" />;
        const save = () => { if (!f.key_message) return; if (editId) { up(d => { const c = d.commsItems?.find(x => x.id === editId); if (c) Object.assign(c, f); }); } else { up(d => { if (!d.commsItems) d.commsItems = []; d.commsItems.push({ id: uid("CM-"), initiative_id: sel, ...f }); }); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (c) => { setEditId(c.id); sF({ target_group_id: c.target_group_id || "", adkar_phase: c.adkar_phase || "Awareness", key_message: c.key_message || "", channelTags: c.channelTags || [c.channel].filter(Boolean), sender_id: c.sender_id || "", timing: c.timing || "", frequency: c.frequency || "", action_ids: c.action_ids || [], impact_item_ids: c.impact_item_ids || [], stakeholder_ids: c.stakeholder_ids || [] }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        const applyTemplate = tpl => { sF(p => ({ ...p, adkar_phase: tpl.adkar_phase, key_message: tpl.key_message, channelTags: tpl.channelTags, timing: tpl.timing, frequency: tpl.frequency })); setShowTpl(false); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Kommunikations-Matrix</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Botschaft × Zielgruppe × Kanal × Absender</p></div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowTpl(true)}>📋 Aus Vorlage</Btn>
                <Btn v="primary" onClick={openNew}>＋ Komm.-Item</Btn>
              </div>
            </div>
            <Modal open={showTpl} onClose={() => setShowTpl(false)} title="Kommunikations-Vorlage wählen" wide>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {COMMS_TEMPLATES.map((tpl, i) => (
                  <div key={i} style={{ padding: "12px 14px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${ADKAR_C[tpl.adkar_phase] || T.accent}`, cursor: "pointer" }} onClick={() => applyTemplate(tpl)}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <span style={{ fontWeight: 700, fontSize: 13 }}>{tpl.label}</span>
                      <Badge color={ADKAR_C[tpl.adkar_phase]}>{tpl.adkar_phase}</Badge>
                    </div>
                    <div style={{ fontSize: 11, color: T.textSec, lineHeight: 1.5 }}>{tpl.key_message.slice(0, 120)}…</div>
                    <div style={{ marginTop: 6, display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {(tpl.channelTags || []).map(c => <Badge key={c} color={T.cyan}>{c}</Badge>)}
                    </div>
                  </div>
                ))}
              </div>
            </Modal>
            {iCOM.length === 0 ? <Empty icon="📣" title="Keine Kommunikation geplant" sub="" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}><div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead><tr style={{ background: T.bg }}>{["Zielgruppe", "ADKAR", "Kernbotschaft", "Kanal", "Absender", "Timing", ""].map(h => <th key={h} style={{ padding: 14, textAlign: "left", color: T.textMut, fontWeight: 700, fontSize: 11, textTransform: "uppercase" }}>{h}</th>)}</tr></thead>
                  <tbody>{iCOM.map(c => {
                    const tg = iTG.find(t => t.id === c.target_group_id); const sender = iSH.find(s => s.id === c.sender_id);
                    return <tr key={c.id} style={{ borderBottom: `1px solid ${T.borderLight}`, cursor: "pointer" }} onClick={() => openEdit(c)}>
                      <td style={{ padding: "8px 10px", fontWeight: 500 }}>{tg?.name || "Alle"}</td>
                      <td style={{ padding: "8px 10px" }}><Badge color={ADKAR_C[c.adkar_phase]}>{c.adkar_phase}</Badge></td>
                      <td style={{ padding: "8px 10px", color: T.textSec, maxWidth: 220 }}>{c.key_message}</td>
                      <td style={{ padding: "8px 10px" }}>{(c.channelTags || [c.channel]).map(ch => <Badge key={ch} color={T.cyan}>{ch}</Badge>)}</td>
                      <td style={{ padding: "8px 10px" }}>{sender ? <Badge color={T.purple}>{sender.name}</Badge> : "–"}</td>
                      <td style={{ padding: "8px 10px", color: T.textMut }}>{c.timing || "–"}{c.frequency ? ` (${c.frequency})` : ""}</td>
                      <td style={{ padding: "8px 10px" }}><Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => d.commsItems = d.commsItems.filter(x => x.id !== c.id)); }}>✕</Btn></td>
                    </tr>;
                  })}</tbody>
                </table>
              </div></Card>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Komm.-Item bearbeiten" : "Neues Komm.-Item"} wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Zielgruppe" value={f.target_group_id} onChange={v => sF(p => ({ ...p, target_group_id: v }))} options={[{ value: "", label: "Alle" }, ...iTG.map(t => ({ value: t.id, label: t.name }))]} />
                <Input label="ADKAR-Phase" value={f.adkar_phase} onChange={v => sF(p => ({ ...p, adkar_phase: v }))} options={ADKAR} />
                <Input label="Kernbotschaft" value={f.key_message} onChange={v => sF(p => ({ ...p, key_message: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Kanal/Kanäle – frei anlegbar" tags={f.channelTags} onChange={v => sF(p => ({ ...p, channelTags: v }))} suggestions={tags.channels} color={T.cyan} /></div>
                <Input label="Absender" value={f.sender_id} onChange={v => sF(p => ({ ...p, sender_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Timing" value={f.timing} onChange={v => sF(p => ({ ...p, timing: v }))} placeholder="z.B. 4 Wochen vor Go-Live" />
                <Input label="Frequenz" value={f.frequency} onChange={v => sF(p => ({ ...p, frequency: v }))} placeholder="z.B. einmalig, wöchentlich" />
                <div />
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Maßnahmen" options={iAC.map(a => ({ value: a.id, label: (a.title || a.id).slice(0, 40) }))} selected={f.action_ids || []} onChange={v => sF(p => ({ ...p, action_ids: v }))} color={T.cyan} /></div>
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Impacts" options={iIM.map(im => ({ value: im.id, label: (im.change_description || im.id).slice(0, 40) }))} selected={f.impact_item_ids || []} onChange={v => sF(p => ({ ...p, impact_item_ids: v }))} color={T.purple} /></div>
                <div style={{ gridColumn: "1/-1" }}><LinkSelect label="Verknüpfte Stakeholder" options={iSH.map(s => ({ value: s.id, label: s.name }))} selected={f.stakeholder_ids || []} onChange={v => sF(p => ({ ...p, stakeholder_ids: v }))} color={T.accent} /></div>
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── CHANGE SATURATION ────────────────────────────────────────────
      const SaturationView = () => {
        if (!ini) return <Empty icon="🌡️" title="Keine Initiative" sub="" />;
        if (iTG.length === 0 || iIM.length === 0) return <div><h2 style={{ margin: "0 0 20px", fontSize: 22, fontWeight: 700 }}>Change Saturation</h2><Empty icon="🌡️" title="Daten fehlen" sub="Zielgruppen und Impacts benötigt" /></div>;
        const DIMS_DE = { People: "Rollen", Process: "Prozesse", Technology: "Technologie", Org: "Organisation", Kultur: "Kultur" };
        return (
          <div>
            <h2 style={{ margin: "0 0 4px", fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Change Saturation</h2>
            <p style={{ margin: "0 0 24px", fontSize: 13, color: T.textMut }}>Wie viel Change trifft auf jede Zielgruppe?</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {iTG.map(tg => {
                const impacts = iIM.filter(i => i.target_group_id === tg.id);
                const totalScore = impacts.reduce((s, i) => s + (i.impact_level || 0), 0);
                const avgScore = impacts.length ? (totalScore / impacts.length).toFixed(1) : 0;
                const maxTraining = impacts.length ? Math.max(...impacts.map(i => i.training_need || 0)) : 0;
                const maxComms = impacts.length ? Math.max(...impacts.map(i => i.comms_need || 0)) : 0;
                const avgCrit = impacts.length ? (impacts.reduce((s, i) => s + (i.criticality || 0), 0) / impacts.length).toFixed(1) : 0;
                const actionsCount = iAC.filter(a => (a.target_group_ids || []).includes(tg.id)).length;
                const satPct = impacts.length * 10 ? Math.round(totalScore / (impacts.length * 10) * 100) : 0;
                const critical = totalScore > 25;
                const dimScores = DIMS.map(d => {
                  const items = impacts.filter(i => i.dimension === d);
                  return { dim: d, de: DIMS_DE[d], icon: DIM_IC[d], score: items.reduce((s, i) => s + (i.impact_level || 0), 0), count: items.length, maxImpact: items.length ? Math.max(...items.map(i => i.impact_level || 0)) : 0, avgTrain: items.length ? (items.reduce((s, i) => s + (i.training_need || 0), 0) / items.length).toFixed(1) : "–", avgComms: items.length ? (items.reduce((s, i) => s + (i.comms_need || 0), 0) / items.length).toFixed(1) : "–" };
                });
                return (
                  <Card key={tg.id} style={{ borderLeft: `4px solid ${critical ? T.danger : totalScore > 15 ? T.warn : T.success}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                      <div><span style={{ fontSize: 16, fontWeight: 700 }}>{tg.name}</span><span style={{ fontSize: 12, color: T.textMut, marginLeft: 8 }}>({tg.size} Personen)</span></div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <Badge color={critical ? T.danger : T.success}>Σ {totalScore}</Badge>
                        <Badge color={T.textMut}>Ø {avgScore}</Badge>
                        <Badge color={T.textMut}>Ø Krit. {avgCrit}</Badge>
                        <Badge color={T.textMut}>{impacts.length} Impacts</Badge>
                        <Badge color={T.accent}>{actionsCount} Maßn.</Badge>
                        {critical && <Badge color={T.danger}>⚠ KRITISCH</Badge>}
                      </div>
                    </div>
                    <div style={{ background: T.bg, borderRadius: 4, height: 8, overflow: "hidden", marginBottom: 14 }}>
                      <div style={{ width: `${Math.min(satPct, 100)}%`, height: "100%", background: critical ? `linear-gradient(90deg,${T.warn},${T.danger})` : `linear-gradient(90deg,${T.success},${T.accent})`, borderRadius: 4 }} />
                    </div>
                    <div style={{ display: "flex", gap: 8 }}>
                      {dimScores.map(d => (
                        <div key={d.dim} style={{ flex: 1, padding: "10px 8px", background: T.bg, borderRadius: T.rs, textAlign: "center", borderTop: `3px solid ${d.score >= 8 ? T.danger : d.score >= 5 ? T.warn : d.count > 0 ? T.success : T.borderLight}` }}>
                          <div style={{ fontSize: 11, color: T.textMut, marginBottom: 6 }}>{d.icon} {d.de}</div>
                          <div style={{ fontSize: 22, fontWeight: 700, color: d.score >= 8 ? T.danger : d.score >= 5 ? T.warn : T.success, marginBottom: 4 }}>{d.score}</div>
                          <div style={{ fontSize: 10, color: T.textMut }}>{d.count} Items</div>
                          {d.count > 0 && <>
                            <div style={{ fontSize: 10, color: T.textMut, marginTop: 4 }}>Max: {d.maxImpact}</div>
                            <div style={{ fontSize: 10, color: T.textMut }}>Ø Train: {d.avgTrain}</div>
                            <div style={{ fontSize: 10, color: T.textMut }}>Ø Komm: {d.avgComms}</div>
                          </>}
                        </div>
                      ))}
                    </div>
                  </Card>
                );
              })}
            </div>
          </div>
        );
      };

      // ─── HEATMAP ──────────────────────────────────────────────────────
      const HeatmapView = () => {
        if (!ini || iTG.length === 0 || iIM.length === 0) return <div><h2 style={{ margin: "0 0 20px", fontSize: 22, fontWeight: 700 }}>Impact Heatmap</h2><Empty icon="🔥" title="Daten fehlen" sub="" /></div>;
        const mx = (tg, dim) => { const items = iIM.filter(i => i.target_group_id === tg && i.dimension === dim); if (!items.length) return null; return Math.max(...items.map(i => i.impact_level || 0)); };
        return (
          <div>
            <h2 style={{ margin: "0 0 24px", fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Impact Heatmap</h2>
            <Card style={{ padding: 0, overflow: "hidden" }}>
              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead><tr style={{ background: T.bg }}><th style={{ padding: 14, textAlign: "left", fontSize: 11, fontWeight: 700, color: T.textMut }}>ZIELGRUPPE</th>{DIMS.map(d => <th key={d} style={{ padding: 14, textAlign: "center", fontSize: 11, fontWeight: 700, color: T.textMut }}>{DIM_IC[d]} {d}</th>)}</tr></thead>
                <tbody>{iTG.map(tg => <tr key={tg.id} style={{ borderBottom: `1px solid ${T.borderLight}` }}>
                  <td style={{ padding: 14, fontSize: 13, fontWeight: 600 }}>{tg.name} <span style={{ fontSize: 11, fontWeight: 400, color: T.textMut }}>({tg.size})</span></td>
                  {DIMS.map(d => { const v = mx(tg.id, d); return <td key={d} style={{ padding: 10, textAlign: "center" }}>{v !== null ? <ScoreDot value={v} size={44} /> : <span style={{ color: T.borderLight }}>–</span>}</td>; })}
                </tr>)}</tbody>
              </table>
            </Card>
          </div>
        );
      };

      // ─── TIMELINE ─────────────────────────────────────────────────────
      const TimelineView = () => {
        const [tvSub, setTvSub] = useState("zeitstrahl");
        if (!ini) return <Empty icon="📅" title="Keine Initiative" sub="" />;
        const events = [];
        iAC.forEach(a => events.push({ date: a.due_date || "", type: "action", icon: "📋", label: a.title, detail: statusLabel(a.status), color: statusColor(a.status), tags: (a.typeTags || [a.type]), nav: () => { setNav("initiative"); setSub("actions"); } }));
        iENG.forEach(e => { const s = iSH.find(x => x.id === e.stakeholder_id); events.push({ date: e.date || "", type: "engagement", icon: "🤝", label: `${s?.name || "?"}: ${e.type}`, detail: e.outcome || e.notes || "", color: T.purple, tags: [], nav: () => setNav("engagement") }); });
        iCOM.forEach(c => events.push({ date: c.timing || "", type: "comms", icon: "📣", label: c.key_message?.slice(0, 50), detail: (c.channelTags || [c.channel])?.join(", ") || "", color: T.cyan, tags: [], nav: () => setNav("comms") }));
        iIM.forEach(im => events.push({ date: "", type: "impact", icon: "⚡", label: im.change_description?.slice(0, 50), detail: `${im.dimension} – Impact: ${im.impact_level}`, color: scoreColor(im.impact_level), tags: [], nav: () => { setNav("initiative"); setSub("impacts"); } }));
        events.sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));
        const months = {}; events.forEach(e => { const m = e.date && e.date.length >= 7 ? e.date.slice(0, 7) : "undatiert"; if (!months[m]) months[m] = []; months[m].push(e); });
        // Gantt/Roadmap
        const acWithDate = iAC.filter(a => a.due_date).sort((a, b) => a.due_date.localeCompare(b.due_date));
        const ganttMin = acWithDate.length ? acWithDate[0].due_date : today();
        const ganttMax = acWithDate.length ? acWithDate[acWithDate.length - 1].due_date : today();
        const ganttSpan = Math.max(1, daysBetween(ganttMin, ganttMax) + 14);
        const barPos = d => Math.max(0, Math.min(96, daysBetween(ganttMin, d) / ganttSpan * 100));
        const barW = Math.max(2, 14 / ganttSpan * 100);
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Timeline</h2>
              <div style={{ display: "flex", gap: 4 }}>
                <Btn small v={tvSub === "zeitstrahl" ? "primary" : "default"} onClick={() => setTvSub("zeitstrahl")}>📋 Zeitstrahl</Btn>
                <Btn small v={tvSub === "roadmap" ? "primary" : "default"} onClick={() => setTvSub("roadmap")}>📊 Roadmap</Btn>
              </div>
            </div>
            {tvSub === "zeitstrahl" && (events.length === 0 ? <Empty icon="📅" title="Keine Ereignisse" sub="" /> : (
              <div style={{ position: "relative", paddingLeft: 24 }}>
                <div style={{ position: "absolute", left: 9, top: 0, bottom: 0, width: 2, background: T.border }} />
                {Object.entries(months).map(([m, evts]) => (
                  <div key={m} style={{ marginBottom: 28 }}>
                    <div style={{ position: "relative", marginBottom: 12, paddingLeft: 18 }}><div style={{ position: "absolute", left: -18, top: 3, width: 14, height: 14, borderRadius: "50%", background: T.accent, border: `3px solid ${T.surface}`, boxShadow: T.shadow }} /><span style={{ fontSize: 13, fontWeight: 700, color: T.accent }}>{m === "undatiert" ? "Ohne Datum" : new Date(m + "-01").toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</span></div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, paddingLeft: 18 }}>
                      {evts.map((ev, i) => (
                        <Card key={i} onClick={ev.nav} style={{ padding: 12, borderLeft: `3px solid ${ev.color}`, cursor: "pointer" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                            <span>{ev.icon}</span>
                            <span style={{ fontSize: 13, fontWeight: 600, color: T.text }}>{ev.label}</span>
                            <span style={{ fontSize: 10, color: T.accent, marginLeft: "auto" }}>→ öffnen</span>
                          </div>
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                            {ev.detail && <Badge color={ev.color}>{ev.detail}</Badge>}
                            {ev.tags.map(t => <Badge key={t} color={T.cyan}>{t}</Badge>)}
                          </div>
                        </Card>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            ))}
            {tvSub === "roadmap" && (acWithDate.length === 0 ? <Empty icon="📊" title="Keine Maßnahmen mit Fälligkeitsdatum" sub="Weise Maßnahmen ein Fälligkeitsdatum zu" /> : (
              <Card>
                <div style={{ display: "flex", marginBottom: 10 }}>
                  <div style={{ width: 210, flexShrink: 0 }} />
                  <div style={{ flex: 1, display: "flex", justifyContent: "space-between", fontSize: 11, color: T.textMut }}>
                    <span>{fmtDate(ganttMin)}</span><span>{fmtDate(ganttMax)}</span>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 12, marginBottom: 12, paddingLeft: 210 }}>
                  {["planned","in_progress","done"].map(st => <span key={st} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: T.textMut }}><div style={{ width: 10, height: 10, borderRadius: 2, background: statusColor(st) }} />{statusLabel(st)}</span>)}
                </div>
                {acWithDate.map(a => (
                  <div key={a.id} style={{ display: "flex", alignItems: "center", marginBottom: 5 }}>
                    <div style={{ width: 210, flexShrink: 0, fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", paddingRight: 10, color: T.text, fontWeight: 500 }} title={a.title}>{a.title}</div>
                    <div style={{ flex: 1, background: T.bg, borderRadius: 3, height: 18, position: "relative" }}>
                      <div style={{ position: "absolute", left: `${Math.max(0, barPos(a.due_date) - barW)}%`, width: `${barW}%`, height: "100%", background: statusColor(a.status), borderRadius: 3, opacity: 0.8 }} title={fmtDate(a.due_date)} />
                    </div>
                    <div style={{ flexShrink: 0, width: 80, textAlign: "right", fontSize: 10.5, color: T.textMut, paddingLeft: 6 }}>{fmtDate(a.due_date)}</div>
                  </div>
                ))}
              </Card>
            ))}
          </div>
        );
      };

      // ─── METHODS LIBRARY ──────────────────────────────────────────────
      const MethodsView = () => {
        const [filter, setFilter] = useState("Alle");
        const methods = data.methods || METHODS;
        const cats = ["Alle", ...new Set(methods.map(m => m.category))];
        const filtered = filter === "Alle" ? methods : methods.filter(m => m.category === filter);
        const [showNew, setShowNew] = useState(false);
        const emptyMethod = { name: "", category: "Analyse", adkar: [], effort: "Mittel", duration: "", when: "", description: "", bestFor: "", steps: [""], outputs: [""] };
        const [mf, sMf] = useState(emptyMethod);
        const addMethod = () => { if (!mf.name) return; up(d => { if (!d.methods) d.methods = [...METHODS]; d.methods.push({ ...mf, id: uid("m"), steps: mf.steps.filter(Boolean), outputs: mf.outputs.filter(Boolean) }); }); sMf(emptyMethod); setShowNew(false); };
        const delMethod = id => up(d => { d.methods = (d.methods || []).filter(m => m.id !== id); });
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Methoden-Bibliothek</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Bewährte Change-Formate der adesso</p></div>
              <Btn v="primary" onClick={() => setShowNew(true)}>＋ Neue Methode</Btn>
            </div>
            <div style={{ display: "flex", gap: 4, marginBottom: 20, flexWrap: "wrap" }}>
              {cats.map(c => <button key={c} onClick={() => setFilter(c)} style={{ padding: "6px 14px", borderRadius: T.rs, border: "none", cursor: "pointer", fontSize: 12, fontWeight: filter === c ? 600 : 400, fontFamily: T.font, background: filter === c ? T.accent : T.bg, color: filter === c ? "#fff" : T.textSec, transition: "all .12s" }}>{c}</button>)}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 14 }}>
              {filtered.map(m => (
                <Card key={m.id} onClick={() => setMethodDetail(m)} style={{ cursor: "pointer" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: T.text }}>{m.name}</span>
                    <div style={{ display: "flex", gap: 4 }}><Badge color={T.purple}>{m.category}</Badge><Btn v="ghost" small onClick={e => { e.stopPropagation(); delMethod(m.id); }}>✕</Btn></div>
                  </div>
                  <p style={{ fontSize: 12, color: T.textSec, margin: "0 0 10px", lineHeight: 1.5 }}>{(m.description || "").slice(0, 120)}…</p>
                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>

                <div style={{ gridColumn: "1/-1" }}>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>ADKAR-Phasen</label>
                  <div style={{ display: "flex", gap: 5, marginTop: 5 }}>{ADKAR.map(a => <button key={a} onClick={() => sMf(p => ({ ...p, adkar: p.adkar.includes(a) ? p.adkar.filter(x => x !== a) : [...p.adkar, a] }))} style={{ padding: "5px 12px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 11.5, fontFamily: T.font, fontWeight: 600, background: mf.adkar.includes(a) ? ADKAR_C[a] + "20" : T.bg, color: mf.adkar.includes(a) ? ADKAR_C[a] : T.textMut, outline: mf.adkar.includes(a) ? `2px solid ${ADKAR_C[a]}` : "none" }}>{a}</button>)}</div>

                <div style={{ gridColumn: "1/-1" }}>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Schritte (je Zeile ein Schritt)</label>

      // ─── PROJEKTREFERENZEN ──────────────────────────────────────────
      const ReferencesView = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const refs = data.references || [];
        const emptyF = { name: "", goal: "", industry: "", startDate: "", endDate: "", personDays: "", volume: "", ausgangslage: "", vorgehensweise: "", resultate: "", internKontakt: "", internKontaktDetails: "", externKontakt: "", externKontaktDetails: "" };
        const [f, sF] = useState(emptyF);
        const save = () => { if (!f.name) return; if (editId) { up(d => { const r = d.references?.find(x => x.id === editId); if (r) Object.assign(r, f, { personDays: Number(f.personDays) || 0, volume: Number(f.volume) || 0 }); }); } else { up(d => { if (!d.references) d.references = []; d.references.push({ id: uid("REF-"), ...f, personDays: Number(f.personDays) || 0, volume: Number(f.volume) || 0 }); }); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (r) => { setEditId(r.id); sF({ name: r.name, goal: r.goal || "", industry: r.industry || "", startDate: r.startDate || "", endDate: r.endDate || "", personDays: String(r.personDays || ""), volume: String(r.volume || ""), ausgangslage: r.ausgangslage || "", vorgehensweise: r.vorgehensweise || "", resultate: r.resultate || "", internKontakt: r.internKontakt || "", internKontaktDetails: r.internKontaktDetails || "", externKontakt: r.externKontakt || "", externKontaktDetails: r.externKontaktDetails || "" }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Projektreferenzen</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Vergangene Projekte & Erfahrungen dokumentieren</p></div>
              <Btn v="primary" onClick={openNew}>＋ Referenz</Btn>
            </div>
            {refs.length === 0 ? <Empty icon="📑" title="Keine Referenzen" sub="Dokumentiere vergangene Projekte" action={<Btn v="primary" onClick={openNew}>Erste Referenz</Btn>} /> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(340px,1fr))", gap: 14 }}>
                {refs.map(r => (
                  <Card key={r.id} onClick={() => openEdit(r)} style={{ cursor: "pointer" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                      <span style={{ fontSize: 15, fontWeight: 700 }}>{r.name}</span>
                      <Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => { d.references = (d.references || []).filter(x => x.id !== r.id); }); }}>✕</Btn>
                    </div>
                    {r.industry && <Badge color={T.purple}>{r.industry}</Badge>}
                    {r.goal && <p style={{ fontSize: 12, color: T.textSec, margin: "6px 0" }}>{r.goal}</p>}
                    <div style={{ display: "flex", gap: 10, fontSize: 11, color: T.textMut, marginBottom: 8 }}>
                      {r.startDate && <span>📅 {fmtDate(r.startDate)} – {fmtDate(r.endDate)}</span>}
                      {r.personDays > 0 && <span>👤 {r.personDays} PT</span>}
                      {r.volume > 0 && <span>💰 {Number(r.volume).toLocaleString("de-DE")}€</span>}
                    </div>
                    {r.ausgangslage && <div style={{ marginBottom: 6 }}><span style={{ fontSize: 10, fontWeight: 700, color: T.textSec }}>AUSGANGSLAGE</span><p style={{ fontSize: 12, color: T.text, margin: "2px 0 0" }}>{r.ausgangslage.slice(0, 100)}{r.ausgangslage.length > 100 ? "…" : ""}</p></div>}
                    {r.resultate && <div><span style={{ fontSize: 10, fontWeight: 700, color: T.textSec }}>RESULTATE</span><p style={{ fontSize: 12, color: T.text, margin: "2px 0 0" }}>{r.resultate.slice(0, 100)}{r.resultate.length > 100 ? "…" : ""}</p></div>}
                    {(r.internKontakt || r.externKontakt) && <div style={{ marginTop: 8, display: "flex", gap: 12, fontSize: 11, color: T.textMut }}>
                      {r.internKontakt && <span>🏢 {r.internKontakt}</span>}
                      {r.externKontakt && <span>🌐 {r.externKontakt}</span>}
                    </div>}
                  </Card>
                ))}
              </div>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Referenz bearbeiten" : "Neue Projektreferenz"} wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Projektname" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <Input label="Ziel / Kurzbeschreibung" value={f.goal} onChange={v => sF(p => ({ ...p, goal: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Branche" value={f.industry} onChange={v => sF(p => ({ ...p, industry: v }))} options={INDUSTRIES} />
                <div />
                <Input label="Startdatum" value={f.startDate} onChange={v => sF(p => ({ ...p, startDate: v }))} type="date" />
                <Input label="Enddatum" value={f.endDate} onChange={v => sF(p => ({ ...p, endDate: v }))} type="date" />
                <Input label="Personentage (PT)" value={f.personDays} onChange={v => sF(p => ({ ...p, personDays: v }))} type="number" />
                <Input label="Auftragsvolumen (€)" value={f.volume} onChange={v => sF(p => ({ ...p, volume: v }))} type="number" />
                <Input label="Ausgangslage" value={f.ausgangslage} onChange={v => sF(p => ({ ...p, ausgangslage: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Vorgehensweise" value={f.vorgehensweise} onChange={v => sF(p => ({ ...p, vorgehensweise: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Resultate" value={f.resultate} onChange={v => sF(p => ({ ...p, resultate: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <Input label="Interner Kontakt (Name)" value={f.internKontakt} onChange={v => sF(p => ({ ...p, internKontakt: v }))} />
                <Input label="Kontaktdaten intern (E-Mail/Tel.)" value={f.internKontaktDetails} onChange={v => sF(p => ({ ...p, internKontaktDetails: v }))} />
                <Input label="Externer Kontakt (Name)" value={f.externKontakt} onChange={v => sF(p => ({ ...p, externKontakt: v }))} />

          </div>
        );
      };

      // ─── PDF REPORT ──────────────────────────────────────────────────
      const PDFReportView = () => {
        if (!ini) return <Empty icon="📄" title="Keine Initiative" sub="" />;
        const dn = iAC.filter(a => a.status === "done").length;
        const pct = iAC.length ? Math.round(dn / iAC.length * 100) : 0;
        const adkar = adkarCov(iAC);
        const gaps = ADKAR.filter(a => adkar[a] === 0);
        const p4 = ini.fourPs || {};
        const S = { fontSize: 13, lineHeight: 1.7, color: T.text };
        const H2 = { fontSize: 18, fontWeight: 700, color: T.adessoBlau, margin: "24px 0 10px", borderBottom: `2px solid ${T.accent}`, paddingBottom: 6 };
        const H3 = { fontSize: 14, fontWeight: 700, color: T.text, margin: "16px 0 6px" };
        const TH = { padding: "6px 10px", textAlign: "left", fontSize: 11, fontWeight: 700, color: T.textMut, background: T.bg, borderBottom: `1px solid ${T.border}` };
        const TD = { padding: "6px 10px", fontSize: 12, borderBottom: `1px solid ${T.borderLight}` };
        return (
          <div>
            <div className="no-print" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
              <Btn onClick={() => setNav("dashboard")}>← Zurück zum Dashboard</Btn>
              <Btn v="primary" onClick={() => window.print()}>🖨️ Drucken / PDF speichern</Btn>
            </div>
            <div style={{ maxWidth: 800, margin: "0 auto" }}>
              <h1 style={{ fontSize: 28, fontWeight: 700, color: T.adessoBlau, marginBottom: 4 }}>{ini.name}</h1>
              <p style={{ fontSize: 13, color: T.textMut, marginBottom: 4 }}>Statusreport – {fmtDate(today())}</p>
              {ini.goal && <p style={{ ...S, fontStyle: "italic", marginBottom: 20 }}>{ini.goal}</p>}

              <div style={H2}>Projektübersicht</div>
              <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <tbody>
                  {[["Branche", ini.industry], ["Priorität", ini.priority], ["Zeitraum", ini.startDate ? `${fmtDate(ini.startDate)} – ${fmtDate(ini.endDate)}` : "–"], ["Go-Live", ini.milestones?.[0]?.date ? fmtDate(ini.milestones[0].date) : "–"], ["Personentage", ini.personDays ? `${ini.personDays} PT` : "–"], ["Volumen", ini.volume ? `${Number(ini.volume).toLocaleString("de-DE")}€` : "–"], ["Fortschritt", `${pct}% (${dn}/${iAC.length} Maßnahmen)`]].map(([l, v]) => (
                    <tr key={l}><td style={{ ...TD, fontWeight: 600, width: 160 }}>{l}</td><td style={TD}>{v || "–"}</td></tr>
                  ))}
                </tbody>
              </table>

              {(p4.project || p4.purpose || p4.particulars || p4.people) && <>
                <div style={H2}>Projektdefinition</div>
                {p4.project && <><div style={H3}>Projekt</div><p style={S}>{p4.project}</p></>}
                {p4.purpose && <><div style={H3}>Zweck</div><p style={S}>{p4.purpose}</p></>}
                {p4.particulars && <><div style={H3}>Besonderheiten</div><p style={S}>{p4.particulars}</p></>}
                {p4.people && <><div style={H3}>Betroffene</div><p style={S}>{p4.people}</p></>}
              </>}

              {gaps.length > 0 && <div style={{ padding: 12, background: T.warnLt, borderRadius: T.rs, marginTop: 16, fontSize: 13 }}>⚠ ADKAR-Lücken: <strong>{gaps.join(", ")}</strong> – keine Maßnahmen zugeordnet</div>}

              <div style={H2}>ADKAR Coverage</div>
              <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
                {ADKAR.map(a => <div key={a} style={{ flex: 1, textAlign: "center", padding: 10, background: T.bg, borderRadius: T.rs }}>
                  <div style={{ fontSize: 20, fontWeight: 700, color: ADKAR_C[a] }}>{adkar[a]}</div>
                  <div style={{ fontSize: 10, fontWeight: 600 }}>{a}</div>
                </div>)}
              </div>

              <div style={H2}>Stakeholder ({iSH.length})</div>
              {iSH.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Name", "Rolle(n)", "Organisationseinheit", "Einfl.", "Int.", "Readiness", "Notizen"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                <tbody>{iSH.map(s => <tr key={s.id}>
                  <td style={{ ...TD, fontWeight: 600 }}>{s.name}</td>
                  <td style={TD}>{(s.roles || [s.role]).join(", ")}</td>
                  <td style={TD}>{s.org_unit || "–"}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{s.influence}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{s.interest}</td>
                  <td style={TD}>{s.readiness}</td>
                  <td style={{ ...TD, fontSize: 11 }}>{s.notes || "–"}</td>
                </tr>)}</tbody>
              </table>}

              <div style={H2}>Zielgruppen ({iTG.length})</div>
              {iTG.map(tg => <div key={tg.id} style={{ marginBottom: 10, padding: 10, background: T.bg, borderRadius: T.rs }}>
                <span style={{ fontWeight: 700 }}>{tg.name}</span> – {tg.size} Personen • {(tg.org_units || []).join(", ") || "–"}
              </div>)}

              <div style={H2}>Impact Items ({iIM.length})</div>
              {iIM.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Zielgruppe", "Dimension", "Beschreibung", "Impact", "Krit.", "Training", "Komm."].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>

                  <td style={TD}>{im.dimension}</td>
                  <td style={{ ...TD, maxWidth: 200 }}>{im.change_description}</td>
                  <td style={{ ...TD, textAlign: "center", fontWeight: 700, color: scoreColor(im.impact_level) }}>{im.impact_level}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{im.criticality}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{im.training_need}</td>
                  <td style={{ ...TD, textAlign: "center" }}>{im.comms_need}</td>
                </tr>; })}</tbody>
              </table>}

              <div style={H2}>Maßnahmen ({iAC.length})</div>
              {iAC.length > 0 && <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                <thead><tr>{["Maßnahme", "Typ", "Status", "Fällig", "Owner", "ADKAR"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                <tbody>{iAC.map(a => { const ow = iSH.find(s => s.id === a.owner_person_id); return <tr key={a.id}>

                  <td style={{ ...TD, color: statusColor(a.status) }}>{statusLabel(a.status)}</td>
                  <td style={TD}>{a.due_date ? fmtDate(a.due_date) : "–"}</td>
                  <td style={TD}>{ow?.name || "–"}</td>
                  <td style={TD}>{(a.adkar_tags || []).join(", ")}</td>
                </tr>; })}</tbody>
              </table>}

                <div style={H2}>Engagements ({iENG.length})</div>

                  <tbody>{iENG.sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(e => { const s = iSH.find(x => x.id === e.stakeholder_id); return <tr key={e.id}>
                    <td style={TD}>{fmtDate(e.date)}</td>
                    <td style={{ ...TD, fontWeight: 600 }}>{s?.name || "–"}</td>
                    <td style={TD}>{e.type}</td>
                    <td style={TD}>{e.outcome || "–"}</td>
                    <td style={TD}>{e.next_action || "–"}</td>
                  </tr>; })}</tbody>
                </table>
              </>}

              {iCOM.length > 0 && <>
                <div style={H2}>Kommunikationsplanung ({iCOM.length})</div>
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 12 }}>
                  <thead><tr>{["Zielgruppe", "ADKAR", "Kernbotschaft", "Kanal", "Absender"].map(h => <th key={h} style={TH}>{h}</th>)}</tr></thead>
                  <tbody>{iCOM.map(c => { const tg = iTG.find(t => t.id === c.target_group_id); const sender = iSH.find(s => s.id === c.sender_id); return <tr key={c.id}>
                    <td style={TD}>{tg?.name || "Alle"}</td>
                    <td style={TD}>{c.adkar_phase}</td>
                    <td style={{ ...TD, maxWidth: 200 }}>{c.key_message}</td>
                    <td style={TD}>{(c.channelTags || [c.channel]).join(", ")}</td>
                    <td style={TD}>{sender?.name || "–"}</td>
                  </tr>; })}</tbody>
                </table>

                          </div>
                        )}
                        <div style={{ marginTop: 8, display: "flex", gap: 4 }}>
                          {["stable","up","down"].map(t => <Btn key={t} small v={k.trend === t ? "primary" : "default"} onClick={() => up(d => { const ki = (d.outcomeKPIs || []).find(x => x.id === k.id); if (ki) ki.trend = t; })}>{trendIcon(t)}</Btn>)}

                      </Card>

            <div>
              <SectionHead>Hypothesen ({iHYP.length})</SectionHead>
              {iHYP.length === 0 ? <Empty icon="🔬" title="Keine Hypothesen" sub="Formuliere Annahmen und prüfe sie" /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {iHYP.map(h => (
                    <Card key={h.id} style={{ borderLeft: `3px solid ${hypStatusColor(h.status)}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{h.statement}</div>
                          {h.assumption && <div style={{ fontSize: 12, color: T.textSec, marginBottom: 4 }}>Annahme: {h.assumption}</div>}
                          {h.metric && <div style={{ fontSize: 12, color: T.textMut }}>Metrik: {h.metric}</div>}
                          {h.result && <div style={{ fontSize: 12, color: T.text, marginTop: 4, padding: "4px 8px", background: T.bg, borderRadius: T.rs }}>Ergebnis: {h.result}</div>}
                        </div>
                        <div style={{ display: "flex", gap: 6, alignItems: "center", marginLeft: 12 }}>
                          {["open","confirmed","rejected"].map(s => <Btn key={s} small v={h.status === s ? "primary" : "default"} onClick={() => up(d => { const hi = (d.hypotheses || []).find(x => x.id === h.id); if (hi) hi.status = s; })}>{s === "open" ? "Offen" : s === "confirmed" ? "Bestätigt" : "Widerlegt"}</Btn>)}
                          <Btn v="ghost" small onClick={() => up(d => { d.hypotheses = (d.hypotheses || []).filter(x => x.id !== h.id); })}>✕</Btn>
                        </div>

                    </Card>
                  ))}

            <div style={{ marginTop: 20 }}>
              <SectionHead>Nutzenpotenziale ({iBEN.length})</SectionHead>

      // ─── LEADERSHIP (Führung) ─────────────────────────────────────────
      const LeadershipView = () => {
        const [showTask, setShowTask] = useState(false);
        const [showDL, setShowDL] = useState(false);
        const [showPB, setShowPB] = useState(false);
        const [fTask, setFTask] = useState({ title: "", owner: "", due_date: "", status: "open", description: "" });
        const [fDL, setFDL] = useState({ date: today(), title: "", decision: "", rationale: "", owner: "" });
        const [fPB, setFPB] = useState({ title: "", audience: "", steps: "", purpose: "", notes: "" });
        if (!ini) return <Empty icon="👔" title="Keine Initiative gewählt" sub="" />;
        const saveTask = () => {
          if (!fTask.title) return;
          up(d => { if (!d.leadershipTasks) d.leadershipTasks = []; d.leadershipTasks.push({ id: uid("LT-"), initiative_id: sel, ...fTask }); });
          setFTask({ title: "", owner: "", due_date: "", status: "open", description: "" }); setShowTask(false);
        };
        const saveDL = () => {
          if (!fDL.title) return;
          up(d => { if (!d.decisionLog) d.decisionLog = []; d.decisionLog.push({ id: uid("DL-"), initiative_id: sel, ...fDL }); });
          setFDL({ date: today(), title: "", decision: "", rationale: "", owner: "" }); setShowDL(false);
        };
        const savePB = () => {
          if (!fPB.title) return;
          up(d => { if (!d.playbooks) d.playbooks = []; d.playbooks.push({ id: uid("PB-"), initiative_id: sel, ...fPB }); });
          setFPB({ title: "", audience: "", steps: "", purpose: "", notes: "" }); setShowPB(false);
        };
        const taskStatusColor = s => s === "done" ? T.success : s === "in_progress" ? T.accent : T.textMut;
        const sponsorProgress = (() => {
          if (iSPT.length === 0) return null;
          const scores = iSPT.map(s => s.score || 0);
          return Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
        })();
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Führung & Sponsoring</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} – Leadership-Aufgaben & Entscheidungslog</p></div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowPB(true)}>＋ Playbook</Btn>
                <Btn v="default" onClick={() => setShowDL(true)}>＋ Entscheidung</Btn>
                <Btn v="primary" onClick={() => setShowTask(true)}>＋ Aufgabe</Btn>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
              <Card>
                <SectionHead>Leadership-Aufgaben ({iLT.length})</SectionHead>

                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iLT.map(t => (
                      <div key={t.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${taskStatusColor(t.status)}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 700, fontSize: 13 }}>{t.title}</span>
                          <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                            {["open","in_progress","done"].map(s => <Btn key={s} small v={t.status === s ? "primary" : "default"} onClick={() => up(d => { const lt = (d.leadershipTasks || []).find(x => x.id === t.id); if (lt) lt.status = s; })}>{s === "open" ? "Offen" : s === "in_progress" ? "Aktiv" : "Fertig"}</Btn>)}
                            <Btn v="ghost" small onClick={() => up(d => { d.leadershipTasks = (d.leadershipTasks || []).filter(x => x.id !== t.id); })}>✕</Btn>
                          </div>
                        </div>
                        {t.owner && <div style={{ fontSize: 11, color: T.textMut }}>👤 {t.owner}</div>}
                        {t.due_date && <div style={{ fontSize: 11, color: T.textMut }}>📅 {fmtDate(t.due_date)}</div>}
                        {t.description && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{t.description}</div>}
                      </div>
                    ))}
                  </div>
                )}
              </Card>

                <SectionHead>Sponsor-Aktivierung ({iSPT.length} Einträge)</SectionHead>
                {sponsorProgress !== null && (
                  <div style={{ marginBottom: 12 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}><span style={{ color: T.textMut }}>Ø Aktivierungs-Score</span><span style={{ fontWeight: 700, color: T.adessoBlau }}>{sponsorProgress}/10</span></div>
                    <div style={{ background: T.bg, borderRadius: 4, height: 8 }}><div style={{ width: `${sponsorProgress * 10}%`, height: "100%", background: `linear-gradient(90deg,${T.accent},${T.success})`, borderRadius: 4 }} /></div>
                  </div>
                )}
                {iSPT.length === 0 ? <p style={{ fontSize: 13, color: T.textMut }}>Noch keine Sponsor-Tracking-Einträge vorhanden. Nutze die Initiative → Stakeholder-Ansicht um Sponsoren zu pflegen.</p> : (
                  iSPT.map(s => {
                    const sh = iSH.find(x => x.id === s.stakeholder_id);
                    return (
                      <div key={s.id} style={{ padding: "8px 10px", background: T.bg, borderRadius: T.rs, marginBottom: 6 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                          <span style={{ fontWeight: 600 }}>{sh?.name || s.stakeholder_id}</span>
                          <Badge color={s.score >= 7 ? T.success : s.score >= 4 ? T.warn : T.danger}>{s.score}/10</Badge>
                        </div>
                        {s.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{s.notes}</div>}
                      </div>
                    );
                  })
                )}
              </Card>
            </div>

              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <SectionHead>Entscheidungslog ({iDL.length})</SectionHead>

                  <tbody>
                    {iDL.map(d => (
                      <tr key={d.id}>
                        <td style={{ padding: "8px 10px", fontSize: 12, borderBottom: `1px solid ${T.borderLight}` }}>{fmtDate(d.date)}</td>
                        <td style={{ padding: "8px 10px", fontSize: 12, fontWeight: 600, borderBottom: `1px solid ${T.borderLight}` }}>{d.title}</td>
                        <td style={{ padding: "8px 10px", fontSize: 12, borderBottom: `1px solid ${T.borderLight}` }}>{d.decision}</td>
                        <td style={{ padding: "8px 10px", fontSize: 12, color: T.textMut, borderBottom: `1px solid ${T.borderLight}` }}>{d.owner}</td>
                        <td style={{ padding: "8px 10px", borderBottom: `1px solid ${T.borderLight}` }}><Btn v="ghost" small onClick={() => up(d2 => { d2.decisionLog = (d2.decisionLog || []).filter(x => x.id !== d.id); })}>✕</Btn></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </Card>
            {iPB.length > 0 && (
              <Card style={{ marginTop: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                  <SectionHead>Playbooks ({iPB.length})</SectionHead>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 12 }}>
                  {iPB.map(pb => (
                    <Card key={pb.id} style={{ background: T.bg, padding: 14 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontWeight: 700, fontSize: 14 }}>📘 {pb.title}</span>
                        <Btn v="ghost" small onClick={() => up(d => { d.playbooks = (d.playbooks || []).filter(x => x.id !== pb.id); })}>✕</Btn>
                      </div>
                      {pb.audience && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Zielgruppe: {pb.audience}</div>}
                      {pb.purpose && <div style={{ fontSize: 12, color: T.textSec, marginBottom: 6 }}>{pb.purpose}</div>}
                      {pb.steps && <div style={{ fontSize: 12, color: T.text, whiteSpace: "pre-line", background: T.surface, padding: "8px 10px", borderRadius: T.rs }}>{pb.steps}</div>}
                    </Card>
                  ))}
                </div>
              </Card>
            )}
            <Modal open={showTask} onClose={() => setShowTask(false)} title="Leadership-Aufgabe">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Aufgabe" value={fTask.title} onChange={v => setFTask(p => ({ ...p, title: v }))} />
