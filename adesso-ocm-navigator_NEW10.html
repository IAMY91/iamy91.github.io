<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adesso OCM Navigator – Change Together</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Fira Sans', sans-serif;
      background-color: #f4f6fa;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f4f6fa;
    }

    ::-webkit-scrollbar-thumb {
      background: #887d75;
      border-radius: 3px;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      main {
        padding: 0 !important;
        overflow: visible !important;
      }

      body {
        background: #fff;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const uid = (p = "") => p + Math.random().toString(36).slice(2, 8);
    const today = () => new Date().toISOString().slice(0, 10);
    const fmtDate = d => d ? new Date(d).toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" }) : "–";
    const clamp = (v, lo = 0, hi = 10) => Math.max(lo, Math.min(hi, Number(v) || 0));
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

    // ─── CSV / ICS helpers ───────────────────────────────────────────────
    const toCSV = (rows, cols) => {
      const esc = v => { const s = String(v ?? ""); return s.includes(",") || s.includes('"') || s.includes("\n") ? `"${s.replace(/"/g, '""')}"` : s; };
      const header = cols.map(c => esc(c.label)).join(",");
      const body = rows.map(r => cols.map(c => esc(typeof c.get === "function" ? c.get(r) : r[c.key])).join(",")).join("\n");
      return header + "\n" + body;
    };
    const downloadBlob = (content, filename, type = "text/plain;charset=utf-8") => {
      const b = new Blob(["\uFEFF" + content], { type });
      const u = URL.createObjectURL(b); const a = document.createElement("a"); a.href = u; a.download = filename; a.click(); URL.revokeObjectURL(u);
    };
    const toICS = events => {
      const fmt = d => d ? d.replace(/-/g, "") : null;
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//adesso OCM Navigator//DE"];
      events.forEach(ev => {
        if (!ev.date) return;
        lines.push("BEGIN:VEVENT", `UID:${uid("ev-")}@ocm`, `DTSTART;VALUE=DATE:${fmt(ev.date)}`, `DTEND;VALUE=DATE:${fmt(ev.date)}`, `SUMMARY:${ev.title}`, ev.desc ? `DESCRIPTION:${ev.desc.replace(/\n/g, "\\n")}` : "", "END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      return lines.filter(l => l !== "").join("\r\n");
    };

    // ─── adesso Corporate Design Theme ──────────────────────────────────
    const T = {
      // Primary adesso Colors
      adessoBlau: "#006ec7",
      adessoGrau: "#887d75",
      // UI Colors
      bg: "#f4f6fa", surface: "#ffffff", border: "#dcdfe5", borderLight: "#edf0f5",
      text: "#222222", textSec: "#5c6178", textMut: "#887d75",
      // Secondary / Schmuckfarben (adesso CD)
      accent: "#006ec7", accentLt: "#e6f0fa",
      success: "#76c800", successLt: "#f1fad9", // adesso Grün
      warn: "#ff9868", warnLt: "#fff4ee",       // adesso Orange
      danger: "#e74c5e", dangerLt: "#fdeef0",   // Standard red for errors
      purple: "#461ebe", cyan: "#28dcaa", pink: "#f566ba",
      shadow: "0 2px 10px rgba(0,0,0,0.05)",
      r: 4, rs: 4, font: "'Fira Sans', sans-serif",
    };

    const ADKAR = ["Awareness", "Desire", "Knowledge", "Ability", "Reinforcement"];
    const ADKAR_C = { Awareness: T.adessoBlau, Desire: T.pink, Knowledge: T.cyan, Ability: T.purple, Reinforcement: T.success };
    const DIMS = ["People", "Process", "Technology", "Org", "Kultur"];
    const DIM_IC = { People: "👥", Process: "⚙️", Technology: "💻", Org: "🏢", Kultur: "🎭" };
    const READINESS = ["supportive", "neutral", "skeptical", "resistant"];
    const TYPES = ["Comms", "Training", "Workshop", "Coaching", "Enablement", "Event", "Feedback"];
    const ROLES = ["Sponsor", "PL", "HR", "IT", "BR", "CM", "SME", "Exec"];
    const CHANNELS = ["Townhall", "E-Mail", "Teams-Chat", "Intranet", "1:1-Gespräch", "Workshop", "Newsletter", "Video", "Poster/Flyer", "Yammer/Viva"];
    const INDUSTRIES = ["IT & Software", "Finanzdienstleistungen", "Pharma & Healthcare", "Automotive", "Energie & Utilities", "Retail & E-Commerce", "Öffentlicher Sektor", "Telekommunikation", "Produktion & Industrie", "Logistik & Transport", "Beratung", "Sonstiges"];

    // ─── Score helpers (0-10) ───────────────────────────────────────────
    const scoreColor = v => { const n = Number(v) || 0; if (n >= 8) return T.danger; if (n >= 5) return T.warn; return T.success; };
    const scoreBg = v => { const n = Number(v) || 0; if (n >= 8) return T.dangerLt; if (n >= 5) return T.warnLt; return T.successLt; };
    const statusColor = s => s === "done" ? T.success : s === "in_progress" ? T.accent : T.textMut;
    const statusLabel = s => s === "done" ? "Fertig" : s === "in_progress" ? "In Arbeit" : "Geplant";
    const readyColor = r => r === "supportive" ? T.success : r === "neutral" ? T.warn : r === "skeptical" ? T.pink : T.danger;

    // ─── Methods Library ────────────────────────────────────────────────
    const METHODS = [
      {
        id: "m1", name: "Stakeholder-Interview", category: "Analyse", adkar: ["Awareness"], effort: "Niedrig", duration: "1–2h pro Person", when: "Frühphase – Bedarfsanalyse & Stimmungsbild",
        description: "Strukturierte Einzelgespräche mit Schlüssel-Stakeholdern, um Bedenken, Erwartungen und Einflussdynamiken zu verstehen.",
        bestFor: "Skeptische Stakeholder mit hohem Einfluss identifizieren und einbinden",
        steps: ["Interviewleitfaden erstellen (5-8 offene Fragen)", "Termine mit Top-Stakeholdern vereinbaren", "Interviews führen & dokumentieren", "Ergebnisse clustern & Handlungsfelder ableiten"],
        outputs: ["Stakeholder-Stimmungsbild", "Engagement-Plan", "Risiko-Landkarte"]
      },
      {
        id: "m2", name: "Impact Assessment Workshop", category: "Analyse", adkar: ["Awareness", "Knowledge"], effort: "Mittel", duration: "2–4h", when: "Frühphase – nach Scope-Definition",
        description: "Moderierter Workshop mit Fachbereichen, um konkrete Auswirkungen des Changes auf Prozesse, Rollen und Systeme zu identifizieren und zu bewerten.",
        bestFor: "Komplexe Changes mit vielen betroffenen Bereichen systematisch erfassen",
        steps: ["Teilnehmer aus allen betroffenen Bereichen einladen", "Ist-Situation pro Bereich erfassen", "Delta zum Soll identifizieren", "Impacts bewerten (Ausmaß, Kritikalität)", "Maßnahmen ableiten"],
        outputs: ["Impact-Register", "Heatmap-Daten", "Maßnahmenvorschläge"]
      },
      {
        id: "m3", name: "Sponsor Roadshow", category: "Kommunikation", adkar: ["Awareness", "Desire"], effort: "Mittel", duration: "30–60 Min je Termin", when: "Vor Go-Live – wenn Awareness & Desire aufgebaut werden müssen",
        description: "Der Sponsor besucht betroffene Teams persönlich, erklärt das Warum und beantwortet Fragen. Stärkt Vertrauen und Sichtbarkeit.",
        bestFor: "Wenn Führungskräfte-Sichtbarkeit fehlt oder Widerstand hoch ist",
        steps: ["Talking Points mit Sponsor abstimmen", "Termine in betroffenen Standorten planen", "Begleitende FAQ & Handout erstellen", "Feedback aus Sessions sammeln", "Follow-up-Maßnahmen ableiten"],
        outputs: ["Sponsor-Talking-Points", "Feedback-Zusammenfassung", "Follow-up-Tasks"]
      },
      {
        id: "m4", name: "Change Champion Netzwerk", category: "Enablement", adkar: ["Desire", "Ability", "Reinforcement"], effort: "Hoch", duration: "Laufend (Setup: 2–3 Wochen)", when: "Ab Mitte Projektphase – als Multiplikatoren für den Change",
        description: "Aufbau eines Netzwerks von Change Champions in den Fachbereichen, die als Multiplikatoren, Feedback-Kanal und lokale Unterstützer fungieren.",
        bestFor: "Große Organisationen mit verteilten Standorten, wo zentrale Kommunikation nicht reicht",
        steps: ["Champions identifizieren & ansprechen", "Rolle & Erwartungen klären", "Kick-off-Workshop durchführen", "Regelmäßige Sync-Meetings etablieren", "Champions mit Materialien & Infos versorgen", "Feedback-Schleife einrichten"],
        outputs: ["Champion-Rollenblatt", "Regelmäßige Briefings", "Feedback-Reports"]
      },
      {
        id: "m5", name: "Resistance Management Workshop", category: "Intervention", adkar: ["Desire", "Ability"], effort: "Mittel", duration: "2–3h", when: "Wenn konkreter Widerstand sichtbar wird",
        description: "Gezielter Workshop mit resistanten Stakeholdern oder deren Führungskräften, um Ursachen von Widerstand zu verstehen und gemeinsam Lösungen zu erarbeiten.",
        bestFor: "Wenn Widerstand über individuelle Gespräche hinaus eskaliert",
        steps: ["Widerstandsmuster analysieren (Ursache, Ausdruck, Quelle)", "Geeignete Teilnehmer identifizieren", "Sicheren Raum schaffen (Regeln, Moderation)", "Bedenken sammeln & clustern", "Gemeinsam Lösungen erarbeiten", "Vereinbarungen dokumentieren & nachverfolgen"],
        outputs: ["Widerstandsanalyse", "Maßnahmenplan", "Vereinbarungen"]
      },
      {
        id: "m6", name: "Training Needs Analysis", category: "Training", adkar: ["Knowledge"], effort: "Mittel", duration: "1–2 Wochen", when: "3–6 Monate vor Go-Live",
        description: "Systematische Erhebung, welche Kompetenzen aufgebaut werden müssen – nach Zielgruppe, Rolle und System-/Prozessänderung.",
        bestFor: "Wenn Technology- oder Process-Impacts hohe Training-Scores haben",
        steps: ["Soll-Kompetenzen pro Rolle ableiten", "Ist-Kompetenzen erheben (Survey/Interviews)", "Gap-Analyse durchführen", "Trainingsformate & -umfang planen", "Trainingsplan erstellen & abstimmen"],
        outputs: ["Kompetenz-Gap-Matrix", "Trainingsplan", "Ressourcenbedarf"]
      },
      {
        id: "m7", name: "Go-Live Readiness Check", category: "Transition", adkar: ["Ability", "Reinforcement"], effort: "Mittel", duration: "1–2 Wochen vor Go-Live", when: "Unmittelbar vor Go-Live",
        description: "Strukturierte Prüfung, ob Organisation, Prozesse und Menschen bereit für den Go-Live sind. Definiert No-Go-Kriterien.",
        bestFor: "Jeder Change mit fixem Go-Live-Datum und hohem Risiko",
        steps: ["Readiness-Kriterien definieren (Tech, People, Process)", "Checkliste pro Zielgruppe erstellen", "Readiness-Assessment durchführen", "Go/No-Go-Entscheidung vorbereiten", "Restrisiken & Mitigationen dokumentieren"],
        outputs: ["Readiness-Scorecard", "Go/No-Go-Empfehlung", "Risiko-Mitigationsplan"]
      },
      {
        id: "m8", name: "Post-Go-Live Sustainment", category: "Reinforcement", adkar: ["Reinforcement"], effort: "Mittel", duration: "4–12 Wochen nach Go-Live", when: "Direkt nach Go-Live",
        description: "Maßnahmenpaket, um die Nachhaltigkeit des Changes sicherzustellen: Hypercare, Feedback-Loops, Quick Wins feiern, Nachschulung.",
        bestFor: "Jeder signifikante Change – wird am häufigsten vergessen",
        steps: ["Hypercare-Plan aufsetzen (Support-Kanäle, Ansprechpartner)", "Feedback-Mechanismus einrichten", "Quick Wins identifizieren & kommunizieren", "Nachschulungsbedarf erheben & durchführen", "Lessons Learned dokumentieren", "Reinforcement-Maßnahmen für FK aufsetzen"],
        outputs: ["Hypercare-Plan", "Feedback-Report", "Lessons Learned", "Sustainment-Roadmap"]
      },
      {
        id: "m9", name: "Pulse Survey / Stimmungscheck", category: "Messung", adkar: ["Awareness", "Desire"], effort: "Niedrig", duration: "5–10 Min (Befragung) + Auswertung", when: "Regelmäßig alle 2–4 Wochen während der Change-Phase",
        description: "Kurze, wiederkehrende Befragung der Betroffenen zu Stimmung, Verständnis und Unterstützungsbedarf. Liefert Trendlinien über Zeit.",
        bestFor: "Readiness-Tracking über Zeit und Identifikation von Trouble Spots",
        steps: ["5–8 Fragen definieren (ADKAR-basiert)", "Tool auswählen (Forms, Viva Pulse)", "Rhythmus festlegen & kommunizieren", "Ergebnisse auswerten & visualisieren", "Maßnahmen aus Ergebnissen ableiten"],
        outputs: ["Stimmungsbarometer (Trend)", "Handlungsempfehlungen", "Management-Summary"]
      },
      {
        id: "m10", name: "Führungskräfte-Enablement", category: "Enablement", adkar: ["Desire", "Knowledge", "Ability"], effort: "Mittel", duration: "2–4h Workshop + laufende Begleitung", when: "Frühzeitig – bevor breite Kommunikation startet",
        description: "Führungskräfte werden befähigt, den Change in ihren Teams aktiv zu begleiten: Botschaften, Umgang mit Widerstand, eigene Rolle.",
        bestFor: "Jeder organisationale Change – FK sind der wichtigste Erfolgsfaktor",
        steps: ["FK-spezifische Impacts & Rolle klären", "Workshop konzipieren (Botschaften, Q&A-Handling, Rolle)", "Workshop durchführen", "Toolkit bereitstellen (Talking Points, FAQ, Einwandbehandlung)", "Regelmäßige Check-ins etablieren"],
        outputs: ["FK-Toolkit", "Talking Points", "Einwandbehandlungs-Guide", "Check-in-Protokolle"]
      },
    ];

    // ─── Persistence ────────────────────────────────────────────────────
    const SK = "ocm-v4";
    const sv = async d => { try { localStorage.setItem(SK, JSON.stringify(d)); } catch { } };
    const ld = async () => { try { const r = localStorage.getItem(SK); if (r) return JSON.parse(r); const old = localStorage.getItem("ocm-v3"); return old ? JSON.parse(old) : null; } catch { return null; } };
    const emptyD = () => ({
      initiatives: [],
      stakeholders: [],
      targetGroups: [],
      impactItems: [],
      actions: [],
      engagements: [],
      commsItems: [],
      methods: [...METHODS],
      customTags: { roles: [...ROLES], actionTypes: [...TYPES], channels: [...CHANNELS], projectTags: [] },
      // Governance
      dependencies: [],
      stageGates: [],
      // Wirkungsmessung
      outcomeKPIs: [],
      hypotheses: [],
      benefits: [],
      // Leadership
      leadershipTasks: [],
      playbooks: [],
      sponsorTracking: [],
      decisionLog: [],
      // Teamentwicklung
      teamMaturity: [],
      pulseChecks: [],
      multipliers: [],
      reinforcementLoops: [],
      // Dialog & Feedback
      feedbackChannels: [],
      personas: [],
      narratives: [],
      // Operating Model
      raciItems: [],
      changeRisks: [],
      templates: [],
      // Kollaboration
      auditLog: [],
      workflowStates: [],
      stakeholderRelations: [],
      cmProfiles: [],
      userProfile: { name: "CM-User", role: "admin", initials: "CM" },
      // Adoption
      maturityAssessment: { date: null, dimensions: [], overall_score: 0 },
      onboardingPaths: [],
      learningItems: [],
      benchmarkData: [],
      // References
      references: [],
    });

    const INITIAL_RISK_QUESTIONS = {
      cc: [
        { id: "cc1", q: "Reichweite der Veränderung (Arbeitsgruppe vs. gesamte Organisation)", score: 3 },
        { id: "cc2", q: "Anzahl betroffener Mitarbeitender", score: 3 },
        { id: "cc3", q: "Unterschiedlichkeit der Auswirkungen (Einheitlich vs. Vielfältig)", score: 3 },
        { id: "cc4", q: "Art der Veränderung (Inkrementell vs. Radikal)", score: 3 },
        { id: "cc5", q: "Ausmaß der Prozessänderung", score: 3 },
        { id: "cc6", q: "Ausmaß der Tool-/Systemänderung", score: 3 },
        { id: "cc7", q: "Ausmaß der Rollen-/Verantwortungsänderung", score: 3 },
        { id: "cc8", q: "Ausmaß der Haltungs-/Überzeugungsänderung", score: 3 },
      ],
      oa: [
        { id: "oa1", q: "Wahrgenommene Notwendigkeit der Veränderung", score: 3 },
        { id: "oa2", q: "Auswirkung vergangener Veränderungen", score: 3 },
        { id: "oa3", q: "Change-Management-Kultur der Organisation", score: 3 },
        { id: "oa4", q: "Gemeinsame Vision / Richtung", score: 3 },
        { id: "oa5", q: "Führungsstil & Sichtbarkeit", score: 3 },
        { id: "oa6", q: "Mitarbeiter-Engagement & Vertrauen", score: 3 },
        { id: "oa7", q: "Ressourcenverfügbarkeit & Kapazität", score: 3 },
        { id: "oa8", q: "Change-Sättigung der Organisation", score: 3 },
      ]
    };

    const INITIAL_PCT_SCORES = { success: 5, leadership: 5, pm: 5, cm: 5 };

    // ─── UI Components ───────────────────────────────────────────────
    const Badge = ({ children, color = T.accent, bg: b, onRemove }) => (
      <span style={{ display: "inline-flex", alignItems: "center", padding: "3px 8px", borderRadius: 4, fontSize: 11, fontWeight: 600, background: b || (color + "1A"), color, whiteSpace: "nowrap", gap: 4 }}>
        {children}{onRemove && <span onClick={e => { e.stopPropagation(); onRemove(); }} style={{ cursor: "pointer", opacity: 0.6, fontSize: 13, lineHeight: 1 }}>×</span>}
      </span>
    );

    const Btn = ({ children, onClick, v = "default", small, disabled, style: sx }) => {
      const S = {
        default: { bg: T.surface, c: T.text, b: T.border },
        primary: { bg: T.accent, c: "#fff", b: T.accent },
        danger: { bg: T.dangerLt, c: T.danger, b: T.dangerLt },
        success: { bg: T.successLt, c: T.success, b: T.successLt },
        ghost: { bg: "transparent", c: T.textMut, b: "transparent" },
        warn: { bg: T.warnLt, c: T.warn, b: T.warnLt }
      };
      const s = S[v] || S.default;
      return <button className="no-print" onClick={onClick} disabled={disabled} style={{ padding: small ? "4px 10px" : "8px 16px", borderRadius: T.rs, border: `1px solid ${s.b}`, background: s.bg, color: s.c, fontSize: small ? 12 : 13, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", fontFamily: T.font, display: "inline-flex", alignItems: "center", gap: 6, opacity: disabled ? 0.5 : 1, transition: "0.2s", boxShadow: v === "default" || v === "primary" ? T.shadow : "none", ...sx }}>{children}</button>;
    };

    const Input = ({ label, value, onChange, options, textarea, type = "text", placeholder, style: sx, min, max, step }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, ...sx }}>
        {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
        {options ? (
          <select value={value} onChange={e => onChange(e.target.value)} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }}>
            <option value="">— Wählen —</option>
            {options.map(o => <option key={typeof o === "string" ? o : o.value} value={typeof o === "string" ? o : o.value}>{typeof o === "string" ? o : o.label}</option>)}
          </select>
        ) : textarea ? (
          <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={3} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none", resize: "vertical" }} />
        ) : (
          <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} min={min} max={max} step={step} style={{ background: T.bg, color: T.text, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px", fontSize: 13, fontFamily: T.font, outline: "none" }} />
        )}
      </div>
    );

    const TagInput = ({ label, tags = [], onChange, suggestions = [], color = T.accent }) => {
      const [inp, setInp] = useState("");
      const add = (v) => { const t = (v || inp).trim(); if (t && !tags.includes(t)) onChange([...tags, t]); setInp(""); };
      const rem = (t) => onChange(tags.filter(x => x !== t));
      const avail = suggestions.filter(s => !tags.includes(s) && s.toLowerCase().includes(inp.toLowerCase()));
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
          <div style={{ border: `1px solid ${T.border}`, background: T.bg, borderRadius: T.rs, padding: 4, display: "flex", flexWrap: "wrap", gap: 4, alignItems: "center" }}>
            {tags.map(t => (
              <Badge key={t} color={color} onRemove={() => rem(t)}>{t}</Badge>
            ))}
            <input value={inp} onChange={e => setInp(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); add(); } }} onBlur={() => add()} placeholder="Eingabe + Enter" style={{ flex: 1, border: "none", background: "transparent", outline: "none", padding: "4px", fontSize: 13, fontFamily: T.font, minWidth: 120 }} />
          </div>
          {inp && avail.length > 0 && (
            <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginTop: 2 }}>
              {avail.slice(0, 8).map(s => <button key={s} onClick={() => add(s)} style={{ padding: "2px 8px", borderRadius: 4, border: "none", background: T.bg, color: T.textSec, fontSize: 11, cursor: "pointer", fontFamily: T.font }}>{s}</button>)}
            </div>
          )}
        </div>
      );
    };

    const ScoreInput = ({ label, value, onChange, style: sx }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 4, ...sx }}>
        {label && <label style={{ fontSize: 12, fontWeight: 600, color: T.textSec }}>{label}</label>}
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <input type="range" min="0" max="10" value={value} onChange={e => onChange(Number(e.target.value))} style={{ flex: 1, accentColor: scoreColor(value) }} />
          <span style={{ width: 28, height: 28, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, background: scoreBg(value), color: scoreColor(value) }}>{value}</span>
        </div>
      </div>
    );

    const ScoreDot = ({ value, size = 28 }) => (
      <div style={{ width: size, height: size, borderRadius: 4, display: "flex", alignItems: "center", justifyContent: "center", fontSize: size < 24 ? 10 : 12, fontWeight: 700, background: scoreBg(value), color: scoreColor(value) }}>{value}</div>
    );

    const Card = ({ children, style: sx, onClick }) => (

    // ─── Tooltip (Hover-Infoblase) ──────────────────────────────────────
    const Tip = ({ text, children, linked, style: sx }) => {
      const [show, setShow] = useState(false);

    // ─── Sparkline (Mini-Trendlinie) ──────────────────────────────────
    const Sparkline = ({ data = [], width = 80, height = 24, color = T.accent }) => {
      if (data.length < 2) return <span style={{ fontSize: 10, color: T.textMut }}>–</span>;
      const min = Math.min(...data), max = Math.max(...data), range = max - min || 1;
      const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * height}`).join(" ");
      return <svg width={width} height={height} style={{ display: "inline-block", verticalAlign: "middle" }}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" /><circle cx={width} cy={height - ((data[data.length - 1] - min) / range) * height} r="2" fill={color} /></svg>;
    };

    // ─── Radar Chart (CSS-basiert) ────────────────────────────────────
    const RadarChart = ({ dimensions = {}, labels = [], size = 200, color = T.accent }) => {
      const n = labels.length; if (n < 3) return null;
      const cx = size / 2, cy = size / 2, r = size * 0.4;
      const angleStep = (2 * Math.PI) / n;
      const pts = labels.map((l, i) => { const v = (dimensions[l] || 0) / 10; const a = i * angleStep - Math.PI / 2; return { x: cx + r * v * Math.cos(a), y: cy + r * v * Math.sin(a) }; });
      const poly = pts.map(p => `${p.x},${p.y}`).join(" ");
      const gridLevels = [0.25, 0.5, 0.75, 1];
      return (
        <svg width={size} height={size} style={{ display: "block", margin: "0 auto" }}>
          {gridLevels.map(gl => <polygon key={gl} points={labels.map((_, i) => { const a = i * angleStep - Math.PI / 2; return `${cx + r * gl * Math.cos(a)},${cy + r * gl * Math.sin(a)}`; }).join(" ")} fill="none" stroke={T.border} strokeWidth="0.5" />)}
          {labels.map((_, i) => { const a = i * angleStep - Math.PI / 2; return <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(a)} y2={cy + r * Math.sin(a)} stroke={T.border} strokeWidth="0.5" />; })}
          <polygon points={poly} fill={color + "33"} stroke={color} strokeWidth="2" />
          {labels.map((l, i) => { const a = i * angleStep - Math.PI / 2; const lx = cx + (r + 18) * Math.cos(a); const ly = cy + (r + 18) * Math.sin(a); return <text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill={T.textSec}>{l}</text>; })}
          {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
        </svg>
      );
    };

    // ─── ADKAR coverage calc ────────────────────────────────────────────
    const adkarCov = (actions, tgId) => { const c = {}; ADKAR.forEach(a => c[a] = 0); actions.filter(a => !tgId || a.target_group_ids?.includes(tgId)).forEach(a => (a.adkar_tags || []).forEach(t => { if (c[t] !== undefined) c[t]++; })); return c; };

    // ═══════════════════════════════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════════════════════════════
    function App() {
      const [data, setData] = useState(emptyD());
      const [loaded, setLoaded] = useState(false);
      const [nav, setNav] = useState("dashboard");
      const [sel, setSel] = useState(null);
      const [sub, setSub] = useState("overview");
      const [methodDetail, setMethodDetail] = useState(null);
      const undoStack = useRef([]);
      const [toast, setToast] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      useEffect(() => { ld().then(d => { if (d) setData({ ...emptyD(), ...d, methods: d.methods || [...METHODS], customTags: { ...emptyD().customTags, ...(d.customTags || {}) } }); setLoaded(true); }); }, []);
      useEffect(() => { if (loaded) sv(data); }, [data, loaded]);

      const up = useCallback(fn => setData(p => { undoStack.current = [...undoStack.current.slice(-19), structuredClone(p)]; const n = structuredClone(p); fn(n); return n; }), []);
      const undo = useCallback(() => { if (!undoStack.current.length) return; const prev = undoStack.current[undoStack.current.length - 1]; undoStack.current = undoStack.current.slice(0, -1); setData(structuredClone(prev)); setToast({ msg: "Rückgängig gemacht ✓", id: Date.now() }); }, []);
      useEffect(() => { const h = e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) { e.preventDefault(); undo(); } }; window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h); }, [undo]);
      useEffect(() => { if (toast) { const t = setTimeout(() => setToast(null), 4000); return () => clearTimeout(t); } }, [toast]);
      const ini = useMemo(() => data.initiatives.find(i => i.id === sel), [data, sel]);
      const iSH = useMemo(() => data.stakeholders.filter(s => s.initiative_id === sel), [data, sel]);
      const iTG = useMemo(() => data.targetGroups.filter(t => t.initiative_id === sel), [data, sel]);
      const iIM = useMemo(() => data.impactItems.filter(i => i.initiative_id === sel), [data, sel]);
      const iAC = useMemo(() => data.actions.filter(a => a.initiative_id === sel), [data, sel]);
      const iENG = useMemo(() => (data.engagements || []).filter(e => e.initiative_id === sel), [data, sel]);
      const iCOM = useMemo(() => (data.commsItems || []).filter(c => c.initiative_id === sel), [data, sel]);
      const upE = (col, id, f, v) => up(d => { const it = d[col].find(x => x.id === id); if (it) it[f] = v; });
      const tags = data.customTags || emptyD().customTags;
      // New memoized collections for extended features
      const iDEP = useMemo(() => (data.dependencies || []).filter(d => d.from_initiative_id === sel || d.to_initiative_id === sel), [data, sel]);
      const iKPI = useMemo(() => (data.outcomeKPIs || []).filter(k => k.initiative_id === sel), [data, sel]);
      const iHYP = useMemo(() => (data.hypotheses || []).filter(h => h.initiative_id === sel), [data, sel]);
      const iBEN = useMemo(() => (data.benefits || []).filter(b => b.initiative_id === sel), [data, sel]);
      const iLT = useMemo(() => (data.leadershipTasks || []).filter(t => t.initiative_id === sel), [data, sel]);
      const iPB = useMemo(() => (data.playbooks || []).filter(p => p.initiative_id === sel), [data, sel]);
      const iSPT = useMemo(() => (data.sponsorTracking || []).filter(s => s.initiative_id === sel), [data, sel]);
      const iDL = useMemo(() => (data.decisionLog || []).filter(d => d.initiative_id === sel), [data, sel]);
      const iTM = useMemo(() => (data.teamMaturity || []).filter(t => t.initiative_id === sel), [data, sel]);
      const iPC = useMemo(() => (data.pulseChecks || []).filter(p => p.initiative_id === sel), [data, sel]);
      const iMUL = useMemo(() => (data.multipliers || []).filter(m => m.initiative_id === sel), [data, sel]);
      const iRL = useMemo(() => (data.reinforcementLoops || []).filter(r => r.initiative_id === sel), [data, sel]);
      const iFC = useMemo(() => (data.feedbackChannels || []).filter(f => f.initiative_id === sel), [data, sel]);
      const iPER = useMemo(() => (data.personas || []).filter(p => p.initiative_id === sel), [data, sel]);
      const iNAR = useMemo(() => (data.narratives || []).filter(n => n.initiative_id === sel), [data, sel]);
      const iRACI = useMemo(() => (data.raciItems || []).filter(r => r.initiative_id === sel), [data, sel]);
      const iCR = useMemo(() => (data.changeRisks || []).filter(r => r.initiative_id === sel), [data, sel]);
      const iSREL = useMemo(() => (data.stakeholderRelations || []).filter(r => r.initiative_id === sel), [data, sel]);
      const userProfile = data.userProfile || emptyD().userProfile;

      // ─── SMART ALERTS ─────────────────────────────────────────────────
      const alerts = useMemo(() => {
        if (!ini) return [];
        const a = [];
        const adkar = adkarCov(iAC);
        const gaps = ADKAR.filter(k => adkar[k] === 0);
        if (gaps.length > 0) a.push({ type: "warn", icon: "⚠️", msg: `ADKAR-Lücken: ${gaps.join(", ")} – keine Maßnahmen zugeordnet` });
        const highResistant = iSH.filter(s => s.readiness === "resistant" && s.influence >= 7);
        highResistant.forEach(s => a.push({ type: "danger", icon: "🚨", msg: `${s.name} ist resistant mit Einfluss ${s.influence}/10 – dringend Engagement nötig` }));
        const noRecentEngagement = iSH.filter(s => s.influence >= 7).filter(s => {
          const engs = iENG.filter(e => e.stakeholder_id === s.id);
          if (engs.length === 0) return true;
          const last = engs.sort((a, b) => b.date.localeCompare(a.date))[0];
          return daysBetween(last.date, today()) > 14;
        });
        noRecentEngagement.forEach(s => a.push({ type: "warn", icon: "📅", msg: `${s.name} (Einfluss ${s.influence}/10) – kein Engagement seit >14 Tagen` }));
        iTG.forEach(tg => {
          const impacts = iIM.filter(i => i.target_group_id === tg.id);
          const totalLoad = impacts.reduce((s, i) => s + (i.impact_level || 0), 0);
          if (totalLoad > 25) a.push({ type: "danger", icon: "🔥", msg: `${tg.name}: Change-Saturation kritisch (Gesamt-Score: ${totalLoad})` });

        const milestone = ini.milestones?.[0];

          if (daysLeft > 0 && daysLeft <= 28) {
            const unready = iAC.filter(a => a.status === "planned");
            if (unready.length > 3) a.push({ type: "danger", icon: "⏰", msg: `Go-Live in ${daysLeft} Tagen – noch ${unready.length} Maßnahmen in "Geplant"` });
          }
        }
        // ── 5 neue Alert-Typen ──────────────────────────────────────────
        // Alert 6: KPI-Stagnation – kein current-Update seit Erstellung (kein Datum, einfach: current === baseline)
        iKPI.filter(k => k.current && k.baseline && k.current === k.baseline && k.trend !== "down").forEach(k =>
          a.push({ type: "warn", icon: "📉", msg: `KPI "${k.title}" zeigt keine Veränderung – Aktuell = Basis (${k.baseline}${k.unit||""})` })
        );
        // Alert 7: Hochrisiko ohne Gegenmaßnahme
        iCR.filter(r => (r.probability||0)*(r.impact||0) >= 16 && !r.mitigation && r.status === "open").forEach(r =>
          a.push({ type: "danger", icon: "🛡️", msg: `Risiko "${r.title}" (Score ${(r.probability||0)*(r.impact||0)}) ohne Gegenmaßnahme dokumentiert` })
        );
        // Alert 8: Sponsor-Inaktivität (kein sponsorTracking-Eintrag in >21 Tagen)
        iSH.filter(s => (s.roles||[s.role]).includes("Sponsor")).forEach(s => {
          const tracks = iSPT.filter(t => t.stakeholder_id === s.id).sort((a,b) => (b.date||"").localeCompare(a.date||""));
          if (tracks.length === 0 || (tracks[0].date && daysBetween(tracks[0].date, today()) > 21))
            a.push({ type: "warn", icon: "👔", msg: `Sponsor ${s.name} – kein Tracking-Eintrag seit >21 Tagen` });

        // Alert 9: Benefits mit abgelaufenem Realisierungsdatum und Status "expected"
        iBEN.filter(b => b.realization_date && b.status === "expected" && daysBetween(b.realization_date, today()) > 0).forEach(b =>
          a.push({ type: "warn", icon: "💎", msg: `Nutzen "${b.title}" – Realisierungsdatum ${fmtDate(b.realization_date)} überschritten, Status noch "Erwartet"` })
        );
        // Alert 10: Narrativ ohne Zielgruppe
        iNAR.filter(n => !n.audience || n.audience.trim() === "").forEach(n =>
          a.push({ type: "warn", icon: "📖", msg: `Narrativ "${n.title}" hat keine Zielgruppe – Kommunikationslücke möglich` })
        );
        return a;
      }, [ini, iSH, iAC, iIM, iTG, iENG, iKPI, iCR, iSPT, iBEN, iNAR]);

      // ─── SIDEBAR (grouped navigation) ────────────────────────────────
      const navGroups = [
        { label: "Steuerung", items: [
          { key: "dashboard", icon: "📊", label: "Dashboard" },

          { key: "opmodel", icon: "⚙️", label: "Operating Model", off: !sel },
        ]},
        { label: "Planung & Analyse", items: [
          { key: "engagement", icon: "🤝", label: "Engagements", off: !sel },
          { key: "comms", icon: "📣", label: "Komm.-Matrix", off: !sel },
          { key: "docs", icon: "📄", label: "Dokumente", off: !sel },
          { key: "saturation", icon: "🌡️", label: "Change Saturation", off: !sel },
          { key: "heatmap", icon: "🔥", label: "Heatmap", off: !sel },
          { key: "timeline", icon: "📅", label: "Timeline", off: !sel },
        ]},
        { label: "Wissen", items: [
          { key: "methods", icon: "📚", label: "Methoden-Bibliothek" },

        ]},
        { label: "System", items: [
          { key: "io", icon: "↕️", label: "Import / Export" },

            ["initiatives", "stakeholders", "targetGroups", "impactItems", "actions", "engagements", "commsItems"].forEach(k => {

            <Card>
              <SectionHead>Maßnahmen-Status</SectionHead>
              <div style={{ display: "flex", gap: 10 }}>
                {[["Geplant", sc.planned, T.textMut], ["In Arbeit", sc.in_progress, T.accent], ["Fertig", sc.done, T.success]].map(([l, v, c]) => (
                  <div key={l} style={{ flex: 1, textAlign: "center", padding: 12, background: T.bg, borderRadius: T.rs }}><div style={{ fontSize: 24, fontWeight: 700, color: c }}>{v}</div><div style={{ fontSize: 10, color: T.textMut }}>{l}</div></div>
                ))}
              </div>
            </Card>
            <Card>
              <SectionHead>Impact-Verteilung</SectionHead>
              {DIMS.map(dim => { const items = iIM.filter(i => i.dimension === dim); return (
                <div key={dim} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <span style={{ width: 20, fontSize: 14 }}>{DIM_IC[dim]}</span><span style={{ width: 100, fontSize: 12, color: T.text, fontWeight: 500 }}>{DIMS_DE[dim]}</span>
                  <div style={{ flex: 1, display: "flex", gap: 3 }}>{items.map((it, i) => <ScoreDot key={i} value={it.impact_level} size={22} />)}{items.length === 0 && <span style={{ fontSize: 11, color: T.textMut }}>–</span>}</div>
                </div>
              ); })}
            </Card>
          </div>
        );
      };

      const RiskSub = () => {
        const ra = ini.riskAssessment || INITIAL_RISK_QUESTIONS;
        const upR = (type, qId, val) => up(d => {
          const i = d.initiatives.find(x => x.id === sel);
          if (i) {
            if (!i.riskAssessment) i.riskAssessment = INITIAL_RISK_QUESTIONS;
            const q = i.riskAssessment[type].find(x => x.id === qId);
            if (q) q.score = val;
          }
        });

        const ccAvg = ra.cc.reduce((s, q) => s + q.score, 0) / ra.cc.length;
        const oaAvg = ra.oa.reduce((s, q) => s + q.score, 0) / ra.oa.length;

        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
            <Card>
              <SectionHead>Change-Eigenschaften (CC)</SectionHead>
              {ra.cc.map(q => (
                <div key={q.id} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 12, marginBottom: 4 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {[1, 2, 3, 4, 5].map(v => (
                      <button key={v} onClick={() => upR("cc", q.id, v)} style={{ flex: 1, padding: "4px", borderRadius: 4, border: "none", background: q.score === v ? T.accent : T.bg, color: q.score === v ? "#fff" : T.text, fontSize: 11, cursor: "pointer" }}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card>
              <SectionHead>Organisatorische Attribute (OA)</SectionHead>
              {ra.oa.map(q => (
                <div key={q.id} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 12, marginBottom: 4 }}>{q.q}</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {[1, 2, 3, 4, 5].map(v => (
                      <button key={v} onClick={() => upR("oa", q.id, v)} style={{ flex: 1, padding: "4px", borderRadius: 4, border: "none", background: q.score === v ? T.accent : T.bg, color: q.score === v ? "#fff" : T.text, fontSize: 11, cursor: "pointer" }}>{v}</button>
                    ))}
                  </div>
                </div>
              ))}
            </Card>
            <Card style={{ gridColumn: "1/-1", textAlign: "center" }}>
              <SectionHead>Risiko-Positionierung</SectionHead>
              <div style={{ display: "flex", justifyContent: "center", gap: 40, alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: ccAvg > 3.5 ? T.danger : ccAvg > 2.5 ? T.warn : T.success }}>{ccAvg.toFixed(1)}</div>
                  <div style={{ fontSize: 11, color: T.textMut }}>Ø CC-Score</div>
                </div>
                <div style={{ width: 150, height: 150, border: `2px solid ${T.border}`, position: "relative", background: "#f9f9f9" }}>
                  <div style={{ position: "absolute", bottom: 0, left: 0, width: "50%", height: "50%", background: T.successLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", top: 0, right: 0, width: "50%", height: "50%", background: T.dangerLt, opacity: 0.3 }} />
                  <div style={{ position: "absolute", left: (oaAvg / 5 * 100) + "%", bottom: (ccAvg / 5 * 100) + "%", width: 12, height: 12, borderRadius: "50%", background: T.accent, transform: "translate(-50%, 50%)", border: "2px solid #fff", boxShadow: T.shadow }} />
                  <div style={{ position: "absolute", bottom: -20, left: "50%", transform: "translateX(-50%)", fontSize: 10 }}>OA (Resilienz) →</div>
                  <div style={{ position: "absolute", left: -45, top: "50%", transform: "rotate(-90deg) translateX(50%)", fontSize: 10 }}>CC (Intensität) →</div>
                </div>
                <div>
                  <div style={{ fontSize: 32, fontWeight: 700, color: oaAvg > 3.5 ? T.danger : oaAvg > 2.5 ? T.warn : T.success }}>{oaAvg.toFixed(1)}</div>
                  <div style={{ fontSize: 11, color: T.textMut }}>Ø OA-Score</div>
                </div>
              </div>
            </Card>
          </div>
        );
      };

      const PCTSub = () => {
        const p = ini.pctAssessment || INITIAL_PCT_SCORES;
        const upP = (f, v) => up(d => { const i = d.initiatives.find(x => x.id === sel); if (i) { if (!i.pctAssessment) i.pctAssessment = INITIAL_PCT_SCORES; i.pctAssessment[f] = v; } });
        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            {Object.keys(p).map(key => (
              <Card key={key}>
                <SectionHead>{key.toUpperCase()}</SectionHead>
                <ScoreInput label="Score (0–10)" value={p[key]} onChange={v => upP(key, v)} />
                <p style={{ fontSize: 11, color: T.textMut, marginTop: 8 }}>{key === "success" ? "Klarheit der Ziele und Definition des Erfolgs." : key === "leadership" ? "Sichtbarkeit, Koalition und Unterstützung der Führung." : key === "pm" ? "Technische Seite: Planung, Ressourcen, Zeitplan." : "Menschliche Seite: Change Management Prozesse."}</p>
              </Card>
            ))}
            <Card style={{ gridColumn: "1/-1" }}>
              <SectionHead>PCT Summary</SectionHead>
              <div style={{ display: "flex", gap: 4, height: 200, alignItems: "flex-end" }}>
                {Object.entries(p).map(([k, v]) => (
                  <div key={k} style={{ flex: 1, textAlign: "center" }}>
                    <div style={{ height: (v * 15), background: v >= 7 ? T.success : v >= 4 ? T.warn : T.danger, borderRadius: "4px 4px 0 0", transition: "0.5s" }} />
                    <div style={{ fontSize: 11, fontWeight: 600, marginTop: 8 }}>{k}</div>
                    <div style={{ fontSize: 13, fontWeight: 700 }}>{v}</div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        );
      };

      // ─── STAKEHOLDER ──────────────────────────────────────────────────
      const StakeholderSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [shView, setShView] = useState("list");
        const emptyF = { name: "", roles: [], org_unit: "", influence: 5, interest: 5, readiness: "neutral", notes: "" };
        const [f, sF] = useState(emptyF);
        const save = () => { if (!f.name) return; if (editId) { up(d => { const s = d.stakeholders.find(x => x.id === editId); if (s) Object.assign(s, f); }); } else { up(d => d.stakeholders.push({ id: uid("S-"), initiative_id: sel, ...f })); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (s) => { setEditId(s.id); sF({ name: s.name, roles: s.roles || [s.role].filter(Boolean), org_unit: s.org_unit || "", influence: s.influence, interest: s.interest, readiness: s.readiness, notes: s.notes || "" }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        const del = (id, e) => { if (e) e.stopPropagation(); up(d => d.stakeholders = d.stakeholders.filter(s => s.id !== id)); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ display: "flex", gap: 4 }}>
                {[["list","📋 Liste"],["map","🗺️ Power-Interest"],["network","🕸️ Netzwerk"]].map(([k,l]) => (
                  <Btn key={k} small v={shView===k?"primary":"default"} onClick={() => setShView(k)}>{l}</Btn>
                ))}
              </div>
              <Btn v="primary" small onClick={openNew}>＋ Hinzufügen</Btn>
            </div>
            {shView === "map" && <StakeholderMapSub />}
            {shView === "network" && <NetworkGraphSub />}
            {shView === "list" && (iSH.length === 0 ? <Empty icon="👤" title="Keine Stakeholder" sub="" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                    <thead><tr style={{ background: T.bg }}>
                      {["Name", "Rolle(n)", "Organisationseinheit", "Einfluss", "Interesse", "Change Readiness", "Notizen", "Letztes Engagement", ""].map(h => <th key={h} style={{ padding: "8px 12px", textAlign: "left", color: T.textMut, fontWeight: 600, fontSize: 10.5, textTransform: "uppercase" }}>{h}</th>)}
                    </tr></thead>
                    <tbody>{iSH.map(s => {
                      const engs = iENG.filter(e => e.stakeholder_id === s.id).sort((a, b) => b.date.localeCompare(a.date));
                      const lastEng = engs[0];
                      const daysSince = lastEng ? daysBetween(lastEng.date, today()) : null;
                      return (
                        <tr key={s.id} style={{ borderBottom: `1px solid ${T.borderLight}` }}>
                          <td style={{ padding: "8px 12px", fontWeight: 500, color: T.text, cursor: "pointer" }} onClick={() => openEdit(s)}>{s.name}</td>
                          <td style={{ padding: "8px 12px" }}>{(s.roles || [s.role]).map(r => <Badge key={r} color={T.purple}>{r}</Badge>)}</td>
                          <td style={{ padding: "8px 12px" }}>
                            <EditCell value={s.org_unit || ""} onChange={v => up(d => { const sh = d.stakeholders.find(x => x.id === s.id); if (sh) sh.org_unit = v; })} style={{ fontSize: 12, color: T.textSec }} />
                          </td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.influence} /></td>
                          <td style={{ padding: "8px 12px" }}><ScoreDot value={s.interest} /></td>
                          <td style={{ padding: "8px 12px" }}><Badge color={readyColor(s.readiness)}>{s.readiness}</Badge></td>
                          <td style={{ padding: "8px 12px", fontSize: 11, maxWidth: 180 }}>
                            <EditCell value={s.notes || ""} onChange={v => up(d => { const sh = d.stakeholders.find(x => x.id === s.id); if (sh) sh.notes = v; })} style={{ fontSize: 11, color: T.textSec }} placeholder="Notiz…" />
                          </td>
                          <td style={{ padding: "8px 12px", fontSize: 11, color: daysSince !== null && daysSince > 14 ? T.danger : T.textMut }}>{lastEng ? `${fmtDate(lastEng.date)} (vor ${daysSince}d)` : "–"}</td>
                          <td style={{ padding: "8px 12px" }}><Btn v="ghost" small onClick={e => del(s.id, e)}>✕</Btn></td>
                        </tr>
                      );
                    })}</tbody>
                  </table>
                </div>
              </Card>
            ))}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Stakeholder bearbeiten" : "Stakeholder hinzufügen"}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Rolle(n) – frei anlegbar" tags={f.roles} onChange={v => sF(p => ({ ...p, roles: v }))} suggestions={tags.roles} color={T.purple} /></div>
                <Input label="Organisationseinheit" value={f.org_unit} onChange={v => sF(p => ({ ...p, org_unit: v }))} style={{ gridColumn: "1/-1" }} />
                <ScoreInput label="Einfluss (0–10)" value={f.influence} onChange={v => sF(p => ({ ...p, influence: v }))} />
                <ScoreInput label="Interesse (0–10)" value={f.interest} onChange={v => sF(p => ({ ...p, interest: v }))} />
                <Input label="Change Readiness" value={f.readiness} onChange={v => sF(p => ({ ...p, readiness: v }))} options={READINESS} />
                <Input label="Notizen" value={f.notes} onChange={v => sF(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── STAKEHOLDER MAP (Power-Interest Grid) ───────────────────────
      const StakeholderMapSub = () => {
        const [tooltip, setTooltip] = useState(null);
        const W = 480, H = 360;
        const PAD = 50;
        const toX = interest => PAD + ((interest || 0) / 10) * (W - PAD * 2);
        const toY = influence => H - PAD - ((influence || 0) / 10) * (H - PAD * 2);
        const quadrants = [
          { x: PAD, y: PAD, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Eng einbinden", bg: "#fff8e1" },
          { x: PAD + (W - PAD * 2) / 2, y: PAD, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Aktiv managen", bg: "#fde8eb" },
          { x: PAD, y: PAD + (H - PAD * 2) / 2, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Beobachten", bg: "#f4f6fa" },
          { x: PAD + (W - PAD * 2) / 2, y: PAD + (H - PAD * 2) / 2, w: (W - PAD * 2) / 2, h: (H - PAD * 2) / 2, label: "Informiert halten", bg: "#e6f0fa" },
        ];
        if (iSH.length === 0) return <Empty icon="🗺️" title="Keine Stakeholder" sub="Lege zuerst Stakeholder an" />;
        return (
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12, alignItems: "center" }}>
              <SectionHead>Stakeholder Power-Interest Grid</SectionHead>
              <div style={{ display: "flex", gap: 12, fontSize: 11 }}>
                {Object.entries({ supportive: T.success, neutral: T.textMut, skeptical: T.warn, resistant: T.danger }).map(([r, c]) => (
                  <span key={r} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ width: 10, height: 10, borderRadius: "50%", background: c, display: "inline-block" }} />
                    {r}
                  </span>
                ))}
              </div>
            </div>
            <div style={{ position: "relative", display: "inline-block" }}>
              <svg width={W} height={H} style={{ display: "block" }}>
                {/* Quadrant backgrounds */}
                {quadrants.map((q, i) => <rect key={i} x={q.x} y={q.y} width={q.w} height={q.h} fill={q.bg} />)}
                {/* Quadrant border */}
                <rect x={PAD} y={PAD} width={W - PAD*2} height={H - PAD*2} fill="none" stroke={T.border} strokeWidth="1" />
                <line x1={(W)/2} y1={PAD} x2={(W)/2} y2={H-PAD} stroke={T.border} strokeWidth="1" strokeDasharray="4,4" />
                <line x1={PAD} y1={(H)/2} x2={W-PAD} y2={(H)/2} stroke={T.border} strokeWidth="1" strokeDasharray="4,4" />
                {/* Axis labels */}
                <text x={W/2} y={H-8} textAnchor="middle" fontSize="11" fill={T.textMut}>Interesse →</text>
                <text x={14} y={H/2} textAnchor="middle" fontSize="11" fill={T.textMut} transform={`rotate(-90,14,${H/2})`}>Einfluss →</text>
                {/* Quadrant labels */}
                {quadrants.map((q, i) => <text key={i} x={q.x + q.w/2} y={q.y + 14} textAnchor="middle" fontSize="10" fill={T.textSec} fontWeight="600">{q.label}</text>)}
                {/* Scale ticks */}
                {[0,2,4,6,8,10].map(v => <>
                  <text key={`xi${v}`} x={toX(v)} y={PAD-6} textAnchor="middle" fontSize="8" fill={T.textMut}>{v}</text>
                  <text key={`yi${v}`} x={PAD-6} y={toY(v)+3} textAnchor="end" fontSize="8" fill={T.textMut}>{v}</text>
                </>)}
                {/* Stakeholder circles */}
                {iSH.map(s => {
                  const cx = toX(s.interest || 5), cy = toY(s.influence || 5);
                  const r = 6 + (s.influence || 0) * 0.9;
                  const col = readyColor(s.readiness);
                  const initials = (s.name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
                  return (
                    <g key={s.id} style={{ cursor: "pointer" }}
                      onMouseEnter={() => setTooltip({ s, cx, cy })}
                      onMouseLeave={() => setTooltip(null)}
                      onClick={() => setSub("stakeholders")}
                    >
                      <circle cx={cx} cy={cy} r={r} fill={col} fillOpacity="0.75" stroke={col} strokeWidth="1.5" />
                      <text x={cx} y={cy+3} textAnchor="middle" fontSize="7" fontWeight="700" fill="#fff">{initials}</text>
                    </g>
                  );
                })}
              </svg>
              {tooltip && (
                <div style={{ position: "absolute", left: tooltip.cx + 12, top: tooltip.cy - 16, background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.rs, padding: "8px 12px", fontSize: 12, boxShadow: T.shadow, zIndex: 100, minWidth: 180, pointerEvents: "none" }}>
                  <div style={{ fontWeight: 700, marginBottom: 4 }}>{tooltip.s.name}</div>
                  <div style={{ color: T.textMut }}>Einfluss: <strong>{tooltip.s.influence}</strong> · Interesse: <strong>{tooltip.s.interest}</strong></div>
                  <div style={{ marginTop: 4 }}><Badge color={readyColor(tooltip.s.readiness)}>{tooltip.s.readiness}</Badge></div>
                  {tooltip.s.notes && <div style={{ color: T.textSec, marginTop: 4, fontSize: 11 }}>{tooltip.s.notes.slice(0, 80)}</div>}
                </div>
              )}
            </div>
          </Card>
        );
      };

      // ─── TARGET GROUPS ────────────────────────────────────────────────
      const TargetSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [f, sF] = useState({ name: "", size: "", org_units: "", locations: "", stakeholder_ids: [] });
        const resetF = () => sF({ name: "", size: "", org_units: "", locations: "", stakeholder_ids: [] });
        const add = () => { if (!f.name) return; up(d => d.targetGroups.push({ id: uid("TG-"), initiative_id: sel, name: f.name, size: parseInt(f.size) || 0, org_units: f.org_units.split(",").map(s => s.trim()).filter(Boolean), locations: f.locations.split(",").map(s => s.trim()).filter(Boolean), stakeholder_ids: f.stakeholder_ids })); resetF(); setShow(false); };
        const save = () => { if (!editId || !f.name) return; up(d => { const tg = d.targetGroups.find(t => t.id === editId); if (tg) { tg.name = f.name; tg.size = parseInt(f.size) || 0; tg.org_units = f.org_units.split(",").map(s => s.trim()).filter(Boolean); tg.locations = f.locations.split(",").map(s => s.trim()).filter(Boolean); tg.stakeholder_ids = f.stakeholder_ids; } }); setEditId(null); resetF(); setShow(false); };
        const openEdit = (tg) => { setEditId(tg.id); sF({ name: tg.name, size: String(tg.size || ""), org_units: (tg.org_units || []).join(", "), locations: (tg.locations || []).join(", "), stakeholder_ids: tg.stakeholder_ids || [] }); setShow(true); };
        const openNew = () => { setEditId(null); resetF(); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}><span style={{ fontSize: 14, fontWeight: 600 }}>Zielgruppen</span><Btn v="primary" small onClick={openNew}>＋</Btn></div>
            {iTG.length === 0 ? <Empty icon="👥" title="Keine Zielgruppen" sub="" /> : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 12 }}>
                {iTG.map(tg => <Card key={tg.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 600, cursor: "pointer" }} onClick={() => openEdit(tg)}>{tg.name} ✏️</span>
                    <Btn v="ghost" small onClick={() => up(d => d.targetGroups = d.targetGroups.filter(t => t.id !== tg.id))}>✕</Btn>
                  </div>
                  <div style={{ fontSize: 12, color: T.textMut, marginBottom: 6 }}>👥 {tg.size} • {tg.org_units?.join(", ") || "–"}</div>
                  {(tg.stakeholder_ids || []).length > 0 && <div style={{ marginBottom: 6, display: "flex", gap: 3, flexWrap: "wrap" }}>{(tg.stakeholder_ids || []).map(sid => { const s = iSH.find(x => x.id === sid); return s ? <Badge key={sid} color={T.purple}>{s.name}</Badge> : null; })}</div>}
                  <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>{ADKAR.map(a => { const c = adkarCov(iAC, tg.id)[a]; return <Badge key={a} color={c === 0 ? T.danger : c < 2 ? T.warn : T.success}>{a[0]}:{c}</Badge>; })}</div>
                </Card>)}
              </div>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Zielgruppe bearbeiten" : "Neue Zielgruppe"}>
              <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} />
                <Input label="Größe" value={f.size} onChange={v => sF(p => ({ ...p, size: v }))} type="number" />
                <Input label="Organisationseinheiten (kommagetrennt)" value={f.org_units} onChange={v => sF(p => ({ ...p, org_units: v }))} />
                <Input label="Standorte" value={f.locations} onChange={v => sF(p => ({ ...p, locations: v }))} />
                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Verknüpfte Stakeholder</label>
                  <div style={{ display: "flex", gap: 4, marginTop: 5, flexWrap: "wrap" }}>
                    {iSH.map(s => <button key={s.id} onClick={() => sF(p => ({ ...p, stakeholder_ids: p.stakeholder_ids.includes(s.id) ? p.stakeholder_ids.filter(x => x !== s.id) : [...p.stakeholder_ids, s.id] }))} style={{ padding: "4px 10px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 11, fontFamily: T.font, fontWeight: 600, background: f.stakeholder_ids.includes(s.id) ? T.accentLt : T.bg, color: f.stakeholder_ids.includes(s.id) ? T.accent : T.textMut }}>{s.name}</button>)}
                  </div>
                </div>
              </div>
              <Btn v="primary" onClick={editId ? save : add} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── IMPACTS (0-10 scale) ─────────────────────────────────────────
      const ImpactSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const emptyF = { target_group_id: "", dimension: "People", change_description: "", impact_level: 5, criticality: 5, training_need: 5, comms_need: 5 };
        const [f, sF] = useState(emptyF);
        const save = () => { if (!f.change_description) return; if (editId) { up(d => { const im = d.impactItems.find(x => x.id === editId); if (im) Object.assign(im, f); }); } else { up(d => d.impactItems.push({ id: uid("I-"), initiative_id: sel, ...f, dependencies: [] })); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (imp) => { setEditId(imp.id); sF({ target_group_id: imp.target_group_id, dimension: imp.dimension, change_description: imp.change_description, impact_level: imp.impact_level, criticality: imp.criticality, training_need: imp.training_need, comms_need: imp.comms_need }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}><span style={{ fontSize: 14, fontWeight: 600 }}>Impact Items</span><Btn v="primary" small onClick={openNew}>＋</Btn></div>
            {iIM.length === 0 ? <Empty icon="⚡" title="Keine Impacts" sub="" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}><div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead><tr style={{ background: T.bg }}>{["Zielgruppe", "Dim.", "Beschreibung", "Impact", "Krit.", "Train.", "Komm.", ""].map(h => <th key={h} style={{ padding: "8px 10px", textAlign: "left", color: T.textMut, fontWeight: 600, fontSize: 10.5, textTransform: "uppercase" }}>{h}</th>)}</tr></thead>
                  <tbody>{iIM.map(imp => <tr key={imp.id} style={{ borderBottom: `1px solid ${T.borderLight}`, cursor: "pointer" }} onClick={() => openEdit(imp)}>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.target_group_id} onChange={v => upE("impactItems", imp.id, "target_group_id", v)} options={iTG.map(t => ({ value: t.id, label: t.name }))} /></td>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.dimension} onChange={v => upE("impactItems", imp.id, "dimension", v)} options={DIMS.map(d => ({ value: d, label: d }))} /></td>
                    <td style={{ padding: "8px 10px", color: T.textSec, maxWidth: 200 }}><EditCell value={imp.change_description} onChange={v => upE("impactItems", imp.id, "change_description", v)} /></td>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.impact_level} onChange={v => upE("impactItems", imp.id, "impact_level", clamp(v))} type="score" /></td>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.criticality} onChange={v => upE("impactItems", imp.id, "criticality", clamp(v))} type="score" /></td>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.training_need} onChange={v => upE("impactItems", imp.id, "training_need", clamp(v))} type="score" /></td>
                    <td style={{ padding: "8px 10px" }}><EditCell value={imp.comms_need} onChange={v => upE("impactItems", imp.id, "comms_need", clamp(v))} type="score" /></td>
                    <td style={{ padding: "8px 10px" }}><Btn v="ghost" small onClick={e => { e.stopPropagation(); up(d => d.impactItems = d.impactItems.filter(i => i.id !== imp.id)); }}>✕</Btn></td>
                  </tr>)}</tbody>
                </table>
              </div></Card>
            )}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Impact bearbeiten" : "Neues Impact Item"}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Zielgruppe" value={f.target_group_id} onChange={v => sF(p => ({ ...p, target_group_id: v }))} options={iTG.map(t => ({ value: t.id, label: t.name }))} />
                <Input label="Dimension" value={f.dimension} onChange={v => sF(p => ({ ...p, dimension: v }))} options={DIMS} />
                <Input label="Beschreibung: Was ändert sich genau?" value={f.change_description} onChange={v => sF(p => ({ ...p, change_description: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <ScoreInput label="Impact (0–10)" value={f.impact_level} onChange={v => sF(p => ({ ...p, impact_level: v }))} />
                <ScoreInput label="Kritikalität (0–10)" value={f.criticality} onChange={v => sF(p => ({ ...p, criticality: v }))} />
                <ScoreInput label="Training-Bedarf (0–10)" value={f.training_need} onChange={v => sF(p => ({ ...p, training_need: v }))} />
                <ScoreInput label="Komm.-Bedarf (0–10)" value={f.comms_need} onChange={v => sF(p => ({ ...p, comms_need: v }))} />
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── STAKEHOLDER NETWORK GRAPH ────────────────────────────────────
      const NetworkGraphSub = () => {
        const [tooltip, setTooltip] = useState(null);
        const [showAddRel, setShowAddRel] = useState(false);
        const emptyRel = { from_id: "", to_id: "", type: "ally", strength: 2, note: "" };
        const [fRel, setFRel] = useState(emptyRel);
        const saveRel = () => {
          if (!fRel.from_id || !fRel.to_id || fRel.from_id === fRel.to_id) return;
          up(d => { if (!d.stakeholderRelations) d.stakeholderRelations = []; d.stakeholderRelations.push({ id: uid("REL-"), initiative_id: sel, ...fRel }); });
          setFRel(emptyRel); setShowAddRel(false);
        };
        const delRel = id => up(d => { d.stakeholderRelations = (d.stakeholderRelations || []).filter(r => r.id !== id); });
        const REL_TYPES = ["ally", "conflict", "influence", "neutral"];
        const REL_LABELS = { ally: "Verbündet", conflict: "Konflikt", influence: "Einfluss auf", neutral: "Neutral" };
        const REL_COLORS = { ally: T.success, conflict: T.danger, influence: T.accent, neutral: T.textMut };
        const REL_DASH = { ally: "none", conflict: "6,3", influence: "none", neutral: "3,5" };
        const W = 640, H = 400, CX = 320, CY = 195, R = 158;
        const N = iSH.length;
        const nodePos = iSH.map((sh, i) => {
          const angle = (i / Math.max(1, N)) * 2 * Math.PI - Math.PI / 2;
          return { ...sh, x: N === 1 ? CX : CX + R * Math.cos(angle), y: N === 1 ? CY : CY + R * Math.sin(angle) };
        });
        const nodeR = sh => Math.max(10, 6 + (sh.influence || 5) * 1.4);
        const initials = name => (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <div style={{ display: "flex", gap: 12, fontSize: 12, color: T.textMut, flexWrap: "wrap" }}>
                {Object.entries(REL_LABELS).map(([k, l]) => (
                  <span key={k} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                    <svg width="24" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke={REL_COLORS[k]} strokeWidth="2" strokeDasharray={REL_DASH[k] === "none" ? "" : REL_DASH[k]} /></svg>
                    {l}
                  </span>
                ))}
              </div>
              <Btn small v="primary" onClick={() => setShowAddRel(true)}>＋ Beziehung</Btn>
            </div>
            {iSH.length === 0 ? <Empty icon="🕸️" title="Keine Stakeholder" sub="Lege zuerst Stakeholder an" /> : (
              <Card style={{ padding: 0, overflow: "hidden" }}>
                <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: "block", maxHeight: 420 }}>
                  {/* Quadrant hints */}
                  <circle cx={CX} cy={CY} r={R} fill="none" stroke={T.borderLight} strokeWidth="1" strokeDasharray="4,4" />
                  {/* Edges */}
                  {iSREL.map(rel => {
                    const from = nodePos.find(n => n.id === rel.from_id);
                    const to = nodePos.find(n => n.id === rel.to_id);
                    if (!from || !to) return null;
                    const col = REL_COLORS[rel.type] || T.textMut;
                    const dash = REL_DASH[rel.type] || "none";
                    const sw = (rel.strength || 2) * 0.9;
                    const dx = to.x - from.x, dy = to.y - from.y, dist = Math.sqrt(dx*dx + dy*dy);
                    const ex = to.x - dx / dist * nodeR(to), ey = to.y - dy / dist * nodeR(to);
                    return (
                      <g key={rel.id}>
                        <line x1={from.x} y1={from.y} x2={ex} y2={ey} stroke={col} strokeWidth={sw} strokeDasharray={dash === "none" ? "" : dash} opacity={0.75} />
                        {rel.type === "influence" && (
                          <polygon points={`${ex},${ey} ${ex - dy/dist*5 - dx/dist*8},${ey + dx/dist*5 - dy/dist*8} ${ex + dy/dist*5 - dx/dist*8},${ey - dx/dist*5 - dy/dist*8}`} fill={col} />
                        )}
                      </g>
                    );
                  })}
                  {/* Nodes */}
                  {nodePos.map(sh => {
                    const r = nodeR(sh);
                    const col = readyColor(sh.readiness);
                    return (
                      <g key={sh.id} onMouseEnter={() => setTooltip(sh)} onMouseLeave={() => setTooltip(null)} style={{ cursor: "pointer" }}>
                        <circle cx={sh.x} cy={sh.y} r={r} fill={col + "22"} stroke={col} strokeWidth="2" />
                        <text x={sh.x} y={sh.y} textAnchor="middle" dominantBaseline="middle" fontSize={Math.max(8, r * 0.65)} fontWeight="700" fill={col}>{initials(sh.name)}</text>
                        <text x={sh.x} y={sh.y + r + 11} textAnchor="middle" fontSize="9" fill={T.textSec}>{sh.name.split(" ")[0]}</text>
                      </g>
                    );
                  })}
                  {/* Tooltip */}
                  {tooltip && (() => {
                    const np = nodePos.find(n => n.id === tooltip.id);
                    if (!np) return null;
                    const tx = np.x > W / 2 ? np.x - 150 : np.x + nodeR(np) + 6;
                    const ty = Math.min(H - 80, np.y - 30);
                    return (
                      <g>
                        <rect x={tx} y={ty} width="148" height="72" rx="6" fill={T.surface} stroke={T.border} strokeWidth="1" filter="drop-shadow(0 2px 6px rgba(0,0,0,.15))" />
                        <text x={tx + 10} y={ty + 18} fontSize="12" fontWeight="700" fill={T.text}>{tooltip.name}</text>
                        <text x={tx + 10} y={ty + 34} fontSize="10" fill={T.textMut}>{(tooltip.roles || [tooltip.role]).join(", ")}</text>
                        <text x={tx + 10} y={ty + 50} fontSize="10" fill={readyColor(tooltip.readiness)}>{tooltip.readiness} · Einfl: {tooltip.influence} · Int: {tooltip.interest}</text>
                        {tooltip.org_unit && <text x={tx + 10} y={ty + 64} fontSize="9" fill={T.textMut}>{tooltip.org_unit}</text>}
                      </g>
                    );
                  })()}
                </svg>
                {/* Relationship list */}
                {iSREL.length > 0 && (
                  <div style={{ padding: "12px 16px", borderTop: `1px solid ${T.borderLight}` }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: T.textMut, marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>Beziehungen ({iSREL.length})</div>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                      {iSREL.map(rel => {
                        const from = iSH.find(s => s.id === rel.from_id);
                        const to = iSH.find(s => s.id === rel.to_id);
                        return (
                          <div key={rel.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "4px 10px", borderRadius: T.rs, background: REL_COLORS[rel.type] + "15", border: `1px solid ${REL_COLORS[rel.type]}44`, fontSize: 12 }}>
                            <span style={{ fontWeight: 600 }}>{from?.name?.split(" ")[0] || "?"}</span>
                            <span style={{ color: REL_COLORS[rel.type], fontSize: 10 }}>──{REL_LABELS[rel.type]}──▶</span>
                            <span style={{ fontWeight: 600 }}>{to?.name?.split(" ")[0] || "?"}</span>
                            {rel.note && <span style={{ fontSize: 10, color: T.textMut }}>({rel.note})</span>}
                            <button onClick={() => delRel(rel.id)} style={{ border: "none", background: "transparent", cursor: "pointer", color: T.textMut, fontSize: 13, padding: "0 2px", lineHeight: 1 }}>×</button>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </Card>
            )}
            <Modal open={showAddRel} onClose={() => setShowAddRel(false)} title="Beziehung hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Von Stakeholder" value={fRel.from_id} onChange={v => setFRel(p => ({ ...p, from_id: v }))} options={iSH.map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Zu Stakeholder" value={fRel.to_id} onChange={v => setFRel(p => ({ ...p, to_id: v }))} options={iSH.filter(s => s.id !== fRel.from_id).map(s => ({ value: s.id, label: s.name }))} />
                <Input label="Beziehungstyp" value={fRel.type} onChange={v => setFRel(p => ({ ...p, type: v }))} options={REL_TYPES.map(t => ({ value: t, label: REL_LABELS[t] }))} />
                <div>
                  <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>Stärke (1–3)</label>
                  <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                    {[1,2,3].map(v => <Btn key={v} small v={fRel.strength === v ? "primary" : "default"} onClick={() => setFRel(p => ({ ...p, strength: v }))}>{v === 1 ? "Schwach" : v === 2 ? "Mittel" : "Stark"}</Btn>)}
                  </div>
                </div>
                <Input label="Notiz (optional)" value={fRel.note} onChange={v => setFRel(p => ({ ...p, note: v }))} />
              </div>
              <Btn v="primary" onClick={saveRel} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── ACTIONS ──────────────────────────────────────────────────────
      const ActionSub = () => {
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [acView, setAcView] = useState("list");
        const emptyF = { typeTags: [], title: "", adkar_tags: [], target_group_ids: [], owner_person_id: "", supporter_ids: [], opponent_ids: [], due_date: "", status: "planned", impact_item_ids: [] };
        const [f, sF] = useState(emptyF);
        const togA = t => sF(p => ({ ...p, adkar_tags: p.adkar_tags.includes(t) ? p.adkar_tags.filter(x => x !== t) : [...p.adkar_tags, t] }));
        const togT = id => sF(p => ({ ...p, target_group_ids: p.target_group_ids.includes(id) ? p.target_group_ids.filter(x => x !== id) : [...p.target_group_ids, id] }));
        const save = () => { if (!f.title) return; if (editId) { up(d => { const a = d.actions.find(x => x.id === editId); if (a) Object.assign(a, f); }); } else { up(d => d.actions.push({ id: uid("A-"), initiative_id: sel, ...f })); } sF(emptyF); setEditId(null); setShow(false); };
        const openEdit = (a) => { setEditId(a.id); sF({ typeTags: a.typeTags || [a.type], title: a.title, adkar_tags: a.adkar_tags || [], target_group_ids: a.target_group_ids || [], owner_person_id: a.owner_person_id || "", supporter_ids: a.supporter_ids || [], opponent_ids: a.opponent_ids || [], due_date: a.due_date || "", status: a.status, impact_item_ids: a.impact_item_ids || [] }); setShow(true); };
        const openNew = () => { setEditId(null); sF(emptyF); setShow(true); };
        const cycle = id => up(d => { const a = d.actions.find(x => x.id === id); if (a) a.status = a.status === "planned" ? "in_progress" : a.status === "in_progress" ? "done" : "planned"; });
        const moveStatus = (id, st) => up(d => { const a = d.actions.find(x => x.id === id); if (a) a.status = st; });
        const COLS = [
          { key: "planned", label: "Geplant", icon: "📋", color: T.warn },
          { key: "in_progress", label: "In Bearbeitung", icon: "⚙️", color: T.accent },
          { key: "done", label: "Erledigt", icon: "✅", color: T.success },
        ];
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ display: "flex", gap: 4 }}>
                <Btn small v={acView === "list" ? "primary" : "default"} onClick={() => setAcView("list")}>📋 Liste</Btn>
                <Btn small v={acView === "kanban" ? "primary" : "default"} onClick={() => setAcView("kanban")}>🗌 Kanban</Btn>
              </div>
              <Btn v="primary" small onClick={openNew}>＋ Hinzufügen</Btn>
            </div>
            {/* Kanban Board */}
            {acView === "kanban" && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
                {COLS.map(col => {
                  const colAC = iAC.filter(a => a.status === col.key);
                  return (
                    <div key={col.key}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, padding: "8px 12px", background: col.color + "18", borderRadius: T.rs, borderLeft: `3px solid ${col.color}` }}>
                        <span>{col.icon}</span><span style={{ fontWeight: 700, color: col.color, fontSize: 13 }}>{col.label}</span>
                        <span style={{ marginLeft: "auto", background: col.color, color: "#fff", borderRadius: 10, padding: "1px 8px", fontSize: 11, fontWeight: 700 }}>{colAC.length}</span>
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: 8, minHeight: 60 }}>
                        {colAC.map(a => {
                          const ow = iSH.find(s => s.id === a.owner_person_id);
                          const tgs = iTG.filter(t => (a.target_group_ids || []).includes(t.id));
                          return (
                            <Card key={a.id} onClick={() => openEdit(a)} style={{ padding: 12, cursor: "pointer", borderTop: `3px solid ${col.color}` }}>
                              <div style={{ fontWeight: 600, fontSize: 12.5, marginBottom: 6, lineHeight: 1.3 }}>{a.title}</div>
                              <div style={{ display: "flex", gap: 3, flexWrap: "wrap", marginBottom: 6 }}>
                                {(a.adkar_tags || []).map(t => <Badge key={t} color={ADKAR_C[t]} style={{ fontSize: 9, padding: "1px 5px" }}>{t}</Badge>)}
                                {(a.typeTags || [a.type]).filter(Boolean).map(t => <Badge key={t} color={T.cyan} style={{ fontSize: 9, padding: "1px 5px" }}>{t}</Badge>)}
                              </div>
                              {a.due_date && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 3 }}>📅 {fmtDate(a.due_date)}</div>}
                              {ow && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 3 }}>👤 {ow.name}</div>}
                              {tgs.length > 0 && <div style={{ fontSize: 10.5, color: T.textMut, marginBottom: 6 }}>🎯 {tgs.map(t => t.name).join(", ")}</div>}
                              <div style={{ display: "flex", gap: 4, marginTop: 4 }}>
                                {col.key !== "planned" && <Btn small v="ghost" onClick={e => { e.stopPropagation(); moveStatus(a.id, col.key === "in_progress" ? "planned" : "in_progress"); }} style={{ fontSize: 10, padding: "2px 8px" }}>◀ Zurück</Btn>}
                                {col.key !== "done" && <Btn small v="primary" onClick={e => { e.stopPropagation(); moveStatus(a.id, col.key === "planned" ? "in_progress" : "done"); }} style={{ fontSize: 10, padding: "2px 8px" }}>Weiter ▶</Btn>}
                              </div>
