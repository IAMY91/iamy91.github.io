                <Input label="Fällig am" value={fTask.due_date} onChange={v => setFTask(p => ({ ...p, due_date: v }))} type="date" />
                <Input label="Beschreibung" value={fTask.description} onChange={v => setFTask(p => ({ ...p, description: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveTask} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showDL} onClose={() => setShowDL(false)} title="Entscheidung dokumentieren">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Datum" value={fDL.date} onChange={v => setFDL(p => ({ ...p, date: v }))} type="date" />
                <Input label="Thema" value={fDL.title} onChange={v => setFDL(p => ({ ...p, title: v }))} />
                <Input label="Entscheidung" value={fDL.decision} onChange={v => setFDL(p => ({ ...p, decision: v }))} textarea />
                <Input label="Begründung" value={fDL.rationale} onChange={v => setFDL(p => ({ ...p, rationale: v }))} textarea />
                <Input label="Entscheidungsträger" value={fDL.owner} onChange={v => setFDL(p => ({ ...p, owner: v }))} />
              </div>
              <Btn v="primary" onClick={saveDL} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showPB} onClose={() => setShowPB(false)} title="Playbook anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

                <Input label="Zweck / Situation" value={fPB.purpose} onChange={v => setFPB(p => ({ ...p, purpose: v }))} textarea />
                <Input label="Schritte / Ablauf (eine Zeile pro Schritt)" value={fPB.steps} onChange={v => setFPB(p => ({ ...p, steps: v }))} textarea />

      // ─── TEAMDEV (Teamentwicklung) ────────────────────────────────────
      const TeamdevView = () => {
        const [showPC, setShowPC] = useState(false);
        const [showMul, setShowMul] = useState(false);
        const [showRL, setShowRL] = useState(false);
        const [showTM, setShowTM] = useState(false);
        const [fPC, setFPC] = useState({ date: today(), group: "", score: 5, notes: "" });
        const [fMul, setFMul] = useState({ name: "", role: "", team: "", influence: 5, notes: "" });
        const [fRL, setFRL] = useState({ title: "", trigger: "", effect: "", notes: "" });
        const [fTM, setFTM] = useState({ team: "", dimension: "collaboration", score: 5, date: today(), notes: "" });
        if (!ini) return <Empty icon="🧩" title="Keine Initiative gewählt" sub="" />;
        const savePC = () => {
          if (!fPC.group) return;
          up(d => { if (!d.pulseChecks) d.pulseChecks = []; d.pulseChecks.push({ id: uid("PC-"), initiative_id: sel, ...fPC, score: Number(fPC.score) }); });
          setFPC({ date: today(), group: "", score: 5, notes: "" }); setShowPC(false);
        };
        const saveMul = () => {
          if (!fMul.name) return;
          up(d => { if (!d.multipliers) d.multipliers = []; d.multipliers.push({ id: uid("MUL-"), initiative_id: sel, ...fMul, influence: Number(fMul.influence) }); });
          setFMul({ name: "", role: "", team: "", influence: 5, notes: "" }); setShowMul(false);
        };
        const saveRL = () => {
          if (!fRL.title) return;
          up(d => { if (!d.reinforcementLoops) d.reinforcementLoops = []; d.reinforcementLoops.push({ id: uid("RL-"), initiative_id: sel, ...fRL }); });
          setFRL({ title: "", trigger: "", effect: "", notes: "" }); setShowRL(false);
        };
        const saveTM = () => {
          if (!fTM.team) return;
          up(d => { if (!d.teamMaturity) d.teamMaturity = []; d.teamMaturity.push({ id: uid("TM-"), initiative_id: sel, ...fTM, score: Number(fTM.score) }); });
          setFTM({ team: "", dimension: "collaboration", score: 5, date: today(), notes: "" }); setShowTM(false);
        };
        const TM_DIMS = ["collaboration","competence","commitment","communication","clarity"];
        const tmByDim = TM_DIMS.map(dim => {
          const entries = iTM.filter(t => t.dimension === dim).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
          return { dim, latest: entries[0] || null };
        });
        const latestPC = iTG.map(tg => {
          const checks = iPC.filter(p => p.group === tg.name).sort((a, b) => b.date?.localeCompare(a.date));
          return { tg, latest: checks[0] || null };
        });
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Teamentwicklung</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} – Pulse Checks & Multiplikatoren</p></div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowTM(true)}>＋ Reife-Check</Btn>
                <Btn v="default" onClick={() => setShowRL(true)}>＋ Verstärkung</Btn>
                <Btn v="default" onClick={() => setShowMul(true)}>＋ Multiplikator</Btn>
                <Btn v="primary" onClick={() => setShowPC(true)}>＋ Pulse Check</Btn>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
              <Card>
                <SectionHead>Pulse Checks – aktueller Stand</SectionHead>
                {latestPC.length === 0 ? <Empty icon="💓" title="Keine Zielgruppen" sub="Lege zuerst Zielgruppen an" /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {latestPC.map(({ tg, latest }) => (
                      <div key={tg.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                          <span style={{ fontWeight: 600, fontSize: 13 }}>{tg.name}</span>
                          {latest ? <Badge color={latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger}>{latest.score}/10</Badge> : <Badge color={T.textMut}>Kein Check</Badge>}
                        </div>
                        {latest && <>
                          <div style={{ background: T.surface, borderRadius: 4, height: 6, marginBottom: 4 }}><div style={{ width: `${latest.score * 10}%`, height: "100%", background: latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger, borderRadius: 4 }} /></div>
                          <div style={{ fontSize: 11, color: T.textMut }}>{fmtDate(latest.date)}{latest.notes && ` – ${latest.notes.slice(0, 60)}`}</div>
                        </>}
                      </div>
                    ))}
                  </div>
                )}
              </Card>
              <Card>
                <SectionHead>Multiplikatoren ({iMUL.length})</SectionHead>
                {iMUL.length === 0 ? <Empty icon="📡" title="Keine Multiplikatoren" sub="Identifiziere Change Agents" /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iMUL.map(m => (
                      <div key={m.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{m.name}</div>
                          {m.role && <div style={{ fontSize: 11, color: T.textMut }}>{m.role}{m.team ? ` · ${m.team}` : ""}</div>}
                          {m.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{m.notes}</div>}
                        </div>
                        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                          <Badge color={T.purple}>Einfluss {m.influence}/10</Badge>
                          <Btn v="ghost" small onClick={() => up(d => { d.multipliers = (d.multipliers || []).filter(x => x.id !== m.id); })}>✕</Btn>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
            <Card style={{ marginTop: 14 }}>
              <SectionHead>Team-Reifegrad ({iTM.length} Einträge)</SectionHead>
              {iTM.length === 0 ? <Empty icon="📐" title="Keine Reife-Checks" sub="Erfasse den Entwicklungsstand des Teams" action={<Btn v="primary" onClick={() => setShowTM(true)}>Reife-Check anlegen</Btn>} /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {tmByDim.map(({ dim, latest }) => {
                    const c = latest ? (latest.score >= 7 ? T.success : latest.score >= 4 ? T.warn : T.danger) : T.borderLight;
                    return (
                      <div key={dim} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                          <span style={{ fontWeight: 600, fontSize: 13, textTransform: "capitalize" }}>{dim}</span>
                          {latest ? <Badge color={c}>{latest.score}/10</Badge> : <Badge color={T.textMut}>Nicht bewertet</Badge>}
                        </div>
                        <div style={{ background: T.surface, borderRadius: 3, height: 5 }}><div style={{ width: `${(latest?.score || 0) * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                        {latest?.notes && <div style={{ fontSize: 11, color: T.textMut, marginTop: 4 }}>{latest.notes}</div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </Card>
            <Card style={{ marginTop: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <SectionHead>Verstärkungs-Schleifen ({iRL.length})</SectionHead>
              </div>
              {iRL.length === 0 ? <Empty icon="🔁" title="Keine Verstärkungs-Schleifen" sub="Definiere positive Feedback-Kreisläufe" action={<Btn v="primary" onClick={() => setShowRL(true)}>Schleife anlegen</Btn>} /> : (
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {iRL.map(r => (
                    <div key={r.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between" }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13 }}>{r.title || r.description}</div>
                        {r.trigger && <div style={{ fontSize: 12, color: T.textSec }}>Auslöser: {r.trigger}</div>}
                        {r.effect && <div style={{ fontSize: 12, color: T.textSec }}>Wirkung: {r.effect}</div>}
                      </div>
                      <Btn v="ghost" small onClick={() => up(d => { d.reinforcementLoops = (d.reinforcementLoops || []).filter(x => x.id !== r.id); })}>✕</Btn>
                    </div>
                  ))}
                </div>
              )}
            </Card>
            <Modal open={showPC} onClose={() => setShowPC(false)} title="Pulse Check erfassen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Gruppe / Zielgruppe" value={fPC.group} onChange={v => setFPC(p => ({ ...p, group: v }))} options={iTG.map(t => t.name)} />
                <Input label="Datum" value={fPC.date} onChange={v => setFPC(p => ({ ...p, date: v }))} type="date" />
                <Input label="Stimmungs-Score (0–10)" value={String(fPC.score)} onChange={v => setFPC(p => ({ ...p, score: clamp(v) }))} type="number" />
                <Input label="Notizen" value={fPC.notes} onChange={v => setFPC(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={savePC} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showMul} onClose={() => setShowMul(false)} title="Multiplikator hinzufügen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Name" value={fMul.name} onChange={v => setFMul(p => ({ ...p, name: v }))} />
                <Input label="Rolle" value={fMul.role} onChange={v => setFMul(p => ({ ...p, role: v }))} />
                <Input label="Team / Bereich" value={fMul.team} onChange={v => setFMul(p => ({ ...p, team: v }))} />
                <Input label="Einfluss (0–10)" value={String(fMul.influence)} onChange={v => setFMul(p => ({ ...p, influence: clamp(v) }))} type="number" />
                <Input label="Notizen" value={fMul.notes} onChange={v => setFMul(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveMul} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showRL} onClose={() => setShowRL(false)} title="Verstärkungs-Schleife anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Bezeichnung" value={fRL.title} onChange={v => setFRL(p => ({ ...p, title: v }))} />
                <Input label="Auslöser (Trigger)" value={fRL.trigger} onChange={v => setFRL(p => ({ ...p, trigger: v }))} textarea />
                <Input label="Gewünschte Wirkung" value={fRL.effect} onChange={v => setFRL(p => ({ ...p, effect: v }))} textarea />
                <Input label="Notizen" value={fRL.notes} onChange={v => setFRL(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveRL} style={{ marginTop: 16 }}>Speichern</Btn>

                <Input label="Team / Gruppe" value={fTM.team} onChange={v => setFTM(p => ({ ...p, team: v }))} />
                <Input label="Dimension" value={fTM.dimension} onChange={v => setFTM(p => ({ ...p, dimension: v }))} options={TM_DIMS} />
                <Input label="Score (0–10)" value={String(fTM.score)} onChange={v => setFTM(p => ({ ...p, score: clamp(v) }))} type="number" />
                <Input label="Datum" value={fTM.date} onChange={v => setFTM(p => ({ ...p, date: v }))} type="date" />
                <Input label="Notizen / Begründung" value={fTM.notes} onChange={v => setFTM(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveTM} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>

      };

      // ─── DIALOGUE (Dialog & Feedback) ────────────────────────────────
      const DialogueView = () => {
        const [showFC, setShowFC] = useState(false);
        const [showNar, setShowNar] = useState(false);
        const [showPer, setShowPer] = useState(false);
        const [fFC, setFFC] = useState({ name: "", type: "survey", frequency: "monthly", owner: "", notes: "" });
        const [fNar, setFNar] = useState({ title: "", audience: "", message: "", tone: "informativ", status: "draft" });
        const [fPer, setFPer] = useState({ name: "", role: "", org_unit: "", pain_points: "", goals: "", fears: "", motivations: "", quote: "" });
        if (!ini) return <Empty icon="💬" title="Keine Initiative gewählt" sub="" />;
        const saveFC = () => {
          if (!fFC.name) return;
          up(d => { if (!d.feedbackChannels) d.feedbackChannels = []; d.feedbackChannels.push({ id: uid("FC-"), initiative_id: sel, ...fFC }); });
          setFFC({ name: "", type: "survey", frequency: "monthly", owner: "", notes: "" }); setShowFC(false);
        };
        const saveNar = () => {
          if (!fNar.title) return;
          up(d => { if (!d.narratives) d.narratives = []; d.narratives.push({ id: uid("NAR-"), initiative_id: sel, ...fNar }); });
          setFNar({ title: "", audience: "", message: "", tone: "informativ", status: "draft" }); setShowNar(false);
        };
        const savePer = () => {
          if (!fPer.name) return;
          up(d => { if (!d.personas) d.personas = []; d.personas.push({ id: uid("PER-"), initiative_id: sel, ...fPer }); });
          setFPer({ name: "", role: "", org_unit: "", pain_points: "", goals: "", fears: "", motivations: "", quote: "" }); setShowPer(false);
        };
        const narStatusColor = s => s === "approved" ? T.success : s === "review" ? T.warn : T.textMut;
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Dialog & Feedback</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>{ini.name} – Feedback-Kanäle, Personas & Narrative</p></div>
              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowNar(true)}>＋ Narrativ</Btn>
                <Btn v="default" onClick={() => setShowPer(true)}>＋ Persona</Btn>
                <Btn v="primary" onClick={() => setShowFC(true)}>＋ Feedback-Kanal</Btn>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
              <Card>
                <SectionHead>Feedback-Kanäle ({iFC.length})</SectionHead>
                {iFC.length === 0 ? <Empty icon="📡" title="Keine Kanäle" sub="Definiere wie Feedback gesammelt wird" action={<Btn v="primary" onClick={() => setShowFC(true)}>Kanal anlegen</Btn>} /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iFC.map(fc => (
                      <div key={fc.id} style={{ padding: "10px 12px", background: T.bg, borderRadius: T.rs, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{fc.name}</div>
                          <div style={{ fontSize: 11, color: T.textMut, marginTop: 2 }}>
                            <Badge color={T.cyan} style={{ marginRight: 6 }}>{fc.type}</Badge>
                            {fc.frequency && <span>{fc.frequency}</span>}
                          </div>
                          {fc.owner && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>👤 {fc.owner}</div>}
                        </div>
                        <Btn v="ghost" small onClick={() => up(d => { d.feedbackChannels = (d.feedbackChannels || []).filter(x => x.id !== fc.id); })}>✕</Btn>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
              <Card>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                  <SectionHead>Personas ({iPER.length})</SectionHead>
                </div>
                {iPER.length === 0 ? <Empty icon="🎭" title="Keine Personas" sub="Beschreibe typische Betroffene" action={<Btn v="primary" onClick={() => setShowPer(true)}>Persona anlegen</Btn>} /> : (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {iPER.map(p => (
                      <div key={p.id} style={{ padding: "12px 14px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${T.pink}` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                          <div>
                            <div style={{ fontWeight: 700, fontSize: 14 }}>🎭 {p.name}</div>
                            {p.role && <div style={{ fontSize: 11, color: T.textMut }}>{p.role}{p.org_unit ? ` · ${p.org_unit}` : ""}</div>}
                          </div>
                          <Btn v="ghost" small onClick={() => up(d => { d.personas = (d.personas || []).filter(x => x.id !== p.id); })}>✕</Btn>
                        </div>
                        {p.quote && <div style={{ fontSize: 12, fontStyle: "italic", color: T.textSec, margin: "4px 0 8px", padding: "4px 8px", borderLeft: `2px solid ${T.pink}` }}>"{p.quote}"</div>}
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, fontSize: 12 }}>
                          {p.pain_points && <div><span style={{ fontSize: 10, fontWeight: 700, color: T.danger }}>SCHMERZPUNKTE</span><div style={{ color: T.textSec, marginTop: 2 }}>{p.pain_points}</div></div>}
                          {p.goals && <div><span style={{ fontSize: 10, fontWeight: 700, color: T.success }}>ZIELE</span><div style={{ color: T.textSec, marginTop: 2 }}>{p.goals}</div></div>}
                          {p.fears && <div><span style={{ fontSize: 10, fontWeight: 700, color: T.warn }}>ÄNGSTE</span><div style={{ color: T.textSec, marginTop: 2 }}>{p.fears}</div></div>}
                          {p.motivations && <div><span style={{ fontSize: 10, fontWeight: 700, color: T.accent }}>MOTIVATIONEN</span><div style={{ color: T.textSec, marginTop: 2 }}>{p.motivations}</div></div>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
            <Card>
              <SectionHead>Narrative & Kernbotschaften ({iNAR.length})</SectionHead>
              {iNAR.length === 0 ? <Empty icon="📖" title="Keine Narrative" sub="Entwickle die Changestory" action={<Btn v="primary" onClick={() => setShowNar(true)}>Narrativ anlegen</Btn>} /> : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 12 }}>
                  {iNAR.map(n => (
                    <Card key={n.id} style={{ borderLeft: `3px solid ${narStatusColor(n.status)}` }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontWeight: 700, fontSize: 14 }}>{n.title}</span>
                        <div style={{ display: "flex", gap: 4 }}>
                          <Badge color={narStatusColor(n.status)}>{n.status}</Badge>
                          <Btn v="ghost" small onClick={() => up(d => { d.narratives = (d.narratives || []).filter(x => x.id !== n.id); })}>✕</Btn>
                        </div>
                      </div>
                      {n.audience && <div style={{ fontSize: 11, color: T.textMut, marginBottom: 4 }}>Zielgruppe: {n.audience}</div>}
                      {n.message && <div style={{ fontSize: 12, color: T.text, lineHeight: 1.6 }}>{n.message}</div>}
                      {n.tone && <Badge color={T.adessoGrau} style={{ marginTop: 6 }}>{n.tone}</Badge>}
                      <div style={{ marginTop: 8, display: "flex", gap: 4 }}>
                        {["draft","review","approved"].map(s => <Btn key={s} small v={n.status === s ? "primary" : "default"} onClick={() => up(d => { const ni = (d.narratives || []).find(x => x.id === n.id); if (ni) ni.status = s; })}>{s === "draft" ? "Entwurf" : s === "review" ? "Review" : "Freigegeben"}</Btn>)}
                      </div>
                    </Card>
                  ))}
                </div>
              )}
            </Card>
            <Modal open={showFC} onClose={() => setShowFC(false)} title="Feedback-Kanal anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Bezeichnung" value={fFC.name} onChange={v => setFFC(p => ({ ...p, name: v }))} />
                <Input label="Typ" value={fFC.type} onChange={v => setFFC(p => ({ ...p, type: v }))} options={["survey","interview","focus_group","open_door","digital_channel","workshop"]} />
                <Input label="Frequenz" value={fFC.frequency} onChange={v => setFFC(p => ({ ...p, frequency: v }))} options={["einmalig","wöchentlich","monatlich","quartalsweise"]} />
                <Input label="Verantwortlich" value={fFC.owner} onChange={v => setFFC(p => ({ ...p, owner: v }))} />
                <Input label="Notizen" value={fFC.notes} onChange={v => setFFC(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveFC} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showNar} onClose={() => setShowNar(false)} title="Narrativ anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Titel / Changestory" value={fNar.title} onChange={v => setFNar(p => ({ ...p, title: v }))} />
                <Input label="Zielgruppe" value={fNar.audience} onChange={v => setFNar(p => ({ ...p, audience: v }))} />
                <Input label="Kernbotschaft" value={fNar.message} onChange={v => setFNar(p => ({ ...p, message: v }))} textarea />
                <Input label="Tonalität" value={fNar.tone} onChange={v => setFNar(p => ({ ...p, tone: v }))} options={["informativ","motivierend","empathisch","direktiv"]} />
              </div>
              <Btn v="primary" onClick={saveNar} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showPer} onClose={() => setShowPer(false)} title="Persona anlegen" wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Input label="Name der Persona" value={fPer.name} onChange={v => setFPer(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <Input label="Rolle / Funktion" value={fPer.role} onChange={v => setFPer(p => ({ ...p, role: v }))} />
                <Input label="Organisationseinheit" value={fPer.org_unit} onChange={v => setFPer(p => ({ ...p, org_unit: v }))} />
                <Input label="Schmerzpunkte" value={fPer.pain_points} onChange={v => setFPer(p => ({ ...p, pain_points: v }))} textarea />
                <Input label="Ziele" value={fPer.goals} onChange={v => setFPer(p => ({ ...p, goals: v }))} textarea />
                <Input label="Ängste / Bedenken" value={fPer.fears} onChange={v => setFPer(p => ({ ...p, fears: v }))} textarea />
                <Input label="Motivationen" value={fPer.motivations} onChange={v => setFPer(p => ({ ...p, motivations: v }))} textarea />
                <Input label="Typisches Zitat" value={fPer.quote} onChange={v => setFPer(p => ({ ...p, quote: v }))} textarea style={{ gridColumn: "1/-1" }} />
              </div>
              <Btn v="primary" onClick={savePer} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── OPMODEL (Operating Model) ────────────────────────────────────
      const OpmodelView = () => {
        const [showRaci, setShowRaci] = useState(false);
        const [showRisk, setShowRisk] = useState(false);
        const [fRaci, setFRaci] = useState({ activity: "", responsible: "", accountable: "", consulted: "", informed: "" });
        const [fRisk, setFRisk] = useState({ title: "", probability: 3, impact: 3, mitigation: "", owner: "", status: "open" });
        if (!ini) return <Empty icon="⚙️" title="Keine Initiative gewählt" sub="" />;
        const saveRaci = () => {
          if (!fRaci.activity) return;
          up(d => { if (!d.raciItems) d.raciItems = []; d.raciItems.push({ id: uid("RACI-"), initiative_id: sel, ...fRaci }); });
          setFRaci({ activity: "", responsible: "", accountable: "", consulted: "", informed: "" }); setShowRaci(false);
        };
        const saveRisk = () => {
          if (!fRisk.title) return;
          up(d => { if (!d.changeRisks) d.changeRisks = []; d.changeRisks.push({ id: uid("CR-"), initiative_id: sel, ...fRisk, probability: Number(fRisk.probability), impact: Number(fRisk.impact) }); });
          setFRisk({ title: "", probability: 3, impact: 3, mitigation: "", owner: "", status: "open" }); setShowRisk(false);
        };
        const riskScore = r => (r.probability || 0) * (r.impact || 0);
        const riskColor = r => { const s = riskScore(r); return s >= 20 ? T.danger : s >= 10 ? T.warn : T.success; };

              <div style={{ display: "flex", gap: 8 }}>
                <Btn v="default" onClick={() => setShowRisk(true)}>＋ Risiko</Btn>

              </div>
            </div>
            <Card style={{ marginBottom: 14 }}>
              <SectionHead>RACI-Matrix ({iRACI.length} Aktivitäten)</SectionHead>

                    {[5,4,3,2,1].map(p => (

                        {[1,2,3,4,5].map(im => {
                          const score = p * im;
                          const bg = score >= 20 ? "#fde8eb" : score >= 15 ? "#fff0e8" : score >= 10 ? "#fffbe6" : score >= 6 ? "#f6fde8" : "#edfdf4";
                          const bc = score >= 20 ? T.danger : score >= 15 ? "#e87000" : score >= 10 ? T.warn : score >= 6 ? T.success : "#28dcaa";

                          return (
                            <div key={im} style={{ width: 44, height: 44, background: bg, border: `1px solid ${bc}`, borderRadius: 4, display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "center", gap: 2, position: "relative", title: `W=${p}, A=${im}, Score=${score}` }}>
                              <span style={{ position: "absolute", top: 1, left: 2, fontSize: 8, color: bc, fontWeight: 700 }}>{score}</span>

                                  {(r.title||"?").slice(0,2)}

                              ))}

                        })}
                      </div>
                    ))}
                    <div style={{ display: "flex", marginLeft: 58, marginTop: 4, fontSize: 9, color: T.textMut }}>
                      <div style={{ width: 44*3+6, textAlign: "center" }}>← niedrig</div>
                      <div style={{ width: 44*2, textAlign: "center" }}>hoch →</div>
                    </div>
                    <div style={{ fontSize: 10, color: T.textMut, marginLeft: 58, marginTop: 2 }}>Auswirkung (A) →</div>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: T.textSec, marginBottom: 8 }}>Legende</div>

              </Card>

            <Card>

                          <Btn v="ghost" small onClick={() => up(d => { d.changeRisks = (d.changeRisks || []).filter(x => x.id !== r.id); })}>✕</Btn>
                        </div>
                      </div>

                  ))}
                </div>
              )}
            </Card>
            <Modal open={showRaci} onClose={() => setShowRaci(false)} title="RACI-Eintrag anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Aktivität / Aufgabe" value={fRaci.activity} onChange={v => setFRaci(p => ({ ...p, activity: v }))} />
                <Input label="R – Responsible (Durchführend)" value={fRaci.responsible} onChange={v => setFRaci(p => ({ ...p, responsible: v }))} />
                <Input label="A – Accountable (Verantwortlich)" value={fRaci.accountable} onChange={v => setFRaci(p => ({ ...p, accountable: v }))} />
                <Input label="C – Consulted (Beratend)" value={fRaci.consulted} onChange={v => setFRaci(p => ({ ...p, consulted: v }))} />
                <Input label="I – Informed (Informiert)" value={fRaci.informed} onChange={v => setFRaci(p => ({ ...p, informed: v }))} />
              </div>
              <Btn v="primary" onClick={saveRaci} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
            <Modal open={showRisk} onClose={() => setShowRisk(false)} title="Change-Risiko anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Risiko-Titel" value={fRisk.title} onChange={v => setFRisk(p => ({ ...p, title: v }))} />
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <Input label="Eintrittswahrscheinlichkeit (1–5)" value={String(fRisk.probability)} onChange={v => setFRisk(p => ({ ...p, probability: clamp(v, 1, 5) }))} type="number" />
                  <Input label="Auswirkung (1–5)" value={String(fRisk.impact)} onChange={v => setFRisk(p => ({ ...p, impact: clamp(v, 1, 5) }))} type="number" />
                </div>
                <Input label="Gegenmaßnahme" value={fRisk.mitigation} onChange={v => setFRisk(p => ({ ...p, mitigation: v }))} textarea />
                <Input label="Risikoinhaber" value={fRisk.owner} onChange={v => setFRisk(p => ({ ...p, owner: v }))} />
              </div>
              <Btn v="primary" onClick={saveRisk} style={{ marginTop: 16 }}>Speichern</Btn>

      // ─── ADOPTION (Adoption & Reife) ──────────────────────────────────
      const AdoptionView = () => {
        const [showLearn, setShowLearn] = useState(false);
        const [fLearn, setFLearn] = useState({ title: "", type: "e-learning", url: "", duration: "", audience: "", notes: "" });
        const saveLearn = () => {
          if (!fLearn.title) return;
          up(d => { if (!d.learningItems) d.learningItems = []; d.learningItems.push({ id: uid("LI-"), ...fLearn }); });
          setFLearn({ title: "", type: "e-learning", url: "", duration: "", audience: "", notes: "" }); setShowLearn(false);
        };
        const mat = data.maturityAssessment || emptyD().maturityAssessment;
        const learns = data.learningItems || [];
        const MATURITY_DIMS = [
          { key: "strategy", label: "Change-Strategie" },
          { key: "leadership", label: "Führungsaktivierung" },
          { key: "comms", label: "Kommunikation" },
          { key: "training", label: "Training & Befähigung" },
          { key: "measurement", label: "Wirkungsmessung" },
          { key: "sustainability", label: "Nachhaltigkeit" },
        ];
        const getScore = key => {
          const dim = (mat.dimensions || []).find(d => d.key === key);
          return dim ? dim.score : 0;
        };
        const setScore = (key, val) => {
          up(d => {
            if (!d.maturityAssessment) d.maturityAssessment = { date: null, dimensions: [], overall_score: 0 };
            const dims = d.maturityAssessment.dimensions || [];
            const existing = dims.find(x => x.key === key);
            if (existing) existing.score = val;
            else dims.push({ key, score: val });
            d.maturityAssessment.dimensions = dims;
            const scores = MATURITY_DIMS.map(dm => (dims.find(x => x.key === dm.key)?.score || 0));
            d.maturityAssessment.overall_score = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : 0;
            d.maturityAssessment.date = today();
          });
        };
        const overallScore = mat.overall_score || 0;
        const matLevel = overallScore >= 8 ? "Optimiert" : overallScore >= 6 ? "Definiert" : overallScore >= 3 ? "Entwickelt" : "Initial";
        const matColor = overallScore >= 8 ? T.success : overallScore >= 6 ? T.accent : overallScore >= 3 ? T.warn : T.danger;
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div><h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>Adoption & Reife</h2><p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>OCM-Reifegrad & Lernpfade</p></div>
              <Btn v="primary" onClick={() => setShowLearn(true)}>＋ Lerninhalt</Btn>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
              <Card style={{ borderTop: `4px solid ${matColor}` }}>
                <SectionHead>OCM-Reifegrad Gesamt</SectionHead>
                <div style={{ display: "flex", alignItems: "center", gap: 16, marginBottom: 16 }}>
                  <div style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 42, fontWeight: 700, color: matColor, lineHeight: 1 }}>{overallScore}</div>
                    <div style={{ fontSize: 12, color: T.textMut }}>von 10</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 20, fontWeight: 700, color: matColor }}>{matLevel}</div>
                    {mat.date && <div style={{ fontSize: 11, color: T.textMut }}>Zuletzt bewertet: {fmtDate(mat.date)}</div>}
                  </div>
                </div>
                <div style={{ background: T.bg, borderRadius: 6, height: 10, overflow: "hidden" }}>
                  <div style={{ width: `${overallScore * 10}%`, height: "100%", background: `linear-gradient(90deg,${matColor},${T.accent})`, borderRadius: 6, transition: "width 0.3s" }} />
                </div>
              </Card>
              <Card>
                <SectionHead>Dimensionen-Bewertung</SectionHead>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {MATURITY_DIMS.map(dm => {
                    const sc = getScore(dm.key);
                    const c = sc >= 7 ? T.success : sc >= 4 ? T.warn : T.danger;
                    return (
                      <div key={dm.key}>
                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                          <span style={{ fontWeight: 600 }}>{dm.label}</span>
                          <div style={{ display: "flex", gap: 2 }}>
                            {[0,2,4,6,8,10].map(v => <Btn key={v} small v={sc === v ? "primary" : "default"} onClick={() => setScore(dm.key, v)} style={{ padding: "1px 5px", fontSize: 10 }}>{v}</Btn>)}
                          </div>
                        </div>
                        <div style={{ background: T.bg, borderRadius: 3, height: 5 }}><div style={{ width: `${sc * 10}%`, height: "100%", background: c, borderRadius: 3, transition: "width 0.3s" }} /></div>
                      </div>
                    );
                  })}
                </div>
              </Card>
            </div>
            <Card style={{ marginBottom: 20 }}>
              <SectionHead>🕸️ Reifegrad-Radar</SectionHead>
              <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 32, padding: "8px 0", flexWrap: "wrap" }}>
                <RadarChart labels={MATURITY_DIMS.map(d => d.label)} values={MATURITY_DIMS.map(d => getScore(d.key) / 10)} color={matColor} size={260} />
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {MATURITY_DIMS.map(dm => { const sc = getScore(dm.key); const c = sc >= 7 ? T.success : sc >= 4 ? T.warn : T.danger; return (<div key={dm.key} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}><div style={{ width: 10, height: 10, borderRadius: "50%", background: c, flexShrink: 0 }} /><span style={{ minWidth: 155 }}>{dm.label}</span><span style={{ fontWeight: 700, color: c }}>{sc}/10</span></div>); })}
                </div>
              </div>
            </Card>
            <Card>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                <SectionHead>Lerninhalte & Onboarding ({learns.length})</SectionHead>
              </div>
              {learns.length === 0 ? <Empty icon="🎓" title="Keine Lerninhalte" sub="Füge E-Learnings, Guides und Workshops hinzu" action={<Btn v="primary" onClick={() => setShowLearn(true)}>Lerninhalt anlegen</Btn>} /> : (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))", gap: 12 }}>

                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{l.title}</div>

                      {l.url && <a href={l.url} target="_blank" rel="noopener noreferrer" style={{ fontSize: 12, color: T.accent }}>🔗 Link öffnen</a>}
                      {l.notes && <div style={{ fontSize: 12, color: T.textSec, marginTop: 4 }}>{l.notes}</div>}
                    </Card>
                  ))}
                </div>
              )}
            </Card>
            <Modal open={showLearn} onClose={() => setShowLearn(false)} title="Lerninhalt anlegen">
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <Input label="Titel" value={fLearn.title} onChange={v => setFLearn(p => ({ ...p, title: v }))} />
                <Input label="Typ" value={fLearn.type} onChange={v => setFLearn(p => ({ ...p, type: v }))} options={["e-learning","video","guide","workshop","webinar","podcast","article"]} />
                <Input label="Zielgruppe" value={fLearn.audience} onChange={v => setFLearn(p => ({ ...p, audience: v }))} />
                <Input label="Dauer" value={fLearn.duration} onChange={v => setFLearn(p => ({ ...p, duration: v }))} />
                <Input label="URL / Link" value={fLearn.url} onChange={v => setFLearn(p => ({ ...p, url: v }))} />
                <Input label="Notizen" value={fLearn.notes} onChange={v => setFLearn(p => ({ ...p, notes: v }))} textarea />
              </div>
              <Btn v="primary" onClick={saveLearn} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── CM PROFILE VIEW ──────────────────────────────────────────────
      const CMProfileView = () => {
        const CM_COMP_DIMS = [
          { key: "strategy", label: "Change-Strategie" },
          { key: "leadership", label: "Führungsaktivierung" },
          { key: "comms", label: "Kommunikation" },
          { key: "training", label: "Training & Befähigung" },
          { key: "measurement", label: "Wirkungsmessung" },
          { key: "sustainability", label: "Nachhaltigkeit" },
        ];
        const emptyP = { name: "", role: "Change Manager", initials: "", email: "", focus_areas: [], bio: "", competencies: {}, projects: [] };
        const [show, setShow] = useState(false);
        const [editId, setEditId] = useState(null);
        const [f, sF] = useState(emptyP);
        const [detail, setDetail] = useState(null);
        const [projInput, setProjInput] = useState({ name: "", year: "", role: "", outcome: "" });
        const profiles = data.cmProfiles || [];
        const setComp = (key, val) => sF(p => ({ ...p, competencies: { ...p.competencies, [key]: val } }));
        const addProject = () => { if (!projInput.name) return; sF(p => ({ ...p, projects: [...p.projects, { id: uid("PR-"), ...projInput }] })); setProjInput({ name: "", year: "", role: "", outcome: "" }); };
        const open = () => { setEditId(null); sF(emptyP); setShow(true); };
        const openEdit = prof => { setEditId(prof.id); sF({ name: prof.name, role: prof.role || "Change Manager", initials: prof.initials || "", email: prof.email || "", focus_areas: prof.focus_areas || [], bio: prof.bio || "", competencies: { ...prof.competencies }, projects: [...(prof.projects || [])] }); setShow(true); };
        const save = () => {
          if (!f.name) return;
          const rec = { ...f, initials: f.initials || f.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() };
          if (editId) { up(d => { const p = (d.cmProfiles || []).find(x => x.id === editId); if (p) Object.assign(p, rec); }); }
          else { up(d => { if (!d.cmProfiles) d.cmProfiles = []; d.cmProfiles.push({ id: uid("CMP-"), ...rec }); }); }
          setShow(false); setEditId(null);
        };
        const del = id => up(d => { d.cmProfiles = (d.cmProfiles || []).filter(x => x.id !== id); });
        const avgComp = comps => { const vals = Object.values(comps || {}); return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0; };
        const compColor = v => v >= 8 ? T.success : v >= 5 ? T.accent : T.warn;
        const AVATAR_COLORS = [T.adessoBlau, T.purple, T.cyan, T.pink, "#8b5e3c", "#2d6a4f"];
        return (
          <div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
              <div>
                <h2 style={{ margin: 0, fontSize: 24, fontWeight: 700, color: T.adessoBlau }}>CM-Profile</h2>
                <p style={{ margin: "4px 0 0", fontSize: 13, color: T.textMut }}>Kompetenzprofile & Projektreferenzen der Change-Manager</p>
              </div>
              <Btn v="primary" onClick={open}>＋ Profil anlegen</Btn>
            </div>
            {profiles.length === 0 ? (
              <Empty icon="🧑‍💼" title="Noch keine CM-Profile" sub="Lege das erste Kompetenzprofil an" action={<Btn v="primary" onClick={open}>Profil anlegen</Btn>} />
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(300px,1fr))", gap: 16 }}>
                {profiles.map((prof, idx) => {
                  const avg = avgComp(prof.competencies);
                  const avatarColor = AVATAR_COLORS[idx % AVATAR_COLORS.length];
                  return (
                    <Card key={prof.id} style={{ cursor: "pointer", borderTop: `4px solid ${avatarColor}` }} onClick={() => setDetail(prof)}>
                      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 14 }}>
                        <div style={{ width: 48, height: 48, borderRadius: "50%", background: avatarColor, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, fontWeight: 700, flexShrink: 0 }}>{prof.initials || "CM"}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: 14, color: T.text }}>{prof.name}</div>
                          <div style={{ fontSize: 11.5, color: T.textMut }}>{prof.role}</div>
                          {prof.email && <div style={{ fontSize: 11, color: T.accent, marginTop: 2 }}>{prof.email}</div>}
                        </div>
                        <div style={{ textAlign: "center" }}>
                          <div style={{ fontSize: 22, fontWeight: 700, color: compColor(avg) }}>{avg}</div>
                          <div style={{ fontSize: 9, color: T.textMut }}>Ø Komp.</div>
                        </div>
                      </div>
                      {/* Competency mini-bars */}
                      <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 12 }}>
                        {CM_COMP_DIMS.map(dim => {
                          const val = (prof.competencies || {})[dim.key] || 0;
                          const c = compColor(val);
                          return (
                            <div key={dim.key} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11 }}>
                              <span style={{ width: 130, color: T.textMut, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{dim.label}</span>
                              <div style={{ flex: 1, background: T.bg, borderRadius: 3, height: 6 }}><div style={{ width: `${val * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                              <span style={{ width: 18, textAlign: "right", fontWeight: 600, color: c, fontSize: 10 }}>{val}</span>
                            </div>
                          );
                        })}
                      </div>
                      {/* Focus areas */}
                      {(prof.focus_areas || []).length > 0 && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
                          {prof.focus_areas.map(fa => <Badge key={fa} color={T.purple}>{fa}</Badge>)}
                        </div>
                      )}
                      {/* Project references */}
                      <div style={{ fontSize: 11, color: T.textMut }}>📁 {(prof.projects || []).length} Projektreferenz{(prof.projects || []).length !== 1 ? "en" : ""}</div>
                      <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                        <Btn small v="default" onClick={e => { e.stopPropagation(); openEdit(prof); }}>✏️ Bearbeiten</Btn>
                        <Btn small v="ghost" onClick={e => { e.stopPropagation(); del(prof.id); }}>✕</Btn>
                      </div>
                    </Card>
                  );
                })}
              </div>
            )}
            {/* Detail Modal */}
            <Modal open={!!detail} onClose={() => setDetail(null)} title={detail?.name || ""} wide>
              {detail && (() => {
                const avg = avgComp(detail.competencies);
                return (
                  <div>
                    {detail.bio && <p style={{ fontSize: 13, color: T.textSec, margin: "0 0 16px", lineHeight: 1.6 }}>{detail.bio}</p>}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 20 }}>
                      <Card style={{ padding: 14 }}>
                        <SectionHead>Kompetenzprofil (Ø {avg}/10)</SectionHead>
                        {CM_COMP_DIMS.map(dim => {
                          const val = (detail.competencies || {})[dim.key] || 0;
                          const c = compColor(val);
                          return (
                            <div key={dim.key} style={{ marginBottom: 8 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 3 }}>
                                <span>{dim.label}</span><span style={{ fontWeight: 700, color: c }}>{val}/10</span>
                              </div>
                              <div style={{ background: T.bg, borderRadius: 3, height: 7 }}><div style={{ width: `${val * 10}%`, height: "100%", background: c, borderRadius: 3 }} /></div>
                            </div>
                          );
                        })}
                      </Card>
                      <Card style={{ padding: 14 }}>
                        <SectionHead>Projektreferenzen ({(detail.projects || []).length})</SectionHead>
                        {(detail.projects || []).length === 0 ? <div style={{ fontSize: 12, color: T.textMut }}>Keine Referenzen</div> : (
                          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                            {(detail.projects || []).map(p => (
                              <div key={p.id} style={{ padding: "8px 10px", background: T.bg, borderRadius: T.rs, borderLeft: `3px solid ${T.accent}` }}>
                                <div style={{ fontWeight: 600, fontSize: 12 }}>{p.name} <span style={{ fontWeight: 400, color: T.textMut }}>({p.year})</span></div>
                                {p.role && <div style={{ fontSize: 11, color: T.textSec }}>{p.role}</div>}
                                {p.outcome && <div style={{ fontSize: 11, color: T.success, marginTop: 2 }}>✓ {p.outcome}</div>}
                              </div>
                            ))}
                          </div>
                        )}
                      </Card>
                    </div>
                    {(detail.focus_areas || []).length > 0 && (
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {detail.focus_areas.map(fa => <Badge key={fa} color={T.purple}>{fa}</Badge>)}
                      </div>
                    )}
                  </div>
                );
              })()}
            </Modal>
            {/* Create/Edit Modal */}
            <Modal open={show} onClose={() => { setShow(false); setEditId(null); }} title={editId ? "Profil bearbeiten" : "Neues CM-Profil"} wide>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
                <Input label="Name" value={f.name} onChange={v => sF(p => ({ ...p, name: v }))} style={{ gridColumn: "1/-1" }} />
                <Input label="Rolle/Titel" value={f.role} onChange={v => sF(p => ({ ...p, role: v }))} />
                <Input label="Kürzel (2–3 Buchstaben)" value={f.initials} onChange={v => sF(p => ({ ...p, initials: v.toUpperCase().slice(0, 3) }))} />
                <Input label="E-Mail" value={f.email} onChange={v => sF(p => ({ ...p, email: v }))} style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}><TagInput label="Schwerpunkte" tags={f.focus_areas} onChange={v => sF(p => ({ ...p, focus_areas: v }))} suggestions={["ADKAR","Stakeholder-Management","Kommunikation","Training","Leadership","Kultur","Agilität","SAP","IT-Transformation"]} color={T.purple} /></div>
                <Input label="Kurzbiografie" value={f.bio} onChange={v => sF(p => ({ ...p, bio: v }))} textarea style={{ gridColumn: "1/-1" }} />
                <div style={{ gridColumn: "1/-1" }}>
                  <SectionHead>Kompetenz-Bewertung (0–10)</SectionHead>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 8 }}>
                    {CM_COMP_DIMS.map(dim => (
                      <div key={dim.key}>
                        <label style={{ fontSize: 11.5, fontWeight: 600, color: T.textSec }}>{dim.label}</label>
                        <div style={{ display: "flex", gap: 3, marginTop: 4, flexWrap: "wrap" }}>
                          {[0,2,4,6,8,10].map(v => <Btn key={v} small v={(f.competencies[dim.key] || 0) === v ? "primary" : "default"} onClick={() => setComp(dim.key, v)} style={{ padding: "2px 6px", fontSize: 10 }}>{v}</Btn>)}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
                <div style={{ gridColumn: "1/-1" }}>
                  <SectionHead>Projektreferenzen</SectionHead>
                  {f.projects.map((p, i) => (
                    <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", background: T.bg, borderRadius: T.rs, marginBottom: 6, fontSize: 12 }}>
                      <span style={{ flex: 1 }}><strong>{p.name}</strong> ({p.year}) – {p.role}</span>
                      <Btn small v="ghost" onClick={() => sF(prev => ({ ...prev, projects: prev.projects.filter((_, j) => j !== i) }))}>✕</Btn>
                    </div>
                  ))}
                  <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 6, marginTop: 8 }}>
                    <Input label="Projektname" value={projInput.name} onChange={v => setProjInput(p => ({ ...p, name: v }))} />
                    <Input label="Jahr" value={projInput.year} onChange={v => setProjInput(p => ({ ...p, year: v }))} />
                    <Input label="Meine Rolle" value={projInput.role} onChange={v => setProjInput(p => ({ ...p, role: v }))} />
                    <Input label="Ergebnis / Outcome" value={projInput.outcome} onChange={v => setProjInput(p => ({ ...p, outcome: v }))} style={{ gridColumn: "1/-1" }} />
                  </div>
                  <Btn small v="default" onClick={addProject} style={{ marginTop: 6 }}>＋ Referenz hinzufügen</Btn>
                </div>
              </div>
              <Btn v="primary" onClick={save} style={{ marginTop: 16 }}>Speichern</Btn>
            </Modal>
          </div>
        );
      };

      // ─── RENDER ───────────────────────────────────────────────────────
      const views = { dashboard: DashboardView, portfolio: PortfolioView, initiative: InitiativeView, docs: DocsView, engagement: EngagementView, comms: CommsView, saturation: SaturationView, heatmap: HeatmapView, timeline: TimelineView, methods: MethodsView, references: ReferencesView, pdfReport: PDFReportView, io: IOView, governance: GovernanceView, outcomes: OutcomesView, leadership: LeadershipView, teamdev: TeamdevView, dialogue: DialogueView, opmodel: OpmodelView, adoption: AdoptionView, cmprofile: CMProfileView };
      const V = views[nav] || DashboardView;

      return (
        <div style={{ display: "flex", minHeight: "100vh", background: T.bg, fontFamily: T.font, color: T.text, fontSize: 13.5 }}>
          <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
          <style>{`@media print { body, #root { background: #fff !important; } nav, button { display: none !important; } main { padding: 20px !important; max-height: none !important; overflow: visible !important; } [style*="min-height: 100vh"] { display: block !important; } [style*="width: 244px"], [style*="width: 250px"] { display: none !important; } } @media (max-width: 767px) { .sidebar-panel { display: none !important; } .sidebar-panel.sidebar-open { display: flex !important; position: fixed; z-index: 1000; top: 0; bottom: 0; left: 0; width: 250px; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.3); } .ham-btn { display: flex !important; } .mob-overlay { display: block !important; } }`}</style>
          {sidebarOpen && <div className="mob-overlay" onClick={() => setSidebarOpen(false)} style={{ display: "none", position: "fixed", inset: 0, zIndex: 999, background: "rgba(0,0,0,0.4)" }} />}
          <button className="ham-btn" onClick={() => setSidebarOpen(true)} style={{ display: "none", position: "fixed", top: 12, left: 12, zIndex: 1001, background: T.surface, border: `1px solid ${T.border}`, borderRadius: T.rs, width: 38, height: 38, cursor: "pointer", fontSize: 18, alignItems: "center", justifyContent: "center", boxShadow: T.shadow }}>☰</button>
          <Sidebar />
          <main style={{ flex: 1, padding: "28px 36px", overflowY: "auto", maxHeight: "100vh" }}><V /></main>
          {toast && <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "#1e293b", color: "#f1f5f9", padding: "12px 20px", borderRadius: T.r, fontSize: 13, fontWeight: 600, zIndex: 9999, display: "flex", alignItems: "center", gap: 12, boxShadow: "0 4px 20px rgba(0,0,0,0.3)", whiteSpace: "nowrap" }}>
            <span>↩️ {toast.msg}</span>
            <span style={{ fontSize: 11, opacity: 0.6 }}>Ctrl+Z für weiteres Rückgängig</span>
            <button onClick={() => setToast(null)} style={{ border: "none", background: "transparent", color: "inherit", cursor: "pointer", fontSize: 16, padding: "0 4px", lineHeight: 1 }}>×</button>
          </div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>

</html>
